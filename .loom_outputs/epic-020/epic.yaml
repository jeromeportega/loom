stories:
  - id: story-020-001
    title: Add `loom weave` as a sibling command of `loom epic`
    description: >-
      Introduce a new `loom weave` CLI command that, in Phase 0, runs the exact same brief-quality
      gate, the same Analyst → PM → Architect planner, and the same execution path as `loom epic`,
      producing the same epic. `loom epic` is not modified.
    acceptance_criteria:
      - >-
        `loom weave "<brief>"` exists and runs the same brief-quality gate, the same three-persona
        planner, and the same execution path as `loom epic`, producing an identical epic.
      - >-
        The weave command reuses the existing epic planning/execution code path rather than forking
        it.
      - >-
        `loom epic` source and behavior are unchanged (no edits to its command handler or planning
        invocation).
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      Create `packages/loom-cli/src/commands/weave.ts` exporting `runWeave(brief, opts)`; register
      it via the `describe`/`applySpec(program.command('weave'), spec)` system exactly as `loom
      epic` is wired. `runWeave` must call the existing `runEpic(brief, opts)` from
      `packages/loom-cli/src/commands/epic.ts` verbatim — do NOT extract a shared `planEpicCore()`
      or otherwise edit `epic.ts` (ADR-001). Trade-off: because `runEpic` returns `void`, weave
      cannot receive the created epic id and must predict it via `Planner.nextEpicId(db)` (set up in
      story-020-003), so keep the wrapper a thin pass-through with no extra args, callbacks, or
      shared state threaded into `runEpic`.
    test_plan: >-
      Levels: integration for command wiring + a focused unit test for the wrapper; full
      epic-equivalence is deferred to story-020-005, do not duplicate it here.


      Key cases:

      - Happy path (integration): after registration, `loom weave` appears as a runnable command via
      the same `applySpec(program.command('weave'), spec)` path `loom epic` uses; invoking
      `runWeave(brief, opts)` reaches `runEpic` and an epic is produced.

      - Pure pass-through (unit): spy/mock `runEpic` and assert `runWeave` calls it exactly once
      with the SAME `(brief, opts)` and NO extra args, callbacks, or injected shared state (guards
      ADR-001/ADR-002 thin-wrapper intent).

      - `loom epic` untouched: assert `runWeave` imports and delegates to the existing `runEpic`
      from `commands/epic.ts` rather than re-implementing the gate/planner/execution (no forked
      `planEpicCore`).


      Verification bar: `loom weave` is invocable and runs the identical gate → Analyst/PM/Architect
      planner → execution path by delegating to an unmodified `runEpic`; the wrapper threads nothing
      new into planning. (Identical-epic proof is owned by story-020-005.)
  - id: story-020-002
    title: Validated verdict schema and single triage classification call
    description: >-
      Define a small zod-validated verdict schema (`type`: feature|bug|chore, `size`: story|epic,
      `confidence`: low|medium|high, `rationale`: short string) and make exactly one classification
      call to the configured triage model before planning. The call is best-effort and physically
      separate from the planning path.
    acceptance_criteria:
      - >-
        A zod schema validates the verdict with exactly the fields `type` (feature|bug|chore),
        `size` (story|epic), `confidence` (low|medium|high), and `rationale` (short string).
      - >-
        Each `loom weave` invocation makes exactly one classification call to
        `policy.agents.triage_model` (default Haiku) before planning; no new model-configuration
        knob is added.
      - >-
        If the classification call fails or times out, weave records the failure and proceeds with
        full planning unchanged — a classifier failure never fails the run.
      - >-
        The classify-and-record code is kept physically separate from the planning path (planning
        does not import or await classifier output).
    estimated_complexity: medium
    dependencies:
      - story-020-001
    tech_notes: >-
      Create `packages/loom-core/src/intake/IntakeClassifier.ts` with `IntakeVerdictSchema` (zod:
      `type` feature|bug|chore, `size` story|epic, `confidence` low|medium|high, `rationale` string
      min 1 max 280) and `classifyIntake(brief, {llm, model, timeoutMs=20_000}):
      Promise<ClassifyResult>`. Make EXACTLY ONE `llm.complete()` call wrapped in a timeout race,
      pinned to `policy.agents.triage_model` (no new knob); return a `ClassifyResult` discriminated
      union (`{ok:true,verdict}` | `{ok:false,reason,detail}`) and never throw on
      llm/parse/zod/timeout failure (ADR-006). Trade-off: this is a brand-new `intake/` module the
      planner must never import or await — keep it physically isolated so the observe-only boundary
      (NFR-1) holds, and accept that the brief is handled twice rather than sharing an abstraction
      with the planning path.
    test_plan: >-
      Level: unit only — `classifyIntake` and `IntakeVerdictSchema` are pure, isolatable seams.
      Inject a fake `LLMClient` (call-counting, scriptable response/throw/never-resolve); no real
      network, no real timers — use a deterministic injected `timeoutMs` and a controllable promise
      (or fake timers), never a real sleep.


      Key cases:

      - Schema accept: a verdict with `type∈{feature,bug,chore}`, `size∈{story,epic}`,
      `confidence∈{low,medium,high}`, `rationale` (1–280 chars) validates.

      - Schema reject (one assertion each): bad/extra `type`; bad `size`; bad `confidence`; empty
      `rationale` (min 1); `rationale` >280 chars.

      - Exactly one call (FR-2): assert the fake `llm.complete` is invoked exactly once per
      `classifyIntake`, and with `model` === the passed triage model value (no hardcoded model, no
      second call).

      - Best-effort failures return a value, never throw: llm throws → `{ok:false,
      reason:'llm_error'}`; response is non-JSON or fails zod → `{ok:false,
      reason:'invalid_output'}`; call exceeds `timeoutMs` (fake llm never resolves) → `{ok:false,
      reason:'timeout'}`. Each must resolve, not reject.

      - Physical separation (static): assert the new `intake/IntakeClassifier.ts` module is not
      imported by `Planner`/gate/execution (a lightweight import-graph or grep assertion; full
      enforcement is story-020-005).


      Verification bar: the schema admits exactly the four specified fields/enums and rejects
      everything else; every invocation makes exactly one triage-model call with no new knob; and
      every llm/parse/zod/timeout failure surfaces as a `{ok:false,…}` Result without throwing.
  - id: story-020-003
    title: Additive persistence and migration for the verdict
    description: >-
      Persist the verdict durably via an additive migration: add column(s) to the epics table and
      bump schema version 22 → 23 with `ALTER TABLE … ADD COLUMN` only, and record an audit row with
      a dedicated action (e.g., `intake_classified`). Pre-existing rows default to a clear
      no-verdict (NULL) state.
    acceptance_criteria:
      - >-
        A new migration in `runMigrations` bumps the schema version from 22 to 23 using only
        additive `ALTER TABLE … ADD COLUMN` statements (no DROP/TRUNCATE).
      - >-
        The validated verdict is stored on the epic record and recorded as an audit-log row with a
        dedicated action (e.g., `intake_classified`).
      - >-
        Pre-existing epic rows (created by `loom epic`) carry a NULL / no-verdict-recorded value
        after migration, never a fabricated classification.
      - >-
        A classification failure recorded in the audit log is distinguishable from a successful
        verdict.
    estimated_complexity: medium
    dependencies:
      - story-020-002
    tech_notes: >-
      Add migration v23 in `runMigrations` of `packages/loom-core/src/state/Database.ts` using the
      same idempotent per-column guard as v20–v22: `if (!epicCols.some(c => c.name ===
      'intake_verdict')) db.exec('ALTER TABLE epics ADD COLUMN intake_verdict TEXT')`, then bump
      `SCHEMA_VERSION` 22→23 — additive only, no DROP/TRUNCATE. Add `recordIntakeVerdict(id,
      verdict)` and `getIntakeVerdict(id): IntakeVerdict|null` (parse + zod-revalidate,
      garbage→null) to `EpicStore.ts`, and in `runWeave` always write one
      `AuditLog.record({action:'intake_classified', detail:{epic_id, ok, verdict?|reason?,
      model?}})` for both success and failure. Trade-off: store the verdict as a single JSON `TEXT`
      column rather than four typed columns (ADR-004) — analytics must query `audit_log.detail`
      JSON, which is the intended analysis surface; the epic column write is
      opportunistic/post-`runEpic` and only on success, so NULL stays the honest 'no verdict' state.
    test_plan: >-
      Level: integration against a real `better-sqlite3` db (temp/in-memory) — migrations and JSON
      round-trips must be exercised on the real engine, not mocked.


      Key cases:

      - Migration to v23: a fresh db ends at `schema_version` 23 and `epics` has an `intake_verdict
      TEXT` column.

      - Additive-only / no data loss: seed a v22 db with existing epic rows, run `runMigrations`;
      assert schema_version → 23, pre-existing rows survive, and their `intake_verdict` is NULL
      (never a fabricated class). Assert the migration source contains no `DROP`/`TRUNCATE`.

      - Idempotent: running `runMigrations` twice on an already-v23 db is a no-op (the per-column
      `if (!epicCols.some(...))` guard) and does not throw.

      - `recordIntakeVerdict` + `getIntakeVerdict` round-trip: write a valid verdict, read it back
      equal; `getIntakeVerdict` re-validates and returns `null` for a NULL column AND for
      corrupt/garbage JSON (degrades to no-verdict, never a default class).

      - Audit success vs failure distinguishable: `AuditLog.record({action:'intake_classified', …})`
      on success carries `ok:true` + the verdict; on failure carries `ok:false` + `reason` and
      writes no epic-column verdict — assert the two rows are queryably distinct.


      Verification bar: the v23 migration is purely additive and idempotent, leaves all pre-existing
      rows at NULL, stores/reads back a validated verdict (corrupt→null), and records a
      distinguishable success/failure `intake_classified` audit row for every run.
  - id: story-020-004
    title: Read-only surfacing of the verdict on the status surface
    description: >-
      Make the persisted verdict readable back and display it read-only on the status surface.
      Absent or null verdicts (rows from `loom epic`, or failed classifications) render honestly as
      'no verdict' rather than a default class.
    acceptance_criteria:
      - The persisted verdict is readable back and displayed read-only on the status surface.
      - Epics with no recorded verdict render as 'no verdict' (not a default or fabricated class).
      - >-
        The verdict is shown for information only; no status-surface code branches execution or
        planning on it.
    estimated_complexity: small
    dependencies:
      - story-020-003
    tech_notes: >-
      Surface the verdict read-only on both status surfaces using
      `EpicStore.getIntakeVerdict(epic.id)`: in `packages/loom-cli/src/commands/status.ts` add a
      `verdict:` line after the existing `gate:` line in `renderLoomDir` and extend `JsonEpic` with
      `intake_verdict?: IntakeVerdict | null`; in `packages/loom-web` add `intake_verdict?` to
      `EpicStatus`/`EpicDetail` (`src/shared/types.ts`) and render a label in `renderDetail()`. The
      one rule that matters: `null` must render literally as `no verdict`, never a
      default/fabricated class, and no status code may branch planning or execution on the value
      (FR-6).
    test_plan: >-
      Level: unit on the two render paths — CLI `renderLoomDir`/`JsonEpic` (`status.ts`) and web
      `renderDetail()` — with `getIntakeVerdict` stubbed. No live db needed.


      Key cases:

      - Verdict present (CLI): an epic whose `getIntakeVerdict` returns a verdict renders a
      `verdict:` line immediately after the existing `gate:` line, showing type/size/confidence;
      `JsonEpic` includes `intake_verdict`.

      - No verdict (CLI): `getIntakeVerdict` → null renders literally `verdict: no verdict` — assert
      it is NOT a default/fabricated class (no `feature`/`story` fallback).

      - Web parity: `EpicStatus`/`EpicDetail` expose `intake_verdict?`; `renderDetail()` shows the
      verdict label when present and `no verdict` when absent.

      - Read-only: assert the render functions only read the value (no call into planner/execution)
      — surfacing introduces no branch on the verdict.


      Verification bar: both surfaces display a present verdict read-only and render absent/null
      honestly as `no verdict`, with no execution/planning branch on the value.
  - id: story-020-005
    title: Observe-only invariant regression test
    description: >-
      Add a regression test pinning the non-negotiable observe-only guarantee: planning and
      execution are identical with no verdict, with a verdict present, and across every verdict
      value. No code in the quality gate, planner, persona selection, or execution reads or branches
      on the verdict.
    acceptance_criteria:
      - >-
        A regression test asserts planning/execution output is identical across three conditions: no
        verdict, a verdict present, and each possible verdict value.
      - >-
        The test fails if any quality-gate, planner, persona-selection, or execution code path reads
        or branches on the verdict.
      - The test confirms `loom epic` and `loom weave` produce the same epic for the same brief.
    estimated_complexity: medium
    dependencies:
      - story-020-002
      - story-020-003
      - story-020-004
    tech_notes: >-
      Add the observe-only regression test (mirror existing planner/epic test setup under
      `packages/loom-cli`/`loom-core` `__tests__`) asserting three things: planning/execution output
      is byte-identical across no-verdict / verdict-present / every verdict value; `loom epic` and
      `loom weave` produce the same epic for the same brief; and no gate, `Planner`,
      persona-selection, or execution code path reads `epics.intake_verdict` or `classifyIntake`'s
      return. This test is the physical enforcement of NFR-1 — it should fail the instant any
      planning code imports `intake/` or reads the verdict column, so assert on equivalence of the
      produced epic artifact rather than internals.
    test_plan: >-
      Level: integration regression — this test IS the physical enforcement of NFR-1. Mirror
      existing planner/epic test setup; stub the LLM so planner output is deterministic and
      reproducible across runs (record/replay fixed responses — no live model, no wall-clock).


      Key cases:

      - epic ≡ weave: run `runEpic(brief)` and `runWeave(brief)` for the same brief with the same
      stubbed planner responses; assert the produced epic artifact is identical.

      - Verdict-value invariance: drive `runWeave` with the classifier forced to each representative
      verdict value (the type×size×confidence matrix, or full enum coverage) AND to a
      failure/no-verdict result; assert the produced epic/execution artifact is byte-identical
      across all conditions and equal to the no-verdict baseline.

      - Topology guard: assert no gate/`Planner`/persona-selection/execution path reads
      `epics.intake_verdict` or `classifyIntake`'s return — implemented as an
      import-graph/structural assertion that fails the instant planning code imports `intake/` or
      reads the column.


      Verification bar: planning/execution output is provably identical across no-verdict,
      verdict-present, and every verdict value; `loom epic` and `loom weave` yield the same epic for
      the same brief; and the test breaks if any planning-side code reads or imports the verdict.
