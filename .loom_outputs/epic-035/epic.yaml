stories:
  - id: story-035-001
    title: Sharpen readiness criteria in the BriefRefiner prompt
    description: >-
      Edit the BriefRefiner prompt so that "ready" means the brief's quality is in the ready band
      AND no critical, planning-blocking gap exists. Make the criteria severity-aware and decouple
      the readiness flag from the mere presence of minor or optional clarification questions,
      without touching the score or critique behavior, output schema, or transport.
    acceptance_criteria:
      - >-
        The prompt defines "ready" as: quality is in the ready band AND no critical,
        planning-blocking gap (blocking ambiguity or missing scope) exists (FR-1).
      - >-
        The criteria are severity-aware: critical gaps make a brief not ready; minor or optional
        gaps a planner can reasonably proceed past do not (FR-2).
      - >-
        The presence of minor or optional clarification questions does not, on its own, flip an
        otherwise plan-ready brief to not ready; questions are still surfaced (FR-3).
      - >-
        The readiness flag is internally consistent with the quality score and the severity
        expressed in the critique (FR-4).
      - >-
        The criteria are stated as general principles of plan-readiness, referencing no eval fixture
        or specific labeled case (FR-5).
      - >-
        Output schema, parsing, and fallback behavior are unchanged, and the scorer remains on the
        non-agentic completion path (FR-6, NFR-2).
      - No guardrail is weakened.
    estimated_complexity: small
    dependencies: []
  - id: story-035-002
    title: Add readiness-intent unit tests using mocked scorer outputs
    description: >-
      Add or update unit tests that assert the sharpened readiness-criteria intent via fixed or
      mocked scorer outputs, with no real model completions. Tests must guard the intended behavior
      in both directions and avoid destabilizing the band-agreement and critique axes.
    acceptance_criteria:
      - >-
        Tests assert that ready-band quality with no critical gap yields "ready", and that minor or
        optional clarification questions alone do not flip a brief to "not ready".
      - >-
        Tests assert that a critical, planning-blocking gap yields "not ready", and cover the
        opposite over-correction failure mode (false "ready") where reasonable (NFR-3).
      - >-
        Tests exercise the decision logic via fixed/mocked scorer outputs and spawn no real model
        completions (NFR-1).
      - >-
        Tests assert readiness intent without re-validating or destabilizing the quality-band and
        critique faithfulness axes.
      - The full build and test suite pass.
    estimated_complexity: small
    dependencies:
      - story-035-001
  - id: story-035-003
    title: Update readiness-semantics docs and pass capabilities drift check
    description: >-
      Update documentation of the readiness flag's semantics (clean pass vs.
      pass-with-clarifications) wherever it is surfaced, and ensure the capabilities drift check
      passes if any user-visible surface changed.
    acceptance_criteria:
      - >-
        Readiness semantics are updated wherever they are documented, reflecting the clean-pass vs.
        pass-with-clarifications meaning (FR-7).
      - >-
        If a user-visible surface changed, docs/capabilities.md is updated and the capabilities
        drift check passes (FR-7).
      - Documentation references no eval fixture and stays consistent with the sharpened criteria.
    estimated_complexity: trivial
    dependencies:
      - story-035-001
