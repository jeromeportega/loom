  - id: story-008-003
    title: Reconcile core service with verified-merge ordered writes
    description: >-
      Build the single shared finalize/reconcile core service: a PR-URL verification path (gh pr
      view) and a git-ancestry path, fail-closed behavior, ordered writes on verified merge,
      idempotent noop on already-resolved epics, and a squash-merge hint on ancestry
      false-negatives.
    acceptance_criteria:
      - A single shared core service implements reconcile with no surface-specific logic.
      - >-
        PR-URL path verifies via gh pr view that PR state is merged AND head/base refs match the
        epic branch and base (main) before recording anything.
      - >-
        Ancestry path checks whether the epic branch is merged into the base branch via git ancestry
        when no URL is supplied.
      - >-
        When gh or git is unavailable or offline, reconcile refuses and does not mark done, with an
        error distinguishing "offline/unavailable" from "PR not merged".
      - >-
        On a verified merge the service writes in order: record epic_pr_url, clear finalize_phase,
        write an epic_reconciled audit_log row, then flip to done; the audit row is written before
        the call returns.
      - An unmerged or unverifiable epic stays non-done (never a false done).
      - >-
        Reconcile on an epic already done or already holding a non-null epic_pr_url is a safe noop
        with no re-record, consistent across callers.
      - An ancestry false-negative refusal hints to re-run with --pr <url> for squash-merged epics.
      - >-
        A reconcile-success test (stranded-but-merged epic to done with epic_pr_url set) and a
        reconcile-refusal test (unmerged/unverifiable epic stays non-done) both pass.
    estimated_complexity: large
    dependencies: []
    tech_notes: >-
      Create `packages/loom-core/orchestrator/EpicReconciler.ts` mirroring `EpicReverter` (same
      constructor-options shape: `{projectRoot, db, baseBranch='main', gitBin, ghBin}`), plus add
      `clearFinalizePhase(id)` to `EpicStore` (sets `finalize_phase=NULL` without touching status —
      `updateFinalizePhase` only sets non-null). PR-URL path shells out with `execFileSync(ghBin,
      ['pr','view',url,'--json','state,headRefName,baseRefName'])` (arg array, no shell) and refuses
      unless `state==='MERGED' && headRefName==='epic/'+id && baseRefName===base`; ancestry path
      uses existing `gitSafe(['merge-base','--is-ancestor','epic/'+id,base])` after a `git rev-parse
      --verify` branch-existence check. Distinguish refusal reasons via the `ReconcileResult.reason`
      union (`tool_unavailable` on `ENOENT`, `unverifiable_offline` on other throws, `not_merged`,
      `ref_mismatch`, `no_epic_branch`) so callers can tell offline from not-merged, and emit the
      `--pr <url>` squash-merge hint on an ancestry false-negative (FR-12). On a verified merge,
      write in exactly this order — `recordPrUrl` → `clearFinalizePhase` →
      `audit.record({action:'epic_reconciled',command:epicId,allowed:true,detail})` →
      `updateStatus(epicId,'done')` — and short-circuit to `{status:'noop'}` if the epic is already
      `done` or already has `epic_pr_url` (ADR-5). Trade-off: this is ordered (not transactional)
      writes; better-sqlite3's synchronous execution makes the order real, and a crash mid-sequence
      leaves a safe still-`in_progress` state recoverable by re-running.
    test_plan: >-
      LEVEL: integration against a REAL SQLite DB (in-memory or temp `better-sqlite3`) so the FR-9
      ordered write is observable; verification tools faked deterministically via the injectable
      `gitBin`/`ghBin` options pointing at stub scripts (canned stdout + exit code) — NO network, NO
      real `gh`/`git`. This is the highest-risk story (a false `done` breaks the `done ⇒
      epic_pr_url` invariant), so cover every refusal reason.


      KEY CASES (checklist):

      PR-URL path (`opts.prUrl` set):

      - [Happy] `gh` stub returns `{state:'MERGED', headRefName:'epic/epic-003',
      baseRefName:'main'}` → `{status:'reconciled'}`; epic reaches `done` with `epic_pr_url` set
      (AC2, AC5, AC9-success).

      - [Refuse] `state:'OPEN'` (or any `!== 'MERGED'`) → `refused/not_merged`, epic stays non-done
      (AC6).

      - [Refuse] `state:'MERGED'` but `headRefName='epic/other'` or `baseRefName='dev'` →
      `refused/ref_mismatch`, no write (AC2 ref check, AC6).

      - [Fail-closed] `gh` stub exits `ENOENT` (binary missing) → `refused/tool_unavailable`; other
      non-zero/throw → `refused/unverifiable_offline` — assert these are DISTINCT reasons so callers
      tell offline from not-merged (AC4).

      Ancestry path (no URL):

      - [Happy] branch `epic/<id>` exists and is an ancestor of `main` → `reconciled`, epic `done`
      (AC3, AC5).

      - [Refuse] branch missing (`git rev-parse --verify` fails) → `refused/no_epic_branch` (AC3).

      - [Refuse + hint] branch exists but `merge-base --is-ancestor` is not-ok on a clean git →
      `refused/not_merged` AND the `note` contains the `--pr <url>` squash-merge hint (AC8, FR-12).

      - [Fail-closed] git binary missing → `refused/tool_unavailable`, epic stays non-done (AC4).

      Idempotency:

      - [Noop] epic already `status='done'` → `{status:'noop'}`, no verification call made (assert
      the `gh`/`git` stub was NOT invoked), no new audit row (AC7).

      - [Noop] epic with non-null `epic_pr_url` (not yet done) → `{status:'noop'}`, no re-record
      (AC7).

      - [Refuse] unknown epic id → `refused/epic_not_found`.

      Ordered write (FR-9 / NFR-1 / NFR-4):

      - [Order] On the happy PR-URL path assert the write sequence is exactly recordPrUrl →
      clearFinalizePhase → `epic_reconciled` audit row → updateStatus('done'). Verify `epic_pr_url`
      is non-null BEFORE `status` becomes `done` (e.g. spy/ordered-log on store+audit calls, or
      assert intermediate state) and that the `epic_reconciled` audit row exists in `audit_log`
      BEFORE `reconcile()` returns (AC5).

      - [clearFinalizePhase] unit-test the new `EpicStore.clearFinalizePhase(id)` sets
      `finalize_phase=NULL` without touching `status`.


      VERIFICATION BAR: The required reconcile-SUCCESS test (stranded-but-merged epic → `done` with
      `epic_pr_url` set) and reconcile-REFUSAL test (unmerged/unverifiable epic stays non-done) both
      pass. Every refusal reason in the `ReconcileResult.reason` union is hit by a case; an
      unverifiable/missing-tool/non-merged input NEVER yields `done` (no false done in any case);
      the ordered write keeps `epic_pr_url` durable before any `done` write; all logic lives in
      `EpicReconciler` with no surface-specific branching.
  - id: story-008-004
    title: loom reconcile CLI and loom_reconcile_epic MCP surfaces
    description: >-
      Add the loom reconcile <epic-id> [--pr <url>] CLI command and the loom_reconcile_epic MCP
      tool, both thin wrappers over the shared reconcile core service with no divergent logic.
    acceptance_criteria:
      - loom reconcile <epic-id> [--pr <url>] CLI command invokes the shared core service.
      - loom_reconcile_epic MCP tool invokes the same shared core service.
      - Both surfaces produce identical outcomes for the same inputs (success, refusal, and noop).
      - Refusal and error messages surface clearly to the operator on both surfaces.
    estimated_complexity: small
    dependencies:
      - story-008-003
    tech_notes: >-
      Add `loom-cli/commands/reconcile.ts` registering
      `program.command('reconcile').argument('<epic-id>').option('--pr <url>', ...)` in
      `loom-cli/index.ts`, and a `loom_reconcile_epic` entry in the MCP `TOOL_DEFINITIONS` +
      `HANDLERS` maps in `loom-mcp/tools/handlers.ts` (inputSchema: required `epic_id`, optional
      `pr_url`). Both construct `new EpicReconciler({projectRoot, db})` and render the
      `ReconcileResult` verbatim — no verification or idempotency logic on either surface (ADR-2),
      so identical inputs yield identical outcomes structurally. Surface the `reason` and `note`
      fields clearly on refusal/error for the operator. Trade-off: one extra indirection layer for
      trivial surfaces, accepted to guarantee CLI/MCP can't diverge.
    test_plan: >-
      LEVEL: integration — both surfaces wrap the same `EpicReconciler`, so the goal is to prove
      parity, not re-test verification logic (that's covered in story-008-003). Use the SAME seeded
      DB state + same faked `gitBin`/`ghBin` stubs and run it through BOTH the CLI action and the
      MCP handler.


      KEY CASES (checklist):

      - [CLI invokes core] `loom reconcile <epic-id> --pr <url>` constructs `EpicReconciler` and
      returns/prints the `ReconcileResult` (AC1).

      - [MCP invokes core] `loom_reconcile_epic` handler ({epic_id required, pr_url optional})
      constructs the SAME service and returns the result (AC2).

      - [Parity: success] same MERGED+matching-refs DB state through CLI and MCP → both yield
      `reconciled` with identical `prUrl`/`status` (AC3).

      - [Parity: refusal] same not_merged (or ref_mismatch) state → both yield identical `refused` +
      same `reason` (AC3).

      - [Parity: noop] already-`done` epic → both yield identical `noop` (AC3).

      - [Operator messaging] on refusal/error, CLI output and MCP response both surface the `reason`
      AND the human-readable `note` clearly (e.g. the squash-merge `--pr` hint is visible to the
      operator on both) (AC4).

      - [Arg marshalling] CLI `--pr` maps to `opts.prUrl`; MCP `pr_url` maps to the same; omitting
      it on both selects the ancestry path.


      VERIFICATION BAR: For identical inputs the CLI and MCP produce identical `ReconcileResult`
      outcomes across success, refusal, and noop — parity is structural (one `reconcile()`
      implementation, surfaces only marshal/render). Refusal `reason` and `note` are legible to the
      operator on both surfaces. Neither surface contains verification or idempotency logic.
