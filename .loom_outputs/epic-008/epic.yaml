      duplication is the accepted cost of zero drift.
    test_plan: >-
      LEVEL: integration-first (this story is wiring across real surfaces; a stub that re-implements
      the spread would pass a unit test while the real surface stays broken). The mandatory
      anti-stub AC dictates the spine. Add thin per-surface assertions for the two surfaces not
      covered by the anti-stub test.


      KEY CASES (checklist):

      - [Anti-stub, REQUIRED] Seed a real DB with a gate-blocked epic (`status='in_progress'`,
      `finalize_phase='gate'`). Import the REAL `loom_get_status` handler from
      `loom-mcp/tools/handlers.ts` AND the REAL web `createApp` serving `/api/fleet` (no hand-built
      fixture app). Drive that one epic through both and assert BOTH report `blocked:true` /
