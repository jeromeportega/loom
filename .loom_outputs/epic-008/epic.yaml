stories:
  - id: story-008-001
    title: Clean per-package compiled output before building
    description: >-
      Make the build remove each package's stale compiled output before building (or otherwise
      restrict the test runner to tests that still exist in source), so renamed-away or deleted
      compiled tests under dist/ cannot be discovered and run.
    acceptance_criteria:
      - >-
        Per-package compiled output is cleaned before build, or the runner only executes tests
        present in source.
      - Renamed-away or deleted compiled tests under dist/ are no longer discovered or executed.
      - >-
        A long-lived working tree that previously built an older revision produces the same
        build/test results as a fresh checkout.
      - No incremental-build or CI caching assumption is broken (verified against CI config).
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      Change each package's `build` script in `packages/*/package.json` to `rm -rf dist && tsc`
      (loom-core also clears `dist-test`), reusing the POSIX `rm -rf` already in the root `clean`
      script. This makes `dist/` a faithful projection of `src/` so `node --test` over
      `dist/**/__tests__/**/*.test.js` can no longer discover renamed-away/deleted compiled tests;
      confirm AC4 by inspection — no `composite`/`tsBuildInfoFile` is configured and no
      `.github/workflows` CI exists, so nothing relies on incremental output. The one trade-off:
      full recompile every build (acceptable for these small packages), and note the coupling — this
      clean step wipes the CLI executable bit, which is exactly why story-010-002 must `chmod +x`.
    test_plan: >-
      **Levels:** Mostly verification of a build-script change plus one runner-behavior test.
      Unit/integration where a real `tsc` + `node --test` cycle is cheap; AC4 is satisfied by
      inspection.


      **Cases:**

      - Build-script change: each `packages/*/package.json` `build` is `rm -rf dist && tsc`
      (`loom-core` also clears `dist-test`). Assert the scripts contain the clean step (cheap source
      assertion) — but the real proof is the behavioral test below.

      - Ghost-test elimination (the core behavior, AC1/AC2): in a package fixture, build once with a
      `src/foo.test.ts`, then rename/delete it from source and rebuild. Assert no
      `dist/**/__tests__/**/foo.test.js` survives and `node --test` over
      `dist/**/__tests__/**/*.test.js` no longer discovers it. Pre-fix (overwrite-in-place `tsc`)
      this ghost would remain — confirm the clean build removes it.

      - Long-lived-tree parity (AC3): starting from a `dist/` that contains an orphan compiled test
      (simulating an older revision), run the changed build and assert the resulting `dist/` is a
      faithful projection of current `src/` — identical to a from-scratch build.

      - AC4 by inspection: document/confirm no `composite`/`tsBuildInfoFile` in any `tsconfig` and
      no `.github/workflows` exists, so no incremental/cache assumption is broken. Record this check
      in the test or PR notes rather than asserting at runtime.


      **Verification bar:** A source-removed test cannot be discovered or executed from `dist/`, a
      stale `dist/` converges to the fresh-checkout result after one build, and the
      no-CI/no-incremental assumption is explicitly verified. Note the coupling for reviewers: this
      clean step wipes the CLI exec bit — restored by story-010-002.
  - id: story-008-002
    title: Removal-guard tests assert version-control absence
    description: >-
      Change removal-guard tests to assert that a package is absent from version control (tracked
      state) rather than absent from disk, so an untracked build-output leftover does not fail them.
    acceptance_criteria:
      - >-
        Removal-guard tests query tracked/version-controlled state (e.g., via git) instead of disk
        presence.
      - An untracked build-output leftover in a removed package directory does not fail the guard.
      - The guard still fails when the package remains tracked in version control.
    estimated_complexity: small
    dependencies: []
    tech_notes: >-
      In the removal-guard tests (`mcpWorkspaceScrub.test.ts`, `serve.test.ts`) replace
      `fs.existsSync('packages/loom-mcp')` with an `isTracked(repoRoot, relPath)` check backed by
      `git ls-files -- packages/loom-mcp` returning empty, per ADR-3. This asserts version-control
      absence rather than disk absence, so an untracked `dist/`/`node_modules` leftover in a removed
      package no longer fails the guard while a still-tracked file correctly does. The one
      trade-off: the tests now shell out to `git` and assume execution inside a checkout (already
      true for the suite).
    test_plan: >-
      **Levels:** Unit test of the removal-guard oracle swap. Fast, deterministic; shells out to
      `git` (the suite already runs inside a checkout).


      **Cases:**

      - Tracked-state oracle (AC1): the guards in `mcpWorkspaceScrub.test.ts` and `serve.test.ts`
      use an `isTracked(repoRoot, relPath)` helper backed by `git ls-files -- <path>` returning
      empty — NOT `fs.existsSync`. Assert the helper returns false for an untracked path and true
      for a tracked one.

      - Untracked leftover tolerated (AC2): create an untracked `packages/loom-mcp/dist/` (or
      `node_modules`) leftover on disk and assert the removal guard still PASSES (a disk-presence
      guard would have failed here). This is the dev/gate-parity regression the story exists for.

      - Guard still bites (AC3): with a file tracked under `packages/loom-mcp` (git ls-files
      non-empty), assert the guard FAILS. The fix must not blind the guard to a genuinely re-added
      package.


      **Determinism:** Drive `isTracked` against a controlled temp git repo or the real repo root
      via `git ls-files`; do not rely on whatever happens to be on disk. No sleeps, no network.


      **Verification bar:** Both removal guards query git tracked state, tolerate untracked build
      residue, and still fail when any `loom-mcp` file remains tracked.
  - id: story-008-003
    title: Verify full build and test on a long-lived working tree
    description: >-
      Run the full build and test suite on a long-lived working tree that previously built an older
      revision, and fix any remaining failures from stale compiled tests or build-output leftovers.
    acceptance_criteria:
      - The full build passes on a long-lived working tree that previously built an older revision.
      - >-
        The entire test suite passes with no failures from stale compiled tests or build-output
        leftovers.
      - Results match a fresh checkout (dev/gate parity).
    estimated_complexity: small
    dependencies:
      - story-008-001
      - story-008-002
    tech_notes: >-
      This is a verification-and-cleanup story depending on story-008-001 and story-008-002: run the
      full `npm run build` + `npm test` on a long-lived working tree that previously built an older
      revision and fix any residual failures from stale `dist/*.test.js` or build-output leftovers.
      Confirm results match a fresh checkout (dev/gate parity); most defects should already be
      resolved by the clean-build step, so expect this to be triage rather than new mechanism.
    test_plan: >-
      **Levels:** End-to-end verification story — run the real `npm run build` + `npm test` on a
      long-lived working tree that previously built an older revision. This is triage/cleanup, not
      new mechanism; no new test file is the deliverable unless triage uncovers a missed leak.


      **Cases / checklist:**

      - Full build green (AC1): on a long-lived tree carrying older `dist/` output, `npm run build`
      completes clean after story-008-001's per-package clean step.

      - Full suite green (AC2): `npm test` passes with zero failures attributable to stale
      `dist/*.test.js` or build-output leftovers. If any surface, fix the residual leak (likely a
      path the clean step missed) rather than deleting the failing test.

      - Fresh-checkout parity (AC3): the same build+test outcome on a clean `git clone`/fresh
      checkout matches the long-lived-tree result.


      **Verification bar:** Build and full test suite pass identically on a stale long-lived tree
      and a fresh checkout, with no failure traceable to compiled-output residue. Since
      story-008-001/002 should resolve most causes, any remaining failure is fixed at the source of
      the leftover, not papered over.
