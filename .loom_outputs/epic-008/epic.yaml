stories:
  - id: story-008-001
    title: Derived blocked indicator in shared core
    description: >-
      Add a read-time helper in the core service that computes additive fields blocked:true and
      blocked_reason:"integration_gate" for any epic where status==in_progress AND
      finalize_phase==gate. The value is computed on read, never stored, and the status string stays
      in_progress.
    acceptance_criteria:
      - >-
        A shared core helper returns blocked:true and blocked_reason:"integration_gate" for epics
        where status==in_progress AND finalize_phase==gate.
      - >-
        The helper returns no blocked field for any other epic state (normal in_progress,
        finalizing, done, etc.).
      - >-
        The computation reads epic state only and never writes or stores the blocked value; DB
        status is unchanged.
      - >-
        Unit tests cover the gate-blocked case, a normal in_progress epic, and a non-gate finalize
        phase.
    estimated_complexity: small
    dependencies: []
    tech_notes: >-
      Create `packages/loom-core/orchestrator/blockedIndicator.ts` exporting the pure
      `deriveBlocked(epic: Pick<EpicRecord,'status'|'finalize_phase'>): BlockedSignal | null` from
      the architecture — the single rule is `status==='in_progress' && finalize_phase==='gate'`
      returns `{blocked:true, blocked_reason:'integration_gate'}`, everything else returns `null`.
      Export `BlockedSignal` from the module and re-export from loom-core's index barrel so all four
      surfaces can import it. Keep it I/O-free (no DB handle, no store) and unit-test the three
      required cases (gate-blocked, normal in_progress, a non-gate phase like `'merging'`) directly
      against the function. Trade-off to know: the signal is derived, never persisted, so it can
      never contradict `status`/`finalize_phase` — do not add a column or cache it.
    test_plan: >-
      LEVEL: unit only — `deriveBlocked` is a pure, I/O-free function, so test it directly against
      the function in `packages/loom-core/orchestrator/blockedIndicator.ts`; no DB handle, no store,
      no integration cost.


      KEY CASES (checklist):

      - [Happy] `deriveBlocked({status:'in_progress', finalize_phase:'gate'})` → returns
      `{blocked:true, blocked_reason:'integration_gate'}` (covers AC1).

      - [Negative] normal in_progress: `{status:'in_progress', finalize_phase:null}` → `null` (AC2,
      AC4).

      - [Boundary] non-gate finalize phase: `{status:'in_progress', finalize_phase:'merging'}` →
      `null` (AC2, AC4). Add at least one more non-gate phase (e.g. `'review'`) to prove only
      `'gate'` triggers.

      - [Negative] gate phase under the wrong status: `{status:'finalizing', finalize_phase:'gate'}`
      → `null` and `{status:'done', finalize_phase:'gate'}` → `null` — proves BOTH conditions are
      required, not either.

      - [Negative] other statuses (`finalizing`, `done`, `failed`, `rejected`, `planning`) → `null`
      (AC2).

      - [Purity] call the function and assert it returns a fresh object/null and performs no write —
      pass a frozen input object and confirm no mutation; there is no store/DB argument to write
      through (AC3).

      - [Type/export] assert `BlockedSignal` is exported from the module AND re-exported from the
      loom-core index barrel (import it via the barrel in the test) so all four surfaces can consume
      it.


      VERIFICATION BAR: All four AC are demonstrably covered by the cases above. A passing suite
      proves the single rule `status==='in_progress' && finalize_phase==='gate'` is the ONLY path to
      a signal, every other state yields `null`, and nothing is persisted. Do not add a stored
      column or cache — if a test needs DB state to pass, the implementation is wrong.
  - id: story-008-002
    title: Surface blocked across all four read surfaces
    description: >-
      Wire the derived blocked signal into the loom status CLI, loom_get_status MCP, the API status
      rollup route, and the API fleet route. Gate the signal strictly to in_progress + gate so
      finalize_phase never leaks for normal in_progress epics.
    acceptance_criteria:
      - loom status CLI shows blocked/blocked_reason for a gate-blocked epic.
      - >-
        loom_get_status MCP returns blocked/blocked_reason for gate-blocked epics while still
        suppressing finalize_phase for normal in_progress epics.
      - The API status rollup route returns the blocked fields for a gate-blocked epic.
      - The API fleet route returns the blocked fields for a gate-blocked epic.
      - >-
        A normal in_progress epic exposes no blocked field and no finalize_phase on any of the four
        surfaces.
      - The status string remains in_progress on all four surfaces.
      - >-
        An anti-stub test imports the real loom_get_status handler AND the real createApp serving
        the API fleet route, drives a gate-blocked epic through both, and asserts both report
        blocked (no hand-built fixture app).
    estimated_complexity: medium
    dependencies:
      - story-008-001
    tech_notes: >-
      Spread `...(deriveBlocked(epic) ?? {})` into each surface's epic object: MCP `renderEpic()` in
      `loom-mcp/tools/handlers.ts` beside the existing finalize_phase spread (~handlers.ts:391,
      leave that gating line intact so normal in_progress still exposes neither field); CLI
      `loom-cli/commands/status.ts` (add a `blocked: integration_gate` line in the human tree AND
      the fields to `JsonEpic` in `collectJsonEpics`); web `rollupEpics()` in
      `loom-web/server/index.ts`; and `buildProjectCards()` in `loom-web/server/routes/fleet.ts`.
      Pin the additive shape `blocked?: true; blocked_reason?: 'integration_gate'` on every surface
      type and never expose raw `finalize_phase` for a non-gate in_progress epic (FR-4). The
      anti-stub acceptance test must import the real `loom_get_status` handler and the real web
      `createApp` (not a hand-built fixture), drive one gate-blocked epic through both, and assert
