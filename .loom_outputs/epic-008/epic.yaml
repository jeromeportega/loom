      - [CLI --json] `collectJsonEpics`: `JsonEpic` for the gate-blocked epic carries
      `blocked`/`blocked_reason` (AC1).

      - [MCP] `renderEpic()` returns `blocked`/`blocked_reason` for the gate-blocked epic (AC2).

      - [API status rollup] `GET /api/status` (`rollupEpics()` in `loom-web/server/index.ts`)
      returns the blocked fields for the gate-blocked epic (AC3).

      - [API fleet] `GET /api/fleet` (`buildProjectCards()` in `routes/fleet.ts`) returns the
