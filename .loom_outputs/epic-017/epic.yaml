stories:
  - id: story-017-001
    title: Capture planning persona output into a durable per-epic buffer
    description: >-
      Capture the streaming stdout of each planning persona subprocess (Analyst, PM, Architect) into
      a rolling buffer keyed to the epic, reusing the supervisor's worker-output buffering approach,
      and flush it to durable state. Record which persona is currently producing output so captured
      lines are attributable.
    acceptance_criteria:
      - >-
        Each planning persona subprocess's streaming stdout is captured into a rolling buffer keyed
        to the epic being planned, using the same buffering approach the supervisor uses for worker
        output (no parallel streaming mechanism is introduced).
      - >-
        The currently active persona (Analyst / PM / Architect) is recorded and updated as personas
        transition during the run.
      - >-
        The per-epic planning buffer is flushed to durable state and remains inspectable after
        planning completes.
      - >-
        The redaction already applied to the worker stream is applied to captured planning output,
        so no secrets appear in the buffer.
      - The existing coarse phase label continues to function unchanged.
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      This story owns the capture half (ADR-001) plus the one load-bearing change. Add the optional
      `onText?: (delta: string) => void` field to `LLMRequest` in
      `packages/loom-core/src/llm/LLMClient.ts`, and in `ClaudeCliClient.ts` switch to `claude -p
      --output-format stream-json` (parse line-delimited events, call `onText` per assistant text
      delta, still resolve the accumulated `LLMResponse`) only when `onText` is present — backends
      without streaming ignore it and return final text. In `Planner.ts` replicate
      `Supervisor.outputTails` as a single `planningTail: { buffer, dirty }` with an interval flush
      timer, reusing the exact `LIVE_TAIL_CHARS = 4096` and `TAIL_FLUSH_MS = 1000` constants; flush
      via a new `EpicStore.updatePlanningLogTail(id, logTail)`, add the `ALTER TABLE epics ADD
      COLUMN planning_log_tail TEXT` migration in `state/Database.ts` next to the existing
      `planning_phase` block, create `planner/PlanningEvent.ts`, and run every chunk through a new
      shared `util/redact.ts` `redactSecrets()` before buffering and before `onPlanningEvent` — also
      apply `worker_auth: 'session'` env-hygiene to the planner subprocess (ADR-006). Trade-off the
      implementer must know: the tail is bounded to 4096 chars, so a persona whose output scrolls
      past is partially lost — the same limitation `agents.log_tail` already accepts (ADR-005);
      reuse `planning_phase` for attribution rather than adding a field.
    test_plan: >-
      Levels: unit for the pure/parsing pieces, integration for the durable seam (Planner →
      EpicStore → SQLite). This story owns the load-bearing `onText` change and the redaction
      control, so weight effort there. Tests-first is practical for `redactSecrets()` and the
      stream-json parser.


      Unit — `util/redact.ts` `redactSecrets()` (AC4): masks an `sk-ant-...` key and a GitHub PAT
      prefix embedded in surrounding text; leaves secret-free text byte-identical; is idempotent
      (redacting redacted output is a no-op); handles empty string and a token split across the
      input without throwing.

      Unit — `ClaudeCliClient.complete()` streaming tap (AC1): GIVEN `onText` present, parses
      line-delimited `stream-json` events and calls `onText` once per assistant text delta; the
      resolved `LLMResponse.text` equals the concatenation of all deltas. GIVEN `onText` absent, the
      buffered code path is used and output is unchanged (this is the regression guard for the
      shared client). A backend that cannot stream ignores `onText` and still returns final text
      (graceful degradation).

      Unit — Planner rolling buffer (AC1, AC3): appending past `LIVE_TAIL_CHARS = 4096` retains the
      most-recent 4096 chars (tail semantics, oldest dropped — the accepted `agents.log_tail`
      limitation); append sets `dirty = true`; a clean (non-dirty) buffer triggers no write.

      Unit — redaction ordering (AC4): every chunk passes through `redactSecrets()` BEFORE it enters
      the buffer and BEFORE `onPlanningEvent` fires (assert a planted secret never reaches either
      sink).

      Integration — durable flush (AC3): drive a fake/streamed persona run; assert
      `EpicStore.updatePlanningLogTail` persists to the new `epics.planning_log_tail` column at the
      `TAIL_FLUSH_MS = 1000` cadence, the column is readable after the run completes, and the flush
      interval timer is cleared on completion (no leaked `setInterval`).

      Integration — migration (AC3): `ALTER TABLE epics ADD COLUMN planning_log_tail TEXT` runs on a
      fresh DB and re-runs idempotently against an existing `.loom` DB that already has the column
      (mirror the existing `planning_phase` guard).

      Unit/Integration — active persona (AC2, AC5): `planning_phase` advances `analyst → pm →
      architect` as personas transition and a phase marker (e.g. `\n── pm ──\n`) is prefixed into
      the tail on transition; assert the existing coarse phase label/marker is read and written
      exactly as before (no field added, no regression).

      Unit — env-hygiene (AC4): when `worker_auth: 'session'`, the planner's LLM subprocess is
      spawned WITHOUT `ANTHROPIC_API_KEY`/`ANTHROPIC_AUTH_TOKEN` in its env (assert the spawned env,
      not the parent process env).


      Verification bar: persona stdout is captured live into a 4096-char epic-keyed tail, persisted
      durably and still readable post-run, attributed to the correct persona via `planning_phase`;
      planted secrets never reach the buffer, the event callback, or the persisted column; the
      `onText`-absent path and the existing phase label are provably unchanged.
  - id: story-017-002
    title: Stream planning log to the web dashboard live pane
    description: >-
      For an epic in the planning phase, render a live planning log pane in the web dashboard fed by
      the existing SSE streaming mechanism, updating as persona output is produced, displayed
      alongside the existing phase indicator.
    acceptance_criteria:
      - >-
        For an epic in the planning phase, the dashboard shows a live planning log pane fed by the
        existing SSE streaming mechanism.
      - The pane updates as persona output is produced and reflects the currently active persona.
      - >-
        The live log pane is displayed alongside the existing phase indicator, which continues to
        work.
      - The pane keys correctly to a planning epic that has no stories yet.
      - The existing SSE pipeline is reused; no new or parallel streaming mechanism is introduced.
    estimated_complexity: medium
    dependencies:
      - story-017-001
    tech_notes: >-
      Consume the `planning_log_tail` column story-017-001 produces — do not touch the capture side.
      Add the `planning-output { epic_id, phase, chunk }` kind to the `LiveEvent` union in
      `packages/loom-web/src/shared/types.ts`, then in `server/events.ts` `tick()` maintain a
      `planningTailSnapshots: Map<epicId, string>` and diff `epic.planning_log_tail` with the
      identical `startsWith()`/`slice()` logic already used for `agents.log_tail`, emitting via the
      existing `emit()` helper (ADR-004 — same `/api/events` channel, no parallel mechanism). In
      `public/index.html` add one `EventSource` listener for `planning-output` and a
      `#planning-log-EPICID` pane that mirrors the worker log pane and sits alongside the existing
      `planning · analyst` phase indicator. The trade-off/gotcha: a planning epic has no stories or
      agent rows yet, so key the pane strictly to `epic_id` (not `agent_id`/`story_id`) and ensure
      it renders before the 'Stories appear once planning completes' state.
    test_plan: >-
      Levels: integration for the `tick()` diff/emit logic in `server/events.ts` (the real risk),
      plus a DOM/component test for the pane. Do NOT touch the capture side — consume the
      `planning_log_tail` column story-017-001 produces. Assert on semantic/visible outcomes, not
      DOM internals.


      Integration — `tick()` diff (AC1, AC2, AC5): maintain `planningTailSnapshots:
      Map<epicId,string>` and reuse the SAME `startsWith()`/`slice()` logic as `agents.log_tail`.
      Cases: (a) tail grows by an appended chunk → emits one `planning-output { epic_id, phase,
      chunk }` carrying only the new slice; (b) tail unchanged between ticks → no emit; (c) tail
      replaced (new value does not `startsWith` the snapshot) → emits the full new tail; (d) two
      epics planning concurrently → snapshots and emits are isolated per `epic_id`.

      Integration — channel reuse (AC5): the event is emitted through the existing `emit()` helper
      on the same `/api/events` SSE channel — assert no new endpoint and that the existing
      `agent`/`output` events still flow (no regression to worker streaming).

      Integration — phase attribution (AC2): the emitted `phase` is sourced from
      `epic.planning_phase` and updates as the active persona changes; `phase` may be `null` and the
      event still emits validly.

      DOM/component — pane render (AC1, AC2, AC3, AC4): an `EventSource` `planning-output` listener
      appends `chunk` to a `#planning-log-<epicId>` pane keyed strictly to `epic_id` (never
      `agent_id`/`story_id`); the pane renders for a planning epic that has NO stories/agent rows
      yet and appears BEFORE the 'Stories appear once planning completes' state; the existing
      `planning · analyst` phase indicator still renders alongside the pane and reflects the active
      persona; successive events append (live update), they do not replace.


      Verification bar: a planning epic with no stories shows a live, append-only log pane fed by
      the existing SSE channel that tracks persona output and the active persona, sitting next to
      the unchanged phase indicator — with the diff logic emitting exactly the new bytes per tick
      and no parallel streaming mechanism introduced.
  - id: story-017-003
    title: Add verbose tail mode to the planning command
    description: >-
      Add a verbose flag to the planning command that tails planning persona output in the terminal
      as it is produced, mirroring the `run` command's verbose mode, while keeping the default
      (non-verbose) output concise.
    acceptance_criteria:
      - The planning command accepts a verbose flag that mirrors the `run` command's verbose mode.
      - With the flag set, planning persona output is tailed in the terminal as it is produced.
      - >-
        Without the flag, the default terminal output remains concise and unchanged from current
        behavior.
      - Tailed output uses the redacted stream, so no secrets are exposed in the terminal.
    estimated_complexity: small
    dependencies:
      - story-017-001
    tech_notes: >-
      Mirror `run --verbose` exactly. Add `{ name: '--verbose', type: 'boolean', changesOutputShape:
      true }` to `spec.options` in `packages/loom-cli/src/commands/epic.ts`, write a
      `makePlanningPrinter({ verbose })` modeled on `makeEventPrinter` (reuse its partial-line
      buffering for `type: 'output'` events and print phase markers on `type: 'phase'`), and wire it
      as `onPlanningEvent` into the `new Planner(...)` options. The trade-off to respect: the
      printer must consume the already-redacted `onPlanningEvent` chunk (never a raw delta), and the
      default non-verbose path must stay byte-for-byte unchanged from today's concise output.
    test_plan: >-
      Levels: unit for `makePlanningPrinter`, plus one wiring assertion on the `epic` command. Small
      story — keep it tight. Mirror `run --verbose`/`makeEventPrinter` exactly.


      Unit — `makePlanningPrinter({ verbose: true })` (AC2): on a `type: 'output'` event prints the
      chunk to the terminal; partial-line buffering (reused from `makeEventPrinter`) reassembles a
      line delivered across two chunks before printing; on a `type: 'phase'` event prints a
      persona/phase marker.

      Unit — `makePlanningPrinter({ verbose: false })` (AC3): consuming `output` and `phase` events
      produces NO persona output (concise default preserved).

      Unit — redacted source (AC4): the printer prints the `chunk` it receives from the
      `onPlanningEvent` event (already redacted upstream) and is never wired to a raw LLM delta —
      assert the printer's only input is the event chunk.

      Integration/unit — flag + wiring (AC1): `--verbose` is registered in `epic.ts` `spec.options`
      as `{ type: 'boolean', changesOutputShape: true }`, mirroring `run`; when set,
      `makePlanningPrinter({ verbose: true })` is passed as `onPlanningEvent` into `new
      Planner(...)`.

      Regression — default output (AC3): a golden/snapshot of the non-verbose `epic` terminal output
      matches today's concise output byte-for-byte (no new lines leak when the flag is absent).


      Verification bar: `--verbose` tails redacted persona output live in the terminal exactly as
      `run --verbose` does; the flag is opt-in and marked `changesOutputShape`; the default
      non-verbose output is provably identical to current behavior.
  - id: story-017-004
    title: Run the full build + test suite and fix any cross-cutting regressions
    description: >-
      After the core, web, and CLI changes land, run the entire build and test suite across all
      packages and fix any cross-service regressions surfaced by running everything together.
    acceptance_criteria:
      - The full build passes.
      - The entire test suite passes.
      - Any cross-cutting regressions introduced across loom-core, loom-web, and loom-cli are fixed.
    estimated_complexity: small
    dependencies:
      - story-017-001
      - story-017-002
      - story-017-003
    tech_notes: >-
      Last to run (depends on the other three). Execute `npm run build` then `npm run test` across
      all workspaces and fix any cross-package fallout. Focus the regression hunt on the one shared,
      load-bearing seam: the `onText` addition to `LLMClient`/`ClaudeCliClient` — confirm the
      buffered path (no `onText`) is unchanged and that worker behavior via `BaseCliWorker` is
      untouched since it does not use `LLMClient`. Also verify the new `LiveEvent` union member
      type-checks across the `loom-web` shared types boundary and the `Database.ts` migration runs
      idempotently on an existing `.loom` state file.
    test_plan: >-
      Level: full-suite integration/regression — this story's 'test' is the green suite plus
      targeted guards on the shared seams. No new feature code; add/keep regression tests only where
      the cross-package risk lives.


      Checklist:

      - `npm run build` passes across all workspaces (AC1); `npm run test` passes across loom-core,
      loom-web, loom-cli (AC2).

      - Shared-seam regression (AC3): confirm `LLMClient.complete()` WITHOUT `onText` is
      byte-for-byte the prior buffered behavior, and that workers via `BaseCliWorker` are untouched
      (they do not route through `LLMClient`) — add or assert a test that exercises the no-`onText`
      path if one does not already exist.

      - Type boundary (AC3): the new `planning-output` member of the `LiveEvent` union type-checks
      across the `loom-web` shared-types boundary (server emit site and browser consumer agree on
      the shape); the build's typecheck is the gate.

      - Migration idempotency (AC3): the `Database.ts` `planning_log_tail` migration runs cleanly
      against an existing `.loom` state file that predates the column AND one that already has it,
      with no error on repeat startup.

      - Fix any cross-package fallout surfaced only when all three packages run together (e.g.
      mismatched event shapes, snapshot drift in the CLI default-output golden).


      Verification bar: build and the entire test suite are green with all three packages
      integrated; the `onText`-absent path, worker path, SSE union type, and DB migration are each
      demonstrated unbroken, and any regression found by running everything together is fixed (not
      skipped or xfail'd).
