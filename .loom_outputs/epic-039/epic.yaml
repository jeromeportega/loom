stories:
  - id: story-039-001
    title: Sharpen skill-judge admission criteria for safety and reusability
    description: >-
      Edit the skill judge's admission-criteria prompt text so safety and reusability become
      explicit, high-priority rejection criteria that override surface quality. The change is
      principled and generic — no reference to the eval's fixtures — and leaves the judge's
      non-agentic completion path, output schema, parsing, and fail-open behavior unchanged in
      shape.
    acceptance_criteria:
      - >-
        The admission criteria explicitly and with high priority reject candidates that teach or
        encourage a dangerous or destructive operation (e.g., force-pushing, history rewriting,
        deleting data, disabling safety checks), with examples that are representative rather than
        an exhaustive blocklist.
      - >-
        The admission criteria explicitly and with high priority reject candidates that are not
        genuinely reusable: narrowly tied to one repo's internals, a one-off, or not generalizable.
      - >-
        Safety and reusability rejections take precedence over surface quality — a well-written,
        polished candidate that is unsafe or non-reusable is still rejected.
      - >-
        The criteria give a clear handling stance for a legitimately reusable skill that merely
        mentions a destructive command in a safe, guarded way, so such skills are not falsely
        rejected.
      - >-
        The criteria are expressed on general principles with no reference to the eval's specific
        cases or fixtures.
      - >-
        An unsafe or non-reusable candidate rejects via the verdict independent of any score it
        might otherwise earn, and the judge remains on the non-agentic completion path with output
        schema, parsing, and fail-open-on-error behavior unchanged in shape.
      - No guardrail is weakened or modified by the change.
    estimated_complexity: medium
    dependencies: []
  - id: story-039-002
    title: Add unit tests covering sharpened criteria with mocked judge outputs
    description: >-
      Add unit tests that exercise the sharpened admission-criteria intent using mocked judge
      outputs and no real model calls, covering unsafe rejection, non-reusable rejection,
      surface-quality override, guarded-mention acceptance, and continued acceptance of good skills.
    acceptance_criteria:
      - >-
        Unit tests exercise the sharpened criteria intent — unsafe reject, non-reusable reject,
        safety/reusability override of surface quality, guarded-mention accept, and good safe
        reusable skill accept — using mocked judge outputs.
      - No test makes a real model call.
      - Existing parsing and output-contract tests remain green.
      - The full build passes and the entire test suite passes.
    estimated_complexity: small
    dependencies:
      - story-039-001
  - id: story-039-003
    title: Update skill docs if applicable and pass capabilities drift check
    description: >-
      If admission criteria are documented in the skill docs, update them to reflect the sharpened
      criteria. Confirm the capabilities drift check passes for any user-visible surface change.
    acceptance_criteria:
      - >-
        If admission criteria are documented in the skill docs, those docs are updated to reflect
        the sharpened safety and reusability criteria.
      - If no such documentation exists, the story records that finding and makes no doc change.
      - The capabilities drift check passes if any user-visible surface changed.
    estimated_complexity: small
    dependencies:
      - story-039-001
