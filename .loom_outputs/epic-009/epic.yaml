stories:
  - id: story-009-001
    title: Drive manifest collection from the live command registry
    description: >-
      Make manifest collection discover a description for every command directly from the command
      sources / live registry, so any registered command — including the existing publish command —
      is collected automatically rather than via a hand-maintained list.
    acceptance_criteria:
      - >-
        Manifest collection discovers a description for every command from the command sources /
        live registry.
      - The existing publish command is now collected into the manifest.
      - describe returns a description for both publish and release.
      - No change to human help output or user-facing CLI behavior.
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      Refactor `packages/loom-cli/src/index.ts` to expose a pure `buildProgram(): Command` factory
      that registers every command without calling `.parse()`, and change the bin entry to
      `buildProgram().parse()` (ADR-4). Wire the existing `publishSpec` into `collectSpecs()` and
      have `buildManifest(program)` enumerate the live commander tree so `describe` returns
      descriptions for both `publish` and `release`, with `source: 'live-commander-registry'` made
      literally true. The one trade-off: splitting construction from parsing is a non-trivial
      refactor and a shared seam story-009-002 consumes — keep human `--help` output and user-facing
      CLI behavior unchanged (AC4).
    test_plan: >-
      **Levels:** Unit/integration against the refactored CLI factory. No new CLI behavior, so tests
      must also pin that human-facing output is unchanged.


      **Cases (tests first where practical):**

      - Factory purity (the enabling refactor): `buildProgram(): Command` registers every command
      and does NOT call `.parse()` at module load. Assert importing `index.ts`/`buildProgram` has no
      parse side effects, and the bin entry is `buildProgram().parse()`.

      - `publish` collected (AC2): `collectSpecs()` now includes `publishSpec`; assert `publish`
      appears in the collected specs.

      - describe output completeness for the named commands (AC3): `buildManifest(buildProgram())` →
      manifest where `commands` contains a `CommandDescription` (non-empty `summary`) for BOTH
      `publish` and `release`. Drive this through the live program, not a curated array.

      - Manifest claim made true (AC1): `Manifest.source === 'live-commander-registry'` and every
      node of the live commander tree resolves to a description (full coverage proven exhaustively
      by story-009-002's enumerating test; here assert the collection mechanism reads the live
      registry).

      - No user-facing change (AC4): snapshot `loom --help` (and a representative subcommand
      `--help`) before/after; assert byte-identical. Assert no change to exit codes / command
      surface.


      **Verification bar:** `describe` resolves a description for every live command including
      `publish` and `release`, sourced from the commander registry, with human `--help` output
      unchanged. This `buildProgram` seam is consumed by story-009-002 — keep its signature stable.
  - id: story-009-002
    title: Completeness test enumerates the live registry
    description: >-
      Rewrite the completeness test to enumerate the live command registry and assert that every
      registered command resolves to a description (the inverse of checking the already-collected
      list), so a command can no longer ship invisibly.
    acceptance_criteria:
      - The completeness test enumerates the live command registry.
      - >-
        It asserts every registered command resolves to a description and fails if any registered
        command lacks one.
      - The rewritten test would have caught the previously-missing publish command.
      - publish and release are confirmed present in describe output.
    estimated_complexity: small
    dependencies:
      - story-009-001
    tech_notes: >-
      Rewrite `describeCompleteness.test.ts` to enumerate the live registry via
      `enumerateRegisteredCommands(buildProgram())` (from story-009-001) and assert every node
      resolves to a `CommandDescription`, inverting today's circular check that derived both sides
      from `collectSpecs()`. Also upgrade `buildManifest` from warn-to-stderr to THROW on any
      registered command lacking a spec so the manifest build itself fails closed. Verify the
      rewritten test would have caught the previously-missing `publish` and that both `publish` and
      `release` appear in `describe` output.
    test_plan: >-
      **Levels:** Unit test (the rewritten completeness tripwire) plus a unit test of the
      fail-closed manifest behavior. This is the FR-6 guardrail — it must demonstrably bite.


      **Cases:**

      - Enumerate the LIVE registry (AC1): rewrite `describeCompleteness.test.ts` to call
      `enumerateRegisteredCommands(buildProgram())` and assert every enumerated node resolves to a
      `CommandDescription`. Must NOT derive both sides from `collectSpecs()` (the old circular
      check) — the registry and the spec set are independent inputs.

      - Fails on a missing spec (AC2): with a command registered in `buildProgram()` but no matching
      spec, the test FAILS naming the offending command. Add a temporary/synthetic
      registered-but-unspecced command in the test to prove the assertion fires, then assert clean
      state has none.

      - Would have caught `publish` (AC3): simulate the prior defect (drop `publishSpec` from
      `collectSpecs`) and assert the rewritten test fails on `publish` — proving it closes the exact
      historical gap.

      - Manifest fails closed: `buildManifest` THROWS (not warns to stderr) when a registered
      command lacks a spec. Assert the throw and its message; confirm the old warn path is gone.

      - Positive confirmation (AC4): with the real program, `describe` output contains both
      `publish` and `release`.


      **Verification bar:** The completeness test enumerates the live registry, fails closed on any
      unspecced registered command (proven by an injected gap and by the `publish` simulation), and
      `buildManifest` throws rather than warns. A future invisible command is impossible, not merely
      unlikely.
