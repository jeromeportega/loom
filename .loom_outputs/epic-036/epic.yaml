stories:
  - id: story-036-001
    title: Derive readiness in code from blocking_gaps and score band
    description: >-
      In the BriefRefiner scorer, add a narrow `blocking_gaps` output and stop emitting the `ready`
      boolean from the model; parse `blocking_gaps` safely and additively, then derive `ready` in
      code as score-in-ready-band AND blocking_gaps-empty, with the ready-band threshold sourced
      from the eval's existing high-band definition. Ship targeted unit tests against mocked scorer
      outputs.
    acceptance_criteria:
      - >-
        The model prompt/output contract emits `blocking_gaps` (only gaps severe enough that a
        planner would have to invent requirements to proceed) and no longer emits a `ready` boolean.
      - >-
        `blocking_gaps` is parsed safely and additively, defaulting to empty when the field is
        absent or malformed.
      - >-
        `ready` is computed in code as (quality_score in ready band) AND (blocking_gaps empty), and
        is not taken directly from the model.
      - >-
        The ready-band threshold is sourced from the existing high-band definition the eval harness
        uses (referenced, not guessed or fit to fixtures).
      - >-
        `blocking_gaps` is kept distinct from the existing minor-ambiguity, missing-scope, and
        clarification-question outputs.
      - >-
        The quality score and existing critique arrays are unchanged in computation and shape; the
        `ready` field remains present and same-typed in the output schema.
      - >-
        Unit tests with mocked scorer outputs and no real model calls cover: ready when high band
        and no blocking gap; not ready when a blocking gap exists; not ready when the score is below
        the band; and graceful degradation to score-band-only readiness when `blocking_gaps` is
        absent or malformed.
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      All changes land in `src/brief/BriefRefiner.ts` and `src/brief/types.ts`. In
      `JSON_SCHEMA_INSTRUCTIONS`, remove the `ready` field and its 'ready is true when...' rule (the
      current critical-gap language at ~lines 67–69 becomes the `blocking_gaps` enumeration
      instruction — narrow: only gaps so severe a planner must invent requirements; explicitly NOT
      critique.ambiguities/missing_scope/questions). Add `blocking_gaps: string[]` to
      `BriefRefinement` and parse it in `normalize()` via the existing `asStringArray` guard
      (absent/malformed → `[]`, satisfying graceful degradation for free). Extract a pure
      `deriveReady(qualityScore, blockingGaps, readyBandMin): boolean` returning `qualityScore >=
      readyBandMin && blockingGaps.length === 0`, and replace the `ready: typeof raw.ready ===
      'boolean' ? ...` line with a call to it using the already-`clampScore`d score. Source the
      floor from `BANDS.high[0]` (=7) in `src/eval/brief-quality/bands.ts` — per ADR-001, do NOT
      import `eval/` from `brief/` (that creates a cycle since eval already depends on brief);
      either hoist the band constant to a leaf module brief owns and re-export from `bands.ts`, or
      inject the floor as a parameter wired at call sites (recommended: hoist + re-export, least
      churn). Add `node:test`/`MockLLMClient` unit cases in
      `src/brief/__tests__/BriefRefiner.test.ts` covering: ready (high band + empty gaps), not-ready
      (blocking gap present), not-ready (score below band), and gaps-absent/malformed →
      score-band-only readiness; confirm salvage (`SALVAGE_QUALITY_SCORE`) and `fallback`
      (`FALLBACK_QUALITY_SCORE`) paths score below the floor so derived `ready=false` holds. The one
      trade-off to know: readiness accuracy now rests entirely on the model's `blocking_gaps`
      discipline and `quality_score` calibration — keep `blocking_gaps` semantically distinct from
      the critique arrays (ADR-004) or you reintroduce the fuzzy synthesis you're removing. Leave
      `quality_score`, critique, questions, delta, and `src/brief/gate.ts` untouched (ADR-005).
    test_plan: >-
      LEVEL: Unit tests only — this is pure logic plus a normalization seam, fully coverable with
      `node:test` + `node:assert/strict` and `MockLLMClient` (no real model calls, no network).
      Mirror `src/brief/__tests__/BriefRefiner.test.ts`. Test the pure `deriveReady(qualityScore,
      blockingGaps, readyBandMin)` directly AND the `normalize()` path end-to-end via mocked raw
      outputs, because the AC is about provenance (derived, not read) which only the normalize path
      proves.


      KEY CASES (checklist):

      - HAPPY: score in high band (e.g. 8) AND `blocking_gaps: []` → derived `ready === true`. (AC:
      ready when high band + no gap)

      - BLOCKING GAP PRESENT: high score (e.g. 9) but `blocking_gaps: ['no auth model specified']` →
      `ready === false`. (AC: not ready when blocking gap)

      - BELOW BAND: `blocking_gaps: []` but score below floor (e.g. 6) → `ready === false`. (AC: not
      ready when below band)

      - BOUNDARY: score exactly at the floor (7) → `ready === true`; score one below (6) → `ready
      === false`. Pin the floor to `BANDS.high[0]` from `src/eval/brief-quality/bands.ts` in the
      assertion (or via the hoisted/re-exported leaf constant), NOT a literal `7`, so the test fails
      if the band SSOT moves. (AC: threshold sourced from high-band definition — FR-5)

      - PROVENANCE / model no longer authoritative: feed raw with `ready: true` but a blocking gap →
      derived `ready === false`; and raw with `ready: false` but high band + empty gaps → derived
      `ready === true`. This proves `ready` is computed, not taken from `raw.ready`. (AC: ready not
      taken directly from model — FR-3/FR-4)

      - GRACEFUL DEGRADATION (run via `asStringArray`): `blocking_gaps` absent → `[]`;
      `blocking_gaps` non-array (e.g. a string or number); array with non-string entries → all
      collapse to `[]`, so readiness falls back to score-band-only. With high band these degrade to
      `ready === true`, never throw. (AC: safe/additive parse, default-empty — FR-6)

      - DISTINCTNESS: one mocked output that populates `critique.ambiguities`,
      `critique.missing_scope`, `questions` AND a separate `blocking_gaps` — assert `blocking_gaps`
      is parsed into its own field and does not mirror or absorb those arrays. (FR-2/AC: kept
      distinct)

      - PRESERVATION: assert `quality_score` (clamped) and every `critique` array pass through
      `normalize()` unchanged in shape/content, and `ready` is still a `boolean` in the result.
      (FR-7/AC: score + critique unchanged, ready present and same-typed)

      - FAIL-CLOSED PATHS: assert the salvage (`SALVAGE_QUALITY_SCORE`) and `fallback`
      (`FALLBACK_QUALITY_SCORE`) constants are below the floor, so those paths yield empty gaps +
      sub-floor score → derived `ready === false` automatically.


      VERIFICATION BAR: Every AC above maps to a passing case run against mocked scorer outputs with
      zero real model calls. `deriveReady` exists as a pure, separately-tested function returning
      `qualityScore >= readyBandMin && blockingGaps.length === 0`. The normalize path demonstrably
      derives `ready` from the clamped score + parsed gaps rather than `raw.ready`. The floor used
      in tests resolves to `BANDS.high[0]`. `src/brief/gate.ts`, `quality_score`, critique,
      questions, and delta are untouched — confirm by the existing BriefRefiner/gate tests still
      passing unchanged.
