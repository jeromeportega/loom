    test_plan: >-
      Level: the full workspace build + test suite is the primary gate; add targeted assertions for
      the cross-cutting seams.


      Key cases (each AC mapped):

      - [AC1] `npm run build` is green across loom-core, loom-cli, loom-web — catch
