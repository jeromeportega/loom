stories:
  - id: story-013-001
    title: Add additive `model` column to agent records
    description: >-
      Add a `model` column to the agents table via an additive schema migration. New column only —
      existing rows are left unchanged and never rewritten or reclassified.
    acceptance_criteria:
      - An additive migration adds a `model` column to the agents table
      - The migration runs cleanly against an existing populated database
      - Pre-existing rows are left with a null/empty model and are not rewritten or misclassified
      - No existing column or cost value is altered by the migration
    estimated_complexity: small
    dependencies: []
    tech_notes: >-
      Add the migration in `packages/loom-core/src/state/Database.ts` `runMigrations()` using the
      existing guarded pattern (`PRAGMA table_info` → `if (!agentCols.some(c => c.name ===
      'model'))`) exactly like the v10/v14 column adds: `ALTER TABLE agents ADD COLUMN model TEXT`
      plus `ALTER TABLE epics ADD COLUMN planner_model TEXT`, then bump `SCHEMA_VERSION` (19 → 20).
      Add `model: string | null` to `AgentRecord` in `packages/loom-core/src/types.ts` so the
      interface mirrors the DDL 1:1. The one trade-off: this is additive-only — pre-migration rows
      stay `NULL` and must never be backfilled or reclassified (NFR-1), since a plausible-but-wrong
      model is worse than `unknown`.
    test_plan: >-
      Level: integration against a real better-sqlite3 DB (migration is a DB seam, not
      unit-mockable). Drive `runMigrations()` directly.


      Key cases (each AC mapped):

      - [AC1] After migration, `PRAGMA table_info(agents)` includes a `model` column of type TEXT;
      `PRAGMA table_info(epics)` includes `planner_model` TEXT.

      - [AC2] Open/seed a DB at the prior schema (SCHEMA_VERSION 19) populated with several agent
      rows (with cost_usd and tokens_* set), then run `runMigrations()` — completes with no error;
      `schema_version` row reads 20.

      - [AC2 idempotency] Run `runMigrations()` twice (and re-open an already-migrated DB) — no
      error, no duplicate column, guarded by the existing `PRAGMA table_info` → `!agentCols.some(c
      => c.name === 'model')` check (mirror the v10/v14 pattern).

      - [AC3] For every pre-existing seeded row, assert `model IS NULL` after migration — never
      backfilled, never set to a default/policy model.

      - [AC4] Snapshot all other agent columns (especially `cost_usd`) before and after migration
      and assert byte-for-byte equality; no row count change.

      - [type] `AgentRecord` in `types.ts` now declares `model: string | null` so the interface
      mirrors the DDL 1:1 (compile check).


      Verification bar: migration is additive and idempotent, `agents.model` + `epics.planner_model`
      exist as TEXT, every legacy row keeps `model = NULL`, and all pre-existing columns including
      `cost_usd` are unchanged. SCHEMA_VERSION bumped 19→20.
  - id: story-013-002
    title: Populate model at spawn for worker, planner, and reviewer
    description: >-
      Populate `model` from the resolved policy model at worker spawn, and extend the same
      attribution to planner and reviewer records wherever a model is resolved. If the executed
      model differs from the requested one, record the executed model.
    acceptance_criteria:
      - At worker spawn, `model` is set from the resolved policy model for the worker's role
      - Planner and reviewer records populate `model` wherever a model is resolved
      - Roles that do not resolve a model are unaffected and not given a spurious model
      - >-
        Where a backend overrides or remaps the model after spawn, the executed model is recorded
        rather than only the requested one
      - 100% of newly created agent records have a populated `model`
    estimated_complexity: medium
    dependencies:
      - story-013-001
    tech_notes: >-
      Add `setModel(id, model)` to `AgentStore.ts` and `setPlannerModel(epicId, model)` to the
      EpicStore (paralleling the existing `planner_tokens_*` setter), then wire two-phase writes in
      `orchestrator/Supervisor.ts`: write the requested model from `modelFor(policy, role)`
      (`llm/factory.ts`) at agent create, and upgrade to the executed model when `system/init`
      arrives — extend `ParsedStreamLine` with `model?: string` sourced from `obj.model` already
      parsed at `ClaudeCodeWorker.ts:260`. Extend the same attribution to planner and reviewer, but
      first confirm the ADR-003 `[ASSUMPTION]` that `CodeReviewAgent` persists no distinct row and
      can ride the worker's `agents.model`. The trade-off (ADR-001): a worker that dies before
      `init` retains the requested model, which may differ from a remapping backend's executed model
      — accepted because every row stays populated.
    test_plan: >-
      Level: unit for the new store setters and the parser; integration for the Supervisor two-phase
      write (use a scripted stream rather than a live claude-code process).


      Key cases (each AC mapped):

      - [unit] `AgentStore.setModel(id, model)` persists and reads back via the agent record;
      calling it twice upgrades the stored value (proves later executed model overwrites earlier
      requested model).

      - [unit] `EpicStore.setPlannerModel(epicId, model)` persists alongside the existing
      `planner_tokens_*` setter.

      - [unit] `parseStreamLine` on a `{type:'system', subtype:'init', model:'…'}` line returns
      `ParsedStreamLine.model` from `obj.model` (the value already read at ClaudeCodeWorker.ts:260);
      non-init lines return `model: undefined`.

      - [AC1+AC5] Supervisor writes the requested model from `modelFor(policy, role)` at agent
      create — assert the row is non-null immediately after create, before any stream event.

      - [AC4] Replay a stream whose `init` model differs from the requested model and assert the
      persisted `model` is upgraded to the executed (init) value.

      - [ADR-001 trade-off] A worker that dies before `init` keeps the requested model (still
      non-null) — assert no row is left null.

      - [AC2 planner] Planner path resolves `planning_model` → `epics.planner_model` populated.

      - [AC2 reviewer / ADR-003] Confirm `CodeReviewAgent` persists no distinct agent row and rides
      the worker's `agents.model`; assert no orphan/spurious agent record is created for the
      reviewer.

      - [AC3] A role that resolves no model leaves `model = NULL` — assert no spurious/default model
      is written.


      Verification bar: 100% of newly created agent rows are non-null at create; executed (init)
      model wins over requested when they differ; planner_model set on the epic; reviewer
      attribution rides the worker row with no extra record; non-resolving roles stay NULL.
  - id: story-013-003
    title: Display per-story model on status read surfaces
    description: >-
      Surface the resolved model per story on `loom status` and equivalent read surfaces, displaying
      records that predate the column as an explicit `unknown`.
    acceptance_criteria:
      - '`loom status` and equivalent reads display the per-story model'
      - Records with no stored model display as an explicit `unknown`, never mapped to any model
      - Only the model id is surfaced — no keys, endpoints, or credentials
    estimated_complexity: small
    dependencies:
      - story-013-002
    tech_notes: >-
      Add a single exported `displayModel(model): string` helper in loom-core that returns `model ??
      'unknown'`, and render it in the inline agent line of
      `packages/loom-cli/src/commands/status.ts` rather than printing `agent.model` raw. Surface
      only the model id string — no keys, endpoints, or auth fields (NFR-3). The trade-off
      (ADR-002): CLI and web don't share a formatter, so each surface must remember to route through
      `displayModel()`; the sentinel lives only at the display layer, never in storage.
    test_plan: >-
      Level: unit for the `displayModel()` helper; thin integration/snapshot for the `status.ts`
      render path.


      Key cases (each AC mapped):

      - [AC2 helper] `displayModel('claude-opus-4-8')` → 'claude-opus-4-8'; `displayModel(null)` →
      'unknown'; `displayModel('')` → 'unknown'; `displayModel(undefined)` → 'unknown'.

      - [AC1] `loom status` agent line renders the per-story model via `displayModel(agent.model)` —
      render a story whose agent has a populated model and assert the id appears on its line.

      - [AC2] Render a story whose agent has `model = NULL` and assert the line shows the literal
      `unknown`, never a guessed/policy model and never raw `agent.model`.

      - [AC3] Assert the rendered output contains only the model id string — no API key, endpoint,
      or auth field is present in the agent line (NFR-3).


      Verification bar: status output shows a model per story, NULL renders as literal `unknown` via
      the shared helper, and no credential/endpoint leaks onto the surface.
  - id: story-013-004
    title: Carry model through decision traces
    description: >-
      Include the resolved model for each agent in decision traces, with pre-migration entries shown
      as `unknown`.
    acceptance_criteria:
      - Decision traces include the resolved model for the agent
      - Trace entries with no stored model show as explicit `unknown`
      - Only the model id appears in traces — no keys, endpoints, or credentials
    estimated_complexity: small
    dependencies:
      - story-013-002
    tech_notes: >-
      In `packages/loom-cli/src/commands/traces.ts`, include the agent's resolved model in each
      decision trace entry, routing it through the same `displayModel()` helper so pre-migration
      entries read as `unknown`. Pull the model from the agent record (or thread it via
      `DecisionTraceStore`) and surface only the id — no credentials. Trivial once `displayModel()`
      exists from story-013-003; the only discipline is consistency with the other read surfaces.
    test_plan: >-
      Level: reuse the `displayModel()` unit coverage; integration for the `traces.ts` entry render.


      Key cases (each AC mapped):

      - [AC1] Each decision-trace entry includes the agent's resolved model, sourced from the agent
      record (or threaded via `DecisionTraceStore`) and routed through `displayModel()`.

      - [AC2] A trace entry whose agent has no stored model renders the literal `unknown` (same
      helper as status, so behavior matches by construction).

      - [AC3] Assert only the model id appears in trace fields — no keys, endpoints, or credentials.


      Verification bar: every trace entry shows the agent's model or `unknown` via `displayModel()`,
      consistent with the status surface, with no secrets in any trace field.
