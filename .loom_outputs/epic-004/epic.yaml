stories:
  - id: story-004-001
    title: Define and encode the command-description schema standard
    description: >-
      Define a structured per-command description standard, encode it as a validatable schema
      consistent with loom's schemas/ directory and zod/YAML conventions, and document it so future
      command authors can conform.
    acceptance_criteria:
      - >-
        A validatable schema encodes the per-command standard: name/path, one-line summary,
        when-to-use guidance, positional arguments (name, type, required, description),
        options/flags (name, type, default, description, whether the flag changes the output shape),
        output contract (including the JSON shape emitted under --json where supported), at least
        one usage example, exit codes and common error conditions, and command relationships
        (prerequisites and typical next steps).
      - >-
        The schema lives in and matches the conventions of loom's existing schemas/ directory and
        zod/YAML usage.
      - >-
        A complete, valid description passes schema validation and an incomplete or malformed one
        fails.
      - The standard is documented so future command authors can conform to it.
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      Create `packages/loom-cli/src/describe/schema.ts` exporting the zod schemas from the
      architecture — `CommandDescriptionSchema`, `WorkflowSchema`, `ManifestSchema`, and the leaf
      schemas (`PositionalArgSchema`, `OptionFlagSchema` with its `changesOutputShape` flag,
      `OutputContractSchema`, `UsageExampleSchema`, `ExitCodeSchema`, `RelationshipsSchema`) — plus
      inferred types via `z.infer`. Mirror it by hand into `schemas/cli-description.schema.yaml` as
      JSON-Schema-draft-07-in-YAML, copying the convention header from
      `schemas/epic.schema.yaml`/`policy.schema.yaml` that names zod as the source of truth
      (ADR-004). Document the standard for future authors (a short section in `docs/`), and prove
      validation both ways by feeding one complete spec (passes) and one missing
      `examples`/`exitCodes` (fails) — reuse the `ZodError` issue-formatting pattern from
      `PMAgent.ts:140`. Trade-off: zod and the YAML mirror are hand-synced, exactly as the existing
      schemas are — no codegen.
    test_plan: >-
      Level: unit tests (node:test + node:assert/strict) against the zod schemas in
      `packages/loom-cli/src/describe/schema.ts` — pure validation logic, no I/O, cheapest level.
      This story's risk is the schema admitting an incomplete spec or rejecting a valid one, so test
      both directions of every FR-1 constraint.


      Key cases:

      - Happy: a complete `CommandDescription` fixture (all of name, summary, whenToUse, arguments,
      options, output, ≥1 example, ≥1 exitCode, errors, relationships) passes
      `CommandDescriptionSchema.parse()`.

      - Missing/empty `examples` → fails (FR-1 'at least one example', `min(1)`).

      - Missing/empty `exitCodes` → fails (`min(1)`).

      - `summary` boundary: <5 chars fails, >100 chars fails, in-range passes.

      - `options[].name` regex: `--json`/`--epic` pass; `-j`, `json`, `--Bad` fail. Assert
      `changesOutputShape` is required (omitting it fails).

      - Positional `type: 'enum'` carries `values`; non-enum omits it.

      - `relationships` omitted → defaults to `{prerequisites: [], nextSteps: []}`.

      - `WorkflowSchema`: `id` regex (`plan` passes, `Plan`/`1plan` fail); `steps` empty → fails.

      - `ManifestSchema`: empty `commands` or `workflows` → fails; `source` must equal literal
      `'live-commander-registry'`.

      - ZodError formatting: an invalid spec, run through the `PMAgent.ts:140` pattern
      (`err.issues.map(i => \`${i.path.join('.')}: ${i.message}\`)`), yields a path-qualified
      message like `examples: Array must contain at least 1 element(s)` (assert presence of path +
      message, not a raw stack).

      - Mirror present: `schemas/cli-description.schema.yaml` exists, is draft-07-in-YAML, and opens
      with the convention header naming zod as source of truth (assert via a string read).


      Verification bar: a complete spec validates and a spec missing `examples` or `exitCodes` (or
      violating any bound above) fails with a path-qualified error; the schema lives in
      `describe/schema.ts`, the hand-synced YAML mirror exists in `schemas/`, and the standard is
      documented in `docs/`. All four acceptance criteria proven by at least one passing+failing
      pair.
  - id: story-004-002
    title: Author co-located descriptions for every registered command
    description: >-
      Co-locate a description with each command definition as the single source of truth and author
      one conforming description for every command the CLI registers today, feeding both machine
      output and human help from one origin.
    acceptance_criteria:
      - >-
        Each registered command has a description co-located with its command definition as the
        single source of truth (no duplicate description store).
      - >-
        Descriptions exist for the parity-port additions pull-guidance and project and cover the new
        stop and propose flags; removed commands such as serve are excluded.
      - Every authored description validates against the standard schema from story-004-001.
      - >-
        Descriptions feed both machine output and human --help where practical, from a single
        origin.
    estimated_complexity: large
    dependencies:
      - story-004-001
    tech_notes: >-
      For each registered command, add `export const spec: CommandDescription` co-located in its own
      `packages/loom-cli/src/commands/*.ts` next to the `run*` handler (ADR-002), and have
      `describe/registry.ts` `collectSpecs()` import them into one array. Cover the parity-port
      additions (`pull-guidance`, `project`) and the new `stop`/`propose` flags, exclude removed
      commands like `serve`, and remember `mcp list`/`mcp add` and `guard check` are real registered
      subcommands that need full-path `name` specs (`"mcp add"`, `"guard check"`). The one
      trade-off: ~29 files are touched, but this is the deliberate anti-drift design — the
      description lives where the behavior lives, so a flag change surfaces the spec in the same
      file.
    test_plan: >-
      Level: unit tests over the assembled spec registry — iterate `collectSpecs()` and validate
      each entry; no need for integration here since specs are static data. Risk is an authored spec
      that is invalid, missing, or duplicated, plus the named coverage gaps.


      Key cases:

      - Every spec returned by `collectSpecs()` passes `CommandDescriptionSchema.parse()` (loop +
      assert per spec; failure names the offending command).

      - Named additions present: a spec exists with `name === 'pull-guidance'` and one with `name
      === 'project'`.

      - New flags covered: the owning command's spec lists `--stop` and `--propose` in
      `options[].name` (assert on the correct command per current CLI wiring).

      - Removed command excluded: no spec has `name === 'serve'`.

      - Full-path subcommand names present and exact: `'mcp add'`, `'mcp list'`, `'guard check'`
      each appear as a spec `name` (regression guard — these are real registered subcommands, not to
      be dropped or shortened).

      - Single source of truth: spec `name` values are unique (no duplicate description store);
      assert the set size equals the array length.

      - One-origin summary (where wired via applySpec): for an applySpec-wired command, `program`
      resolves it and `command.description()` equals the spec's `summary`.


      Verification bar: `collectSpecs()` yields exactly one valid spec per registered command with
      unique names, the parity-port additions and new flags are covered, `serve` is absent, and the
      subcommand full-path names are exact. (Registry-vs-live-program completeness is owned by
      story-004-005; this story proves the authored content itself is valid and complete.)
  - id: story-004-003
    title: Encode core task-level workflows
    description: >-
      Capture a small set of task-level workflows that chain commands to accomplish a goal, anchored
      by the six core tasks named in acceptance, and encode them against the standard.
    acceptance_criteria:
      - A small set of workflows is encoded, each chaining commands to accomplish a goal.
      - >-
        Workflows cover the six core tasks — planning, approving, running, checking status,
        retrying, and reconciling — including the plan → approve → run path.
      - >-
        Exact command names for the retry/resume and reconcile paths are confirmed against the
        current CLI.
      - Encoded workflows validate against the standard/manifest schema.
    estimated_complexity: medium
    dependencies:
      - story-004-001
    tech_notes: >-
      Create `packages/loom-cli/src/describe/workflows.ts` exporting `WORKFLOWS: Workflow[]`
      covering the six core tasks — planning, approving, running, status, retrying, reconciling —
      each as `WorkflowSchema`-valid steps with `command` strings that must be real command `name`s
      present in the manifest (including the plan → approve → run chain). Before encoding, confirm
      the exact CLI names for the retry/resume and reconcile paths against the live `program`
      registry (don't guess — e.g. verify whether it's `run --retry`, `retry`, or `reconcile`).
      Validate each workflow against `WorkflowSchema` from story-004-001; the only subtlety is
      keeping every `steps[].command` referentially valid against `collectSpecs()`.
    test_plan: >-
      Level: unit tests over `WORKFLOWS` in `packages/loom-cli/src/describe/workflows.ts`. The
      load-bearing risk is referential integrity — a workflow step naming a command that does not
      exist — and guessed retry/reconcile names, so test those hardest.


      Key cases:

      - Each entry in `WORKFLOWS` validates against `WorkflowSchema` (loop + parse).

      - Six-task coverage: the set of workflow `id`s includes `plan`, `approve`, `run`, `status`,
      `retry`, `reconcile` (or the agreed ids for those goals) — assert all six present.

      - plan → approve → run chain: a workflow encodes those three as ordered `steps[].command`
      values in sequence.

      - Referential integrity (critical): every `steps[].command` across all workflows resolves to a
      real spec `name` in `collectSpecs()` — assert each is a member of the spec-name set; a typo or
      stale name turns the suite red.

      - Confirmed CLI names: the retry/resume and reconcile steps use command names actually present
      in the live `program` registry (don't assume — assert the chosen name, e.g.
      `run`/`retry`/`reconcile`, is registered). This is the case that catches a guessed name.

      - Each workflow has ≥1 step and a non-empty `goal`.


      Verification bar: `WORKFLOWS` validates against `WorkflowSchema`, covers all six core tasks
      including the plan→approve→run path, and every referenced command name resolves against
      `collectSpecs()`/the live registry — no dangling or guessed command references.
  - id: story-004-004
    title: Implement loom describe and wire human-facing output
    description: >-
      Ship the loom describe command emitting the full machine-readable manifest as JSON or a single
      command's description by name, update docs/capabilities.md, and (stretch) generate a
      human-readable CLI reference from the same source.
    acceptance_criteria:
      - >-
        loom describe with no argument emits the full machine-readable manifest as JSON, validating
        against the standard.
      - >-
        loom describe <command> emits a single command's description by name, validating against the
        standard.
      - The manifest includes per-command descriptions and the encoded task-level workflows.
      - >-
        docs/capabilities.md is updated to reflect the new describe command and any user-visible
        knobs.
      - Existing human --help output continues to function unchanged.
      - '[stretch] A human-readable CLI reference can be generated from the same description source.'
    estimated_complexity: medium
    dependencies:
      - story-004-002
      - story-004-003
    tech_notes: >-
      Build `describe/applySpec.ts` (`applySpec(cmd, spec)` wiring `spec.summary`→`.description()`,
      `spec.arguments`→`.argument()`, `spec.options`→`.option()`, ADR-003), `describe/manifest.ts`
      (`buildManifest(program)` assembling `collectSpecs()` + `WORKFLOWS`, validating against
      `ManifestSchema` and throwing formatted `ZodError`), and `commands/describe.ts`
      (`runDescribe(name?)` — no arg prints full manifest, an arg prints one `CommandDescription`,
      unknown name exits non-zero to stderr). Emit with `console.log(JSON.stringify(payload, null,
      2))` exactly like `status.ts:86`/`diff.ts:90` — no new formatter — read `loomVersion` from the
      existing `PKG_VERSION` in `index.ts`, register `describe` in `index.ts`, and add its row to
      `docs/capabilities.md`. The trade-off (ADR-005): `describe` is always JSON for a clean agent
      contract — the stretch human reference is a *separate* generator consuming `buildManifest()`
      output, not a `--format` flag, and existing `--help` must stay untouched.
    test_plan: >-
      Level: integration for the command's observable contract (invoke `runDescribe`/the CLI and
      capture stdout, stderr, exit code) plus focused unit tests for `applySpec` and
      `buildManifest`. The command's contract is 'valid JSON to stdout, correct exit codes' — assert
      on parsed output and process result, not internals.


      Key cases:

      - `loom describe` (no arg): stdout parses as JSON and validates against `ManifestSchema`;
      manifest contains both `commands` (the per-command specs) and `workflows` (the encoded task
      workflows); exit 0.

      - `loom describe status` (single command): stdout validates against `CommandDescriptionSchema`
      and deep-equals that command's authored spec; exit 0.

      - Multi-word lookup: `loom describe 'guard check'` and `loom describe 'mcp add'` resolve to
      the right spec.

      - Unknown name: `loom describe nope` exits non-zero, writes a message to stderr, and emits no
      valid manifest to stdout.

      - `applySpec(cmd, spec)`: wired command's `.description()` === `spec.summary`; declared
      `spec.arguments`/`spec.options` appear in `command.registeredArguments`/`command.options`
      (single-origin wiring).

      - `buildManifest(program)`: with a deliberately invalid spec injected, throws a ZodError
      formatted as `path: message` (per `PMAgent.ts:140`); on valid input returns a
      `ManifestSchema`-valid object.

      - `loomVersion` in the manifest equals `PKG_VERSION` from `index.ts`.

      - Emission is `console.log(JSON.stringify(payload, null, 2))` — output is deterministic and
      round-trips through `JSON.parse`.

      - NFR-1 smoke: `loom --help` and e.g. `loom status --help` still print help and exit 0
      (unchanged).

      - Docs: `docs/capabilities.md` contains a `describe` row (assert via read).

      - [stretch, only if implemented] the human-reference generator consumes `buildManifest()`
      output and produces non-empty reference text.


      Verification bar: both `describe` forms emit standard-valid JSON (full manifest incl.
      workflows; single-command lookup), unknown names exit non-zero to stderr, `--help` output is
      unchanged, and `capabilities.md` reflects the new command.
  - id: story-004-005
    title: Add the description completeness test
    description: >-
      Add a completeness test that enumerates every registered command and asserts each has a
      complete, valid description, mirroring the parity-oracle pattern from the MCP-removal epic.
    acceptance_criteria:
      - >-
        The test enumerates every command the CLI registers and asserts each has a description that
        validates against the standard.
      - The suite fails if any registered command lacks a complete, valid description.
      - The test derives its command inventory from the registry, not a hand-maintained list.
      - The test mirrors the parity-oracle pattern from the MCP-removal epic.
    estimated_complexity: small
    dependencies:
      - story-004-001
      - story-004-002
    tech_notes: >-
      Add `packages/loom-cli/src/__tests__/describeCompleteness.test.ts` using `node:test` +
      `node:assert/strict` (mirroring `cliParity.test.ts`), driven by
      `enumerateRegisteredCommands(program)` which recursively flattens `program.commands` to
      full-path names (including `guard`/`mcp` subcommands) and asserts each has a spec in
      `collectSpecs()` that passes `CommandDescriptionSchema`; also assert the ADR-003 drift check
      that each spec's `options[].name` set matches `command.options`. Critically (ADR-001) derive
      the inventory from the *live* Commander registry, not a hardcoded list — this deliberately
      inverts the parity oracle's frozen-snapshot approach, so do NOT copy `cliParity.test.ts:42`'s
      hand-maintained array. Trade-off: this test catches *added* commands lacking specs but won't
      notice *removed* commands — that removal tripwire stays owned by `cliParity.test.ts`.
    test_plan: >-
      Level: this story's deliverable IS a test —
      `packages/loom-cli/src/__tests__/describeCompleteness.test.ts` (node:test +
      node:assert/strict, run over compiled dist, mirroring `cliParity.test.ts`). The plan is how to
      build it correctly and prove it actually fails when coverage breaks.


      Key cases the test must implement:

      - `enumerateRegisteredCommands(program)` recursively flattens `program.commands` to full-path
      names, including `guard`/`mcp` subcommands — assert it returns entries like `status`, `run`,
      `guard check`, `mcp add`, `mcp list`.

      - For every enumerated command, assert a spec with matching `name` exists in `collectSpecs()`
      AND passes `CommandDescriptionSchema` — a registered command with no/invalid spec turns the
      suite red.

      - Drift check (ADR-003): for each command, the spec's `options[].name` set equals the live
      `command.options` long-flag names — divergence fails.

      - Inventory source (ADR-001): the inventory is derived from the live `program` via
      `enumerateRegisteredCommands`, NOT a hardcoded array — explicitly do not copy
      `cliParity.test.ts:42`'s frozen list. (Code review point; reinforce with the meta-proof
      below.)

      - Meta-proof that the tripwire works: in a sub-test, build a minimal program registering a
      command with no matching spec (or a deliberately invalid spec) and assert the completeness
      assertion throws — demonstrating the suite would go red on a missing/invalid description
      rather than passing vacuously.

      - Mirrors the parity-oracle pattern (enumerate → assert completeness → fail loud) while
      inverting its inventory source.


      Verification bar: the test enumerates commands from the live registry, passes when every
      registered command has a complete valid spec with matching options, and is demonstrably
      registry-driven — a synthetic missing or malformed spec makes it fail. The added-command gap
      is closed even though removal stays owned by `cliParity.test.ts`.
  - id: story-004-006
    title: Verify clean build, green suite, and no regressions
    description: >-
      Run the full build and test suite across all packages and fix any cross-cutting regressions,
      confirming no command behavior changed and no MCP surface was reintroduced.
    acceptance_criteria:
      - The full build passes.
      - The entire test suite passes.
      - No existing command behavior is broken and human --help still works.
      - No MCP server or tool surface has been reintroduced.
    estimated_complexity: small
    dependencies:
      - story-004-001
      - story-004-002
      - story-004-003
      - story-004-004
      - story-004-005
    tech_notes: >-
      Run `npm run build` and `npm run test` across all workspace packages and fix any cross-cutting
      fallout from the new `describe/*` modules and ~29 edited `commands/*.ts` files. Manually
      confirm `loom --help` and a few commands' `--help`/behavior are unchanged (NFR-2), and assert
      no MCP server/socket/LLM surface was reintroduced — `commands/describe.ts` should import only
      `describe/*` and `commander`, performing no git, network, DB, or subprocess work (NFR-3).
      Largely mechanical verification; the one watch-point is import-cycle or build-order errors
      from `registry.ts` pulling in every command module.
    test_plan: >-
      Level: full-suite/system verification plus targeted regression smoke — this is the green-build
      gate, not new feature tests. Largely orchestration over existing suites; the watch-point is
      build-order/import-cycle fallout from `registry.ts` importing every command module.


      Key cases:

      - `npm run build` exits 0 across all workspace packages (catches import-cycle or build-order
      errors from `describe/registry.ts` pulling in all ~29 command modules).

      - `npm run test` — entire suite green across packages, including the new
      `describeCompleteness.test.ts` and the existing `cliParity.test.ts`.

      - NFR-2 regression: `loom --help` and a few commands' `--help` (e.g. `status`, `run`, `guard
      check`) still print and exit 0 unchanged; at least one command's real behavior unchanged (e.g.
      `loom status --json` emits the same shape as before).

      - NFR-3 no-MCP invariant: assert `commands/describe.ts` imports only `describe/*` and
      `commander`; `runDescribe` performs no git, network, DB, subprocess, server, or socket work
      (static import-graph / grep assertion plus the behavioral check that `describe` opens no
      listener). Confirm `mcp list`/`mcp add` (worker provisioning) remain registered and were not
      deleted — they are unrelated to loom's removed own-MCP surface.


      Verification bar: full build and full test suite pass with no regressions; `--help` and
      sampled command behavior are unchanged; and no server/socket/LLM/MCP surface was reintroduced
      by the describe work.
