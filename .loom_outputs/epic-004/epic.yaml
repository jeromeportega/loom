stories:
  - id: story-004-001
    title: Switch CursorAgentWorker to stream-json with partial output
    description: >-
      Change CursorAgentWorker to invoke cursor-agent with --output-format stream-json
      --stream-partial-output and adapt its parseStreamLine override to the streamed event shape, so
      stdout activity feeds the stall timer. Preserve usage/request-count harvesting (including the
      requestCount: 1 per-session fallback) and human-readable dashboard SSE live output, and verify
      BaseCliWorker's terminal-event detection and partial-line carry under the new format.
    acceptance_criteria:
      - >-
        CursorAgentWorker spawns cursor-agent with --output-format stream-json
        --stream-partial-output
      - >-
        parseStreamLine parses the streamed event shape, verified against fixture lines in tests
        under __tests__/
      - >-
        Each streamed stdout event resets the stall timer; a test verifies a worker emitting
        incremental output survives a story running 3x the stall window
      - >-
        A test verifies a worker with zero output for story_stall_minutes is still terminated at the
        window
      - >-
        Usage/request-count harvesting (including the requestCount: 1 fallback) and dashboard SSE
        live output behave the same as before the format switch
      - >-
        BaseCliWorker terminal-event detection and partial-line carry are covered by tests under the
        stream-json format
      - docs/capabilities.md progress-aware timeouts row notes the cursor-cli backend nuance
    estimated_complexity: large
    dependencies: []
    tech_notes: >-
      In packages/loom-core/src/orchestrator/CursorAgentWorker.ts, change agentArgs() to return
      ['-p', '--model', this.model, '--force', '--trust', '--output-format', 'stream-json',
      '--stream-partial-output'] and rewrite parseStreamLine as a defensive per-line JSON.parse
      mirroring ClaudeCodeWorker.parseStreamLine: handle the CursorStreamEvent union
      (system/user/assistant/tool_call/result), emit humanText from assistant text content, and
      harvest usage only from the terminal type:'result' event via the existing readNum key lists
      with the requestCount: 1 fallback when usage fields are absent (ADR-3). Do NOT touch
      WorkerTimeoutGuard or BaseCliWorker's recordActivity wiring — stall reset comes free from
      stdout chunks (ADR-1); keep streamingInput() false and the never-terminal isTerminalLine
      default (ADR-7). Capture real cursor-agent stream-json fixture lines under
      packages/loom-core/src/__tests__/ and pin the parse, the 3x-stall-window survival case, the
      genuine-silence kill at story_stall_minutes, terminal-event detection, and partial-line carry;
      update the progress-aware timeouts row in docs/capabilities.md. Trade-off: you are pinning
      cursor-agent's event cadence — unknown event shapes must fall through to humanText or {} and
      never throw, so version drift degrades to noise rather than a crashed worker.
    test_plan: >-
      Levels: unit tests for parseStreamLine (pure, fixture-driven) plus in-process integration
      tests through BaseCliWorker.spawnAgent with a fake child process and fake timers for the guard
      interaction — no real cursor-agent, no sleeps. All under packages/loom-core/src/__tests__/.
      Cases: (1) agentArgs() returns exactly
      ['-p','--model',<model>,'--force','--trust','--output-format','stream-json','--stream-partial-output'].
      (2) parseStreamLine against real captured fixture lines: system/init → no humanText/usage;
      assistant with text content → humanText equals the text (this is the SSE live-output surface —
      assert onOutput receives it unchanged); tool_call → no throw; result with usage fields →
      WorkerUsage harvested via the existing readNum keys including request_count and
      total_cost_usd. (3) result event with NO usage fields → usage with requestCount: 1 (the
      per-session fallback, FR-4). (4) Garbage line (non-JSON) and unknown event type → falls
      through to {humanText: line} or {}, never throws. (5) Partial-line carry: one fixture event
      split mid-JSON across two stdout 'data' chunks parses once, correctly, after the second chunk.
      (6) Terminal-event detection: a 'result' line does not end the session early (isTerminalLine
      stays never-terminal); session ends on process exit. (7) Stall behavior with fake timers and a
      stubbed guard/spawn: a worker emitting a chunk every fraction of the stall window survives a
      run lasting 3x story_stall_minutes with zero kills; (8) a worker emitting nothing is killed
      exactly at story_stall_minutes — same as today. Do NOT test WorkerTimeoutGuard internals;
      drive it only via stdout chunks (the contract per ADR-1). Verification bar: all fixture parse
      cases green; survival-at-3x and kill-at-window both pinned by deterministic fake-timer tests;
      usage fold and requestCount fallback byte-identical to the pre-switch semantics;
      docs/capabilities.md progress-aware timeouts row updated with the cursor-cli nuance (checklist
      item, reviewed in diff).
  - id: story-004-002
    title: Loud startup warning for self-defeating stall config on cursor-cli
    description: >-
      When worker_backend is cursor-cli and story_stall_minutes < story_absolute_cap_minutes, emit a
      loud startup warning naming both values and the risk of killing healthy workers. Warning
      chosen over default-to-cap per PRD FR-6 decision.
    acceptance_criteria:
      - >-
        Startup with worker_backend: cursor-cli and story_stall_minutes < story_absolute_cap_minutes
        emits a warning naming both values and the false-kill risk
      - No warning is emitted on other backends or when the condition does not hold
      - Tests under __tests__/ cover both the warning and non-warning cases
    estimated_complexity: small
    dependencies: []
    tech_notes: >-
      Create packages/loom-core/src/orchestrator/configWarnings.ts exporting
      stallConfigWarning(policy: Policy): string | undefined — non-undefined only when
      agents.worker_backend === 'cursor-cli' && story_stall_minutes < story_absolute_cap_minutes,
      with a message naming both values and the false-kill risk. Wire a single console.warn call
      site in packages/loom-cli/src/run.ts at startup next to the existing
      integration_branch/integrator warnings (~line 256); keep all logic in the pure core function
      so both warning and non-warning cases are unit-testable under node --test in
      packages/loom-core/src/__tests__/ (ADR-4 pattern). Trade-off per ADR-5: warn only, never
      rewrite story_stall_minutes — silently defaulting to the cap would weaken genuine-silence
      protection.
    test_plan: >-
      Level: unit only — stallConfigWarning is a pure function in
      packages/loom-core/src/orchestrator/configWarnings.ts; do not test the console.warn call site
      in run.ts. Cases: (1) worker_backend: 'cursor-cli', story_stall_minutes: 12,
      story_absolute_cap_minutes: 60 → returns a string containing both numeric values ('12', '60')
      and false-kill risk wording. (2) cursor-cli with stall === cap → undefined (boundary). (3)
      cursor-cli with stall > cap → undefined. (4) worker_backend: 'claude-code' with stall < cap →
      undefined. Verification bar: warning fires only for the exact self-defeating cursor-cli
      condition, names both values, and every non-matching combination returns undefined; the
      function never mutates policy (assert story_stall_minutes unchanged — ADR-5 says warn, never
      rewrite).
  - id: story-004-003
    title: Fail-fast cursor_model validation against cursor-agent --list-models
    description: >-
      Validate cursor_model and the cursor-cli planning_model against cursor-agent --list-models
      output at loom doctor and at the start of loom epic / loom run, before any LLM pass. When
      --list-models itself fails (offline, unauthenticated), degrade to an actionable message rather
      than crashing or false-failing valid configuration.
    acceptance_criteria:
      - >-
        An invalid cursor_model or cursor-cli planning_model is rejected at loom doctor and at the
        start of loom epic / loom run, before the brief refiner or any worker spawns
      - The rejection message shows the complete valid-model list
      - >-
        When --list-models fails, validation emits an actionable warning/error and does not
        false-fail a valid configuration
      - Tests under __tests__/ cover the valid, invalid, and degraded --list-models cases
      - docs/capabilities.md loom doctor row documents the new model-validation check
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      Create packages/loom-core/src/llm/cursorModels.ts with parseListModelsOutput(stdout): string[]
      (pure, fixture-tested), listCursorModels(cursorBin?) using execFileSync('cursor-agent',
      ['--list-models']) with an args array (no shell), and validateCursorModels(policy, cursorBin?)
      returning CursorModelCheck | undefined — undefined when neither llm_backend nor worker_backend
      is 'cursor-cli'; note modelFor() in llm/factory.ts means validating cursor_model also covers
      the cursor-cli planning model. Add ≤10-line call sites: doctor.ts gets a Check row (warn on
      'unavailable', fail on 'invalid' only when a cursor backend is configured), epic.ts and run.ts
      call it right after policy load and process.exit(1) on status === 'invalid' BEFORE
      BriefRefiner/Supervisor construction; the 'invalid' message must include the complete
      validModels list. Unit-test the ok/invalid/unavailable matrix against fixture stdout in
      packages/loom-core/src/__tests__/ and update the loom doctor row in docs/capabilities.md.
      Trade-off: degrade-open on probe failure (FR-8) means an offline typo still surfaces late — by
      design, no worse than today.
    test_plan: >-
      Level: unit tests in packages/loom-core/src/__tests__/ against fixture stdout — never spawn
      the real CLI; the CLI call sites (doctor.ts/epic.ts/run.ts) are ≤10-line pass-throughs
      verified by code review, not new CLI test harness (ADR-4). Cases: (1) parseListModelsOutput on
      a captured --list-models fixture → exact expected string[]; (2) parseListModelsOutput on
      empty/garbage stdout → [] without throwing. (3) validateCursorModels returns undefined when
      neither llm_backend nor worker_backend is 'cursor-cli' (nothing to validate). (4) cursor_model
      present in the fixture list → status 'ok'. (5) cursor_model absent → status 'invalid',
      invalidIds names it, and message contains EVERY model from validModels — assert all entries
      appear, not a prefix (this is the G-4 contract). (6) listCursorModels failure (stub a bad
      cursorBin / nonexistent binary) → status 'unavailable', validModels [], actionable message,
      and critically NOT 'invalid' — a valid config must not false-fail offline (FR-8). Verification
      bar: the full ok/invalid/unavailable matrix is pinned; the invalid message provably carries
      the complete model list; degraded mode warns without failing. Manual smoke for the call-site
      semantics (doctor warns on unavailable, epic/run exit 1 on invalid before BriefRefiner) noted
      in the story PR; docs/capabilities.md loom doctor row updated (diff-reviewed checklist item).
  - id: story-004-004
    title: Preserve full stderr on non-zero cursor-agent exit
    description: >-
      Remove or greatly raise the 500-char output.slice in CursorCliClient.ts so that non-zero
      cursor-agent exits surface full (or near-full) stderr — the one message that lists the valid
      model ids.
    acceptance_criteria:
      - >-
        On non-zero cursor-agent exit, the surfaced error contains stderr in full or at a bound
        large enough to show the complete valid-model list untruncated
      - A test under __tests__/ covers a non-zero exit with stderr longer than 500 chars
    estimated_complexity: trivial
    dependencies: []
    tech_notes: >-
      In packages/loom-core/src/llm/CursorCliClient.ts, replace output.slice(0, 500) at ~line 65 in
      complete() with a named constant MAX_ERROR_OUTPUT_CHARS = 64_000 and interpolate
      proc.output.slice(0, MAX_ERROR_OUTPUT_CHARS) into the 'cursor-agent exited' Error message. Add
      one test under packages/loom-core/src/__tests__/ asserting a non-zero exit with >500-char
      stderr surfaces untruncated. Trade-off per ADR-6: keep a bound rather than going unbounded —
      64 KB covers any model list while capping memory/log spam on pathological output.
    test_plan: >-
      Level: one unit test in packages/loom-core/src/__tests__/, driving CursorCliClient.complete
      with a stubbed subprocess. Cases: (1) non-zero exit with stderr of ~2,000 chars (longer than
      the old 500 bound, shaped like a model list) → thrown Error message contains the entire stderr
      untruncated — assert the final characters are present, not just a substring near the start.
      Optionally (2) assert the bound is the named constant MAX_ERROR_OUTPUT_CHARS = 64_000 by
      construction (import the constant), but do not pad with a >64KB truncation test unless the
      constant is exported. Verification bar: a failure message long enough to hold a complete
      valid-model list survives intact; both acceptance criteria covered by case 1.
