stories:
  - id: story-004-001
    title: Fix orphaned web wiring (blocking prerequisite)
    description: >-
      Mount the inbox.ts and mutations.ts routers in createApp() before any leftover inline route
      for the same path, delete the now-duplicate inline approve/reject/retry/stop/kill handlers
      (located by route path + body, not line number), keep the inline archive handler, and newly
      serve POST /api/epics/:id/resume.
    acceptance_criteria:
      - >-
        inbox.ts and mutations.ts are mounted in the real createApp() and GET /api/inbox returns
        200, not 404 (proven by a real-createApp test)
      - >-
        Duplicate inline approve/reject/retry/stop/kill handlers are removed; the inline archive
        handler is retained and still functions
      - >-
        POST /api/epics/:id/resume is served and the approve endpoint returns {status:'dispatching'}
        (covered by real-createApp route tests)
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      Edit `loom-web/src/server/index.ts` `createApp()` (~line 67): call `registerInboxRoutes(app,
      ...)` and `registerMutationRoutes(app, ...)` *before* the leftover inline handlers — Express
      dispatches first-registered-wins (ADR-003), so mounting the routers first makes them
      authoritative and de-risks the deletion. Then delete the duplicate inline
      approve/reject/retry/stop/kill handlers by locating them via route path + body (NOT line
      number, which drifts), keep the inline archive handler since `mutations.ts` has none, and add
      `POST /api/epics/:id/resume`. The one trade-off: there is a transient window where both a
      router and an inline handler match the same path (router wins) — guard against regression with
      NFR-4 real-`createApp` route tests asserting `GET /api/inbox`→200 and
      approve→`{status:'dispatching'}` rather than unit-mocking the app.
    test_plan: >-
      Level: integration route tests against the REAL `createApp()` from
      `loom-web/src/server/index.ts` (NFR-4) — never a hand-built express app, so an unmounted route
      fails loudly. Use supertest (or the existing harness) over `createApp(deps)` with stubbed
      store deps.


      Key cases:

      - [Happy] `GET /api/inbox` returns 200 with the pending-items body (regression guard against
      the prior 404 — assert NOT 404 explicitly).

      - [Happy] `POST /api/epics/:id/approve` returns `{status:'dispatching'}` (proves the mounted
      mutations router wins over any inline handler).

      - [New route] `POST /api/epics/:id/resume` returns 200/served (was previously unserved →
      assert NOT 404).

      - [Retained] inline archive handler still works: exercise the archive endpoint and assert its
      success response (mutations.ts has no archive, so it must survive the deletion).

      - [Duplicate removal] reject/retry/stop/kill each resolve to the mounted router's behavior,
      not a stale inline handler — assert each returns its router response shape, proving
      first-registered-wins ordering (ADR-003).

      - [Ordering] a focused assertion that the router is authoritative for a shared path (e.g.
      approve), to catch a future re-introduction of an inline duplicate ahead of the router.


      Verification bar: every acceptance criterion is met when, exercised through the actual
      `createApp`, `GET /api/inbox`→200, approve→`{status:'dispatching'}`, `POST .../resume` is
      served, archive still functions, and no removed inline handler shadows a router route. A test
      must fail if any of these routes regresses to 404 or to the wrong handler.
  - id: story-004-002
    title: Signal persistence with reconciliation (SignalStore + schema v17)
    description: >-
      Add a SignalStore writing to a new signals table at schema v17 with a UNIQUE constraint on a
      stable key. Re-running a scan UPSERTs last_seen and marks any previously-open signal not
      re-observed as stale; each scan writes an audit row.
    acceptance_criteria:
      - >-
        Database.ts SCHEMA_VERSION bumps 16 → 17 using idempotent CREATE TABLE IF NOT EXISTS;
        pre-v17 DBs auto-create the new tables and default behavior with no scan run is unchanged
      - >-
        signals table has a UNIQUE constraint on a stable key; re-running a scan UPSERTs last_seen
        rather than inserting duplicates
      - Any previously-open signal not re-observed in a scan is marked stale (proven by test)
      - Each scan writes an audit row
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      Create `loom-core/src/signals/SignalStore.ts` and bump `Database.ts` `SCHEMA_VERSION` 16→17
      using `CREATE TABLE IF NOT EXISTS` for the `signals` table (UNIQUE on `key`, plus
      `idx_signals_status`/`idx_signals_source`) so pre-v17 DBs auto-create it and the no-scan
      default path is unchanged (NFR-1). Implement `upsertMany` with `INSERT ... ON CONFLICT(key) DO
      UPDATE SET last_seen=excluded.last_seen, status='open', detail=..., weight=..., metadata=...`,
      `reconcile(observedKeys)` to flip un-observed `open`→`stale` (returns count), and
      `listOpen(limit?)`/`getByKeys`. Use the synchronous `better-sqlite3` connection and write one
      `audit_log` row per scan via the existing `AuditLog.record({action:'signal_scan', detail})`;
      the trade-off is rows are never deleted (ADR-004), so the table grows unbounded — acceptable
      under the single-serial-operator assumption.
    test_plan: >-
      Level: unit/integration against a real in-memory `better-sqlite3` DB (`:memory:`) — this is
      the DB seam, so use a real connection, not a mock. Construct `SignalStore(db)` directly.


      Key cases:

      - [Migration] Opening a fresh DB applies `SCHEMA_VERSION` 17 and `CREATE TABLE IF NOT EXISTS
      signals` (plus `idx_signals_status`/`idx_signals_source`) exists; assert the version row reads
      17.

      - [Migration/compat] Open a simulated pre-v17 DB (version 16, no signals table) → migration
      auto-creates the table without error and existing rows are untouched (NFR-1); default behavior
      with no scan run is unchanged.

      - [UNIQUE key] inserting two `Signal`s with the same `key` does not create duplicate rows;
      `upsertMany` reports `inserted` vs `refreshed` correctly.

      - [UPSERT refresh] re-upserting an existing key updates `last_seen`, `detail`, `weight`,
      `metadata` and resets `status='open'`, but keeps `first_seen` and `id` stable.

      - [Reconcile→stale] after upserting keys A,B then calling `reconcile([A])`, B flips
      `open`→`stale` and the returned count is 1; A stays `open`. A `stale` row re-observed on next
      scan returns to `open`.

      - [listOpen cap] `listOpen(limit)` returns only `open` rows and honors the limit (the capped
      set the engine consumes).

      - [getByKeys] returns exactly the requested keys, ignoring unknown ones.

      - [Audit] each scan persistence path writes one `audit_log` row via
      `AuditLog.record({action:'signal_scan', detail})`.


      Verification bar: criteria met when a real-DB test proves v16→v17 idempotent migration,
      UNIQUE-key UPSERT (no dup rows, `last_seen` advanced), unobserved-open→stale reconciliation,
      and one audit row per scan.
  - id: story-004-003
    title: SignalScanner interface and ≥3 real scanners
    description: >-
      Define a stable SignalScanner interface under loom-core/src/signals/ and implement
      audit-introspection, code-debt, and github-issues scanners reading this repo's real state with
      no fixtures in the live path, wired into a scan orchestration that persists via SignalStore.
    acceptance_criteria:
      - >-
        ≥3 scanners implement SignalScanner: audit-introspection (recurring work_failure, retry
        clusters, review_status='errored', epic_integration_gate failures), code-debt (regex
        TODO|FIXME|HACK over tracked source), and github-issues (one signal per open gh issue)
      - code-debt caps at 200 deterministic matches per scan with dropped matches logged
      - >-
        github-issues degrades gracefully on missing gh, missing remote, auth failure, rate-limit,
        and network timeout: it never throws and returns zero signals plus an audit note
      - >-
        One test per scanner proves it produces real signals from this repo, persisted and
        UPSERT-deduped with stale-marking on re-run
    estimated_complexity: large
    dependencies:
      - story-004-002
    tech_notes: >-
      Define the `SignalScanner` interface (`source`, `scan(ctx: ScanContext): Promise<Signal[]>`)
      in `loom-core/src/signals/SignalScanner.ts` and implement three scanners plus a `runScan.ts`
      orchestrator that persists through `SignalStore` (story-004-002). `CodeDebtScanner` walks `git
      ls-files`-scoped tracked source with `RegExp /TODO|FIXME|HACK/`, ordered by path-then-line,
      capping at 200 matches and logging the dropped count (ADR-007); `GithubIssuesScanner` uses
      `child_process.spawn('gh', ['issue','list','--json',...])` with an arg array and NO shell
      (injection control) and MUST return `[]` + an audit note — never throw — on missing
      `gh`/remote/auth/rate-limit/timeout (FR-5); `AuditIntrospectionScanner` queries the real
      `audit_log` for recurring `work_failure`/retry clusters, `review_status='errored'`, and
      `epic_integration_gate` failures. The critical contract: scanners read real repo state with no
      fixtures — testability comes from stubbing the `gh` subprocess and the DB, so each scanner is
      deterministic and produces stable `key`s for UPSERT-dedup with stale-marking on re-run.
    test_plan: >-
      Level: unit/integration per scanner against a real `:memory:` DB and a STUBBED `gh`
      subprocess. The live path has no fixtures — testability comes from stubbing
      `child_process.spawn` for `gh` and seeding the real `audit_log`/`signals` tables, never from
      fixture Signal objects. Run scanners through `runScan.ts` persisting via `SignalStore`.


      Key cases:

      - [audit-introspection happy] seed `audit_log` with recurring `work_failure`, a retry cluster,
      a `review_status='errored'` row, and an `epic_integration_gate` failure → scanner emits one
      signal per detected cluster with deterministic `key`s; assert kinds and evidence references.

      - [code-debt happy] over the repo's git-tracked source, `RegExp /TODO|FIXME|HACK/` produces
      signals with `key` = `code-debt:<path>:<line>:<token>`, ordered by path-then-line.

      - [code-debt cap — FR-4] feed a tree (or stubbed `git ls-files` set) with >200 matches →
      exactly 200 emitted in deterministic order and the dropped count is logged to the scan audit
      row.

      - [github-issues happy] stub `gh issue list --json` returning N open issues → exactly N
      signals, one per issue, with the issue URL as evidence; assert `spawn('gh',[...])` is called
      with an arg array and NO shell (injection control) and that issue titles containing shell
      metacharacters are passed as data, not interpolated.

      - [github-issues degradation — FR-5] for EACH of: missing `gh` binary (ENOENT), missing
      remote, auth failure, rate-limit, network timeout → scanner returns `[]`, never throws, and
      writes an audit note distinguishing 'no issues' from 'gh unavailable'.

      - [persistence + dedup] run a scan, then re-run with the same real state → signals
      UPSERT-dedup (no duplicate rows, `last_seen` advanced); remove one source signal and re-run →
      that signal is stale-marked. One such test per scanner (AC4).


      Verification bar: criteria met when ≥3 scanners each produce real, deterministic signals from
      this repo, code-debt is capped at 200 with the drop logged, github-issues never throws across
      all five degradation modes (each with an audit note), and a re-run proves UPSERT-dedup +
      stale-marking per scanner.
  - id: story-004-004
    title: Opportunity engine — batched LLM clustering and deterministic scoring
    description: >-
      Add a single batched, injectable/stubbable LLM clustering+scoring call per scan over the
      capped open-signal set that proposes impact/effort/confidence and a rationale, plus a pure
      deterministic scoring/ranking function and stable opportunity keys, with robust cluster-output
      validation, persisted for serving.
    acceptance_criteria:
      - >-
        Exactly one batched LLM call per scan over the capped open-signal set; the LLM client is
        injectable and stubbed in tests (never one call per signal)
      - >-
        A pure deterministic function computes score = impact * confidence / max(effort, 0.1) and
        assigns descending rank given fixed LLM output
      - >-
        Each opportunity has a stable key = sha1(sorted(member signal keys)); scoped/dismissed keys
        are never resurfaced, open keys are refreshed, and materially-changed membership yields a
        new key — proven by a test keyed on the opportunity key
      - >-
        Cluster output validation drops unknown signal_ids, skips empty clusters, and on malformed
        JSON triggers exactly one repair re-prompt then skips opportunity generation without failing
        the whole scan
      - Opportunities are persisted with rationale, evidence links, and signal counts
    estimated_complexity: large
    dependencies:
      - story-004-003
    tech_notes: >-
      Build `loom-core/src/signals/OpportunityEngine.ts` plus the `opportunities` table (schema v17,
      UNIQUE on `key`). Keep `scoreOf(impact,confidence,effort) =
      impact*confidence/Math.max(effort,0.1)` and `opportunityKey(memberKeys) =
      sha1(sorted(memberKeys))` (`crypto.createHash`) as pure deterministic functions — the NFR-5
      determinism guarantee covers these, not the LLM. `generate(openSignals)` makes EXACTLY ONE
      `LLMClient.complete()` call over the capped `listOpen()` set (never per-signal; ADR-002)
      routed via `modelFor(policy,'planning')`, presenting batch-local `SignalRecord.id`s and
      resolving returned `signal_ids[]` back to durable `signal.key`s before hashing (ADR-005).
      Validate hard (FR-10): drop unknown ids, skip empty clusters, clamp impact/effort/confidence
      to `[0,1]`, and on malformed JSON re-prompt exactly once then skip opportunity generation
      without failing the scan; on UPSERT, refresh `open` keys but leave `scoped`/`dismissed`
      untouched so they never resurface. The trade-off the implementer must accept: the cheaper tier
      yields coarser clusters and membership drift mints a new key (near-duplicate churn) rather
      than merging — a similarity step is explicitly out of scope.
    test_plan: >-
      Level: unit with an injected `MockLLMClient` returning canned `ClusterProposal[]`, plus
      real-DB persistence of `opportunities`. The determinism guarantee (NFR-5) covers the pure
      functions and ranking GIVEN fixed LLM output — stub the LLM, never assert on real model
      variance.


      Key cases:

      - [Single call — ADR-002] `generate(openSignals)` invokes `LLMClient.complete()` EXACTLY ONCE
      regardless of signal count (spy/count the calls); assert never one-call-per-signal and that
      the call is routed via the planning/cheaper model.

      - [scoreOf pure] `scoreOf(impact,confidence,effort)` =
      `impact*confidence/Math.max(effort,0.1)`; table-test including `effort=0` (uses 0.1 floor) and
      the `[0,1]` bounds.

      - [Ranking] given fixed proposals, opportunities get descending `rank` (1 = highest score);
      ties broken deterministically.

      - [opportunityKey — ADR-001] `opportunityKey(memberKeys)` = `sha1(sorted(memberKeys))`:
      order-independent (same set → same key), and a changed member set → a different key.

      - [id→key resolution — ADR-005] LLM returns batch-local `signal_ids`; engine resolves to
      durable `signal.key`s before hashing; assert the persisted `member_keys` are keys, not row
      ids.

      - [Validation — FR-10] drop unknown `signal_id`s; skip empty clusters; clamp
      `impact/effort/confidence` to `[0,1]` when the LLM returns out-of-range values.

      - [Malformed JSON] first `complete()` returns unparseable JSON → exactly ONE repair re-prompt;
      if the repair also fails, opportunity generation is skipped and the scan does NOT throw
      (assert call count = 2 and scan completes).

      - [UPSERT non-resurrection] pre-seed an `open` opportunity (refreshed with new
      score/rank/rationale on matching key) and a `scoped` and a `dismissed` one (left untouched,
      never resurfaced) — keyed assertion on the opportunity `key`.

      - [Persistence] opportunities are written with `rationale`, `evidence` links, and
      `signal_count`.


      Verification bar: criteria met when, with a stubbed LLM, exactly one batched call occurs,
      scoring/ranking/keys are deterministic and provable by a key-based test, validation survives
      unknown ids / empty clusters / one malformed-JSON repair without failing the scan, and
      scoped/dismissed keys never resurface while open keys refresh.
  - id: story-004-005
    title: Explicit-only scoping with governance invariant
    description: >-
      Implement scopeOpportunity(opportunityId) that runs only on explicit operator action, feeding
      description + evidence_summary through BriefRefiner and Planner to produce a planned + manual
      epic linked via scoped_epic_id, and enforce that scoped epics flow through the existing
      plan_approval inbox gate without auto-approval.
    acceptance_criteria:
      - >-
        scopeOpportunity produces a real planned + autonomy_level='manual' epic that passes the
        brief gate, links scoped_epic_id, and sets opportunity status='scoped' (tested with stubbed
        planner + LLM)
      - On brief-gate failure the critique is recorded and the opportunity is left open (tested)
      - >-
        The scoped epic appears in GET /api/inbox as a pending plan_approval and stays planned until
        an explicit approve; no code path auto-approves or auto-scopes on a score threshold (proven
        by test)
      - A later-rejected scoped epic returns its opportunity to open (tested)
    estimated_complexity: medium
    dependencies:
      - story-004-004
    tech_notes: >-
      Implement `loom-core/src/signals/scopeOpportunity.ts` with a single class of caller — an
      explicit operator action — feeding the opportunity's `rationale`/evidence summary through the
      existing `BriefRefiner.refine()` and `evaluateBriefGate()` (`min_brief_quality_score` from
      policy) into `Planner.run()`. On pass, create a `planned` epic with `autonomy_level='manual'`,
      set `opportunities.scoped_epic_id`+`status='scoped'`, and write an audit row; on gate failure,
      record the critique and leave the opportunity `open` (return `{ok:false, critique}`). The
      governance invariant is structural (ADR-006): the scoped epic must appear in `GET /api/inbox`
      as a pending `plan_approval` and stay `planned` until an explicit approve — there is
      deliberately no scheduler, no score-threshold auto-scope, and no auto-approve branch, and a
      test should grep-assert that absence plus the Supervisor-reject path returning the opportunity
      to `open`.
    test_plan: >-
      Level: integration with stubbed `Planner`, `BriefRefiner`/`evaluateBriefGate`, and
      `MockLLMClient`, over a real `:memory:` DB holding `opportunities`, `epics`, `audit_log`. Plus
      a structural (grep) test for the governance invariant.


      Key cases:

      - [Happy scope — FR-11/12] `scopeOpportunity(deps, id)` feeds `rationale`/evidence_summary
      through the brief gate (pass, given `min_brief_quality_score`), runs `Planner.run()`, and
      creates an epic with `status='planned'` AND `autonomy_level='manual'`; sets
      `opportunities.scoped_epic_id` and `status='scoped'`; returns `{ok:true, epicId}`; writes an
      `opportunity_scoped` audit row.

      - [Gate failure] stub the brief gate to fail → returns `{ok:false, critique}`, records the
      critique (audit row), and leaves the opportunity `status='open'` (no epic created).

      - [Inbox surfacing — FR-12] the newly scoped epic appears in `GET /api/inbox` as a pending
      `plan_approval` (reuse the existing source, no new tagging) and stays `planned` until an
      explicit approve; assert the Supervisor does NOT auto-approve it.

      - [Governance invariant — ADR-006, structural] a test that greps the `signals/` source and
      asserts the ABSENCE of any scheduler/daemon/cron, any score-threshold auto-scope caller, and
      any auto-approve branch; `scopeOpportunity` has exactly one class of caller (explicit operator
      action).

      - [Reject returns to open] simulate the operator/Supervisor REJECTING the scoped epic → the
      linked opportunity returns to `status='open'`.

      - [Idempotency] scoping an already-`scoped` opportunity does not double-create an epic.


      Verification bar: criteria met when scoping produces a planned+manual epic that gates through
      the existing `plan_approval` inbox (never auto-approved), gate failure leaves the opportunity
      open with a recorded critique, a structural test proves no auto-scope/auto-approve path
      exists, and a reject returns the opportunity to open.
  - id: story-004-006
    title: Discovery surfaces — opportunity board, API, CLI, and MCP tool
    description: >-
      Expose the pipeline through a read-only federated GET /api/opportunities, an opportunities.js
      board view with ranked cards, token-gated audit-logged scope/dismiss endpoints, a loom scan
      CLI command (and optional loom opportunities), and a loom_scan_signals MCP tool.
    acceptance_criteria:
      - >-
        GET /api/opportunities serves a read-only federated list and is covered by a real-createApp
        test
      - >-
        opportunities.js board renders opportunities ranked, with rationale, evidence links, signal
        counts, Scope/Dismiss buttons, and an empty state
      - >-
        POST /api/opportunities/:id/scope and POST /api/opportunities/:id/dismiss are token-gated
        and audit-logged, each covered by a real-createApp test
      - >-
        loom scan CLI command (and optional loom opportunities) and the loom_scan_signals MCP tool
        expose the pipeline end to end
    estimated_complexity: large
    dependencies:
      - story-004-001
      - story-004-005
    tech_notes: >-
      Create `loom-web/src/server/routes/opportunities.ts` (`registerOpportunityRoutes`) mounted in
      `createApp()` alongside `registerFleetRoutes`: `GET /api/opportunities` is read-only federated
      (reuse `makeResolveProjectDb`/`ProjectRegistry` validation for `?project=`, mirroring
      `/api/fleet`), while `POST /:id/scope` and `POST /:id/dismiss` go through
      `accessGuard({token,readOnly})` (requires the write token even in read-only mode,
      `timingSafeEqual`) and each write an audit row. Add `loom-web` frontend `opportunities.js`
      mirroring `fleet.js` (ranked cards with rationale, evidence links, signal counts,
      Scope/Dismiss buttons, and an empty state), a `commander` `program.command('scan')` in
      loom-cli mirroring `runEpic` (plus optional `loom opportunities`), and a `loom_scan_signals`
      entry in `loom-mcp/src/tools/registry.ts` `TOOL_DEFINITIONS` with a handler mirroring
      `loom_get_status`. Cover scope/dismiss/list with real-`createApp` route tests; the one gotcha
      is that scope/dismiss are mutations that must stay token-gated even though the list is
      public-read.
    test_plan: >-
      Level: integration route tests against the REAL `createApp()` (NFR-4) for the API; a
      lightweight DOM/render unit test for `opportunities.js`; smoke tests for the CLI command and
      MCP tool handler.


      Key cases:

      - [GET list — happy] `GET /api/opportunities` returns 200 with a ranked `OpportunityCard[]`
      (rationale, `evidence[]`, `signal_count`, `status`), read-only and federated — mirrors
      `/api/fleet`; covered by a real-`createApp` test.

      - [GET federation/path-traversal] `?project=` is validated through
      `makeResolveProjectDb`/`ProjectRegistry` before any DB is opened; an unregistered project id
      is rejected, not opened.

      - [Scope endpoint — token-gated] `POST /api/opportunities/:id/scope` WITHOUT the write token →
      401/403 via `accessGuard` (write token required even in read-only mode); WITH the token →
      invokes scoping and writes an audit row. Real-`createApp` test.

      - [Dismiss endpoint — token-gated] `POST /api/opportunities/:id/dismiss` without token →
      rejected; with token → sets `status='dismissed'`, returns `{status:'dismissed'}`, writes an
      audit row, and the dismissed opportunity does not resurface on re-scan. Real-`createApp` test.

      - [Read vs write] confirm `GET` needs no write token but both POSTs do (the key gotcha:
      public-read list, gated mutations).

      - [Board render] `opportunities.js` renders cards in `rank` order with rationale, evidence
      links, signal counts, and Scope/Dismiss buttons; assert the EMPTY STATE renders when the list
      is empty (assert on semantic locators / visible text, not DOM internals).

      - [CLI] `loom scan` runs the pipeline end-to-end with an injected/stub LLM and prints the
      ranked board (and optional `loom opportunities`); `--json` emits structured output.

      - [MCP] `loom_scan_signals` handler is registered in `TOOL_DEFINITIONS`, accepts `{project?}`,
      and returns the ranked board (mirrors `loom_get_status`).


      Verification bar: criteria met when list/scope/dismiss are each proven through the actual
      `createApp` (list public-read, both mutations token-gated and audit-logged), the board renders
      ranked cards plus an empty state, and the CLI command and MCP tool drive the pipeline end to
      end.
