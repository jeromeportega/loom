stories:
  - id: story-010-001
    title: Build the StorySignals record at story completion
    description: >-
      At each story's completion point in the Supervisor/worker path, compute HeuristicSignals from
      existing state, resolve the implied tier/steps via the existing tier.ts functions, and
      assemble one StorySignals record. No execution behavior changes — the resolver output is
      recorded, not applied.
    acceptance_criteria:
      - >-
        diff_lines and diff_files are computed for the story branch vs. the resolved epic base (e.g.
        the epic branch merge-base); the chosen base ref is confirmed resolvable at story-completion
        time.
      - risky_paths_touched lists changed files matching policy.agents.risky_paths via minimatch.
      - >-
        tests_green_first_try is set from the first-try test result, or null when that signal source
        is unavailable (the write site confirms whether the source exists).
      - >-
        Tier and steps are produced by calling the existing resolveCostTier and tierSteps with no
        new or divergent decision logic.
      - >-
        camelCase tierSteps output (verifyPhase, skillGen) is mapped to snake_case
        StorySignals.steps fields (verify_phase, skill_gen).
      - Computation runs regardless of policy.agents.adaptive_cost.
      - >-
        Unit tests cover heuristic computation (diff counts, minimatch risky-path matching, null
        first-try case) and assert tier/steps equal resolveCostTier/tierSteps for the same inputs.
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      Create the new module `packages/loom-core/src/orchestrator/signalLedger.ts` and implement
      `computeHeuristics(input: HeuristicInput)` and `buildStorySignals(...)` there. For diff counts
      use `gitSafe(...)` from `orchestrator/git.ts` to run `git diff --numstat`/`--name-only` over
      `assignment.baseSha..HEAD` inside `assignment.worktreePath` — the same range/mechanism
      `BaseCliWorker.changedFiles`/`workerDiff` use (BaseCliWorker.ts:909,938);
      `risky_paths_touched` is the changed-file list filtered with `minimatch` against
      `policy.agents.risky_paths`. Call the UNCHANGED `resolveCostTier` + `tierSteps` from
      `orchestrator/tier.ts` and do the casing map (`verifyPhase→verify_phase`,
      `skillGen→skill_gen`) in `buildStorySignals` ONLY (ADR-5). The one trade-off:
      `tests_green_first_try` is `null` this release (no first-try source on `WorkerResult`, NFR-4),
      which pins `confidence='low'` and makes most stories resolve `heavy` — that bias is the
      intended measurement, not a bug to fix; unit-test that tier/steps equal
      `resolveCostTier`/`tierSteps` for identical inputs.
    test_plan: >-
      Level: **unit** — `computeHeuristics` and `buildStorySignals` in
      `packages/loom-core/src/orchestrator/signalLedger.ts` are deterministic given inputs. Drive
      the diff cases with a small temp-git-repo fixture (real `gitSafe` over `baseSha..HEAD`) so you
      exercise the actual `git diff --numstat`/`--name-only` parsing; stub `gitSafe` only if a temp
      repo is impractical.


      Key cases (checklist):

      - [ ] diff_lines = sum(added+deleted), diff_files = count of changed files, parsed from
      `--numstat` over `assignment.baseSha..HEAD` (same range as `BaseCliWorker.changedFiles`,
      BaseCliWorker.ts:909/938).

      - [ ] Boundary: empty diff → diff_lines=0, diff_files=0 (no crash, no NaN).

      - [ ] Boundary: binary file rows in numstat (`-\t-\t<file>`) do not produce NaN; counted in
      diff_files, contribute 0 lines.

      - [ ] risky_paths_touched: happy path — some changed files match `policy.agents.risky_paths`
      via minimatch; none-match → `[]`; all-match → full list. Use real glob patterns.

      - [ ] tests_green_first_try: `null` when no first-try source (the actual release behavior,
      ADR-3); also assert true/false pass straight through `HeuristicInput.testsGreenFirstTry` to
      the field (plumbing).

      - [ ] tier/steps equality: for several `HeuristicSignals` inputs, assert
      `buildStorySignals(...).tier` === `resolveCostTier(sameInput)` and `.steps` maps
      `tierSteps(sameInput)` — assert equality against the live functions, NOT hardcoded enum
      values, so a future `tier.ts` tweak can't silently diverge (FR-2).

      - [ ] Casing map: `tierSteps` camelCase `{verifyPhase, skillGen}` → `StorySignals.steps`
      `{verify_phase, skill_gen}`, and prove the rename happens ONLY in `buildStorySignals` (ADR-5)
      — e.g. `steps` carries no `verifyPhase`/`skillGen` keys.

      - [ ] heavy-bias: with self_assessment absent → confidence='low', confirm resolver yields
      `heavy` (document this is expected measurement, not a bug).

      - [ ] adaptive_cost-independence: computation has no branch on `policy.agents.adaptive_cost`
      (assert identical output with the knob on vs off, or by inspection that the knob is never read
      here).


      Verification bar: every AC has a named passing test; tier/steps are proven equal to
      `resolveCostTier`/`tierSteps` for identical inputs; the snake_case mapping is pinned;
      null/empty/binary diff edges don't throw. `tier.ts` is imported and called, never edited.
  - id: story-010-002
    title: Persist StorySignals to audit_log and .loom/signals markdown
    description: >-
      Write each StorySignals record to two sinks: an audit_log row and a human-readable markdown
      file at .loom/signals/<story-id>.md. Persistence is best-effort and must never block or fail
      story completion.
    acceptance_criteria:
      - >-
        The audit_log row is written before the story result returns to the caller (CLAUDE.md
        logging invariant).
      - A markdown file is written to .loom/signals/<story-id>.md keyed by story id.
      - Computed values (heuristics, tier, steps) are identical across both sinks.
      - Recording occurs regardless of policy.agents.adaptive_cost.
      - >-
        Any failure to write either sink (e.g. unwritable .loom/signals) is swallowed and does not
        block or fail story completion.
      - .loom/signals is gitignored run state, not committed artifacts.
      - >-
        A cross-sink shape test pins identical computed values and the camelCase→snake_case field
        mapping across both sinks.
    estimated_complexity: medium
    dependencies:
      - story-010-001
    tech_notes: >-
      Implement `class SignalLedger` in the same `signalLedger.ts`, constructed with `{ db,
      projectRoot }`, and call `ledger.record(storyId, signals, agentId)` from the Supervisor
      story-completion seam — the block that already writes the `code_review_pass` audit row
      (Supervisor.ts:~2011-2019) where `baseSha`/`worktreePath`/db are in scope and the worktree
      isn't pruned. Write both sinks by serializing ONE `StorySignals` object: an `audit_log` row
      via `AuditLog.record` with `action='story_signals'`, `command=storyId`,
      `detail=JSON.stringify(signals)` (no migration — reuse the JSON `detail` column, ADR-7), and
      `.loom/signals/<story-id>.md` via `fs.writeFileSync`. Wrap everything in try/catch so the
      method NEVER throws (FR-8) — optionally emit a `story_signals_skipped` row on failure — and
      validate `storyId` against the `story-NNN-NNN` pattern before building the path to block
      traversal. The trade-off: double-write drift risk, so the required cross-sink shape test must
      assert both sinks carry identical computed values and the snake_case mapping; ensure
      `.loom/signals/` is covered by the existing `.loom/` gitignore entry and that recording runs
      regardless of `policy.agents.adaptive_cost`.
    test_plan: >-
      Level: **integration** for the two sinks (real `better-sqlite3` temp/in-memory DB + a temp
      `projectRoot` on disk), **unit** for storyId validation and the never-throws contract. Target
      `class SignalLedger.record` / `readEpic` in `signalLedger.ts`, invoked at the Supervisor seam
      that already writes `code_review_pass` (Supervisor.ts:~2011-2019).


      Key cases (checklist):

      - [ ] audit_log sink: `record()` writes a row via `AuditLog.record` with
      `action='story_signals'`, `command=<storyId>`, `allowed=1`, `detail=JSON.stringify(signals)`;
      round-trip it back through `getByStory`/`WHERE command=?` and `JSON.parse(detail)` to the same
      `StorySignals`.

      - [ ] NFR-2 ordering: the audit row exists before `record()` returns (assert row present
      synchronously on return; no deferred/async write).

      - [ ] markdown sink: file created at `.loom/signals/<story-id>.md` keyed by id, containing
      tier, steps, and heuristics.

      - [ ] **Cross-sink shape test (FR-3/FR-4, required):** parse the audit `detail` JSON and the
      markdown body; assert identical computed values (diff_lines, diff_files, risky_paths_touched,
      tier, steps) and that `steps` is snake_case (`verify_phase`, `skill_gen`) in both — both
      serialized from ONE `StorySignals` object.

      - [ ] Best-effort, never throws (FR-8): force an unwritable `.loom/signals` (read-only dir or
      a path collision) → `record()` returns normally, does not throw, story completion is
      unaffected; if implemented, a `story_signals_skipped` audit row is emitted.

      - [ ] Best-effort on DB error: a failing/closed DB handle is swallowed the same way —
      `record()` still does not throw.

      - [ ] Path-traversal guard: storyIds not matching `story-NNN-NNN` (e.g. `../../etc/passwd`,
      `story-1/../x`) are rejected before path construction; no file is written outside
      `.loom/signals/`.

      - [ ] adaptive_cost-independence: recording happens with `policy.agents.adaptive_cost` both on
      and off (FR-5).

      - [ ] gitignore: assert `.loom/signals/` is covered by the existing `.loom/` entry in
      `.gitignore` (NFR-3) — read the file and confirm the ledger path is ignored.


      Verification bar: both sinks written from one object with provably identical values + casing;
      `record()` is shown to never throw under forced disk and DB failures; the audit row lands
      before return; traversal is blocked; recording is knob-independent and the ledger path is
      gitignored.
  - id: story-010-003
    title: Render Build signal analysis section in EpicFinalizer
    description: >-
      EpicFinalizer reads back the persisted ledger records (never writes them) and appends a
      per-story 'Build signal analysis' section to the epic PR body, beside the existing
      integration-gate section, listing heuristics, recommended tier/steps, and flagged mismatches.
    acceptance_criteria:
      - EpicFinalizer reads .loom/signals records and never writes them.
      - >-
        The epic PR body contains a 'Build signal analysis' section beside the integration-gate
        section.
      - >-
        The section lists, per story, the heuristics, the recommended tier and steps, and any
        mismatch flags.
      - >-
        Over-spend mismatch is flagged: a story recommended heavy that then finalized with no review
        findings and a green gate is marked as a candidate future gating could safely downgrade.
      - The under-spend direction is not flagged.
      - >-
        Story-level review findings and gate status needed for the over-spend flag are confirmed
        available at finalize time (or the flag degrades gracefully when granularity is missing).
      - >-
        A unit test covers the section renderer, including the over-spend flag case and the
        heavy-bias-without-flag case.
    estimated_complexity: medium
    dependencies:
      - story-010-002
    tech_notes: >-
      Add a pure `renderBuildSignalAnalysis(input: SignalRenderInput): string` (no I/O) in
      `signalLedger.ts`, and wire `EpicFinalizer.finalize` to call `ledger.readEpic(storyIds)`
      (audit_log-only readback, NEVER markdown, NEVER writes) after `composeBody`, appending the
      result immediately after the existing `if (gateOutcome) body += renderGateSection(...)` at
      EpicFinalizer.ts:664-666. The over-spend flag (FR-7) fires only when a story was recommended
      `heavy` AND finalized with zero review findings AND a green gate; never flag under-spend. The
      trade-off the implementer must respect: the integration gate is epic-level today (ADR-6), so
      per-story `gateGreen` may be identical across stories — when story-level findings/gate
      granularity is missing, the renderer must degrade to emitting heuristics + tier WITHOUT
      asserting the flag rather than printing false precision; unit-test the over-spend case and the
      heavy-bias-without-flag case.
    test_plan: >-
      Level: **unit** for the pure `renderBuildSignalAnalysis(input: SignalRenderInput): string` (no
      I/O), plus a focused **integration** test for the `EpicFinalizer.finalize` wiring (real DB so
      `readEpic` reads audit_log) and the **NFR-1 regression** assertion.


      Key cases (checklist):

      - [ ] Renders a section headed `Build signal analysis`, appended after `renderGateSection`
      (EpicFinalizer.ts:664-666), listing per story (in `storyOrder`) the heuristics, recommended
      tier, and steps.

      - [ ] Over-spend flag fires (FR-7): tier=`heavy` AND `reviewFindings===0` AND
      `gateGreen===true` → story marked a candidate future gating could safely downgrade.

      - [ ] heavy-bias WITHOUT flag: tier=`heavy` but `reviewFindings>0` OR `gateGreen!==true` →
      heuristics+tier emitted, no downgrade flag.

      - [ ] Under-spend never flagged: e.g. tier=`light`/`standard` with findings present → no flag
      emitted in either direction.

      - [ ] Graceful degradation (ADR-6): `outcomes` missing/`null` (`gateGreen:null` or
      `reviewFindings:null`, since the gate is epic-level today) → emit heuristics + tier WITHOUT
      asserting the flag; assert the output contains no false-precision flag text.

      - [ ] readEpic readback: `ledger.readEpic(storyIds)` returns the latest record per story id
      from audit_log only, parsing `detail`; given duplicate rows for a story, the newest wins.

      - [ ] **Read-path purity (NFR-1, load-bearing):** after `finalize` runs the read path, assert
      NO new audit rows and NO `.loom/signals` writes occur from reading; `SignalLedger` is not
      imported by any execution-decision code.

      - [ ] **NFR-1 regression:** reviewer count, verify-phase spawn, and skill-generation decisions
      are identical whether or not ledger records exist (run finalize/dispatch with records present
      vs absent → same execution outcomes).


      Verification bar: renderer is a pure function whose output covers every per-story field; the
      over-spend flag fires on exactly the heavy+no-findings+green-gate triple and on nothing else;
      under-spend is never flagged; missing granularity degrades instead of asserting; the finalizer
      only reads (no writes) and proves zero execution impact.
