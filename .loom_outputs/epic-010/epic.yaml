stories:
  - id: story-010-001
    title: Release command refreshes and stages the lockfile
    description: >-
      In the release command, refresh and stage the lockfile so it stays in sync with the bumped
      package versions, leaving no lockfile drift after a release.
    acceptance_criteria:
      - After a release, the lockfile reflects the bumped package versions.
      - The refreshed lockfile is staged as part of the release commit.
      - The repository is clean with no lockfile drift after the release command completes.
    estimated_complexity: small
    dependencies: []
    tech_notes: >-
      In `release.ts`, after `scripts/bump-versions.mjs` does its surgical `package.json` version
      edits and before the release commit, run `npm install --package-lock-only` and add
      `package-lock.json` to the existing release-commit pathspec (ADR-5). This rewrites the
      lockfile (lockfileVersion 3) to match bumped versions without mutating `node_modules`, leaving
      zero drift. The one trade-off: it assumes the registry is reachable to resolve metadata —
      accepted, since release is already an online operation (it opens a PR via `gh`) — and note
      this in-sync lockfile is what enables the `npm ci` worktree-refresh alternative in
      story-007-001.
    test_plan: >-
      **Levels:** Unit/integration on `release.ts`'s lockfile step, with `npm` and `git`
      interactions at the seam. Avoid running a real network install in the unit test; assert the
      command sequence and staging, and use one controlled integration check for actual lock sync.


      **Cases:**

      - Lockfile refreshed after bump (AC1): assert `release.ts` runs `npm install
      --package-lock-only` AFTER `scripts/bump-versions.mjs` edits versions and BEFORE the release
      commit. Verify order at the seam.

      - Lock reflects bumped versions (AC1, integration): in a temp fixture repo, bump versions then
      run the refresh; assert `package-lock.json` (lockfileVersion 3) entries for the workspace
      packages match the bumped versions and `node_modules` is untouched.

      - Staged in the release commit (AC2): assert `package-lock.json` is added to the existing
      release-commit pathspec (the commit includes it alongside the bumped `package.json` files).

      - Clean tree after release (AC3): post-command, `git status` shows no unstaged/untracked
      lockfile drift — the repo is clean.

      - Boundary: if no versions changed, the step is still safe (no spurious drift). Note the
      documented trade-off (registry reachable) — don't write a test requiring an air-gapped
      environment.


      **Verification bar:** After the release flow, the lockfile matches bumped versions, is part of
      the release commit, and leaves zero drift — proving a later `npm ci` (including the
      story-007-001 worktree-refresh alternative) would resolve cleanly.
  - id: story-010-002
    title: Clean build sets the executable bit on the CLI entry
    description: >-
      Ensure a clean build sets the executable bit on the CLI entry point so the linked command is
      runnable without a manual chmod (POSIX target).
    acceptance_criteria:
      - A clean build produces a CLI entry with the executable bit set.
      - >-
        The linked command is runnable immediately after a clean build with no manual executable-bit
        change.
      - Behavior holds on POSIX (macOS/Linux); Windows is out of scope.
    estimated_complexity: small
    dependencies: []
    tech_notes: >-
      Append a post-`tsc` step `chmod +x dist/index.js dist/loom-bench.js` to `packages/loom-cli`'s
      `build` script so the bin targets declared in its `package.json` (`loom`, `loom-bench`) are
      executable after a clean build (ADR-6). This exists specifically because story-008-001's `rm
      -rf dist` wipes the previously-surviving `755` bit that `tsc`'s `644` output would otherwise
      lack — order the build as clean→tsc→chmod. The one trade-off: POSIX-only (macOS/Linux);
      Windows ignores the bit and is explicitly out of scope (NFR-4).
    test_plan: >-
      **Levels:** Build-step verification — POSIX-only. A small integration test that runs the
      loom-cli clean build and inspects the resulting file mode.


      **Cases:**

      - Exec bit set after clean build (AC1): run `packages/loom-cli` `build` (which is `rm -rf dist
      && tsc && chmod +x dist/index.js dist/loom-bench.js`); assert `dist/index.js` and
      `dist/loom-bench.js` have the owner-executable bit (mode `& 0o100`). These are the `bin`
      targets (`loom`, `loom-bench`) in `package.json`.

      - Runnable after link (AC2): after the clean build, the linked command runs with no manual
      `chmod` — e.g. invoke the built `dist/index.js` (or `loom --version` post-`npm link`) and
      assert a successful exit. Proves the bit is correct, not just present.

      - Order coupling (regression vs story-008-001): assert the clean step precedes `chmod`
      (clean→tsc→chmod) so the `rm -rf dist` that wipes the bit is followed by its restoration. A
      build that chmods before tsc/clean must fail this.

      - Platform scope (AC3): guard/skip the mode assertion on Windows (NFR-4 out of scope); run it
      on macOS/Linux.


      **Verification bar:** A from-clean build yields executable `dist/index.js` and
      `dist/loom-bench.js`, the linked `loom` runs with no manual intervention, and the chmod is
      ordered after the clean step on POSIX.
