stories:
  - id: story-023-001
    title: Backend-appropriate timeout and robust JSON recovery
    description: >-
      Harden the existing classifier's call path: raise the classification timeout to a generous,
      configurable default sized to the session-subprocess backend's real ~100s latency (with
      headroom), and recover the JSON verdict from prose- or markdown-fence-wrapped model output
      using a forceful instruction plus an assistant prefill that begins the JSON.
    acceptance_criteria:
      - >-
        The classification timeout default accommodates the real ~100s backend latency with headroom
        and is configurable (not the old 20s cap).
      - >-
        The classifier extracts the JSON verdict object from conversational or markdown-fenced
        output via a forceful instruction plus an assistant prefill.
      - Tests feed realistic non-pure-JSON responses through the parsing path and pass.
    estimated_complexity: small
    dependencies: []
    tech_notes: >-
      Work entirely inside `packages/loom-core/src/intake/IntakeClassifier.ts` (`classifyIntake`);
      keep its signature and `IntakeVerdictSchema`/`ClassifyResult` unchanged (ADR-004/ADR-005).
      Raise the default `timeoutMs` to ~120s and add a new `policy.agents.intake_timeout_ms` knob to
      `PolicySchema` in `packages/loom-core/src/types.ts`
      (`z.number().int().min(1000).default(120_000)`), resolved in the CLI and passed through.
      Recover the verdict from prose/markdown-fenced output via a forceful system instruction plus
      an assistant prefill that opens the JSON object, keeping the parse path a single `JSON.parse`
      + `zod` validate that degrades to `{ ok: false, reason: 'invalid_output' }`; cover it with
      tests that feed realistic non-pure-JSON responses through a stub `LLMClient`. Trade-off: a
      genuinely hung call now burns up to ~120s before failing, acceptable only because the call is
      best-effort and off the critical path.
  - id: story-023-002
    title: Conservative sizing bias with sharpened epic-vs-story criteria
    description: >-
      Bias the classifier toward the richer size and sharpen the epic-versus-story boundary in the
      sizing instruction so it stops under-sizing. Reuse and harden the existing prompt; do not
      rebuild.
    acceptance_criteria:
      - >-
        Under low confidence or ambiguous scope signals, the classifier defaults to the richer size
        (epic over story).
      - >-
        The sizing instruction carries concrete criteria: multiple functional areas / multiple
        services / a cross-cutting change ⇒ epic; a single bounded change ⇒ story.
      - A unit test pins the conservative tiebreak behavior under ambiguity.
    estimated_complexity: small
    dependencies: []
    tech_notes: >-
      Edit only the sizing portion of the system/prompt strings in
      `packages/loom-core/src/intake/IntakeClassifier.ts` — reuse and harden, do not rebuild. Encode
      the conservative tiebreak (ADR-006): low confidence or ambiguous scope resolves to `epic`,
      with concrete criteria — multiple functional areas / multiple services / cross-cutting ⇒ epic;
      a single bounded change ⇒ story. Pin the tiebreak with a unit test that drives an ambiguous
      stubbed `LLMClient` response and asserts `size: 'epic'`. Trade-off: you will introduce some
      story→epic over-sizing, so the test must guard against merely swapping one bias for the other
      (Goal 2), not just check that epic wins.
  - id: story-023-003
    title: Wire classifier into loom weave observe-only with singleton-robust test
    description: >-
      Call the classifier before planning in a real loom weave invocation and persist the verdict
      best-effort to all three sinks (database, audit log, status surface), keeping planning and
      execution byte-identical regardless of the verdict. Prove the wiring with a singleton-robust
      end-to-end test and pin the observe-only invariant with a regression test.
    acceptance_criteria:
      - >-
        A real loom weave invocation calls the classifier before planning and persists the verdict
        best-effort to the database, the audit log, and the status surface.
      - >-
        A classifier failure does not block or alter the weave path; planning and execution remain
        byte-identical with or without the verdict.
      - >-
        A singleton-robust end-to-end test runs the real weave path and asserts a non-null persisted
        verdict, reading it back through the same database handle the write used (never a fresh
        read-only connection).
      - >-
        A regression test confirms planning and execution outputs are identical with and without the
        verdict present (observe-only invariant).
    estimated_complexity: medium
    dependencies:
      - story-023-001
    tech_notes: >-
      Add a private leaf side-effect `recordIntakeClassification(deps)` that returns `void` and
      `try/catch`-swallows every failure, then call it inside the shared `runEpic` path in
      `packages/loom-cli/src/commands/epic.ts` after the brief gate and before the Planner — not in
      `runWeave` (ADR-002); retire the reserved `_classifyIntake` seam in `weave.ts`. Persist
      best-effort and independently to all three sinks: `EpicStore.recordIntakeVerdict`,
      `AuditLog.record({ action: 'intake_classified', allowed, detail })`, and the status surface
      read by `getIntakeVerdicts`. The singleton-robust e2e test MUST read the verdict back through
      the same handle the write used (`openDatabase`) and discipline `resetDatabaseForTest()` in
      setup/teardown — never a fresh `createDatabase` read-only connection (ADR-003); add the FR-4
      regression test asserting planner + execution output are byte-identical with the verdict
      present vs absent. Trade-off: `loom epic` now also performs the (inert) classification,
      widening scope slightly — accepted because both paths are observe-only.
  - id: story-023-004
    title: Fail-closed honest eval gate with failure-reason reporting
    description: >-
      Harden the eval's go/no-go gate to fail closed: require a minimum number of successfully
      scored cases and report do-not-proceed or inconclusive when classifier-failure or
      judge-inconclusive rates are high, surfacing failure-reason counts rather than silently
      excluding failed cases.
    acceptance_criteria:
      - >-
        The gate requires a minimum number of successfully scored cases, with the threshold chosen
        and justified.
      - >-
        The gate reports do-not-proceed or inconclusive when classifier-failure or
        judge-inconclusive rates are high, with cutoffs chosen and justified.
      - The eval report surfaces failure-reason counts instead of silently excluding failed cases.
    estimated_complexity: small
    dependencies: []
    tech_notes: >-
      Extend `scoreIntakeEval` (pure function, no I/O) and the `IntakeEvalReport` interface in
      `packages/loom-core/src/eval/intakeEvalTypes.ts` additively — add `failureCounts`,
      `scoredCases`, and a `gate { decision, statement, minScoredCases }`. Since
      `computeAxisAccuracy` already excludes classifier failures from the denominator, surface those
      reason counts (`llm_error`/`timeout`/`invalid_output` and `judgeInconclusive`) rather than
      letting a tiny denominator read as `proceed` (FR-9/FR-10). The gate must fail closed: below a
      justified `minScoredCases`, or above justified failure/inconclusive cutoffs, emit
      `inconclusive`/`do-not-proceed`, never `proceed`. Trade-off: legitimate runs with a few
      transient failures may report `inconclusive` and need a re-run — cheaper than a false
      `proceed`.
  - id: story-023-005
    title: Re-anchor size labels on intrinsic scope and gitignore eval output
    description: >-
      Re-anchor the noisy size labels on intrinsic brief scope rather than loom's historical story
      count, correcting only labels a careful reading and the judge agree are wrong, conservatively,
      with each change documented. Gitignore the eval output directory.
    acceptance_criteria:
      - >-
        Size labels are re-anchored on intrinsic brief scope, not loom's historical decomposition
        story count.
      - >-
        Only labels both a careful reading and the judge agree are wrong are changed,
        conservatively; each change is documented with what changed and why.
      - No label is changed solely to raise the score.
      - The eval output directory is gitignored.
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      Re-anchor size labels in `eval-cases/intake-classification.yaml` on the brief's intrinsic
      scope; keep `story_count` present but `@deprecated` and ensure the scorer never reads it
      (ADR-008). Change only labels that a careful reading AND the judge agree are wrong,
      conservatively, and document each change inline (what + why) so corrections are auditable as
      rubric repair, not score-gaming. Separately, add the eval output directory `.loom/eval/` to
      `.gitignore` (FR-12). Trade-off: residual label noise may remain and must be reported honestly
      by the re-run; if corrections turn out numerous, that is itself a signal about loom's
      decomposition — flag it, but treat fixing it as out of scope.
  - id: story-023-006
    title: Re-run the eval and record an honest gate decision
    description: >-
      Re-run the eval against the corrected label set and the conservatively-biased classifier,
      recording per-axis accuracy, the confusion matrix, and the gate's honest decision, and stating
      plainly whether the classifier clears the bar to proceed to phase one.
    acceptance_criteria:
      - >-
        The re-run records per-axis (type and size) accuracy, the confusion matrix, and an honest
        gate decision (proceed / do-not-proceed / inconclusive).
      - The report states plainly whether the classifier clears the bar to proceed to phase one.
      - The epic→story under-sizing confusions are measurably reduced versus the prior 4-of-22.
      - >-
        Each case uses exactly one cheap classifier call and one stronger-model judge call (budget
        preserved).
    estimated_complexity: medium
    dependencies:
      - story-023-001
      - story-023-002
      - story-023-004
      - story-023-005
    tech_notes: >-
      This is an execution-and-reporting story: run `scripts/eval-intake.mjs` (→ `runIntakeEval` →
      `classifyIntake` with the cheap `classifierModel`, graded by `IntakeJudge` on
      `claude-opus-4-8` via `LOOM_JUDGE_MODEL`) against the corrected fixtures, exactly one
      classifier call and one judge call per case (NFR-3/FR-8). Record per-axis (type, size)
      accuracy, the confusion matrix, and the gate's honest decision to
      `.loom/eval/intake-report.{md,json}`, and state plainly whether it clears the bar for phase
      one. Confirm epic→story under-sizings are measurably below the prior 4-of-22. Trade-off: this
      measures, it does not guarantee a pass — report `do-not-proceed`/`inconclusive` faithfully if
      that is the result rather than tuning labels or prompts to force `proceed`.
  - id: story-023-007
    title: Full build and test suite green with no guardrail weakened
    description: >-
      Run the full build and the entire test suite together and fix any cross-cutting regressions
      across loom-core and loom-cli, confirming the observe-only invariant holds and no guardrail is
      weakened.
    acceptance_criteria:
      - The full build passes.
      - The entire test suite passes.
      - The observe-only invariant regression test holds and no existing guardrail is weakened.
    estimated_complexity: small
    dependencies:
      - story-023-001
      - story-023-002
      - story-023-003
      - story-023-004
      - story-023-005
      - story-023-006
    tech_notes: >-
      Run `npm run build` and `npm run test` together across `loom-core` and `loom-cli` and fix any
      cross-cutting regressions; this story owns no production source beyond test fixups. Confirm
      the FR-4 observe-only regression test (planner/execution byte-identical with vs without
      verdict) holds and that no existing guardrail test in the policy/worktree suites is weakened
      (NFR-2). Trade-off: when the suite goes red, resist relaxing a guardrail or observe-only
      assertion to make it pass — fix the underlying cause, since a quietly weakened guardrail
      defeats the epic's central safety claim.
