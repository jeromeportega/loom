stories:
  - id: story-033-001
    title: Migrate BriefRefiner to non-agentic completion mode (lead)
    description: >-
      Add `nonAgentic` with `excludeDynamicSections: true` to the `llm.complete` call in
      `packages/loom-core/src/brief/BriefRefiner.ts`, mirroring `IntakeClassifier`. As the lead
      item, establish the per-gate migration pattern the other gates copy, and size `max output
      tokens` to the full JSON payload (readiness flag, 0–10 score, optional refined brief,
      critique, clarification questions).
    acceptance_criteria:
      - >-
        BriefRefiner's `llm.complete` call passes `nonAgentic` with `excludeDynamicSections: true`,
        matching the IntakeClassifier reference pattern
      - >-
        An explicit `max output tokens` is set, sized to BriefRefiner's full JSON output (readiness
        flag, score, refined brief, critique, clarification questions)
      - >-
        BriefRefiner's system prompt is verified self-contained — no reliance on working directory,
        environment, or git status; any dynamic-context dependency found is folded into the static
        prompt
      - >-
        The output schema, parsing, retry, and fallback behavior are unchanged — only the transport
        changes
      - >-
        A test asserts the call requests non-agentic mode, mirroring the IntakeClassifier regression
        test
      - All pre-existing BriefRefiner tests still pass
    estimated_complexity: small
    dependencies: []
    tech_notes: >-
      Edit the single `llm.complete` call in `packages/loom-core/src/brief/BriefRefiner.ts`, adding
      `nonAgentic: { excludeDynamicSections: true }` and `maxTokens: 8192`, copying the shape
      verbatim from `IntakeClassifier.classifyOnce` (`intake/IntakeClassifier.ts:96-105`). As the
      lead/reference story, get the call shape exactly right — leave the `BriefRefinement` parser
      (`brief/types.ts`), `normalize`, and `salvagePartialRefinedBrief` paths byte-identical. Add
      one test capturing `FakeLLM.calls[0]` and asserting `req.nonAgentic` and `req.maxTokens`,
      mirroring `IntakeClassifier.test.ts:193-202`. Trade-off: 8192 is sized to a FULL markdown
      `refined_brief`; undersize it and you truncate mid-document, tripping
      `salvagePartialRefinedBrief` → `SALVAGE_QUALITY_SCORE` fail-closed — confirm against the
      gate's worst-case payload before settling the literal.
    test_plan: >-
      Level: unit only — this is a call-site shape change; assert on the captured request, not the
      subprocess (argv is already pinned by nonAgenticArgs.regression.test.ts). Add one new test to
      BriefRefiner's test file mirroring IntakeClassifier.test.ts:193-202, driven by
      FakeLLM/MockLLMClient.


      Key cases:

      - [happy/FR-1] Call `BriefRefiner.refine(rough)`, then assert `fake.calls[0].nonAgentic`
      deepEquals `{ excludeDynamicSections: true }`. (AC1)

      - [FR-3/FR-2] Assert `fake.calls[0].maxTokens === 8192`. Confirm the literal against a
      worst-case payload: a full markdown `refined_brief` + all 5 critique arrays + delta — if a
      fixture brief truncates mid-document the test should expose it. (AC2)

      - [FR-4] Read the system prompt source (`loadBundledPrompt`/the refiner's static blocks) and
      confirm no cwd/env/git/memory interpolation reaches `req.system`; if found, fold it into the
      static prompt and add an assertion that the captured `req.system` text contains no dynamic
      placeholder. (AC3)

      - [FR-6 regression] Re-run the full existing BriefRefiner suite: `normalize`, the
      `BriefRefinement` parser (brief/types.ts), retry, and the `salvagePartialRefinedBrief` →
      `SALVAGE_QUALITY_SCORE` fail-closed path must pass byte-identical with zero edits. Add no
      schema/fallback assertions beyond what exists. (AC4, AC6)


      Verification bar: the new request-shape test passes (nonAgentic + maxTokens=8192 captured on
      the single call), the prompt is demonstrably static, and 100% of pre-existing BriefRefiner
      tests stay green with no behavior-file edits. This story is the reference — the exact
      `complete({ ..., maxTokens, nonAgentic: { excludeDynamicSections: true } })` shape it lands is
      what the other five copy.
