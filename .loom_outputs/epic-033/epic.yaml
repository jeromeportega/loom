  - id: story-033-004
    title: Migrate OpportunityEngine (incl. JSON-repair retry) to non-agentic mode
    description: >-
      Add `nonAgentic` with `excludeDynamicSections: true` to the `llm.complete` call in
      `packages/loom-core/src/signals/OpportunityEngine.ts`, including its JSON-repair retry path.
      OpportunityEngine clusters signals into opportunities.
    acceptance_criteria:
      - >-
        OpportunityEngine's `llm.complete` call passes `nonAgentic` with `excludeDynamicSections:
        true`
      - The JSON-repair retry path also issues its completion in non-agentic mode
      - >-
        An explicit `max output tokens` is set, sized to OpportunityEngine's clustered-opportunities
        output
      - >-
        OpportunityEngine's system prompt is verified self-contained; any dynamic-context dependency
        is folded into the static prompt
      - Output schema, parsing, retry, and fallback behavior are unchanged
      - >-
        A test asserts the call requests non-agentic mode, mirroring the IntakeClassifier regression
        test
      - All pre-existing OpportunityEngine tests still pass
    estimated_complexity: small
    dependencies:
      - story-033-001
    tech_notes: >-
      In `packages/loom-core/src/signals/OpportunityEngine.ts`, BOTH completions must migrate: the
      cluster call at `:104` and the JSON-repair re-prompt at `:116`. Add `nonAgentic: {
      excludeDynamicSections: true }` to each; `maxTokens: 4096` is already explicit on both, so
      keep it. Leave `parseClusterProposals`/`recoverJsonText` recovery untouched. Critically, the
      test must assert `nonAgentic` on EVERY captured call (`calls[0]` AND `calls[1]`), not just the
      first. Trade-off: the repair re-prompt is the easy one to forget — migrating only the primary
      call would leave the fallback path agentic and silently violate FR-5.
    test_plan: >-
      Level: unit only. Add a request-shape test to OpportunityEngine's test file via
      FakeLLM/MockLLMClient. This is a MULTI-CALL gate — the test must cover both completions.


      Key cases:

      - [FR-1, cluster call :104] `OpportunityEngine.generate(openSignals)` on a clean parse →
      assert `calls[0].nonAgentic` deepEquals `{ excludeDynamicSections: true }`. (AC1)

      - [FR-5, repair call :116] Drive a malformed-JSON first response so the JSON-repair re-prompt
      fires, then assert `calls[1].nonAgentic` ALSO deepEquals `{ excludeDynamicSections: true }`.
      This is the case that protects FR-5 — migrating only the primary call would silently leave the
      fallback agentic. (AC2 for repair)

      - [FR-3] Assert `req.maxTokens === 4096` on EVERY captured call (already explicit on both —
      confirm it survives). (AC3)

      - [FR-4] Confirm the system prompt is static; fold in any dynamic dependency found. (AC4)

      - [FR-6 regression] Existing tests pass: `parseClusterProposals`/`recoverJsonText` recovery,
      retry, and fallback unchanged. (AC5, AC6)


      Verification bar: a single test exercises both the happy cluster path and the forced-repair
      path and asserts nonAgentic + maxTokens=4096 on calls[0] AND calls[1]; the prior
      OpportunityEngine suite stays green.
