stories:
  - id: story-027-001
    title: Cohesive dashboard frontend refocus (Autonomy/Fleet/Inbox, traces, audit, skills, read-only)
    description: >-
      Single-worker frontend change delivering all six key capabilities together by editing the
      shared navigation/tab-bar region of packages/loom-web/public/index.html plus a small set of
      closely-related frontend files (shared JS/CSS and per-tab view files). Remove the Autonomy
      stub tab, hide Fleet and Inbox tabs, surface per-story decision traces and per-story audit in
      the epic detail view, add a Skills view with per-skill history drill-down, and make read-only
      mode honest. No backend route behavior changes except the minimum needed to expose read-only
      state to the client; all existing read endpoints are reused as-is.
    acceptance_criteria:
      - >-
        The Autonomy tab is absent from dashboard navigation and its view file is deleted, while the
        POST autonomy route and the `loom autonomy` CLI command remain unchanged and functional.
      - >-
        Fleet and Inbox tabs are not shown in the visible tab bar; their server routes, view files,
        and tests remain intact, with a clear comment at the registration site explaining the
        intentional hide and how to re-enable.
      - >-
        The epic detail view shows a read-only, collapsible per-story decision traces section fed by
        the existing per-agent traces endpoint with no backend change.
      - >-
        The epic detail view shows a read-only, collapsible per-story audit section fed by the
        existing audit endpoint with no backend change.
      - >-
        A Skills view tab lists discovered skills with lifecycle and track record from the existing
        skills endpoint and drills down to per-skill history from the existing per-skill history
        endpoint, registered in the tab bar in place of the removed/hidden tabs so navigation stays
        coherent.
      - >-
        In read-only mode, all mutation buttons (approve, reject, stop, kill, retry, archive) are
        disabled or hidden with a brief explanation, and all read/observability surfaces remain
        fully functional.
      - >-
        The existing server-side read-only state is exposed to the client with only the minimum
        response-surface change and no route behavior change.
      - >-
        The observability spine (epic list, detail, live log panes, planning stream, planning
        artifacts) remains fully intact and no guardrail is weakened.
      - All frontend changes ship in this one story — no parallel index.html/tab-bar editors.
    estimated_complexity: large
    dependencies: []
    tech_notes: >-
      All edits land in `packages/loom-web/public/index.html` (the 923-line SPA) plus a new
      `public/skills.js`; per ADR-004 there is exactly one editor for this file. FR-1: delete
      `autonomy.js` and its `<script>` include (leave POST autonomy route and `loom autonomy` CLI
      untouched); FR-2: remove the `fleet.js` include with a restore-comment at the site, leave
      `inbox.js` un-included. FR-3 traces: fetch `GET /api/epics/:id/traces` once and partition the
      `DecisionTrace[]` by `story_id` (ADR-001, avoids N+1); FR-4 audit: fan `GET
      /api/agents/:id/audit` across the `EpicDetail.agents` whose `story_id` matches each story,
      then merge by `timestamp` (ADR-002). Render both as native `<details>/<summary>` collapsibles
      (no new deps). FR-5: register the Skills tab through the existing
      `Loom.registerView({id,label,render})` seam (`index.html:236`), listing
      `SkillManifestSummary[]` from `GET /api/skills` and drilling into `GET
      /api/skills/:name/history`. FR-6/FR-7: read `read_only` off the polled `/api/status` body into
      one module-level `readOnly` flag and route all seven mutation controls
      (`approveBtn`,`rejectBtn`,`stopBtn`,`archiveBtn`,`[data-kill]`,`[data-retry]`,`[data-retry-clean]`)
      through a single `mutationControl(html)` chokepoint (ADR-005). The one backend edit is
      additive: surface `read_only: opts.readOnly ?? false` on `GET /api/status` in
      `src/server/index.ts` — do not touch `accessGuard` (`auth.ts`) or `access-guard.test.ts`. The
      trade-off to hold in mind: you are deliberately absorbing grouping/fan-out work client-side to
      keep the read endpoints frozen (NFR-2) — keep every new section GET-only so it never trips the
      read-only `403`.
    test_plan: >-
      Mix of levels — the load-bearing risk is client render logic and one additive server field, so
      split coverage accordingly.


      INTEGRATION (server, fast — supertest/express harness like the existing route tests):

      - `GET /api/status` returns `read_only: true` when launched with `opts.readOnly` true
      (LOOM_WEB_READONLY=1 / `--read-only`), and `read_only: false` (or the field absent ⇒ false)
      otherwise. This is the only backend change (FR-7, AC7) — pin it.

      - Regression guard: assert `accessGuard` behavior is byte-unchanged — a non-GET without a
      token still returns 403, a GET still passes in read-only mode. Do NOT modify `auth.ts` or
      `access-guard.test.ts`; run them and confirm green (NFR-1/AC8).

      - Confirm the four frozen read endpoints (`/api/epics/:id/traces`, `/api/agents/:id/audit`,
      `/api/skills`, `/api/skills/:name/history`) are untouched — their existing tests must pass
      unchanged (NFR-2).


      UNIT (client transforms — pull the pure grouping/fan-out/gate helpers out of `index.html` so
      they are testable without a browser; jsdom where DOM assertions are needed):

      - Trace grouping (FR-3/AC3): given a `DecisionTrace[]` with mixed `story_id` values (incl.
      null), partition is correct, one fetch only (no per-agent N+1, per ADR-001), and a story with
      zero traces yields an empty (not erroring) section.

      - Audit fan-out (FR-4/AC4): given `EpicDetail.agents` with multiple agents on one story (retry
      case), the union over `agent_id`s is merged and sorted by `timestamp`; a story whose agents
      have no recoverable id renders empty, not error (ADR-002). Single-agent story ⇒ exactly one
      audit fetch.

      - `mutationControl(html)` chokepoint (FR-6/AC6): when `readOnly` true it hides/disables and
      adds the explanation; when false it passes html through. Drive ALL seven controls
      (`approveBtn`, `rejectBtn`, `stopBtn`, `archiveBtn`, `[data-kill]`, `[data-retry]`,
      `[data-retry-clean]`) through it and assert none render an active mutation control in
      read-only mode (ADR-005).

      - `read_only` flag is read off the `/api/status` poll body and defaults to false when the
      field is absent (FR-7).


      E2E / jsdom DOM render (the few user-visible outcomes that unit tests can't prove):

      - Nav contains NO Autonomy tab and the `autonomy.js` file/script include is gone (FR-1/AC1);
      query nav by visible label/role.

      - Nav shows NO Fleet and NO Inbox tab (FR-2/AC2); assert the restore comment exists at the
      registration site and `fleet.js`/`inbox.js` + their server
      routes/`fleet.test.ts`/`inbox.test.ts` are intact.

      - Skills tab is present and registers via `Loom.registerView({id:'skills',...})`; rendering it
      lists `SkillManifestSummary` rows (name, lifecycle, injected/succeeded/failed track record)
      and clicking a skill drills into `/api/skills/:name/history` rows (FR-5/AC5).

      - Epic detail shows collapsible `<details>/<summary>` traces and audit sections, collapsed by
      default, read-only (no mutation verbs inside) (FR-3/FR-4).

      - Observability spine smoke: epic list, detail, live log panes, planning stream, and planning
      artifacts still render (AC8).


      VERIFICATION BAR: every AC above maps to a named passing case; in read-only mode no mutation
      button is clickable-but-silent (each is hidden/disabled with text), every read surface still
      works, the only server diff is the `read_only` field on `/api/status`, and
      `access-guard.test.ts`, `fleet.test.ts`, `inbox.test.ts` pass unmodified. AC9 (single editor /
      no parallel index.html work) is a process constraint, not a test — satisfy it by landing all
      frontend edits in this story.
