  - id: story-027-003
    title: Run the full build and test suite and fix cross-cutting regressions
    description: >-
      Run the complete build and test suite across all packages after the frontend and documentation
      changes land, and fix any cross-cutting regressions surfaced by the whole suite running
      together.
    acceptance_criteria:
      - The full build passes.
      - The entire test suite passes with no cross-cutting regressions.
    estimated_complexity: small
    dependencies:
      - story-027-001
      - story-027-002
    tech_notes: >-
      No feature code of its own: run `npm run build` then `npm run test` across all workspace
      packages (`loom-core`, `loom-cli`, `loom-web`) after 027-001/027-002 land, and fix only
      cross-cutting regressions the combined suite surfaces. Pay attention to
      `fleet.test.ts`/`inbox.test.ts` and `access-guard.test.ts` staying green — the architecture's
      restorability and NFR guarantees mean those must pass unchanged; if they fail it signals the
      hide/expose work touched more than intended. The trade-off: keep fixes minimal and scoped to
      true regressions, not opportunistic refactors, since this story is the integration gate, not a
      new editor of the SPA.
    test_plan: >-
      Integration gate — no feature code of its own. The 'test' here is running the real suites and
      confirming no cross-cutting regression.


      KEY CASES:

      - `npm run build` across all workspace packages (`loom-core`, `loom-cli`, `loom-web`) succeeds
      (AC1).

      - `npm run test` across all packages passes with the frontend + docs changes landed together
      (AC2).

      - Targeted regression watch: `fleet.test.ts`, `inbox.test.ts`, and `access-guard.test.ts` must
      pass UNCHANGED — a failure there signals the hide/expose work touched more than intended
      (restorability + NFR guarantees) and is the first thing to investigate.

      - The capabilities drift check passes as part of the suite.


      VERIFICATION BAR: full build green and the entire suite green with the three guard tests
      passing unmodified. Any fix applied must be a minimal, scoped repair of a true regression
      surfaced by the combined run — not an opportunistic refactor or a change to test expectations
      to make red go green.
