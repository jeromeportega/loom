stories:
  - id: story-002-001
    title: Make adversarial-review and edge-case-hunter handlers LLM-backed via an injected client
    description: >-
      Replace the `{ findings: [] }` stub handlers in skills/types.ts with real handlers that load
      each skill's SKILL.md body as a cacheable static system prefix, send the ReviewerInput as the
      user message through a dependency-injected LLMClient, parse the response, and validate it
      against the shared ReviewerOutput schema — mirroring the CodeReviewAgent pattern. Add the
      injection seam (SkillRuntimeContext extension or a factory closing over the client) and unit
      tests using a stub client.
    acceptance_criteria:
      - >-
        Invoking adversarial-review or edge-case-hunter through invokeSkill with a stubbed client
        returns real parsed ReviewerOutput findings, not the empty stub.
      - >-
        Each handler loads its SKILL.md body via SkillStore as the system prefix and places the
        per-diff ReviewerInput in the user message after the cache boundary (NFR-1).
      - >-
        On malformed model output the zod parse throws from the handler; no new error-handling is
        added in the handler (FR-2).
      - >-
        An LLMClient is dependency-injected into skill execution so tests pass a stub returning
        canned JSON and never call a live model (FR-3, NFR-3).
      - >-
        Provenance is unchanged: each invocation still writes skill_usage + audit_log rows via
        invokeSkill's existing path, not duplicated in the handler (FR-4).
      - Unit tests cover both handlers with a stub client across valid and malformed output (FR-9).
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      Replace the `{ findings: [] }` stub handlers in `skills/types.ts` with LLM-backed handlers
      that mirror `CodeReviewAgent`: build a `registerReviewerSkills({ llm, model, projectRoot })`
      factory (per ADR-001) that closes over the `LLMClient` and re-registers both handlers, rather
      than threading `llm` through `SkillRuntimeContext` or `invokeSkill` (keep those two seams
      byte-identical). Each handler loads its body via `SkillStore.load(name)` and emits it as a
      `system: [{ text, cache: true }]` block, puts `JSON.stringify(ReviewerInput)` in the user
      message *after* the cache boundary (NFR-1), then returns
      `ReviewerOutput.parse(extractJson(text))` with `source` set to
      `SOURCE.ADVERSARIAL`/`SOURCE.EDGE_CASE` from `findings/sources.ts`. Per ADR-003 add no
      try/catch — let `ZodError` propagate so the orchestrator's existing repair-then-warn path
      handles it; unit-test both handlers against a `MockLLMClient` returning canned valid JSON and
      malformed/prose output (FR-9). The one trade-off: re-registering into the process-global
      registry creates a startup-ordering invariant (`registerReviewerSkills` must run before the
      first invocation, and tests must re-register stub handlers for isolation).
    test_plan: >-
      Level: unit (fast, deterministic, stubbed client — this is pure handler logic, no DB seam
      worth an integration test here). Inject a `MockLLMClient` and register both handlers via
      `registerReviewerSkills({ llm, model, projectRoot })`; re-register fresh stubs in `beforeEach`
      for isolation (the registry is process-global). Cases: (1) HAPPY — invoking
      `adversarial-review` through `invokeSkill` with the mock returning canned valid JSON yields a
      parsed `ReviewerOutput` whose findings carry `source === SOURCE.ADVERSARIAL`; same for
      `edge-case-hunter` → `SOURCE.EDGE_CASE`. (2) PROMPT SHAPE — assert the request the mock
      receives has the SKILL.md body in `system: [{ text, cache: true }]` (body loaded via
      `SkillStore.load(name)`) and `JSON.stringify(ReviewerInput)` in the user message AFTER the
      cache boundary (NFR-1); assert the cached system text does not contain the diff. (3) MALFORMED
      — mock returns prose / non-JSON / JSON missing required fields → the handler lets `ZodError`
      (or extraction failure) propagate; assert it THROWS and contains no try/catch / fallback
      findings (FR-2, ADR-003). (4) PROVENANCE — after a successful invocation through
      `invokeSkill`, exactly one `skill_usage` row and the existing `audit_log` row exist per call,
      written by `invokeSkill` (FR-4) — assert the handler itself issues no DB writes (no
      duplication). (5) NO LIVE MODEL — assert only the `MockLLMClient` is ever called (NFR-3).
      Verification bar: both handlers return real schema-valid findings with the correct `source`
      from a stub, place the diff after a cached SKILL.md prefix, throw (not swallow) on malformed
      output, and leave provenance to `invokeSkill` — covering all six acceptance criteria.
  - id: story-002-002
    title: Wire reviewOrchestrator through workerFactory and run.ts with predictable fallback
    description: >-
      Thread loom's db and an LLMClient through workerFactory.createWorker and run.ts, and set a
      reviewOrchestrator(assignment) that assembles ReviewPassDeps from the three reviewers, a
      db-backed AuditSink, and a warn logger. Engage the orchestrated path only under
      review_strategy='block-and-revise' when reviewers and agent are available; otherwise degrade
      to the legacy single-agent path.
    acceptance_criteria:
      - >-
        workerFactory.createWorker and run.ts thread db and an LLMClient through and set
        reviewOrchestrator (FR-6).
      - >-
        reviewOrchestrator assembles ReviewPassDeps from the three reviewers, a db-backed AuditSink,
        and a warn logger, engaging only under review_strategy='block-and-revise' (FR-5).
      - >-
        When reviewers or the agent are unavailable the path degrades to legacy single-agent
        behavior rather than throwing; the availability check and fallback are explicit (FR-7).
      - >-
        Behavior for review_strategy='comment' and 'off' is unchanged — the legacy single-agent path
        is not altered.
    estimated_complexity: medium
    dependencies:
      - story-002-001
    tech_notes: >-
      Build `buildReviewOrchestrator({ db, llm, reviewAgent, projectRoot, reviewStrategy })` in
      `orchestrator/workerFactory.ts` (ADR-002) that returns `undefined` unless
      `reviewStrategy==='block-and-revise'` AND `db && llm && reviewAgent` are all present; when
      defined it returns `(assignment) => ReviewPassDeps` assembling
      `[codeReviewReviewer(reviewAgent, story), skillReviewer(SOURCE.ADVERSARIAL, {db, story_id,
      epic_id}), skillReviewer(SOURCE.EDGE_CASE, {db, story_id, epic_id})]`, an audit sink `{
      record: (action, detail) => new AuditLog(db).record({ action, detail }) }` (ADR-004 — do not
      re-emit per-reviewer rows here), and a `warn` logger. Extend `createWorker(opts & { db?, llm?
      })` to call this and assign the result to the existing `reviewOrchestrator` hook on
      `BaseCliWorker` (`:130`); thread `db` and the CLI-backed `LLMClient` from `run.ts`, which
      already opens the db and constructs the `CodeReviewAgent`. The trade-off: `comment`/`off` and
      any missing-dependency path must stay byte-identical, which is guaranteed by the field
      remaining `undefined` — verify the gate centralizes the availability check in one place rather
      than duplicating it across call sites.
    test_plan: >-
      Level: unit for the gate logic in `buildReviewOrchestrator` (cheapest place to prove the truth
      table), plus a thin integration assertion that `createWorker` assigns the hook. Test
      `buildReviewOrchestrator({ db, llm, reviewAgent, projectRoot, reviewStrategy })` directly.
      Cases — gate truth table (FR-5, FR-7): (1) `reviewStrategy='block-and-revise'` AND
      db+llm+reviewAgent all present → returns a function (not undefined). (2)
      `reviewStrategy='comment'` → undefined. (3) `reviewStrategy='off'` → undefined. (4)
      `block-and-revise` but `db` missing → undefined; (5) `llm` missing → undefined; (6)
      `reviewAgent` missing → undefined. (7) SHAPE — when defined, calling the closure with a
      `WorkerAssignment` returns `ReviewPassDeps` whose `reviewers` array is exactly
      `[codeReviewReviewer(reviewAgent, story), skillReviewer(SOURCE.ADVERSARIAL, {db, story_id,
      epic_id}), skillReviewer(SOURCE.EDGE_CASE, {db, story_id, epic_id})]` (assert length 3 and the
      two skill sources), an `audit.record` that writes via `new AuditLog(db).record(...)`, and a
      `warn` logger. (8) WIRING — `createWorker(opts & { db, llm })` under `block-and-revise` leaves
      `reviewOrchestrator` set on the returned worker; under `comment`/`off` or with deps missing,
      `reviewOrchestrator` is `undefined` (FR-6). (9) FALLBACK — with the hook undefined,
      `BaseCliWorker.run()` takes the legacy single-`CodeReviewAgent` pass without throwing (FR-7);
      assert the gate lives in one place (no duplicated availability check at call sites).
      Verification bar: the orchestrator hook is set if and only if `block-and-revise` AND all three
      deps are present, assembles the exact three-reviewer `ReviewPassDeps`, and every other
      configuration leaves the field `undefined` so the legacy path is reached unchanged.
  - id: story-002-003
    title: Integration test for the orchestrated three-reviewer pass
    description: >-
      Add an integration test that dispatches a story under review_strategy='block-and-revise' with
      a stubbed LLMClient and proves the orchestrated path runs end-to-end: a deduped union of
      findings, a blocker/high finding triggering a bounded revision, and provenance rows for both
      ported reviewers.
    acceptance_criteria:
      - >-
        The test runs the orchestrated path under block-and-revise with a stubbed client and no live
        model calls (FR-8, NFR-3).
      - Findings from the reviewers are unioned and deduped in the test outcome.
      - A blocker/high finding triggers a revision bounded by maxReviewRevisions.
      - skill_usage and audit_log rows are present for both adversarial-review and edge-case-hunter.
    estimated_complexity: small
    dependencies:
      - story-002-002
    tech_notes: >-
      Add an integration test that constructs a real `better-sqlite3` db, registers the reviewer
      handlers via `registerReviewerSkills` with a `MockLLMClient` returning canned JSON (one
      reviewer yields a `blocker`/`high` finding), then dispatches a story under
      `review_strategy='block-and-revise'` through `createWorker`/the orchestrated path. Assert
      end-to-end: the union of reviewer findings is deduped (`dedupeFindings`), the blocker/high
      triggers exactly one bounded revision (cap = `maxReviewRevisions` in `runReviewLoop`), and
      querying `skill_usage`+`audit_log` shows rows for both `adversarial-review` and
      `edge-case-hunter` (FR-8). The trade-off to watch: assert zero live model calls by only ever
      injecting the stub — never let a default/production `LLMClient` leak into the wiring under
      test.
    test_plan: >-
      Level: integration (this story IS the integration test — real `better-sqlite3` db, real
      `runReviewPass`/`runReviewLoop`/`dedupeFindings`, stubbed `LLMClient` only). Construct an
      in-memory/temp sqlite db with the loom schema; register handlers via `registerReviewerSkills`
      with a `MockLLMClient` scripted so one reviewer (e.g. adversarial) yields a `blocker` or
      `high` finding and the others yield benign/overlapping findings; dispatch one story under
      `review_strategy='block-and-revise'` through `createWorker` and the orchestrated path.
      Assertions (cover all four ACs): (1) NO LIVE MODEL — only the `MockLLMClient` is injected
      anywhere in the wiring; assert zero default/production `LLMClient` construction (FR-8, NFR-3).
      (2) DEDUPED UNION — seed two reviewers with a duplicate finding (same file/line/source key per
      the frozen dedupe rule) and assert the pass outcome contains the unioned set with the
      duplicate collapsed by `dedupeFindings`; a `review.findings.deduped` audit row is written. (3)
      BOUNDED REVISION — the blocker/high finding triggers exactly one `review.revision.triggered`,
      and the loop stops at `maxReviewRevisions` (assert the revise callback is invoked the capped
      number of times, not unbounded). (4) PROVENANCE FOR BOTH — query `skill_usage` and `audit_log`
      and assert rows exist for BOTH `adversarial-review` and `edge-case-hunter` (skill name present
      in each table). Verification bar: a single deterministic test, with no network/model,
      demonstrates fan-out → unioned-and-deduped findings → one bounded revision driven by a serious
      finding → provenance recorded for both ported reviewers.
