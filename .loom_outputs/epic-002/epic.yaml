stories:
  - id: story-002-001
    title: Materialize allowlist-only worktree .cursor/mcp.json from the policy registry
    description: >-
      At story worktree setup in the orchestrator, generate a worktree-local .cursor/mcp.json
      containing exactly the servers in policy.mcp.registry and nothing else. Make and document the
      loom-server inclusion decision (default: exclude, confirmed against any dispatch-time
      dependency).
    acceptance_criteria:
      - >-
        Worktree setup writes a worktree-local .cursor/mcp.json whose servers are exactly the
        policy.mcp.registry contents
      - An empty registry produces a config exposing zero non-loom MCP servers
      - >-
        Servers registered via loom mcp add appear in the worktree config of every subsequently
        spawned worker
      - >-
        The decision on including the loom MCP server itself is made, checked against dispatch-time
        dependencies, and documented
      - Tests under __tests__/ cover config generation for both empty and populated registries
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      Create packages/loom-core/src/mcp/WorktreeMcp.ts exporting materializeWorktreeMcpConfig(opts:
      MaterializeOptions): MaterializeResult per the contract — a whole-file node:fs write of
      .loom/worktrees/<storyId>/.cursor/mcp.json (overwrite, never merge; do NOT reuse
      upsertMcpServer, which deliberately never clobbers). Build entries from the existing
      pickPackage()/toMcpJsonEntry() in mcp/adapter.ts so ${VAR} secret references pass through
      untouched; accept registry: McpRegistry | null (null/empty registry yields a config with zero
      non-loom servers) and an optional loomServerEntry injected by the caller (ADR-5 — only
      loom-cli knows loomScriptPath(), so thread it via SupervisorOptions and the loom run wiring
      rather than computing it in core). Per ADR-3, loom inclusion is per-backend: include for
      cursor-cli (CursorAgentWorker.pullGuidanceHint() depends on the loom_pull_guidance tool),
      exclude for claude-code — document this in the code where the decision is wired. Call it in
      Supervisor.dispatch() immediately after this.wt.create(storyId, ...) (step 2 of the dispatch
      ordering) and add table-driven node --test cases under packages/loom-core/src/__tests__/ for
      empty and populated registries. Trade-off: the generated file is a pure function of the
      registry, so re-dispatch is idempotent, at the cost of breaking inherited ~/.cursor/mcp.json
      servers (deliberate; migration is loom mcp add).
    test_plan: >-
      Levels: unit (node --test) for materializeWorktreeMcpConfig — it is a pure function of
      (registry, loomServerEntry, worktreePath) per ADR-5, so table-driven unit tests give full
      confidence cheaply; one integration case at the Supervisor.dispatch seam to prove the call
      site. Key cases for packages/loom-core/src/__tests__/ (use a temp dir as worktreePath, read
      the written file back): (1) empty/null registry, no loomServerEntry → file written with
      mcpServers === {} and serverNames === []; (2) populated registry → mcpServers keys are EXACTLY
      the registry server names, entries match toMcpJsonEntry() output, and ${VAR} secret references
      appear verbatim (assert the literal '${' string survives — no env expansion); (3)
      loomServerEntry provided → 'loom' present in both the file and sorted serverNames; omitted →
      absent (covers the per-backend ADR-3 decision: include for cursor-cli, exclude for claude-code
      — assert both shapes); (4) overwrite semantics: pre-seed the worktree with a stale
      .cursor/mcp.json containing an extra server, materialize, assert the extra server is GONE
      (whole-file write, not merge) and a second call is idempotent; (5) serverNames sorted
      regardless of registry insertion order; (6) registry round-trip: upsertMcpServer a new server
      into a temp registry, materialize again, assert it appears (covers the 'loom mcp add → next
      worker sees it' criterion without spawning a worker). Integration case: Supervisor.dispatch
      with a stub runner asserts the config file exists in the worktree before runner.run() is
      invoked. Verification bar: every AC has a named passing test; the empty-registry case
      demonstrably yields zero non-loom servers; the loom-inclusion decision is asserted in tests
      for both backends and documented where wired.
  - id: story-002-002
    title: 'Cursor-cli backend: headlessly disable all non-allowlisted MCP servers per worktree'
    description: >-
      Verify cursor-agent config precedence and the per-project durability of cursor-agent mcp
      disable, then wire worktree setup to enumerate servers via cursor-agent mcp list and disable
      every non-allowlisted server against the worktree. Investigate and document any residual
      strictness gap, recording the upstream cursor-agent ask as out of scope.
    acceptance_criteria:
      - >-
        Config-layer precedence and disable-state durability (per-project vs user-global) are
        verified and findings recorded before enforcement is wired in
      - >-
        At worktree setup, all non-allowlisted servers — including user-level ~/.cursor/mcp.json
        entries — are disabled headlessly against the worktree
      - >-
        A worker spawned with an empty policy registry sees zero non-loom MCP servers on the
        cursor-cli backend
      - >-
        Any strictness gap that cannot be closed headlessly is documented, with the upstream ask
        recorded as out of scope
    estimated_complexity: large
    dependencies:
      - story-002-001
    tech_notes: >-
      Spike FIRST: verify cursor-agent config-layer precedence and that cursor-agent mcp disable
      state is per-project, not user-global — if it's user-global the design must change before
      wiring (ADR-2 gates on this), and record findings. Then create
      packages/loom-core/src/orchestrator/CursorMcpEnforcer.ts exporting
      enforceCursorMcpAllowlist(opts: CursorEnforceOptions): CursorEnforceResult, using
      execFileSync('cursor-agent', ['mcp', 'list'|'disable', ...], { cwd: worktreePath }) to
      enumerate and disable every server not in allowlist (registry names + 'loom'). Wire it into
      Supervisor.dispatch() step 3, gated on backend === 'cursor-cli', after materialization and
      before the audit row. Servers that can't be disabled headlessly go in CursorEnforceResult.gaps
      — recorded in the audit detail (disabledServers/gaps), never thrown; document the residual
      strictness gap and the upstream --strict-mcp-config-equivalent ask as out of scope. Trade-off:
      enumerate-and-disable is weaker than claude's strict flag and can race a server added between
      list and spawn — document, don't try to close.
    test_plan: >-
      Levels: the spike findings (config-layer precedence; disable state per-project vs user-global)
      are manual verification recorded in writing — gate the rest of the story on that record
      existing, per ADR-2; then unit/integration tests of enforceCursorMcpAllowlist using a fake
      cursor-agent binary (a stub script passed via the cursorBin option) so tests are deterministic
      and never touch the real CLI or user config. Key cases: (1) stub 'mcp list' returns
      [user-jira, internal-tools, loom, registry-a]; allowlist = ['registry-a','loom'] → assert 'mcp
      disable' invoked exactly for user-jira and internal-tools, each with cwd === worktreePath, and
      result.disabled === those two sorted; (2) empty allowlist except 'loom' (empty registry) →
      every non-loom server disabled — this is the 'worker sees zero non-loom servers' AC at the
      unit level; (3) all servers already allowlisted → zero disable calls, disabled === []; (4) a
      disable call exits non-zero or hangs/prompts (stub simulates) → server lands in result.gaps,
      function RETURNS (never throws), other disables still attempted; (5) 'mcp list' output
      unparseable or empty → no crash, sane empty result; (6) Supervisor integration: dispatch with
      backend 'cursor-cli' invokes the enforcer after materialization and feeds disabled/gaps into
      the audit detail; backend 'claude-code' never invokes it. Verification bar: spike findings
      recorded before wiring; tests prove every non-allowlisted server gets a headless disable
      attempt against the worktree cwd, gaps are captured not thrown, and the documented residual
      gap + upstream ask exist in the story output.
  - id: story-002-003
    title: 'Claude-code backend: spawn workers with strict MCP config flags'
    description: >-
      Update spawn-arg construction in ClaudeCodeWorker.ts so workers are launched with
      --strict-mcp-config --mcp-config pointing at the worktree-generated config file.
    acceptance_criteria:
      - >-
        Claude-code workers spawn with --strict-mcp-config and --mcp-config <path to the
        worktree-generated .cursor/mcp.json equivalent>
      - Tests under __tests__/ cover the spawn-arg construction
    estimated_complexity: small
    dependencies:
      - story-002-001
    tech_notes: >-
      In packages/loom-core/src/orchestrator/ClaudeCodeWorker.ts, change agentArgs() to take the
      WorkerAssignment (have BaseCliWorker.spawnAgent pass it down — the minimal seam per the
      interface contract) and append ['--strict-mcp-config', '--mcp-config', path.join(worktreePath,
      '.cursor/mcp.json')] when the generated config exists. Per ADR-3 the claude-code config
      excludes the loom server entry (guidance arrives over stdin via WorkerInputChannel, no MCP
      dependency). Add node --test coverage of the spawn-arg construction under
      packages/loom-core/src/__tests__/, including the config-absent case. Trade-off:
      --strict-mcp-config is the strongest available guarantee but couples the arg to the generated
      file's path convention — keep the path derivation in one place.
    test_plan: >-
      Level: unit only — agentArgs() is arg construction, no process spawn needed. Key cases in
      packages/loom-core/src/__tests__/: (1) generated config exists at <worktree>/.cursor/mcp.json
      → agentArgs(assignment) includes the contiguous pair '--strict-mcp-config', '--mcp-config',
      followed by the exact absolute path built with path.join (assert the full triple and its
      order); (2) config file absent → neither flag appears (the config-absent case the tech notes
      require); (3) existing claude-code args are preserved unchanged around the new flags
      (regression guard on the agentArgs(assignment) signature change through
      BaseCliWorker.spawnAgent — assert a CursorAgentWorker or base-class path still compiles/passes
      with the new signature). Verification bar: tests demonstrate the flags are appended iff the
      generated file exists and point at the worktree-generated config; both ACs covered by cases
      1–2.
  - id: story-002-004
    title: Audit-log each worker's exact MCP server set before spawn
    description: >-
      Write one audit_log row per worker spawn containing the exact set of MCP server names the
      worker was given, persisted before the worker process starts, mirroring how bash commands are
      logged. Confirm the existing audit_log schema fits the payload without migration.
    acceptance_criteria:
      - Every worker spawn writes exactly one audit row containing the worker's MCP server names
      - The audit row is written before the worker process starts
      - >-
        The existing audit_log table stores the payload without a schema migration, or the finding
        is documented
      - Tests under __tests__/ cover the audit row contents and write-before-spawn ordering
    estimated_complexity: small
    dependencies:
      - story-002-001
    tech_notes: >-
      In Supervisor.dispatch() (packages/loom-core/src/orchestrator/Supervisor.ts), call
      this.audit.record() with action: 'worker_mcp_servers', command: <storyId>, agent_id:
      <task.agentId>, and a detail payload matching WorkerMcpServersDetail ({ servers: sorted names
      from MaterializeResult, backend, configPath, loomServerIncluded, disabledServers? from the
      cursor enforcer }) — placed after materialization/enforcement and strictly before
      runner.run(), so write-before-spawn holds by construction (step 4 of the dispatch ordering,
      ADR-4). No migration: audit_log.detail is a free-form JSON TEXT column and AuditLog.record()
      already stringifies — confirm and note this in the story. Keep it a separate row from the
      existing 'dispatch' row (its detail shape is consumed by dashboards). Tests under
      packages/loom-core/src/__tests__/ assert row contents via AuditLog.getByStory() and the
      write-before-spawn ordering. Trade-off: two rows per dispatch, accepted to avoid changing the
      dispatch row's contract.
    test_plan: >-
      Level: integration against real SQLite (temp/in-memory Database) — the contract under test is
      what lands in audit_log and when, not Supervisor internals. Key cases: (1) dispatch one story
      with a stub runner → exactly ONE row with action 'worker_mcp_servers' for that story via
      AuditLog.getByStory(); assert command === storyId and agent_id === task.agentId; (2) detail
      payload parses as WorkerMcpServersDetail: servers sorted and exactly matching the
      MaterializeResult names, correct backend, configPath, loomServerIncluded true for cursor-cli /
      false for claude-code; (3) cursor-cli path: disabledServers (and gaps if present) from the
      enforcer appear in detail; claude-code path: field absent; (4) write-before-spawn by
      observation, not convention: stub runner.run() queries getByStory() at invocation time and
      asserts the worker_mcp_servers row already exists — this is the ordering AC made executable;
      (5) the existing 'dispatch' row is still written with its current detail shape (two rows per
      dispatch, dashboards unbroken); (6) no-migration confirmation: the insert succeeds against the
      unmodified Database.ts schema (the test running at all proves it — note the finding in the
      story). Verification bar: one row per spawn, correct and complete payload, row provably
      persisted before runner.run() executes, zero schema changes.
