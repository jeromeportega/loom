stories:
  - id: story-002-001
    title: Add `loom pull-guidance <story-id>` command
    description: >-
      Add a CLI command that wraps `OperatorGuidance.pullSince` to print new operator guidance for a
      story (the worker-side read path mirroring `loom_pull_guidance`).
    acceptance_criteria:
      - >-
        `loom pull-guidance <story-id>` prints new guidance since the last pull as plain text by
        default
      - A `--json` flag emits the guidance as structured JSON
      - When there is no new guidance, a clear "no new guidance" message is printed
      - An unknown story id exits non-zero with a clear one-line message and never a stack trace
    estimated_complexity: small
    dependencies: []
    tech_notes: >-
      Add a `pull-guidance` command in `packages/loom-cli/src/index.ts` (commander) that wraps
      `OperatorGuidance.pullSince(storyId)` from
      `packages/loom-core/src/orchestrator/OperatorGuidance.ts`, returning `{ content, has_more }`.
      Default-print `content` as plain text (or `"no new guidance"` when `content === null`); under
      `--json` print the full `{ content, has_more }` object. Wrap unknown-story-id in a try/catch
      that prints a one-line message and `process.exit(1)` — never let a stack trace escape.
      Trade-off (ADR-002): you are intentionally dropping the typed MCP payload for raw text + a
      `--json` escape hatch, so keep the JSON shape byte-identical to what `loom_pull_guidance`
      returned.
    test_plan: >-
      Levels: integration (the command + a real `.loom/guidance/<id>.md` and `.pulled/<id>.offset`
      on a temp dir — the filesystem offset seam is the thing that breaks), plus a unit assertion on
      error handling. Key cases: (1) Happy path — guidance appended since last pull → `loom
      pull-guidance <story-id>` prints the appended text as plain text on stdout, exit 0. (2)
      `--json` → stdout parses to exactly `{ content, has_more }`; assert the shape is
      byte-identical to the old `loom_pull_guidance` payload (ADR-002), including `has_more`. (3) No
      new guidance — `pullSince` returns `content === null` → prints a clear "no new guidance"
      message, exit 0 (NOT an error). (4) Offset advances — call twice; second call returns nothing
      new (proves the consumption marker moved, not re-reads). (5) `has_more: true` path when more
      remains. (6) Unknown story id → exit code 1, single-line message on stderr, assert NO stack
      trace / no 'Error:' multiline dump leaks. Verification bar: every AC has a passing case; the
      `--json` shape test is the contract guard that lets Epic 003 delete the MCP read tool safely.
  - id: story-002-002
    title: Add `loom project <project-root>` command
    description: >-
      Add a CLI command that returns the registered project's detail plus its latest epic, mirroring
      `loom_get_project`.
    acceptance_criteria:
      - >-
        `loom project <project-root>` prints a short human summary (root, name, latest epic
        id/status/title) by default
      - A `--json` flag emits the full project object
      - >-
        An unregistered project root exits non-zero with a clear one-line message and never a stack
        trace
    estimated_complexity: small
    dependencies: []
    tech_notes: >-
      Add a `project <project-root>` command in `packages/loom-cli/src/index.ts` that calls
      `ProjectRegistry().list().find(p => p.root === root)`
      (`packages/loom-core/src/state/ProjectRegistry.ts`) and joins it to the latest `EpicRecord`
      (`packages/loom-core/src/state/types.ts`). Default output is a short human summary (root,
      name, latest epic id/status/title); `--json` emits `{ project, latest_epic? }`. An
      unregistered root exits non-zero with a one-line message and no stack trace. Reuse whatever
      lookup `loom_get_project` called so behavior is identical by construction.
    test_plan: >-
      Levels: integration with a seeded `ProjectRegistry` (`~/.loom/projects.json`) and `EpicStore`,
      since the command joins two real stores. Key cases: (1) Happy path — registered root with at
      least one epic → default output contains root, name, and the latest epic's id/status/title
      (assert it picks the LATEST epic, seed ≥2 epics to prove ordering). (2) `--json` → stdout
      parses to `{ project, latest_epic }` matching the registry entry and `EpicRecord`. (3)
      Boundary — registered project with zero epics → `latest_epic` absent/omitted in JSON and human
      output degrades gracefully (no crash, no 'undefined'). (4) Unregistered root → exit 1,
      one-line message, no stack trace. Verification bar: each AC covered; lookup reuses the same
      path `loom_get_project` used so behavior is identical by construction — assert that with a
      fixture, don't just trust it.
  - id: story-002-003
    title: Add `loom stop --epic` and `--reason` audit parity to stop/retry
    description: >-
      Extend `loom stop` with an `--epic <epic-id>` mode that terminates only that epic's running
      workers (mirroring `loom_stop_epic`), and add an optional `--reason` flag to bare `loom stop`,
      `loom stop --epic`, and `loom retry` for audit parity with MCP.
    acceptance_criteria:
      - >-
        `loom stop --epic <epic-id>` terminates every running worker of that epic while leaving
        other epics running
      - Bare `loom stop` retains its graceful whole-supervisor halt behavior unchanged
      - >-
        An optional `--reason` flag on bare `loom stop`, `loom stop --epic`, and `loom retry` is
        recorded in the audit log, defaulting to a CLI-source reason string when omitted
      - A nonexistent epic id exits non-zero with a clear one-line message and never a stack trace
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      In `packages/loom-cli/src/index.ts`, extend the existing `stop` command with an `--epic
      <epic-id>` mode that mirrors `loom_stop_epic` (terminate only that epic's workers via the
      Supervisor, leaving other epics running) while leaving bare `loom stop`'s graceful
      whole-supervisor halt untouched; add an optional `--reason <text>` to bare `stop`, `stop
      --epic`, and `retry`. Each path must call `AuditLog.record({ action, detail: { reason } })`
      from `packages/loom-core/src/state/AuditLog.ts`, defaulting `reason` to a CLI-source string
      when omitted. Nonexistent epic id → one-line message, exit 1, no stack trace. Trade-off: this
      is the medium-complexity story because epic-scoped termination must select the right worker
      subset — confirm the Supervisor exposes a per-epic stop and don't accidentally halt the whole
      supervisor.
    test_plan: >-
      Levels: integration — this is the highest-risk story (worker-subset selection). Drive a
      `Supervisor` with workers seeded across TWO epics and assert `AuditLog` rows. Key cases: (1)
      Isolation (the load-bearing case) — `loom stop --epic <A>` terminates only epic A's running
      workers; assert epic B's workers are STILL running afterward. (2) Bare `loom stop` unchanged —
      still performs the graceful whole-supervisor halt (regression guard; assert it stops
      everything, not one epic). (3) `--reason "text"` on each of bare `stop`, `stop --epic`, and
      `retry <story-id>` → `AuditLog.record` writes `detail.reason === "text"` with the right
      `action` (`stop_agent`/`stop_epic`/`retry_story`). (4) `--reason` omitted on each path → audit
      `detail.reason` equals the documented CLI-source default string (assert the exact default).
      (5) Nonexistent epic id → exit 1, one-line message, no stack trace, and no workers terminated.
      Verification bar: isolation + audit-row assertions both green; do NOT assert internal
      Supervisor calls — assert observable worker liveness and persisted audit rows.
  - id: story-002-004
    title: Add MCP-parity flags to existing read commands (status, scan, propose)
    description: >-
      Thread the MCP `project` parameter into `loom status` and `loom scan` as a `--project <root>`
      flag, and add `--top-lessons`, `--top-opps`, and `--json` flags to `loom propose` (mirroring
      `loom_propose`).
    acceptance_criteria:
      - '`loom status --project <root>` targets the named registered project'
      - '`loom scan --project <root>` targets the named registered project'
      - >-
        `loom propose` accepts `--top-lessons`, `--top-opps`, and `--json` flags that match the
        `loom_propose` behavior
    estimated_complexity: small
    dependencies: []
    tech_notes: >-
      Thread a `--project <root>` flag into the existing `status` and `scan` commands in
      `packages/loom-cli/src/index.ts` (resolving the root through `ProjectRegistry` exactly as the
      MCP `project` param did), and add `--top-lessons <n>`, `--top-opps <n>`, and `--json` to
      `propose`, passing them into `proposeNextEpic` from loom-core. The `--json` plumbing on
      `propose` already has a pattern to copy — reuse it rather than inventing a new serializer. No
      core changes; these are pure flag-to-argument bindings.
    test_plan: >-
      Levels: integration (pure flag-to-arg bindings, but the binding must actually scope). Key
      cases: (1) `loom status --project <root>` → output reflects the named project; seed TWO
      registered projects and assert the OTHER project's data is not shown (proves scoping, not just
      acceptance of the flag). (2) `loom scan --project <root>` → same scoping assertion against the
      named project. (3) `loom propose --top-lessons <n>` and `--top-opps <n>` → the values are
      passed through to `proposeNextEpic` and bound output respects the counts (e.g. n=1 yields at
      most 1). (4) `loom propose --json` → stdout parses as JSON matching the existing propose
      serializer pattern. Verification bar: every flag is observably honored
      (scoped/limited/serialized), not merely parsed without error. No core changes expected — if a
      test needs core edits, that's a smell to flag.
  - id: story-002-005
    title: Route cursor worker guidance through the CLI / guidance file
    description: >-
      Update the cursor worker prompt to pull live operator guidance via `loom pull-guidance` or by
      reading `.loom/guidance` for the story directly, and stop materializing the loom-server entry
      into the cursor worktree `.cursor/mcp.json`.
    acceptance_criteria:
      - >-
        The cursor worker prompt instructs workers to pull guidance via `loom pull-guidance` or by
        reading `.loom/guidance` for the story directly
      - The loom-server entry is no longer materialized into the cursor worktree `.cursor/mcp.json`
      - Worker-facing third-party MCP provisioning into `.cursor/mcp.json` remains unchanged
    estimated_complexity: small
    dependencies:
      - story-002-001
    tech_notes: >-
      Update the cursor worker prompt template (in `packages/loom-core`, the dispatch/worker-prompt
      source) to instruct workers to pull live guidance via `loom pull-guidance <story-id>` or by
      reading `.loom/guidance/<story-id>.md` directly, and stop passing the `loom` server entry into
      `materializeWorktreeMcpConfig` in `packages/loom-core/src/mcp/WorktreeMcp.ts` so the worktree
      `.cursor/mcp.json` carries only third-party `policy.mcp.registry` servers. Do NOT alter the
      function signature or its third-party materialization behavior — touch only the loom-self
      entry. Depends on story-002-001 existing. Trade-off (NFR-1): this reroutes the worker read
      path off the MCP RPC, so it must be proven working here before Epic 003 deletes the old read
      tool.
    test_plan: >-
      Levels: unit on the worker-prompt template (string content) + integration on
      `materializeWorktreeMcpConfig` output. This reroutes the cursor worker read path off MCP, so
      it must be PROVEN here before Epic 003 deletes the old tool (NFR-1). Key cases: (1) Cursor
      worker prompt template contains the instruction to pull guidance via `loom pull-guidance
      <story-id>` or read `.loom/guidance/<story-id>.md` directly (assert the substring/path is
      present). (2) Materialize a worktree config → resulting `.cursor/mcp.json` contains NO `loom`
      self-server entry (assert key absent). (3) Third-party retained — same materialize call still
      writes the `policy.mcp.registry` servers unchanged (assert they are present); function
      signature untouched. (4) Secrets — env vars in third-party entries remain `${VAR}` references,
      not inlined (security-model guard). Verification bar: all three ACs pass AND the third-party +
      secret-handling regression guards stay green, demonstrating only the loom-self entry was
      removed.
  - id: story-002-006
    title: Prove CLI parity with the mcp__loom inventory and green the suite
    description: >-
      Add a verification test that enumerates the pre-removal `mcp__loom` tool inventory and asserts
      each tool maps to a CLI command, then run the full build and test suite to confirm the parity
      port holds end to end.
    acceptance_criteria:
      - >-
        A test enumerates the pre-removal `mcp__loom` tool inventory and asserts each tool maps to a
        CLI command
      - All seven Phase-1 capabilities are confirmed reachable from the CLI
      - The full build passes
      - The entire test suite passes
    estimated_complexity: small
    dependencies:
      - story-002-001
      - story-002-002
      - story-002-003
      - story-002-004
      - story-002-005
    tech_notes: >-
      Add a verification test (in the loom-cli or loom-core test suite) that pins the pre-removal
      `mcp__loom` tool inventory as a fixed list and asserts each of the seven Phase-1 tools maps to
      a CLI command per the parity oracle (`loom_pull_guidance→loom pull-guidance`,
      `loom_get_project→loom project`, `loom_stop_epic→loom stop --epic`, `loom_propose→loom
      propose`, `loom_scan_signals→loom scan`, `loom_get_status→loom status`, `loom_stop_agent→loom
      stop <story-id>`), then run `npm run build` and the full `npm run test`. Keep the inventory
      list as an explicit literal in the test — it is the source of truth for "no capability lost,"
      so it must fail loudly if a mapping regresses.
    test_plan: >-
      Levels: a single meta/unit verification test in the loom-cli (or loom-core) suite — this test
      IS the parity oracle and the source of truth for 'no capability lost'. Key cases: (1) Pin the
      pre-removal `mcp__loom` inventory as an explicit literal list (all 23 `loom_*` tools) —
      hardcoded, not derived, so it fails loudly on drift. (2) Assert each of the seven Phase-1
      tools maps to its CLI command per the oracle: `loom_pull_guidance→loom pull-guidance`,
      `loom_get_project→loom project`, `loom_stop_epic→loom stop --epic`, `loom_propose→loom
      propose`, `loom_scan_signals→loom scan`, `loom_get_status→loom status`, `loom_stop_agent→loom
      stop <story-id>`. (3) Assert the remaining 16 tools also map to an existing CLI command (the
      full inventory, not just the seven). (4) Negative guard — the mapping table must be exhaustive
      over the inventory so that a removed/renamed command fails the test (document this intent).
      Then run `npm run build` and full `npm run test`. Verification bar: the parity test is green
      over the complete inventory and a clean build + full green suite — confirming all seven
      Phase-1 capabilities are reachable from the CLI.
