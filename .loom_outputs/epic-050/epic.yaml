stories:
  - id: story-050-001
    title: Add loom-home location config knob and resolve its path
    description: >-
      Add exactly one configuration setting for the loom-home location and implement the resolution
      logic. Default is a sibling directory at the workspace root, defined as the immediate parent
      of the target repo (e.g. target ~/repos/app resolves to ~/repos/loom-home); the single config
      setting overrides this default.
    acceptance_criteria:
      - >-
        A single config setting for the loom-home location is read by loom; no broader config
        hierarchy is introduced
      - >-
        With no override set, resolution returns a sibling directory at the workspace root
        (immediate parent of the target repo)
      - When the config setting is provided, resolution returns the overridden location
      - Unit tests cover the default sibling resolution and the override path
    estimated_complexity: small
    dependencies: []
    tech_notes: >-
      Create `packages/loom-core/src/home/resolveLoomHomePath.ts` exporting a pure
      `resolveLoomHomePath(projectRoot, policy)` that returns an absolute path — model its structure
      and unit-testability on `planner/paths.ts`. Add the single optional `loom_home:
      z.string().optional()` field to `PolicySchema` in `packages/loom-core/src/types.ts` so
      `PolicyEngine.load()` picks it up for free; default resolution = `path.dirname(projectRoot) +
      '/loom-home'` using `node:path`, override = the policy value with `~` expansion (resolve `~`
      against `os.homedir()`). Trade-off to know: the 'workspace root = immediate parent' default is
      a heuristic (ADR-2) — keep it pure and dumb, push all escape-hatch behavior onto the explicit
      knob, and cover both branches (default sibling, explicit override with tilde) in unit tests.
    test_plan: >-
      Level: UNIT only — `resolveLoomHomePath(projectRoot, policy)` is pure, no I/O, so cover it
      with fast table-driven unit tests in
      `packages/loom-core/src/home/resolveLoomHomePath.test.ts`. Also add a tiny schema test
      confirming `PolicySchema` accepts the new field. Key cases: (1) DEFAULT sibling —
      `projectRoot='/home/u/repos/app'`, `policy={}` → `'/home/u/repos/loom-home'` (assert
      `path.dirname(projectRoot)+'/loom-home'`); (2) OVERRIDE absolute —
      `policy.loom_home='/srv/control/loom-home'` → returned verbatim; (3) OVERRIDE with tilde —
      `policy.loom_home='~/workspaces/cp/loom-home'` → expanded against `os.homedir()` (assert no
      literal `~` remains); (4) return value is ALWAYS absolute (`path.isAbsolute(result) === true`)
      for both branches; (5) `PolicySchema.parse({})` succeeds with `loom_home` undefined and
      `.parse({loom_home:'/x'})` succeeds — proving exactly one optional knob was added and absence
      falls through to default. Verification bar: AC1 met by the schema test (single optional field
      read, no hierarchy); AC2 by case 1; AC3 by cases 2–3; AC4 by having both default and override
      (incl. tilde) branches asserted. Tests must be deterministic — stub `os.homedir()` (inject or
      mock) rather than depending on the real home dir.
  - id: story-050-002
    title: Create and git-init loom-home on demand
    description: >-
      When loom-home does not exist at the resolved location, create the directory and run git init.
      If a directory already exists, reuse it when it is a git repo and follow a defined, documented
      behavior when it exists but is not a git repo.
    acceptance_criteria:
      - If no directory exists at the resolved location, loom creates it and runs git init
      - >-
        If a git repository already exists at the resolved location, loom reuses it without
        re-initializing
      - >-
        If a non-git directory exists at the resolved location, loom follows the defined behavior
        (init-in-place per the documented assumption) rather than failing ambiguously
      - Tests cover absent, existing-git-repo, and existing-non-git-repo cases
    estimated_complexity: small
    dependencies:
      - story-050-001
    tech_notes: >-
      Create `packages/loom-core/src/home/ensureLoomHome.ts` exporting idempotent
      `ensureLoomHome(loomHomePath): EnsureResult` (`{path, created, initialized, reused}`); detect
      repo state with `isGitRepo()`/`hasCommits()` and run `git init` only via
      `gitSafe(loomHomePath, ['init'])` from `orchestrator/git.ts` — never shell out directly.
      Implement the three cases from ADR-3: absent → `mkdir -p` + init (`created`+`initialized`),
      existing git repo → reuse without re-init (`reused`), existing non-git dir → init-in-place.
      Critical guard (Security Model): refuse and throw a clear error when the resolved path is
      inside `projectRoot` or inside any `.git` directory, to prevent nested-repo corruption.
      Trade-off: init-in-place can surprise an operator who mis-pointed the knob — favor the
      documented non-destructive behavior over a hard failure that blocks the first epic.
    test_plan: >-
      Level: INTEGRATION-style unit against real temp directories — `ensureLoomHome` performs
      filesystem + git work, so use scratch dirs (`fs.mkdtemp`) and the REAL
      `gitSafe`/`isGitRepo`/`hasCommits` from `orchestrator/git.ts` (do NOT mock git; that's the
      seam under test). File: `packages/loom-core/src/home/ensureLoomHome.test.ts`, cleaning up temp
      dirs in teardown. Key cases: (1) ABSENT — point at a non-existent path → returns
      `{created:true, initialized:true, reused:false}` and `isGitRepo(path)===true`; (2) EXISTING
      GIT REPO — pre-`git init` a temp dir and make a commit → returns `{reused:true,
      initialized:false, created:false}` and the pre-existing HEAD/commit is preserved (no re-init
      clobber); (3) EXISTING NON-GIT DIR — create a dir with a sentinel file → init-in-place:
      `{created:false, initialized:true}`, sentinel file still present and unmodified; (4)
      IDEMPOTENCY — call twice; second call returns `reused:true` and does not re-init; (5) GUARD:
      resolved path inside `projectRoot` → throws a clear error (assert message, assert no `.git`
      created); (6) GUARD: resolved path inside any `.git` directory → throws. Verification bar:
      AC1–AC3 mapped to cases 1/2/3 respectively with the documented init-in-place behavior; AC4
      (tests cover absent/existing-git/existing-non-git) satisfied; plus the security guards prove
      no nested-repo corruption. Assert git ran via `gitSafe` (no shelling out) by exercising real
      repo state, not by inspecting call internals.
  - id: story-050-003
    title: Route per-epic artifact writes into loom-home with provenance
    description: >-
      Write the per-epic outputs (project-brief.md, prd.md, architecture.md, epic.yaml) that
      currently land in .loom_outputs/<epic-id>/ into loom-home instead of the target repo, and
      record provenance (target repo + epic) via a defined, pinned-down mechanism so loom-home
      history stays traceable across source repos.
    acceptance_criteria:
      - >-
        All four per-epic artifacts are written under loom-home, not into the target repo working
        tree
      - >-
        Each artifact set records provenance identifying its target repo and epic via the chosen
        mechanism (commit-message convention, metadata file, and/or directory layout)
      - Machine-local state (SQLite DB) and worktrees are untouched and remain where they are
      - Tests assert artifacts land under loom-home and provenance is recorded
    estimated_complexity: medium
    dependencies:
      - story-050-002
    tech_notes: >-
      Create `packages/loom-core/src/home/artifactRouter.ts` exporting `routeArtifacts(input)` that
      copies the four planning artifacts from `.loom/planning/<runId>/` into
      `<loomHome>/repos/<slug>/<epic-id>/` and writes `provenance.json` (the `Provenance` interface,
      `loom_home_schema: 1`). Compute `<slug>` = `<sanitized-name>-<8-char hash>` (ADR-7) hashing
      `remoteUrl()` or absolute `projectRoot` when there is no remote, using `node:crypto`; derive
      the directory name, provenance, and later commit trailers from the same computed values so the
      three provenance channels (ADR-4) can't drift. Do not relocate the SQLite DB or worktrees
      (ADR-8). Trade-off: keep this step a pure copy-with-provenance — it writes files but must not
      commit (that is story-050-004), preserving the copy-at-finalize boundary from ADR-6.
    test_plan: >-
      Level: INTEGRATION-style unit against temp dirs (filesystem only — this step copies and
      writes, it must NOT commit). File: `packages/loom-core/src/home/artifactRouter.test.ts`. Set
      up a fake `.loom/planning/<runId>/` with the four source files and a temp loom-home; call
      `routeArtifacts(...)`. Key cases: (1) ALL FOUR artifacts (`project-brief.md`, `prd.md`,
      `architecture.md`, `epic.yaml`) land under `<loomHome>/repos/<slug>/<epic-id>/` with
      byte-identical content, and NOTHING is written into the target repo working tree (assert
      target tree unchanged); (2) PROVENANCE — `provenance.json` exists with `loom_home_schema:1`,
      `target_repo:{name,path,remote_url,slug}`, `epic_id`, `run_id`, `target_head_sha`,
      `created_at` (ISO-8601); (3) SLUG determinism (ADR-7) —
      `<slug>='<sanitized-name>-<8charhash>'`, same `remoteUrl()` → same slug across calls; no
      remote → hash falls back to absolute `projectRoot`; assert the on-disk directory name ===
      `provenance.slug` (three channels can't drift); (4) BOUNDARY: an absent optional source in
      `artifactSources` (e.g. no `epicYaml`) → only present artifacts copied, no throw; (5) NO
      COMMIT — assert loom-home git history/index is unchanged after routing (this is
      story-050-004's job); (6) machine-local state untouched — SQLite DB file and any worktree dirs
      are not created/moved/modified. Verification bar: AC1 (case 1), AC2 (cases 2–3), AC3 (case 6),
      AC4 (cases 1–2). Make `created_at` deterministic via injected clock so the test isn't
      time-flaky.
  - id: story-050-004
    title: Commit artifacts to loom-home's git history with defined rollback semantics
    description: >-
      During planning and finalize, commit each epic's artifacts to loom-home's own git history
      instead of onto the target repo's epic branch. Define and implement the failure/rollback
      semantics between target-repo operations and the loom-home commit so a partial failure does
      not leave the epic in an undefined split state.
    acceptance_criteria:
      - Planning and finalize commit the epic's artifacts to loom-home's own git history
      - No loom operational artifacts are committed onto the target repo's epic branch
      - >-
        loom-home commits do not interfere with the target repo's git operations and no guardrail is
        weakened
      - >-
        Failure/rollback semantics for a partial-failure finalize are defined and exercised by a
        test
      - >-
        Single-repo planning, dispatch, integration gate, per-epic PR, worktrees, and guard engine
        behave unchanged
    estimated_complexity: medium
    dependencies:
      - story-050-003
    tech_notes: >-
      Create `packages/loom-core/src/home/commitArtifacts.ts` exporting `commitArtifacts(input):
      CommitArtifactsResult` that stages and commits `repos/<slug>/<epic-id>/` via
      `gitSafe(loomHomePath, [...])` with the loom-home path as explicit `cwd`, building the commit
      message with the `Target-Repo`/`Target-Path`/`Target-Head`/`Epic`/`Run-Id` trailers. Then
      re-point `EpicFinalizer.promoteArtifacts()` (`orchestrator/EpicFinalizer.ts:809`) to call
      `resolveLoomHomePath → ensureLoomHome → routeArtifacts → commitArtifacts` and DELETE the old
      `.loom_outputs/<epicId>` write + target-branch `git add`/`commit`. Implement ADR-5 ordering:
      target PR lands first, then loom-home; on loom-home failure set `loom_home_status='pending'`
      (and `loom_home_sha` on success) via `EpicStore` — add the two `epics` columns — and return
      the discriminated result rather than throwing into finalize, never rolling back the target PR.
      Trade-off: this accepts a bounded, observable split-state window closed by the pending marker
      + retry instead of a real two-phase commit git can't provide.
    test_plan: >-
      Level: UNIT for `commitArtifacts` against a temp loom-home git repo (real `gitSafe`, real
      `EpicStore` on a temp SQLite file) PLUS one INTEGRATION test of the re-pointed
      `EpicFinalizer.promoteArtifacts()` seam. Files:
      `packages/loom-core/src/home/commitArtifacts.test.ts` and an addition to the existing
      `EpicFinalizer`/orchestrator test. Key cases: (1) HAPPY — staged `repos/<slug>/<epic-id>/` is
      committed with `cwd=loomHomePath`; returns `{status:'committed', sha}`; commit message carries
      ALL trailers (`Target-Repo`, `Target-Path`, `Target-Head`, `Epic`, `Run-Id`); `EpicStore` row
      has `loom_home_status='committed'` and `loom_home_sha=sha`; (2) FAILURE/ROLLBACK (FR-10) —
      force the commit to fail (e.g. unwritable/invalid loom-home) → returns `{status:'pending',
      reason}`, sets `loom_home_status='pending'`, and DOES NOT throw into finalize and DOES NOT
      roll back the target PR; (3) RETRY/IDEMPOTENCY — a later `commitArtifacts` from `pending`
      reconciles to `committed` without duplicate/garbage commits; (4) RE-POINTED SEAM — after
      `promoteArtifacts()`, the target epic branch has NO `.loom_outputs/<epicId>` write and NO new
      commit from promotion (assert target-branch diff is unchanged by promotion); the old
      `.loom_outputs` + target `git add`/`commit` path is gone; (5) ORDERING (ADR-5) — target
      merge/PR completes before the loom-home commit, and a loom-home failure leaves the target PR
      intact; (6) ISOLATION/GUARD (NFR-1) — loom-home commit lands on loom-home's own default
      branch, never a target `protected_branches` ref; the target repo's index/branches are
      untouched after the loom-home commit; (7) MIGRATION — `EpicStore` schema gains
      `loom_home_status` (CHECK in committed|pending, default NULL) and `loom_home_sha`.
      Verification bar: AC1 (case 1), AC2 (case 4), AC3 (cases 6 + guard), AC4 (cases 2–3), AC5
      parity covered here + proven structurally in story-050-005. Use real git/EpicStore, not mocks,
      so the two-repo `cwd` separation is actually exercised.
  - id: story-050-005
    title: Add automated test proving the target repo stays code-only
    description: >-
      Add an automated test asserting that after an epic runs, the target repo's epic branch diff
      contains only code — no .loom_outputs/ or other loom operational artifacts — and that
      already-committed prior artifacts are left untouched (no history rewrite).
    acceptance_criteria:
      - >-
        A test asserts the target-repo epic-branch diff is code-only with no loom artifacts
        committed
      - >-
        The test confirms pre-existing committed .loom_outputs/ history is left in place (no
        rewrite)
      - The test passes in the suite
    estimated_complexity: small
    dependencies:
      - story-050-004
    tech_notes: >-
      Add an integration test (alongside the existing `EpicFinalizer`/orchestrator tests in
      `packages/loom-core`) that runs an epic to finalize against a temp target repo and asserts
      `git diff` on `epic/<id>` is code-only — no `.loom_outputs/` or other loom artifacts — and
      that loom-home (separate repo) holds the set with provenance. Also assert that any
      pre-existing committed `.loom_outputs/` history is left untouched (no rebase/rewrite). Use the
      real `git.ts`/`gitSafe` paths against scratch repos so the test exercises the actual two-repo
      `cwd` separation. Trade-off: this test is the structural proof of the code-only invariant
      (NFR-2), so prefer asserting on the literal diff/file list over mocking git.
    test_plan: >-
      Level: INTEGRATION — this is THE structural proof of the code-only invariant (FR-8/NFR-2), so
      use real `git.ts`/`gitSafe` against scratch repos and assert on the literal diff/file list; do
      NOT mock git. Add alongside the existing `EpicFinalizer`/orchestrator integration tests in
      `packages/loom-core`. Setup: a temp target repo and a temp loom-home; run an epic through to
      finalize. Key cases: (1) CODE-ONLY DIFF — `git diff`/`git show --name-only` on `epic/<id>` in
      the target repo contains only code paths and ZERO loom artifacts (no `.loom_outputs/`, no
      `project-brief.md`/`prd.md`/`architecture.md`/`epic.yaml` committed) — assert the committed
      file list explicitly excludes those; (2) LEDGER PRESENT — the separate loom-home repo holds
      `repos/<slug>/<epic-id>/` with all four artifacts and `provenance.json`, committed to
      loom-home's own history; (3) NO HISTORY REWRITE (NFR-3) — seed the target repo with a
      pre-existing committed `.loom_outputs/<old-epic>/` commit, capture its SHA, run finalize, then
      assert that commit SHA is byte-for-byte unchanged (no rebase/rewrite). Verification bar: all
      three ACs map 1:1 to cases 1/3/(pass-in-suite); the test must fail loudly if any loom artifact
      reappears on the target branch — that regression guard is the whole point.
