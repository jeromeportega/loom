stories:
  - id: story-041-001
    title: Author case-set fixtures with rubric expectations
    description: >-
      Create the lesson-extractor case set: representative epic-telemetry inputs (decision traces,
      agent logs, audit tails) including at least one rich multi-story epic and one thin/near-empty
      epic. Pair each case with rubric expectations — expected lesson themes plus known
      over-extraction traps (telemetry that should yield few or no lessons).
    acceptance_criteria:
      - >-
        A new lesson-extractor consumer directory contains fixture files for at least two cases: one
        rich multi-story epic and one thin/near-empty epic.
      - Each case's telemetry includes realistic decision traces, agent logs, and an audit tail.
      - >-
        Each case is paired with rubric expectations expressed as expected lesson themes (not exact
        expected lessons) plus at least one over-extraction trap.
      - Fixtures are hand-authored synthetic data only and make no real model calls.
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      Hand-author the fixture YAML at `packages/loom-core/eval-cases/lesson-extractor.yaml` to
      satisfy the `LessonExtractorCaseSchema` (`src/eval/lesson-extractor/caseSchema.ts`, owned by
      story-041-002 — coordinate on shape early): each case needs `id`, `source: 'rich'|'thin'`, an
      `EpicTelemetry`-shaped `telemetry` block (`decision_traces`, `agents`, `audit_tail` mirroring
      the production shapes in `src/findings/LessonExtractor.ts`), and a `rubric` of
      `expected_themes` plus ≥1 `over_extraction_traps`. Critical trap: the thin case must carry a
      *little* real telemetry, not empty — `LessonExtractor.extract()` short-circuits to `[]` when
      all three sources are empty, so an empty thin case never exercises over-extraction. Keep all
      data synthetic with no real-epic anonymized content (PRD out-of-scope) and make no model
      calls.
    test_plan: >-
      Level: unit (fixture-validation only) — fixtures are data, so the only automated check is a
      parse + structural assertion; no LLM, no integration here.


      Key cases (checklist):

      - Fixture file `packages/loom-core/eval-cases/lesson-extractor.yaml` parses as YAML and
      contains ≥2 cases.

      - Exactly the two required profiles are present: one case with `source: 'rich'` and one with
      `source: 'thin'`.

      - For every case, `telemetry` has non-empty `decision_traces`, `agents` (with
      `review_summary`/`log_tail`), and `audit_tail` arrays — assert each is realistic (length ≥1,
      required fields populated).

      - For every case, `rubric.expected_themes` is a non-empty array of theme strings (NOT exact
      lesson text) and `rubric.over_extraction_traps` has length ≥1.

      - CRITICAL edge — thin-case non-emptiness: the `thin` case's telemetry must NOT be all-empty
      across the three sources, because `LessonExtractor.extract()` short-circuits to `[]` when all
      are empty and over-extraction would never be exercised. Add an explicit test asserting the
      thin case carries at least a little telemetry in at least one source.

      - Synthetic-only: assert no field contains real-epic/anonymized markers; the test itself makes
      zero model calls.


      Verification bar: the YAML loads, both required profiles exist with realistic
      decision-trace/agent/audit telemetry, each case carries themes + ≥1 trap, and the thin case is
      non-empty enough to tempt manufactured lessons. Coordinate the field names early with
      story-041-002's `LessonExtractorCaseSchema` so this fixture validates without rework.
  - id: story-041-002
    title: Case loader for rubric cases
    description: >-
      Implement a case loader that reads the fixture case set and its rubric expectations into the
      existing gate-eval framework's case structure, reusing the framework (no bespoke loading).
      Include deterministic mocked-LLM unit tests.
    acceptance_criteria:
      - >-
        Loader reads every fixture case and its rubric expectations into the framework's standard
        case structure via direct imports.
      - >-
        Rubric expectations (expected themes + over-extraction traps) are carried through onto each
        loaded case.
      - Deterministic unit tests cover the loader with no real model calls.
      - Tests pass.
    estimated_complexity: small
    dependencies:
      - story-041-001
    tech_notes: >-
      Implement `loadLessonExtractorCases(fixturePath?)` and the zod `LessonExtractorCaseSchema` in
      `src/eval/lesson-extractor/{loadCases.ts,caseSchema.ts}`, mirroring the
      brief-quality/skill-judge loaders via direct imports from `../framework`; parse the YAML,
      validate with zod (fail-fast on bad fixtures), and carry `rubric.expected_themes` +
      `over_extraction_traps` through onto each loaded `LessonExtractorCase`. Type the case against
      the framework's `GateEvalCase` rather than inventing a parallel shape, and back it with
      deterministic unit tests that read a small fixture and assert rubric pass-through — no real
      LLM. The one trade-off: the telemetry sub-schema must track the production `EpicTelemetry`
      shape (ADR-003), so a production change to that shape will break this loader's validation,
      which is intended.
    test_plan: >-
      Level: unit, deterministic — loader is pure file-read + zod parse; it makes no LLM call, so no
      MockLLMClient needed, but assert no real model call regardless.


      Key cases (checklist) against `loadLessonExtractorCases(fixturePath?)` /
      `LessonExtractorCaseSchema` in `src/eval/lesson-extractor/{loadCases,caseSchema}.ts`:

      - Happy path: pointed at a small inline test fixture, returns a `LessonExtractorCase[]` whose
      length equals the fixture case count, typed against the framework's `GateEvalCase` (id/source
      carried through), via direct imports from `../framework`.

      - Rubric pass-through: `rubric.expected_themes` and `rubric.over_extraction_traps` survive
      onto each loaded case unchanged (assert exact values, not just presence).

      - Default vs explicit path: omitting `fixturePath` resolves the production case set; an
      explicit path is honored.

      - Fail-fast on bad fixtures (zod throws, not silently coerces): missing required field;
      `expected_themes` containing an empty string (min(1)); `over_extraction_traps` empty (min(1));
      `source` outside `'rich'|'thin'`; telemetry sub-shape violating the `EpicTelemetry` mirror
      (e.g. wrong type on `decision_traces`).


      Verification bar: every fixture case loads into the framework case structure with rubric
      expectations intact and correctly typed, and structurally invalid fixtures are rejected at
      load time — all with no real LLM and passing tests.
  - id: story-041-003
    title: Runner driving the production extractor with env-configurable models
    description: >-
      Implement a runner that drives the production lesson extractor over the loaded case set with
      no reimplementation of extraction. Make the gate-under-eval model and the judge model
      environment-configurable with safe defaults.
    acceptance_criteria:
      - >-
        Runner invokes the production lesson extractor (imported, not reimplemented) over each
        loaded case.
      - >-
        Gate-under-eval model and judge model are each selectable via environment variables with
        safe defaults.
      - Production extractor behavior is unchanged (observe-only).
      - Targeted tests for the runner pass without real model calls.
    estimated_complexity: medium
    dependencies:
      - story-041-002
    tech_notes: >-
      Implement `runLessonExtractorGate(c, deps, opts)` in `src/eval/lesson-extractor/runGate.ts`
      returning `GateOutcome<Lesson[]>`: construct the production `new LessonExtractor({ llm:
      deps.llm, model: deps.gateModel, skillMdPath: resolveLessonExtractorSkillMd(opts.projectRoot)
      })`, call `.extract(c.telemetry)`, return `{status:'ok', output}` or `{status:'failed',
      detail}` on throw — never reimplement extraction (ADR-002). Resolve models via
      `resolveEvalModels`/per-script defaults with `DEFAULT_GATE_MODEL =
      'claude-haiku-4-5-20251001'` (production `skill_gen` model) and
      `LOOM_EVAL_GATE_MODEL`/`LOOM_EVAL_JUDGE_MODEL` overrides (ADR-005). Test with `MockLLMClient`
      only. Trade-off: importing the production class binds this file to its constructor
      (`LessonExtractorOptions`), so a production refactor can break the eval build — that coupling
      is the point.
    test_plan: >-
      Level: unit/seam test with `MockLLMClient` — drives the REAL `LessonExtractor` class but
      scripts the LLM so no real model call is made.


      Key cases (checklist) against `runLessonExtractorGate(c, deps, opts)` in
      `src/eval/lesson-extractor/runGate.ts`:

      - Happy path: with `MockLLMClient` scripted to return a valid lesson payload, returns `{
      status: 'ok', output }` where `output` is the production `Lesson[]` (handler-stamped fields
      present).

      - Drives production, not a copy: assert it constructs `new LessonExtractor({ llm, model,
      skillMdPath })` and calls `.extract(c.telemetry)` — verify the mock client receives the
      production SKILL.md prompt (resolved via `resolveLessonExtractorSkillMd(opts.projectRoot)`),
      proving the real class is exercised (ADR-002).

      - Telemetry passed through unchanged: the `EpicTelemetry` handed to `.extract()` equals
      `c.telemetry` (observe-only; no mutation).

      - Failure path: when the extractor throws (e.g. mock returns unparseable output past its own
      repair retry), returns `{ status: 'failed', detail }` — never throws out of the gate.

      - Model resolution precedence (FR-7): `opts.gateModel` > `LOOM_EVAL_GATE_MODEL` env >
      `DEFAULT_GATE_MODEL` ('claude-haiku-4-5-20251001'); same precedence for the judge model. Test
      each rung, including the default-when-unset case (manipulate env in-test and restore it).


      Verification bar: the gate invokes the imported production extractor (not a reimplementation),
      returns ok/failed correctly, resolves both model knobs with the documented precedence and safe
      defaults, leaves production behavior untouched, and never makes a real model call.
  - id: story-041-004
    title: Rubric-based LLM-as-judge
    description: >-
      Implement the rubric-based LLM-as-judge step on the framework's judge interface. It scores
      extracted lessons against each case's rubric expectations on at least faithfulness,
      usefulness, and coverage, and flags hallucinated lessons and over-extraction. Include
      deterministic mocked-LLM tests for the judge wiring.
    acceptance_criteria:
      - >-
        Judge scores extracted lessons against rubric expectations on faithfulness, usefulness, and
        coverage.
      - Judge flags hallucinated lessons and over-extraction.
      - Judge is wired via the existing framework's LLM-as-judge step, not a reimplementation.
      - Deterministic mocked-LLM tests cover the judge wiring with no real model calls and pass.
    estimated_complexity: medium
    dependencies:
      - story-041-002
    tech_notes: >-
      Implement `judgeLessonExtraction(c, output, deps)` in `src/eval/lesson-extractor/judge.ts` on
      the framework's judge interface, returning `JudgeOutcome<LessonExtractorJudgment>` (define
      `LessonExtractorJudgment` in `judgeTypes.ts`): prompt the judge to score the extracted
      `Lesson[]` against `c.rubric.expected_themes` + `over_extraction_traps`, emitting
      `faithfulness`/`usefulness` (0..1), `coverage` ('full'|'partial'|'missing'),
      `hallucinated_lessons`, and `over_extraction` plus a `reason`. Use the framework's
      LLM-as-judge wiring (not a reimplementation) and return `{status:'inconclusive'}` on judge
      failure. The one trade-off: this is rubric-theme judging, not label-matching (ADR-004), so
      verdicts are non-deterministic on real models — buy CI determinism with scripted
      `MockLLMClient` responses.
    test_plan: >-
      Level: unit, deterministic — `MockLLMClient` scripts the judge's responses; no real model
      call.


      Key cases (checklist) against `judgeLessonExtraction(c, output, deps)` in
      `src/eval/lesson-extractor/judge.ts` (judgment shape in `judgeTypes.ts`):

      - Happy path: with a mocked judge JSON response, returns `{ status: 'ok', judgment }` where
      `faithfulness` and `usefulness` ∈ [0,1], `coverage` ∈ {'full','partial','missing'},
      `hallucinated_lessons` and `total_lessons` are integers, `over_extraction` is boolean, and
      `reason` is non-empty.

      - Rubric is actually used: assert the prompt sent to the mock includes
      `c.rubric.expected_themes` AND `c.rubric.over_extraction_traps` AND the extracted `Lesson[]`
      under judgment.

      - Both flags exercised: a mocked response with `hallucinated_lessons > 0` is parsed through; a
      response with `over_extraction: true` (the thin/trap scenario) is parsed through.

      - Invariant: `hallucinated_lessons ≤ total_lessons` — assert the schema/parse rejects or
      clamps a response violating it (whichever the implementation chooses; pick one and test it).

      - Fail-closed: malformed judge JSON, an out-of-enum `coverage`, or an LLM throw → `{ status:
      'inconclusive' }` (never a fabricated 'ok').

      - Wired through the framework's LLM-as-judge step, not a bespoke reimplementation — assert the
      judge call goes through that seam.


      Verification bar: the judge scores extracted lessons against the case rubric on faithfulness,
      usefulness, and coverage, flags hallucinated lessons and over-extraction, fails to
      `inconclusive` on bad/absent output, and passes deterministically under the mock with no real
      model call.
  - id: story-041-005
    title: Scorer with fail-closed thresholded decision
    description: >-
      Implement a scorer that aggregates the judge's per-case scores into faithfulness, usefulness,
      and coverage metrics plus a hallucination rate, and emits a fail-closed pass/fail decision
      against per-metric thresholds calibrated against the brief-quality / skill-judge reference
      consumers. Include deterministic mocked-LLM tests.
    acceptance_criteria:
      - >-
        Scorer aggregates per-case judge scores into faithfulness, usefulness, and coverage metrics
        plus a hallucination rate.
      - >-
        Scorer emits a single pass/fail decision against per-metric thresholds and defaults to fail
        when any metric is below bar.
      - A deliberately degraded output yields fail and a known-good output yields pass in tests.
      - Deterministic unit tests cover the scorer with no real model calls and pass.
    estimated_complexity: medium
    dependencies:
      - story-041-004
    tech_notes: >-
      Implement `scoreLessonExtractor(records)`, `lessonExtractorVerdict(m)`, and
      `LESSON_EXTRACTOR_THRESHOLDS` in `src/eval/lesson-extractor/score.ts`, plus
      `LessonExtractorMetrics extends CoreMetrics` in `judgeTypes.ts`: aggregate per-case judgments
      into mean `faithfulness`/`usefulness`/`coverage` (map full=1/partial=0.5/missing=0) and
      `hallucinationRate = Σ hallucinated / Σ total`, `overExtractionRate`, then fail-closed via
      per-metric bars (faithfulness≥0.80, usefulness≥0.70, coverage≥0.70, hallucinationRate≤0.10 —
      ADR-007) and structural `minScoredCases: 2` (NOT the reference 5 — ADR-006) fed to the
      framework `decide()`. Test that a deliberately degraded record set yields
      `do-not-proceed`/`fail` and a known-good set yields `proceed`, with no real LLM. Trade-off: a
      2-case floor means each case heavily sways the verdict, so keep the floor a named constant
      that grows with the fixture set.
    test_plan: >-
      Level: unit, pure functions, fully deterministic — operates on hand-built `RunRecord[]`; NO
      LLM involved at all.


      Key cases (checklist) against `scoreLessonExtractor(records)`, `lessonExtractorVerdict(m)`,
      `LESSON_EXTRACTOR_THRESHOLDS` in `src/eval/lesson-extractor/score.ts`
      (`LessonExtractorMetrics` in `judgeTypes.ts`):

      - Aggregation math (assert exact numbers from known inputs): mean `faithfulness`, mean
      `usefulness`; `coverage` mapped full=1/partial=0.5/missing=0 then averaged; `hallucinationRate
      = Σ hallucinated_lessons / Σ total_lessons`; `overExtractionRate = fraction of scored cases
      with over_extraction === true`.

      - Divide-by-zero guard: `Σ total_lessons === 0` yields a defined `hallucinationRate` (0, not
      NaN).

      - Per-metric threshold bars, each tested in isolation (others held passing): `faithfulness <
      0.80`, `usefulness < 0.70`, `coverage < 0.70`, `hallucinationRate > 0.10` each →
      `do-not-proceed`; all clear → `proceed`.

      - Boundary values (the bug that hides in `<` vs `≤`): faithfulness exactly 0.80 → proceed;
      usefulness/coverage exactly 0.70 → proceed; hallucinationRate exactly 0.10 → proceed.

      - AC-mandated pair: a deliberately degraded record set → fail (`do-not-proceed`); a known-good
      set → pass (`proceed`).

      - Fail-closed structural via framework `decide()`: with scored cases < `minScoredCases` (2 —
      ADR-006, NOT 5), or gate-failure / judge-inconclusive rate over threshold, the decision is
      `inconclusive` — never `proceed` by omission; a missing metric also defaults to non-proceed.


      Verification bar: aggregation is numerically exact, every quality bar and its boundary is
      enforced, degraded→fail / good→pass both demonstrated, and the decision is fail-closed when
      cases are insufficient or a metric is missing — all deterministic, no real model call.
  - id: story-041-006
    title: Sub-barrel wiring, runner script, and eval docs
    description: >-
      Wire the consumer's own sub-barrel with a single public entry via direct imports, add at most
      one re-export line to the top barrel (matching brief-quality / skill-judge structure), add a
      runner script consistent with existing eval scripts, and update the eval docs describing how
      the operator runs the harness. Confirm the full build, test suite, and capabilities drift
      check pass.
    acceptance_criteria:
      - Consumer exposes a single public entry through its own sub-barrel wired via direct imports.
      - >-
        Top barrel gains at most one re-export line, matching the current brief-quality /
        skill-judge pattern.
      - >-
        A runner script consistent with existing eval scripts runs the harness and produces all four
        aggregate metrics plus the fail-closed verdict in one invocation.
      - Eval docs are updated to describe how the operator runs the harness.
      - >-
        No guardrail is weakened; the capabilities drift check passes; the full build and test suite
        pass.
    estimated_complexity: small
    dependencies:
      - story-041-003
      - story-041-004
      - story-041-005
    tech_notes: >-
      Wire `src/eval/lesson-extractor/index.ts` as the sub-barrel (`export *` of
      caseSchema/loadCases/judgeTypes/runGate/judge/score/consumer + `EvalReport`/`MainOptions` from
      run.ts), implement `createLessonExtractorConsumer(opts)` in `consumer.ts` composing stories
      002–005, and add the operator entrypoint `main(opts?)` in `run.ts` driving the framework
      `runGateEval` → `decide` → `EvalReport`, written to
      `.loom/eval/lesson-extractor-report.{md,json}`. Add `scripts/eval-lesson-extractor.mjs`
      importing `dist/eval/lesson-extractor/run.js` and a root `package.json`
      `eval:lesson-extractor` script, then write `docs/runbooks/lesson-extractor-eval.md` and update
      `docs/architecture/gate-eval-framework.md` + `docs/capabilities.md`; confirm full build, test
      suite, and capabilities drift check pass. The one trade-off: add ZERO new lines to the top
      barrel `src/eval/index.ts` (ADR-001) — reach the consumer by direct deep import like
      brief-quality/skill-judge to avoid the wildcard-collision failure (dogfooding S41), even
      though FR-9 permits one re-export line.
    test_plan: >-
      Level: integration (whole-consumer run via `main()` under `MockLLMClient`) plus
      structural/build gates. End-to-end here means the framework pipeline wired with a mock LLM,
      not a real model.


      Key cases (checklist):

      - End-to-end one-invocation (Goal 1): `main({ llm: MockLLMClient, fixturePath, projectRoot })`
      over the fixture set returns an `EvalReport` carrying ALL FOUR aggregate metrics
      (faithfulness, usefulness, coverage, hallucinationRate) plus `decision`, `perCase`, and
      `markdown` — in a single call.

      - Composition: `createLessonExtractorConsumer(opts)` wires loadCases→runGate→judge→score and
      `runGateEval`→`decide` drives them; assert the perCase records flow through to the verdict.

      - Report side-effect: the run writes `.loom/eval/lesson-extractor-report.{md,json}` (assert
      both files exist with the metrics + verdict).

      - Sub-barrel surface: `src/eval/lesson-extractor/index.ts` re-exports
      caseSchema/loadCases/judgeTypes/runGate/judge/score/consumer + `EvalReport`/`MainOptions` —
      single public entry reachable by direct import.

      - Top-barrel constraint (ADR-001 / dogfooding S41): assert `src/eval/index.ts` gains ZERO new
      lines for this consumer (AC permits ≤1; architecture mandates 0) — a grep/structural test that
      no `lesson-extractor` wildcard re-export was added at the root, so no name can collide.

      - Runner script: `scripts/eval-lesson-extractor.mjs` imports
      `dist/eval/lesson-extractor/run.js` and a root `package.json` `eval:lesson-extractor` script
      exists; running it produces the four metrics + fail-closed verdict in one invocation.

      - Repo gates (must be green, run as part of this story's verification): `npm run build`, the
      full `npm run test` suite, and the capabilities drift check — and
      `docs/runbooks/lesson-extractor-eval.md` + `docs/architecture/gate-eval-framework.md` +
      `docs/capabilities.md` are updated.

      - Guardrail integrity: confirm no production file under `src/findings/**` was modified and no
      policy/worktree/audit guardrail weakened.


      Verification bar: a single operator invocation yields all four aggregate metrics plus the
      fail-closed verdict and a written report; the consumer is reachable through its own sub-barrel
      with zero new top-barrel lines and no collision; and build, full test suite, and capabilities
      drift check all pass with docs updated and production behavior unchanged.
