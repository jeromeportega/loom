stories:
  - id: story-044-001
    title: Decouple decision scoring from skill-quality judging
    description: >-
      In the skill-generator eval consumer, score the generate-versus-NONE decision for every case
      by comparing the generator's actual decision to the case's expected decision, independent of
      whether a skill body exists. Count correct NONE decisions as scored, fix the
      actual-versus-expected comparison polarity, and drive the gate verdict and its scored-case
      denominator from the corrected figures.
    acceptance_criteria:
      - >-
        Decision correctness is computed for every case, including cases where the generator
        returned NONE (FR-1, FR-4).
      - >-
        A correct NONE on a trivial case is included in the scored-case count and scores as a
        correct decision (FR-2).
      - >-
        Decision scoring reads each case's expected decision and compares it to the actual decision
        with correct polarity, so both a correct generate and a correct NONE register as correct
        (FR-3).
      - >-
        Skill quality and faithfulness judging still runs, but only on cases that produced a skill;
        a NONE result is excluded from quality judging only, not from decision scoring (FR-5).
      - >-
        The proceed / do-not-proceed gate verdict is driven by the corrected decision-correctness
        figures, with the scored-case denominator evaluating against all scored cases (FR-6).
      - >-
        The change is isolated to the skill-generator eval path; the skill generator's production
        behavior and any other eval consumer are unchanged.
      - No guardrail is relaxed as a side effect (NFR-2).
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      This is the core fix, all under `packages/loom-core/src/eval/skill-generator/`. In
      `runGate.ts`, change the `status:'ok'` return so `output` also carries `_eval: {
      expectedDecision: c.rubric.expected_decision, source: c.source }` (FIX 1, ADR-001) — keep the
      existing first-call-wins decision-derivation logic untouched. Introduce a dedicated `type
      SkillGeneratorGateOutput = SkillGeneratorDecision & { _eval: SkillGeneratorDecisionMeta }` and
      thread it through `runGate.ts` → `consumer.ts` → `score.ts` so the compiler forces the
      attachment (ADR-002), replacing the old optional `(output as ... & { _eval? })` cast; in
      `score.ts`, leave the `actual === expected` comparison alone but score every
      `gate.status==='ok'` case (NONE included) and override `scoredCases = okGate.length` after
      spreading `coreMetrics(records)` (FIX 2, ADR-003). The one trade-off to know: `scoredCases`
      now means 'decision-scored cases' here while it stays judge-coupled in the other five
      framework consumers — document that divergence at the override site and do NOT edit
      `framework/coreMetrics.ts`.
    test_plan: >-
      LEVEL: Unit (`node:test`), exercising the `runGate.ts` producer → `score.ts` consumer seam
      end-to-end (ADR-004), not the scorer in isolation. Use the existing `makeMockLLM(responses[])`
      stub from `runGate.test.ts`; NO live judge calls (NFR-1). All tests live under
      `skill-generator/__tests__/`.


      KEY CASES (each maps to an acceptance criterion):

      - `runSkillGeneratorGate` attaches metadata: for both a generate case and a NONE case, assert
      the `status:'ok'` outcome carries `output._eval = { expectedDecision:
      c.rubric.expected_decision, source: c.source }` copied verbatim from the fixture (FR-1
      producer half, FIX 1 / ADR-001). This is the seam the old tests never checked.

      - Compile-time contract: `SkillGeneratorGateOutput = SkillGeneratorDecision & { _eval:
      SkillGeneratorDecisionMeta }` is threaded `runGate.ts → consumer.ts → score.ts`; the old
      optional `(output as ... & { _eval? })` cast is gone. Verify via `npm run build` — any
      `status:'ok'` path omitting `_eval` must fail to compile (ADR-002).

      - Decision scored for EVERY gate-ok case incl. NONE: feed runGate-faithful records into
      `scoreSkillGenerator`; a correct NONE (expected `none`, actual `none`) AND a correct generate
      (expected `generate`, actual `generate`) both register correct via the unchanged `actual ===
      expected` comparison (FR-1, FR-3, FR-4).

      - `scoredCases` override: assert `metrics.scoredCases === okGate.length`, including a NONE
      case whose `judge==='skipped'`, proving the override beats the judge-coupled `coreMetrics`
      default (FR-2, FR-6, ADR-003).

      - `expected_decision==='either'` excluded from `correctDenom`; fail-closed kept
      (`correctDenom===0 → decisionCorrectness=0`).

      - Quality/faithfulness means computed only over `judge==='ok'` generate cases; a NONE case
      contributes to decision scoring but never to `skillQuality`/`faithfulness` (FR-5).

      - Verdict wiring: with the corrected reference shape (8 gate-ok cases, all decisions correct),
      `decide`/`skillGeneratorVerdict` over the produced metrics returns `proceed` — no false
      do-not-proceed.

      - Isolation + guardrails: assert no edit to `framework/coreMetrics.ts` (or any framework
      file); `judge.ts` untrusted-input tagging and `runGate.ts` `:memory:` db + `mkdtemp`
      SkillStore are untouched (NFR-2, scope-isolation criterion).


      VERIFICATION BAR: For the reference 8-case shape, `scoredCases === totalCases (8)` and
      `decisionCorrectness === 1.0`, driving a `proceed` verdict; decision correctness is computed
      over all gate-ok cases (NONE included) with correct polarity; `_eval` is compiler-required so
      the build only passes when the producer attaches it; quality judging still runs but only on
      generate cases; the diff touches only `packages/loom-core/src/eval/skill-generator/` and
      relaxes no guardrail.
  - id: story-044-002
    title: Deterministic mocked-LLM tests for the four scoring behaviors
    description: >-
      Add deterministic, mocked-LLM unit tests that lock the corrected decision-scoring logic. Tests
      must use mocked judge/LLM responses with no live calls and cover all four required behaviors.
    acceptance_criteria:
      - >-
        A test proves a correct NONE on a trivial case scores as correct and is counted as scored
        (FR-7a).
      - A test proves a correct generate scores as correct (FR-7b).
      - >-
        A test proves an incorrect decision in either direction (NONE-when-expected-generate and
        generate-when-expected-NONE) scores as incorrect (FR-7c).
      - >-
        A test proves quality and faithfulness grading applies only to cases that produced a skill,
        never to NONE cases (FR-7d).
      - All tests use mocked LLM/judge responses with no live judge calls (NFR-1).
      - The full build and entire test suite pass.
    estimated_complexity: small
    dependencies:
      - story-044-001
    tech_notes: >-
      Add deterministic tests under `skill-generator/__tests__/` using `node:test` and the existing
      `makeMockLLM(responses[])` stub from `runGate.test.ts` — no live judge calls (NFR-1). Per
      ADR-004, feed real (or runGate-faithful) `runGate.ts` output into `scoreSkillGenerator` rather
      than hand-building `_eval` like the old `score.test.ts` `makeDecision()` helper did, and
      assert the four FR-7 behaviors: correct-NONE counts as scored AND correct (a),
      correct-generate correct (b), wrong-direction-either-way incorrect (c), and
      quality/faithfulness judging touches only generate cases (d). The trade-off: exercising the
      producer→scorer seam is heavier than a pure-scorer unit test, but the pure tests are exactly
      what masked the original bug — keep at least one end-to-end seam assertion.
    test_plan: >-
      LEVEL: Unit (`node:test`), deterministic, mocked-LLM. Per ADR-004, feed real or
      runGate-faithful `runSkillGeneratorGate` output into `scoreSkillGenerator` rather than
      hand-building `_eval` (that helper is what masked the original bug); keep at least one true
      producer→scorer seam assertion. Use `makeMockLLM(responses[])`; NO live judge calls. Place
      under `skill-generator/__tests__/`.


      KEY CASES — the four FR-7 behaviors as a tight checklist:

      - (a) Correct NONE on a trivial case (`source:'trivial'`, expected `none`, actual `none`):
      assert it is BOTH counted in `scoredCases` AND scored as a correct decision (FR-7a).

      - (b) Correct generate (expected `generate`, actual `generate`): scores correct, contributes
      to `decisionCorrectness` (FR-7b).

      - (c) Incorrect in BOTH directions — parametrize two records: NONE-when-expected-generate, and
      generate-when-expected-NONE; each must score as an incorrect decision and pull
      `decisionCorrectness` below 1.0 / raise `spuriousGenerationRate` for the spurious-generate
      case (FR-7c).

      - (d) Quality/faithfulness applied only to skill-producing cases: with one generate + one NONE
      record, assert the judge mock is consulted only for the generate case and
      `skillQuality`/`faithfulness` are computed from generate cases alone, never the NONE case
      (FR-7d, FR-5).

      - All judge/LLM responses are mocked; assert no network/live judge path is hit (NFR-1).


      VERIFICATION BAR: All four FR-7 behaviors have a named passing test, at least one exercises
      the runGate→score seam (not a hand-attached `_eval`), every test is deterministic with mocked
      responses, and `npm run build` plus the entire `npm test` suite pass green.
