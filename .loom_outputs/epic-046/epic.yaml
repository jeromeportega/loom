stories:
  - id: story-046-001
    title: Permit abstention in the non-agentic clustering prompt and lock it with a regression test
    description: >-
      Sharpen the opportunity engine's non-agentic clustering prompt so abstention is an explicit,
      legitimate outcome: permit zero clusters, raise the coherence/relatedness bar before grouping,
      and distinguish "weak because noise" from "weak because subtle-but-real" — without weakening
      clustering on genuinely related signals. Add one accompanying regression test asserting both
      behaviors. The change is confined to the single clustering-prompt site and its test; the
      agentic path and the opportunity-engine eval are untouched.
    acceptance_criteria:
      - >-
        The non-agentic clustering prompt explicitly permits returning zero clusters when no genuine
        relationship exists (FR-1).
      - >-
        The prompt requires a real coherence/relatedness threshold before grouping and does not
        force membership merely to avoid an empty result (FR-2).
      - >-
        The prompt distinguishes "weak because noise" from "weak because subtle-but-real" so valid
        weak-but-real clusters are not suppressed (FR-3).
      - >-
        Clustering output on genuinely related signal sets is unchanged from current behavior — no
        regression on coherent inputs (FR-4).
      - >-
        Only the non-agentic clustering path is modified; the agentic clustering path is untouched
        (FR-5).
      - >-
        A new regression test asserts a pure-noise signal fixture yields few-or-no clusters AND a
        related signal fixture yields correct clustering (FR-6).
      - >-
        The noise assertion tolerates LLM output variance (e.g. "zero or one low-coherence cluster"
        rather than strictly zero) so the test is not flaky (FR-7).
      - The opportunity-engine eval (fixtures, assertions, scoring) is not modified (FR-8).
      - >-
        The diff is confined to the clustering-prompt site and its test; no new modules or
        architectural change.
      - The full test suite passes.
    estimated_complexity: small
    dependencies: []
    tech_notes: >-
      Edit only the `CLUSTER_SYSTEM_PROMPT` string literal in
      `packages/loom-core/src/signals/OpportunityEngine.ts` (the single non-agentic clustering
      prompt, passed as `system: [{ text: CLUSTER_SYSTEM_PROMPT, cache: true }]`); sharpen the
      existing 'Return [] if no meaningful clusters exist' line so abstention is explicitly
      sanctioned, raise the coherence/relatedness bar before grouping, and name the 'weak because
      noise' vs 'weak because subtle-but-real' distinction so quiet-but-true clusters survive
      (FR-1/2/3). Do NOT add a coherence number, threshold, prompts module, or config knob — steer
      with prompt language only (ADR-001, ADR-002), and leave the `complete()` call topology,
      `nonAgentic.excludeDynamicSections`, `ClusterProposal`/`OpportunityRecord` shapes,
      `parseClusterProposals()`, and `scoreOf()`/`opportunityKey()` byte-for-byte unchanged. Add two
      cases to the existing `OpportunityEngine.test.ts` using its sequenced mock `LLMClient` (no
      live model): a noise fixture (mock returns `[]`, assert `result.length <= 1` per the ADR-003
      tolerance band) and a related fixture (mock returns a valid `ClusterProposal[]`, assert
      clusters surface with expected `member_keys` — no regression, FR-4). The one trade-off to
      know: prompt steering gives softer, non-deterministic guarantees than a numeric gate — the
      deterministic mock test plus the (read-only, FR-8/ADR-004) eval's `forced_clustering_rate` are
      what hold the behavior, so confirm during implementation that no downstream coherence
      threshold already exists before assuming none does, and do not touch
      `eval-cases/opportunity-engine.yaml` or anything under `src/eval/opportunity-engine/`.
    test_plan: >-
      LEVEL — Unit only, via `node:test` extending the existing
      `packages/loom-core/src/signals/__tests__/OpportunityEngine.test.ts` and its sequenced mock
      `LLMClient`. No live model (would flake — ADR-003/005), no integration or e2e: the change is
      one prompt constant plus deterministic engine-behavior assertions. Do NOT add or modify any
      eval case under `eval-cases/opportunity-engine.yaml` or `src/eval/opportunity-engine/` (FR-8)
      — the eval is read-only and is the standing detector, not a test you write here.


      KEY CASES (add to OpportunityEngine.test.ts):

      - [Happy/abstention] `generate(openSignals)` with a pure-noise fixture (unrelated signals:
      distinct sources/kinds/surfaces, no shared remediation or owner) where the mock
      `LLMClient.complete()` returns `[]` ⇒ assert `result.length <= 1` (ADR-003 tolerance band; do
      NOT assert `=== 0`, FR-7). Verifies abstention is handled end-to-end and produces zero
      `OpportunityRecord`s.

      - [Happy/related — no regression] `generate()` with a coherent fixture (signals sharing a real
      theme, e.g. mirror the `oe-separable-auth-perf` shape) where the mock returns a valid
      `ClusterProposal[]` with non-empty `signal_ids` ⇒ assert the cluster(s) surface as
      `OpportunityRecord`s with the expected `member_keys` (durable `Signal.key` values, not numeric
      ids — confirms id→key resolution per ADR-005 still holds), and that
      `score`/`rank`/`signal_count` are populated. This is the FR-4 guardrail against
      over-correction.

      - [Boundary — tolerance ceiling] noise fixture where the mock returns exactly ONE
      low-coherence `ClusterProposal` ⇒ assert `result.length <= 1` still passes (encodes that one
      weak cluster is tolerated, two+ is a regression).

      - [Topology unchanged] reuse the existing assertions that `complete()` is called exactly once
      (ADR-002), with `nonAgentic.excludeDynamicSections: true` and `system: [{ text:
      CLUSTER_SYSTEM_PROMPT, cache: true }]` — guard that the prompt edit did not disturb the call
      shape, repair path, or parse (`parseClusterProposals()` already accepts `[]` and fenced
      output, so no new parsing).


      MANUAL / DIFF-REVIEW BAR (not unit-testable, verify by inspection):

      - The ONLY production edit is the `CLUSTER_SYSTEM_PROMPT` string literal in
      `OpportunityEngine.ts`. Confirm the new text (a) explicitly sanctions returning `[]`/zero
      clusters (FR-1), (b) states a real coherence/relatedness bar and that membership must not be
      forced to avoid an empty result (FR-2), and (c) names the 'weak because noise' vs 'weak
      because subtle-but-real' distinction so quiet-but-true clusters survive (FR-3).

      - Confirm NO new file/module/prompts-template/config knob and NO numeric coherence field or
      threshold added (ADR-001/002); `ClusterProposal`/`OpportunityRecord` shapes,
      `scoreOf()`/`opportunityKey()`, and the agentic path (`scopeOpportunity.ts`) are byte-for-byte
      untouched (FR-5). Before assuming no downstream coherence gate exists, grep the signals module
      to confirm.


      VERIFICATION BAR — All ACs met when: the two new tests (noise→`length<=1`, related→correct
      `member_keys`) pass deterministically off the mock; the existing single-call/repair/id→key
      tests still pass; `git diff` is limited to the prompt constant and the test file with no eval
      changes; and `npm run test` across the workspace is green (FR-6, FR-7, and 'full suite
      passes').
