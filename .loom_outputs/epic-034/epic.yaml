stories:
  - id: story-034-001
    title: Build gate-agnostic eval framework core
    description: >-
      Extract the reusable structure of the intake eval into a gate-agnostic framework exposing five
      plug points: a case-set loader, a per-case gate runner, an LLM-as-judge step, an aggregating
      scorer, and a fail-closed thresholded decision. The core bakes in no consumer-specific case
      schema, gate invocation, or judge prompt.
    acceptance_criteria:
      - >-
        The framework exposes five plug points: case-set loader, per-case gate runner, LLM-as-judge
        step, aggregating scorer, and fail-closed thresholded decision.
      - >-
        The case schema, gate invocation, and judge prompt are supplied by consumers; none are baked
        into the core.
      - >-
        The decision step supports configurable thresholds: minimum scored cases, maximum
        gate-failure rate, and maximum judge-inconclusive rate.
      - >-
        Both the gate-under-eval model and the judge model are env-var selectable, each with a safe
        default.
      - Deterministic mocked-LLM unit tests cover the framework with no real model calls.
    estimated_complexity: large
    dependencies: []
    tech_notes: >-
      Create `packages/loom-core/src/eval/framework/` with four modules: `types.ts` (the
      `GateEvalConsumer<TCase,TOut,TJudg,TMetrics>` interface plus
      `GateOutcome`/`JudgeOutcome`/`RunRecord`/`CoreMetrics`/`EvalThresholds`/`Decision`),
      `runGateEval.ts` (the per-case loop — `runGate` then `judge` only if gate is `ok`, else
      `judge='skipped'`; enforce exactly ≤1 gate + ≤1 judge call per case), `decide.ts`
      (fail-closed: structural thresholds → `inconclusive` before consulting the consumer's
      `verdict`), and `models.ts` (`resolveEvalModels` reading
      `LOOM_EVAL_GATE_MODEL`/`LOOM_EVAL_JUDGE_MODEL` with defaults `modelFor(policy,'planning')` and
      `claude-opus-4-8`). Carry the case/output/judgment types through generics so the core never
      imports a consumer or branches on consumer identity, and reuse the existing `llm/LLMClient.ts`
      seam plus `llm/MockLLMClient.ts` for the deterministic `node:test` coverage. The trade-off to
      accept (ADR-001/ADR-004): heavier generic signatures and env-var reads pushed out to the entry
      layer, in exchange for a core that knows nothing about its consumers and stays fully
      injectable in tests.
    test_plan: >-
      LEVEL: Unit only (node:test + MockLLMClient). The core is pure orchestration over injected
      closures — no real seams, no integration needed. Reuse the existing eval/__tests__ patterns
      (inject MockLLMClient, then inspect `llm.requests`).


      KEY CASES (one file per core module):

      - runGateEval: assert EXACTLY ≤1 gate call + ≤1 judge call per case via mock request count —
      for 1 case and for N cases (AC1). On gate `ok` → judge IS called with the gate output; on gate
      `failed` → judge NOT called and the RunRecord carries `judge.status==='skipped'`. A gate that
      throws maps to `{status:'failed'}`; a judge that throws/parse-fails maps to
      `{status:'inconclusive'}` (never a fake pass).

      - coreMetrics: `scoredCases` counts only (gate ok AND judge ok); `gateFailureRate =
      gateFailures/totalCases`; `judgeInconclusiveRate = judgeInconclusive/(totalCases −
      gateFailures)`. Edge: empty records, and all-cases-failed (judge-rate denominator 0) must not
      divide-by-zero.

      - decide() fail-closed ordering (AC3): `scoredCases < minScoredCases` → inconclusive; else
      `gateFailureRate > maxGateFailureRate` → inconclusive; else `judgeInconclusiveRate >
      maxJudgeInconclusiveRate` → inconclusive; else delegate to the consumer `verdict(metrics)`.
      Boundary: a rate EQUAL to its max (not over) must pass through to verdict. Assert `reasons[]`
      names the tripped threshold.

      - models.ts resolveEvalModels (AC4): env unset → defaults (`modelFor(policy,'planning')` for
      gate, `claude-opus-4-8` for judge); `LOOM_EVAL_GATE_MODEL` / `LOOM_EVAL_JUDGE_MODEL` set →
      each overrides independently. Set/restore env inside the test; do not read env in the core
      loop.

      - Consumer-agnosticism (AC2): drive runGateEval/decide with a throwaway stub consumer to prove
      the core never imports a real consumer and never branches on consumer identity.


      VERIFICATION BAR: All five plug points exist with the exact contract signatures
      (loadCases/runGate/judge/score/verdict + thresholds;
      runGateEval/coreMetrics/decide/resolveEvalModels). decide() honors the three structural
      thresholds fail-closed in the stated order. The whole core file suite is green under node:test
      with MockLLMClient and ZERO real-client construction (NFR-2).
  - id: story-034-002
    title: Refactor intake classifier eval onto the framework
    description: >-
      Rebuild the existing intake classifier eval on top of the new framework, supplying its case
      schema, gate invocation, and judge prompt as plug points. Remove the welded shared logic
      rather than duplicating it, with no behavior change.
    acceptance_criteria:
      - >-
        The intake eval is rebuilt on the framework, providing case schema, gate invocation, and
        judge prompt as plug points.
      - >-
        Inputs, outputs, and thresholds are unchanged; the existing intake eval tests pass without
        modification.
      - >-
        Shared eval logic is removed from the intake module, not copied — it lives only in the
        framework.
      - The intake eval re-runs cleanly with verifiably unchanged behavior.
    estimated_complexity: medium
    dependencies:
      - story-034-001
    tech_notes: >-
      Re-seat the existing intake eval onto the framework by MOVING logic out of
      `runIntakeEval.ts`/`IntakeJudge.ts`/`scoreIntakeEval.ts` into an intake `GateEvalConsumer`
      (its `loadCases` keeps the current `IntakeEvalCaseSchema` + `intake-classification.yaml`,
      `runGate` calls `classifyIntake()`, `judge` uses `personas/intake-judge.md`), deleting the
      welded shared code rather than copying it (NFR-4). Critically, intake's existing combined
      `MAX_FAILURE_RATE = 0.25` (classifier OR judge) and its asymmetric dangerous-confusion rule
      must live in the intake consumer's `score`/`verdict`, NOT in the core's `decide()` — per
      ADR-002 this reproduces today's decision exactly. The one thing to watch (FR-5): the existing
      intake eval tests must pass unmodified, so map gate/judge failure semantics onto the new
      `GateOutcome`/`JudgeOutcome` shapes without shifting any threshold boundary.
    test_plan: >-
      LEVEL: Unit only — and the decisive test is that the PRE-EXISTING intake eval tests pass
      UNMODIFIED. This is a behavior-preserving refactor (FR-5), so the existing suite is the
      characterization harness; do not edit those test files.


      KEY CASES:

      - Regression guard (AC2/AC4): the existing `runIntakeEval.test.ts`, `IntakeJudge.test.ts`,
      `scoreIntakeEval.test.ts`, `loadIntakeEvalSet.test.ts` all stay green with no edits. If any
      needs editing, the refactor changed behavior — stop.

      - Plug-point wiring (AC1): the intake `GateEvalConsumer` supplies `loadCases` (keeps
      `IntakeEvalCaseSchema` + `eval-cases/intake-classification.yaml`), `runGate` (calls
      `classifyIntake()`), `judge` (uses `personas/intake-judge.md`). One case through the consumer
      reproduces the old single-case record shape.

      - Threshold parity (AC2): the combined `MAX_FAILURE_RATE = 0.25` (classifier OR
      judge-inconclusive) and `MIN_SCORED_CASES = 5` live in the intake consumer's
      `score`/`verdict`, NOT in core `decide()`. Test the exact boundary: failure rate == 0.25
      reproduces today's outcome; > 0.25 → inconclusive.

      - Dangerous-confusion rule (AC2): epic→story under-sizing on the size axis still flips the
      intake verdict to do-not-proceed / clearsBar=false — driven from the consumer's verdict,
      identical to pre-refactor.

      - Outcome mapping: classifier failure → GateOutcome `failed`; judge parse-fail/outage →
      JudgeOutcome `inconclusive` (never `agree`). Confirm no threshold boundary shifted under the
      new shapes.

      - No-duplication (AC3): the welded loop/judge/score logic is deleted from the old modules
      (moved into the framework + consumer), not copied.


      VERIFICATION BAR: Every pre-existing intake eval test passes byte-for-byte unmodified; for
      identical input records the intake decision (proceed/do-not-proceed/inconclusive) is identical
      pre- and post-refactor including the combined-rate and epic→story rules; core decide()
      contains none of intake's combined-rate or dangerous-confusion logic.
  - id: story-034-003
    title: Build labeled brief-quality case set
    description: >-
      Create a balanced labeled case set of representative rough briefs spanning clearly plan-ready,
      clearly not-ready/vague, and borderline. Each case carries expected readiness, an expected
      quality band (not an exact score), and the key critique themes a good reviewer should surface.
      Define and document the band boundaries and agreement-within-band tolerance.
    acceptance_criteria:
      - >-
        The case set spans clearly plan-ready, clearly not-ready/vague, and borderline briefs,
        balanced across the three categories.
      - Each case carries expected readiness, an expected quality band, and key critique themes.
      - >-
        Quality-band boundaries and the agreement-within-band tolerance are defined and documented
        for review before the operator run.
      - The set size satisfies the framework's minimum-scored-cases threshold.
      - The case set loads through the framework's case-set loader, with deterministic loader tests.
    estimated_complexity: medium
    dependencies:
      - story-034-001
    tech_notes: >-
      Author `packages/loom-core/eval-cases/brief-quality.yaml` and `eval/brief-quality/types.ts`
      with the `BriefQualityCaseSchema` (zod: `id`, `source`, `category`, `brief`, `expected_ready`,
      `expected_band`, `critique_themes`, `rationale`), balanced across
      `plan-ready`/`not-ready`/`borderline` and sized at or above the core's `minScoredCases`
      threshold. Put the band cuts (low 0–3 / mid 4–6 / high 7–10) and boundary tolerance τ=1 in
      `eval/brief-quality/bands.ts` as visible config constants, not magic numbers, and document
      them for operator review before the run (FR-11/ADR-003). Wire the fixture through the
      framework's `loadCases` plug with deterministic loader tests that assert zod validation fails
      loudly on malformed cases — the trade-off here is hand-maintained YAML that can drift,
      mitigated only by load-time validation.
    test_plan: >-
      LEVEL: Unit (schema + loader) plus a fixture-integrity test. No LLM involved — keep it fast
      and deterministic.


      KEY CASES:

      - Schema validation (AC2/AC5): `BriefQualityCaseSchema` accepts a well-formed case (id,
      source, category, brief, expected_ready, expected_band, critique_themes, rationale). Loader
      tests assert zod fails LOUDLY on each malformed shape: missing `expected_ready`,
      `expected_band` outside the {low,mid,high} enum, empty `critique_themes` (min 1), empty
      `brief`, bad `category`.

      - Fixture loads (AC5): `eval-cases/brief-quality.yaml` loads through the framework's
      `loadCases` plug and every case validates.

      - Balance & coverage (AC1): assert all three `category` values {plan-ready, not-ready,
      borderline} are present and counts are roughly balanced (no category empty or dominant).

      - Minimum size (AC4): assert case count ≥ core `minScoredCases` (≥5) — prefer headroom above 5
      since some cases may fail/inconclusive at run time.

      - Band/tolerance constants (AC3): `bands.ts` exports the cuts (low 0–3 / mid 4–6 / high 7–10)
      and τ=1 as NAMED constants, not magic numbers. A pin test fixes those values so a silent
      change breaks a test.

      - Label sanity: `expected_ready` is consistent with `category` (plan-ready ⇒ true, not-ready ⇒
      false); each `expected_band` is a valid enum member.


      VERIFICATION BAR: brief-quality.yaml loads and zod-validates cleanly; the loader rejects every
      malformed case with a loud error; the set is balanced across the three categories and ≥
      minScoredCases; band cuts and τ exist as documented config constants covered by a pin test and
      are written up for operator review before the run (FR-11).
  - id: story-034-004
    title: Build brief-quality judge, runner, and scorer
    description: >-
      Implement the brief-quality consumer on the framework: an LLM-as-judge that independently
      assesses plan-readiness and grades the scorer on readiness correctness, quality-within-band,
      and critique fidelity; plus a runner and scorer that evaluate BriefRefiner over the case set
      and end in a fail-closed decision. Observe-only — no production planning impact.
    acceptance_criteria:
      - >-
        The LLM-as-judge independently assesses plan-readiness, then grades on three axes: readiness
        correctness, quality score within band, and critique fidelity (real issues surfaced, no
        invented ones).
      - >-
        The runner evaluates BriefRefiner over the case set and the scorer reports readiness
        accuracy, quality-score agreement-within-band, and critique quality, ending in a fail-closed
        decision.
      - >-
        BriefRefiner's production behavior is verifiably unchanged; the eval is not wired into the
        planning path or the integration gate.
      - >-
        Deterministic mocked-LLM tests cover the scorer and judge wiring; no worker makes a real
        model call and the full eval is not run as a worker story.
    estimated_complexity: large
    dependencies:
      - story-034-001
      - story-034-003
    tech_notes: >-
      Implement the brief-quality consumer's `runGate` (invoke the unchanged `brief/BriefRefiner.ts`
      `.refine()`, mapping thrown errors to `{status:'failed'}`), `judge` (build the prompt from a
      new `personas/brief-quality-judge.md`, emit `BriefQualityJudgment` with
      `readiness_correct`/`quality_in_band`/`critique_fidelity`, mapping any failure to
      `inconclusive`), and `score` (call `coreMetrics(records)` then extend with
      `readinessAccuracy`/`qualityBandAgreement`/`critiqueQuality`), ending in `decide()` for a
      fail-closed `Decision`; expose it all through `eval/brief-quality/run.ts` `main()`. Treat
      `brief/BriefRefiner.ts` and its `BriefRefinement` return type as frozen — read it, never edit
      it, and add no new gate fields. Cover the scorer and judge wiring with `MockLLMClient`
      `node:test` cases only; the critical constraint (NFR-1/NFR-2): never construct a real client,
      never register this as a `loom` subcommand or worker, and never reference it from the
      integration gate.
    test_plan: >-
      LEVEL: Unit only (node:test + MockLLMClient). Seams: `runGate` wraps `BriefRefiner.refine()`;
      `judge` parses a mocked judgment; `score` aggregates. NEVER construct a real client; the full
      eval is operator-run, not a worker story (NFR-2).


      KEY CASES:

      - runGate (AC1/AC3): invokes `brief/BriefRefiner.refine(brief)` exactly once (assert via
      mock); a thrown error maps to `{status:'failed'}`; success returns `{status:'ok', output:
      BriefRefinement}`. Assert NO new fields are read/required on BriefRefinement — the gate type
      is frozen.

      - judge (AC1): builds the prompt from `personas/brief-quality-judge.md`; parses a
      MockLLMClient reply into `BriefQualityJudgment{readiness_correct, quality_in_band,
      critique_fidelity ∈ faithful|partial|fabricated, reason}`; a parse-fail/outage maps to
      `{status:'inconclusive'}` (never a fabricated pass).

      - quality_in_band math (τ=1): score s agrees with band [lo,hi] iff s ∈ [lo−1, hi+1]. Boundary
      cases: high band 7–10 → s=6 agrees, s=5 misses; low band 0–3 → s=4 agrees, s=5 misses; the
      6-vs-7 edge counts as agreement.

      - score (AC2): calls `coreMetrics(records)` then extends — `readinessAccuracy =
      readiness_correct/scoredCases`, `qualityBandAgreement = quality_in_band/scoredCases`,
      `critiqueQuality = (faithful + 0.5·partial)/scoredCases`. Drive with crafted records mixing
      faithful/partial/fabricated AND ok/failed/inconclusive; verify all three denominators use
      `scoredCases` (gate ok AND judge ok), excluding failed/skipped/inconclusive.

      - decide (AC2): fail-closed — too-few-scored / gate-failure-rate / judge-inconclusive-rate
      trip inconclusive before the brief-quality `verdict(metrics)` applies its quality bar
      (proceed/do-not-proceed).

      - main() in `eval/brief-quality/run.ts`: load → runGateEval → score → decide → EvalReport
      (with markdown), end-to-end under mocks; assert it constructs MockLLMClient only.

      - Observe-only (AC3): structurally confirm run.ts/eval is absent from the loom command table
      and any worker prompt (the deep import-boundary sweep is story-034-006).


      VERIFICATION BAR: the judge emits all three axes and degrades to inconclusive on failure; the
      scorer reports readinessAccuracy, qualityBandAgreement, and critiqueQuality over scoredCases
      and ends in a fail-closed Decision; BriefRefiner/.refine()/BriefRefinement are untouched (no
      new gate fields); every test injects MockLLMClient with zero real-client construction; run.ts
      is a plain main() not registered as a subcommand or worker.
