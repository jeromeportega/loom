stories:
  - id: story-011-001
    title: Build a shared structured renderer for policy validation errors
    description: >-
      Create a single render function that turns a policy validation error (the existing zod error)
      plus the policy file path into a structured, operator-readable message. This is the shared
      unit consumed by both the load path and the doctor.
    acceptance_criteria:
      - >-
        A render function accepts a policy validation error and the policy file path and returns a
        structured message.
      - >-
        The message names the policy file path, the offending field path, the value received, the
        allowed values or constraint, and a one-line fix hint.
      - >-
        When multiple knobs are invalid, the renderer reports all issues the validator surfaces
        cheaply; otherwise reporting the first error is acceptable (FR-9).
      - Unit tests cover at least one enum-violation case and one constraint-violation case.
      - No new validation logic is added — the message is a render of the existing validation error.
    estimated_complexity: small
    dependencies: []
    tech_notes: >-
      Create `packages/loom-core/src/guardrails/policyError.ts` exporting `describePolicyIssues(err:
      ZodError): PolicyIssue[]`, `formatPolicyError(policyPath, issues): string`, and the
      `PolicyValidationError extends Error` class (carrying `policyPath` + structured `issues`),
      then re-export all three from the core index. Map each entry by `issue.code` per ADR-3 —
      `invalid_enum_value` → render its `options`, `too_small`/`too_big` → render its bound —
      reading `path`, `received`, and allowed values straight off the existing `ZodError.issues[]`;
      add zero new validation. Trade-off to know: this couples the renderer to zod's issue-code
      shape, so a zod major that renames codes forces a render update — acceptable since zod is
      already load-bearing. Cover one `invalid_enum_value` and one `too_small`/`too_big` case with
      `node:test`.
    test_plan: >-
      Level: unit only — these are pure functions over an in-memory `ZodError`, no IO, no console.
      Build the input `ZodError` fixtures by calling `PolicySchema.parse` (or `safeParse`) on
      hand-crafted bad-value objects so the issue shapes are real, not faked.


      Key cases (`node:test`):

      - describePolicyIssues — enum violation: a bad `agents.review_strategy` (e.g. `"loud"`) yields
      one PolicyIssue with `fieldPath` = dotted path (`agents.review_strategy`), `received` = the
      bad value, `constraint` rendering the enum `options` (e.g. "one of: off, comment,
      block-and-revise"), and a non-empty one-line `hint`.

      - describePolicyIssues — bound violation: a `too_small`/`too_big` numeric knob renders the
      bound (e.g. "integer between 1 and 10"), again with fieldPath/received/hint.

      - formatPolicyError: returned string contains ALL five FR-1 elements — policy file path, field
      path, value received, allowed values/constraint, fix hint.

      - Multiple issues: a `ZodError` carrying ≥2 issues produces a PolicyIssue per issue and
      formatPolicyError lists all (FR-9 'report all when cheap'); a single-issue error renders one
      cleanly.

      - PolicyValidationError: instance carries `policyPath` + structured `issues`, and `.message`
      equals `formatPolicyError(policyPath, issues)`.

      - No-new-validation guard: the renderer is never handed a raw object to validate — it only
      consumes an existing `ZodError`; assert valid input is never the renderer's concern (renderer
      has no parse call).


      Verification bar: from a real `PolicySchema.parse` failure, both an enum case and a constraint
      case render a message exposing file path + field path + received + allowed/constraint + hint,
      and `PolicyValidationError` carries the structured `issues` alongside the rendered `.message`.
  - id: story-011-002
    title: Render the friendly error at the shared policy load path
    description: >-
      Catch the policy validation error at the single shared policy load/validate function and emit
      the structured message via the renderer, exiting cleanly. If loading is duplicated per
      command, perform the small refactor to route through one path.
    acceptance_criteria:
      - >-
        The shared policy load/validate path catches validation errors and emits the FR-1 structured
        message.
      - No raw Node stack trace is printed for a policy validation error.
      - The command exits non-zero cleanly on an invalid policy value.
      - The friendly message is verified across more than one command that loads policy.
      - >-
        The policy engine remains structurally enforcing; an invalid policy is not made easier to
        load.
    estimated_complexity: small
    dependencies:
      - story-011-001
    tech_notes: >-
      In `packages/loom-core/src/guardrails/PolicyEngine.ts`, keep `static load(loomdir)`'s
      signature unchanged but wrap the `PolicySchema.parse` call: catch the `ZodError`, convert it
      via `describePolicyIssues` + `formatPolicyError`, and throw a `PolicyValidationError` instead
      — never catch-and-default (a test must assert an invalid policy yields no usable engine, per
      the Security Model). Add the single boundary in `packages/loom-cli/src/index.ts`:
      `parseAsync().catch(handleTopLevelError)`, where `handleTopLevelError` prints `err.message` to
      stderr and `process.exit(1)` only for `instanceof PolicyValidationError`, and rethrows
      everything else with its stack intact (Philosophy #3 / ADR-1). The one trade-off: `index.ts`
      previously had no top-level catch — adding it is what makes all 12 policy loaders benefit from
      one change instead of editing each call site. Verify the friendly message via the `capture()`
      helper across at least two policy-loading commands.
    test_plan: >-
      Levels: unit/integration for `PolicyEngine.load` (drive it against a temp `.loom/policy.yaml`
      on disk); integration for the CLI boundary via the `capture()` helper (intercepts `console.*`
      + `process.exit`). Depends on story-011-001's renderer.


      Key cases:

      - `PolicyEngine.load(loomdir)` on an invalid enum value throws `PolicyValidationError` (assert
      `instanceof`), NOT a raw `ZodError`.

      - Security-Model guard: an invalid policy value never yields a usable engine — `load` throws
      rather than catching-and-defaulting; assert no `PolicyEngine` is returned (no silent fallback
      to default policy).

      - `load` with a valid policy returns an engine unchanged (no regression).

      - `handleTopLevelError(err)`: given a `PolicyValidationError`, writes `err.message` to stderr
      and calls `process.exit(1)`; captured stderr contains the FR-1 fields and NO stack trace (no
      "at " frames, no `node:internal`).

      - `handleTopLevelError` with any non-policy error rethrows with stack intact (Philosophy #3 /
      ADR-1) — assert a generic `Error` is not swallowed.

      - Cross-command proof (FR "more than one command"): run two distinct policy-loading commands
      (e.g. `guard` and `run`/`status`) against the same invalid policy via `capture()`; both print
      the identical friendly message and exit non-zero.


      Verification bar: an invalid policy value, exercised through ≥2 commands, prints the
      structured FR-1 message to stderr with a clean non-zero exit and zero stack frames; a valid
      policy is unaffected; and a test proves an invalid policy can never produce a usable
      `PolicyEngine`.
  - id: story-011-003
    title: Add a policy-aware check to the prerequisites doctor
    description: >-
      Have the prerequisites doctor validate .loom/policy.yaml and report an invalid knob as a
      failed check, sharing the FR-1 render path so detail does not drift from the load-path
      message.
    acceptance_criteria:
      - The doctor validates .loom/policy.yaml as part of its checks.
      - >-
        An invalid knob is reported as a failed check carrying the same field path and
        allowed-values detail, using the shared render path from story-011-001.
      - With a valid policy, the doctor's policy check passes.
      - The doctor exits non-zero when the policy check fails.
    estimated_complexity: small
    dependencies:
      - story-011-001
    tech_notes: >-
      In `packages/loom-cli/src/commands/doctor.ts`, wrap `PolicyEngine.load(loomDir)` in a
      `try/catch` and on `PolicyValidationError` push `{ name: 'policy', ok: false, required: true,
      detail: <condensed render of e.issues> }` onto the existing `Check[]`; build the detail from
      the same `PolicyIssue[]` (do not re-derive strings) so it cannot drift from the load-path
      message (FR-4/ADR-2). The catch must never rethrow — letting the error escape would
      reintroduce the crash this epic removes. A valid policy yields a passing check; because the
      check is `required: true`, an invalid one already drives doctor's existing non-zero exit, so
      no exit-code change is needed.
    test_plan: >-
      Level: integration — invoke `runDoctor()` against a temp `.loom` dir containing a valid or
      invalid `policy.yaml`, asserting on the returned `Check[]` and the exit code via `capture()`.
      Depends on story-011-001's shared render path.


      Key cases:

      - Doctor's `Check[]` now includes a check named `policy`.

      - Invalid knob → that check is `{ ok: false, required: true }` and its `detail` carries the
      same field path + allowed-values text, built from the shared `PolicyIssue[]` (assert the
      detail is derived from the renderer output, not a re-spelled string — guards FR-4/ADR-2
      no-drift).

      - Valid policy → the `policy` check is `ok: true` (FR-5).

      - No-crash guard: with an invalid policy, `runDoctor()` returns normally and
      `PolicyValidationError` does NOT escape (the try/catch never rethrows) — this is the
      regression the epic exists to prevent.

      - Exit code: because the policy check is `required: true`, an invalid policy drives doctor's
      existing non-zero exit (assert via `capture()`); a valid policy keeps doctor's success exit.


      Verification bar: doctor surfaces an invalid knob as a failed required check whose detail
      matches the load-path render, exits non-zero, never crashes, and passes the policy check when
      the policy is valid.
