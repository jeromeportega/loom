stories:
  - id: story-032-001
    title: Run-scoped, non-persisted auto-resume attempt counter
    description: >-
      Add a run-scoped, non-persisted counter that tracks automatic-resume attempts keyed
      per-story-within-run, used to bound auto-resume. The bound reads the existing automatic-resume
      attempt-cap policy knob; no new knob or persisted state is introduced.
    acceptance_criteria:
      - A counter tracks automatic-resume attempts per story within a single run.
      - The counter is not persisted and does not carry across runs — a new run starts fresh.
      - >-
        One story's attempt count does not affect another story's budget within the same run
        (per-story-within-run granularity).
      - >-
        The attempt bound is read from the existing automatic-resume attempt-cap policy knob; no new
        knob is added.
      - Unit tests cover increment, per-story isolation, and reset between runs.
    estimated_complexity: small
    dependencies: []
    tech_notes: >-
      Add a `private readonly autoResumeCounts = new Map<string, number>()` field plus
      `autoResumesSoFar(storyId)` (returns `?? 0`) and `recordAutoResume(storyId)` helpers to
      `orchestrator/Supervisor.ts`; key by story id so per-story budgets stay isolated. The bound is
      read from the existing `policy.agents.auto_resume_attempts` knob in `types.ts` (default 2) via
      `this.opts.autoResumeAttempts ?? 0` — do NOT add a new knob or persist the map. Run-scoping is
      structural: a `loom run` builds one `Supervisor`, so the Map dies with the instance; unit-test
      increment, per-story isolation, and that a fresh `Supervisor` starts at 0. Trade-off to know:
      per-story keying means aggregate run budget is `N × cap` (FR-5 open assumption — flag it,
      don't switch to a global key without confirmation).
    test_plan: >-
      Level: UNIT only — this is pure in-memory Map logic on the Supervisor instance; no DB, no I/O,
      so unit tests give full confidence cheaply.


      Key cases (checklist):

      - Default-absent: a freshly constructed Supervisor → `autoResumesSoFar('story-A')` returns 0
      (the `?? 0` path) before any record.

      - Increment & return: `recordAutoResume('story-A')` returns 1 on first call, 2 on second;
      `autoResumesSoFar` reflects the new value after each.

      - Per-story isolation: after `recordAutoResume('story-A')`, `autoResumesSoFar('story-B')` is
      still 0 — one story's count never moves another's (per-story-within-run granularity).

      - Run-scope reset: construct a second Supervisor for the same storyId →
      `autoResumesSoFar(storyId)` is 0. Assert there is NO shared static/module-level state backing
      the Map (run-scoping must be structural — the Map dies with the instance).

      - Cap source: the bound is read from `policy.agents.auto_resume_attempts` via
      `this.opts.autoResumeAttempts ?? 0` (default 2); assert no new knob field is introduced and
      that `undefined` resolves to 0 (disabled), not a fabricated default.

      - Non-persistence: assert no write to `audit_log`/`agents` occurs from counter operations.


      Verification bar: All five ACs proven by unit tests covering increment, per-story isolation,
      and fresh-Supervisor-starts-at-0. The cap must demonstrably come from the existing knob and
      the Map must never be persisted.
  - id: story-032-002
    title: Auto re-dispatch from checkpoint via existing manual-retry preparation path
    description: >-
      On a stall or hung-request kill with a checkpoint commit, automatically re-dispatch the story
      within the same run by re-entering the existing manual-retry preparation path with a non-clean
      (resume) disposition, feeding the existing handoff so the worker continues prior work. Bound
      by the attempt counter; leave the story failed on no-checkpoint or cap exhaustion.
    acceptance_criteria:
      - >-
        On a stall/hung-request kill with a checkpoint commit, the story is automatically
        re-dispatched within the same run with no manual re-run.
      - >-
        The re-dispatch reuses the existing handoff so the resumed worker's prompt includes prior
        context and continues rather than restarting.
      - >-
        Recovery flows through the existing manual-retry preparation path with a non-clean resume
        disposition; no parallel or duplicate recovery code path is introduced.
      - >-
        When no checkpoint commit exists, the story is left failed and is not resumed on
        uncommitted/dirty work.
      - When the attempt cap is reached, the story is left failed and is not re-dispatched again.
      - >-
        Both stall-kills and hung-request-kills feed this path and decrement the same attempt
        counter.
      - >-
        Each auto-resume re-dispatch is logged to audit_log; no guardrail is weakened (no push to
        protected branches, worktree isolation holds).
      - Tests cover resume-with-checkpoint, no-checkpoint→failed, and cap-exhausted→failed.
    estimated_complexity: large
    dependencies:
      - story-032-001
    tech_notes: >-
      All wiring lands in `Supervisor.applyResult()` (`orchestrator/Supervisor.ts`); do not create a
      second dispatch path (NFR-3). Write a pure, separately-tested `shouldAutoResume(result,
      attemptsSoFar, cap)` returning `(killReason === 'stall' || 'hung_request') &&
      checkpointCommitted === true && attemptsSoFar < cap`. On a pass, call the existing
      `StoryRetryService.prepare(storyId)` with its default non-clean disposition (`clean=false ⇒
      willResume=true`, keeps branch/worktree and feeds `.loom/handoff/<id>.md` via
      `buildWorkerPrompt({includeHandoff:true})`), then `recordAutoResume(storyId)` AFTER prep
      returns `ready`, set `task.status='pending'`, and `return` to re-enter `dispatchLoop`.
      Default-deny: no checkpoint, cap reached, or `prep.status !== 'ready'` leaves the story
      failed. The one trade-off: auto-resume is now coupled to manual-retry semantics — any future
      change to `prepare()` changes both paths, which is the deliberate cost of one shared path.
      Cover resume-with-checkpoint, no-checkpoint→failed, cap-exhausted→failed; re-dispatch must
      route through the unchanged `dispatch()` so worktree isolation and the policy engine still
      apply.
    test_plan: >-
      Level: UNIT for the pure predicate + INTEGRATION for the `Supervisor.applyResult()` wiring
      (stub `StoryRetryService`, `AuditLog`, and dispatch loop). Unit isolates the decision logic;
      integration proves the result lands on the single existing retry path and re-enters dispatch —
      no new spawn path.


      UNIT — `shouldAutoResume(result, attemptsSoFar, cap)` truth table:

      - `killReason==='stall'` + `checkpointCommitted===true` + `attemptsSoFar < cap` → true.

      - `killReason==='hung_request'` + checkpoint + under cap → true (FR-9 shared path).

      - `checkpointCommitted===false` (or undefined) → false for BOTH reasons (FR-6, never resume on
      dirty).

      - Boundary at cap: `attemptsSoFar === cap` → false; `attemptsSoFar === cap-1` → true (FR-4
      exact bound).

      - `cap===0` (knob disables) → false even with a checkpoint.

      - `killReason` is `'cap'`/undefined/other → false (only stall & hung_request resume).


      INTEGRATION — `applyResult()` wiring:

      - Resume-with-checkpoint: stall kill + `checkpointCommitted` + under cap →
      `retryService.prepare(storyId)` called exactly once with its default non-clean disposition
      (`clean=false ⇒ willResume=true`); on `prep.status==='ready' && prep.willResume`,
      `recordAutoResume` is called AFTER prep returns, `task.status` set to `'pending'`, and the
      method returns so `dispatchLoop` re-picks it. Assert the handoff path is honored (prepare
      keeps branch/worktree; resumed prompt built with `includeHandoff:true`), not a fresh start.

      - No-checkpoint→failed: `checkpointCommitted===false` → `prepare` NOT called, counter NOT
      incremented, task left failed.

      - Cap-exhausted→failed: `autoResumesSoFar` already at cap → `prepare` NOT called, left failed,
      not re-queued.

      - Prep rejects: `prep.status!=='ready'` or `!willResume` → counter NOT incremented (increment
      happens only after a ready prep), task left failed.

      - Shared budget: a hung_request kill and a stall kill for the same story both increment the
      same `autoResumeCounts[storyId]`.

      - Single path: assert re-dispatch sets `task.status='pending'` and re-enters the EXISTING
      `dispatch()`/`dispatchLoop` — no second dispatch method, no duplicate recovery branch (NFR-3).
      Worktree isolation and policy engine apply because the same dispatch path runs.


      Verification bar: All eight ACs. The predicate truth table is fully green; the three mandated
      scenarios (resume-with-checkpoint, no-checkpoint→failed, cap-exhausted→failed) pass at the
      integration level; recovery provably flows through `StoryRetryService.prepare(clean=false)`
      with no parallel path; each re-dispatch produces an audit row and increments the counter
      exactly once.
  - id: story-032-003
    title: Per-kill stall/hung-request audit diagnostics
    description: >-
      For every stall and hung-request kill, record richer audit detail: the failure mode
      (hung-request-with-no-response vs. fully-silent-subprocess), the last stream event seen before
      the kill, and the resume attempt number this kill corresponds to.
    acceptance_criteria:
      - >-
        Each stall and hung-request kill writes audit detail identifying the failure mode:
        hung-request-with-no-response vs. fully-silent-subprocess.
      - >-
        The last stream event before the kill is recorded; the fully-silent-subprocess case records
        a null/"none" sentinel instead of failing the audit write.
      - The resume attempt number for the kill is recorded, sourced from the run-scoped counter.
      - Hung-request detection logic, the stall window, and the absolute cap remain unchanged.
      - Tests cover both failure modes, including the no-stream-event sentinel path.
    estimated_complexity: medium
    dependencies:
      - story-032-001
      - story-032-002
    tech_notes: >-
      Create a small new module `orchestrator/StallKillAudit.ts` exporting the `STALL_KILL_ACTION =
      'worker_stall_kill'` constant, the `StallKillDetail` shape, and `recordStallKill(audit,
      {agentId, storyId, result, resumeAttempt})` which calls the existing `AuditLog.record()` with
      `command=storyId` (so `getByStory()` picks it up) and `detail=JSON.stringify(...)`. Derive
      `silence_kind` from frozen guard outputs — `'hung_request_no_response'` when
      `killReason==='hung_request'`, else `'fully_silent_subprocess'` when
      `lastStreamEvent==='(none)'`; never add a field to `WorkerTimeoutGuard` (NFR-2). Call
      `recordStallKill` audit-first in `applyResult` (before the resume decision) so a kill is
      recorded even when prep later rejects, and source `resume_attempt` from
      `autoResumesSoFar(storyId)`. Trade-off: the derivation depends on the guard's `'(none)'`
      sentinel — pin it in a shared constant and unit-test both failure modes including the
      no-stream-event path so a future sentinel change can't break the classifier silently.
    test_plan: >-
      Level: UNIT for `recordStallKill` and the `silence_kind` derivation (pure mapping from a
      `WorkerResult`); INTEGRATION against an in-memory/real better-sqlite3 `AuditLog` to confirm
      the row persists and is retrievable via `getByStory(storyId)`.


      Key cases (checklist):

      - Failure-mode derivation — hung: `killReason==='hung_request'` →
      `silence_kind==='hung_request_no_response'` regardless of `lastStreamEvent`.

      - Failure-mode derivation — silent: `killReason==='stall'` + `lastStreamEvent==='(none)'` →
      `silence_kind==='fully_silent_subprocess'`.

      - Stall with a real event: `killReason==='stall'` + a concrete `lastStreamEvent` label →
      `last_stream_event` records that label; `silence_kind` follows the derivation rule.

      - Sentinel path (FR-8): when no stream event exists, `last_stream_event` is the `'(none)'`
      sentinel and the audit write SUCCEEDS — assert `recordStallKill` does not throw on the silent
      case.

      - Resume attempt: `resume_attempt` equals the value passed from `autoResumesSoFar(storyId)` (0
      on the first kill); verify it is the counter reading, not a hardcoded value.

      - Row shape: `action === 'worker_stall_kill'` (the `STALL_KILL_ACTION` constant), `command ===
      storyId` (so `getByStory()` picks it up across retries), and `detail ===
      JSON.stringify(StallKillDetail)` carrying all FR-7 fields: `kill_reason`, `silence_kind`,
      `last_stream_event`, `resume_attempt`, `checkpoint_committed`.

      - Audit-first ordering (cross-check with story-032-002): `recordStallKill` fires before the
      resume decision so a kill is recorded even when prep later rejects.

      - Sentinel pinning (NFR-2): the `'(none)'` comparison uses a shared constant; tests exercise
      BOTH failure modes including the no-stream-event path so a future sentinel change can't
      silently break the classifier. Assert no field was added to `WorkerTimeoutGuard`.


      Verification bar: All five ACs. Both failure modes plus the no-stream-event sentinel path are
      covered; the persisted row is queryable by story id and its JSON `detail` carries failure
      mode, last stream event, and resume attempt number; the guard remains untouched.
