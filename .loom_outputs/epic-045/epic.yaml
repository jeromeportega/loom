stories:
  - id: story-045-001
    title: Add intake_routing policy knob (off/advisory/confirm), default off
    description: >-
      Add an opt-in policy knob `intake_routing` with levels `off` (default), `advisory`, and
      `confirm` to the policy schema and loader. At `off`, the classifier stays observe-only and the
      planning path is byte-identical to today.
    acceptance_criteria:
      - >-
        `intake_routing` is defined in the policy schema with allowed values `off`, `advisory`,
        `confirm` and defaults to `off` when unset.
      - Policy validation rejects any value outside the three allowed levels.
      - >-
        With the knob `off`, the classifier remains observe-only (verdict recorded but never
        influences planning) and the planning path output is byte-identical to today — proven by an
        automated test (NFR-1).
      - The classifier continues to classify the refined brief on the non-agentic path (NFR-4).
    estimated_complexity: small
    dependencies: []
    tech_notes: >-
      Add `intake_routing: z.enum(['off','advisory','confirm']).default('off')` to the `agents`
      object in `PolicySchema` (`packages/loom-core/src/types.ts`), beside `intake_timeout_ms`, and
      mirror it in `schemas/policy.schema.yaml` with the three-level description from the
      architecture. The `.default('off')` gives both 'rejects out-of-range' and 'defaults to off'
      for free — no custom validation. Prove byte-identical legacy behavior with an automated test
      that runs the off-path: the resolver returns `undefined`, `PlannerOptions.routing` stays
      absent, and the PM user message is unchanged; the trade-off to know is that NFR-1 demands an
      *output-equivalence* assertion, not just 'the knob exists'.
    test_plan: >-
      **Levels:** Unit for the schema knob (zod is the contract); one output-equivalence test for
      the off-path (this is the NFR-1 gate and the riskiest claim).


      **Key cases:**

      - [ ] `PolicySchema` parses a policy with `agents.intake_routing` *omitted* → resolves to
      `'off'` (default). (AC1)

      - [ ] Parses each valid level `off` / `advisory` / `confirm` successfully. (AC1)

      - [ ] Rejects an out-of-range value (e.g. `'auto'`, `''`, `true`) → zod parse throws /
      `safeParse` returns `success:false`. Do NOT write custom validation — assert the enum does it.
      (AC2)

      - [ ] `schemas/policy.schema.yaml` and `PolicySchema` agree on the three levels and default
      (parse the YAML enum or assert the loader accepts only those three).

      - [ ] **Off-path output-equivalence (NFR-1):** with the knob `off`,
      `resolveIntakeRouting(...)` returns `undefined`, `PlannerOptions.routing` is absent, and the
      assembled PM user message string is byte-identical to the no-routing baseline. Capture the
      baseline PM message with no routing and assert string equality — not merely 'the knob exists'.
      (AC3)

      - [ ] Classifier still runs and classifies the *refined* brief on the non-agentic path with
      knob `off` (verdict recorded via `EpicStore.recordIntakeVerdict`, `intake_classified` logged)
      — observe-only is unchanged. (AC4, NFR-4)


      **Verification bar:** zod tests prove default-to-off and reject-out-of-range with no
      hand-rolled validation; the output-equivalence test proves the PM prompt is
      character-for-character unchanged on the off-path and the verdict never reaches
      `PlannerOptions`.
  - id: story-045-002
    title: 'Advisory routing: inject effective verdict into planner as a sizing constraint'
    description: >-
      At `advisory`, feed the classifier's effective size and type into the existing planner as
      explicit prompt-text sizing constraint, and print the classification and rationale before
      planning begins without blocking. Routing reuses the existing planner — not a parallel
      pipeline.
    acceptance_criteria:
      - >-
        At `advisory`, the effective size and type are injected into the existing planner as
        explicit prompt text: `story` instructs a single cohesive story or minimal necessary
        decomposition; `epic` instructs full decomposition as today.
      - >-
        No separate or parallel planning pipeline is introduced — the existing planner is reused
        (FR-5).
      - >-
        The classification (type, size, confidence) and its rationale are printed before planning
        begins.
      - Advisory planning does not wait for operator input (non-blocking, NFR-2).
      - >-
        An outcome-level test confirms a `story` verdict yields a single-story result rather than an
        inflated multi-story epic.
    estimated_complexity: medium
    dependencies:
      - story-045-001
    tech_notes: >-
      Create `packages/loom-core/src/intake/routing.ts` exporting the `EffectiveRouting` interface
      and the pure `buildSizingConstraintBlock(routing)` builder (emit the single-cohesive-story
      instruction for `story`, the full-decomposition instruction for `epic`), then append its
      output in `core/planner/PMAgent.ts` only when `routing` is present — copy the existing
      `skillsBlock` conditional-injection pattern exactly so prompt caching and the single planner
      path are preserved (FR-5, no parallel pipeline). Also add the optional `routing?:
      EffectiveRouting` field to `PlannerOptions` in `core/planner/Planner.ts`, change
      `recordIntakeClassification` to RETURN its `IntakeClassificationResult`, and add
      `resolveIntakeRouting` (advisory branch: print classification + rationale to `out`,
      non-blocking, return `EffectiveRouting`) in `loom-cli/intake/`. The one trade-off: prompt-text
      guidance is probabilistic, so the AC requires an *outcome-level* test asserting a `story`
      verdict yields a single-story result — never infer correctness from the instruction merely
      being present (ADR-001).
    test_plan: >-
      **Levels:** Unit for the pure `buildSizingConstraintBlock` and for `PMAgent` conditional
      injection (cheap, deterministic); unit for `resolveIntakeRouting` advisory branch (inject a
      fake `out` stream); one outcome-level test with a deterministic mocked LLM for the
      `story`→single-story guarantee (the probabilistic AC — must be behavioral, per ADR-001).


      **Key cases:**

      - [ ] `buildSizingConstraintBlock({size:'story',...})` emits the single-cohesive-story /
      minimal-decomposition instruction text. (AC1)

      - [ ] `buildSizingConstraintBlock({size:'epic',...})` emits the full-decomposition instruction
      (today's behavior). (AC1)

      - [ ] `PMAgent` appends the block to its user message **only when `routing` is present**,
      mirroring the `skillsBlock` conditional; `routing` absent → no block (re-asserts the NFR-1
      seam from 045-001). (AC2, FR-5)

      - [ ] No parallel pipeline: the advisory path constructs and calls the *existing*
      `Planner`/`PMAgent` — assert routing flows through `new Planner({ routing })`, not a separate
      code path. (AC2)

      - [ ] `resolveIntakeRouting` advisory branch prints type, size, confidence, AND rationale to
      the injected `out` stream before returning. (AC3)

      - [ ] Advisory is **non-blocking**: the branch returns an `EffectiveRouting`
      (`source:'classifier'`) without ever reading stdin/readline — assert no stdin consumption
      (e.g. stub stdin to throw if read). (AC4, NFR-2)

      - [ ] `resolveIntakeRouting` returns `undefined` when classification failed (`ok:false`) →
      legacy path, never a partial route.

      - [ ] **Outcome-level (AC5):** with a deterministic mocked LLM/PM response, a `story` verdict
      routed through the planner yields a **single-story** breakdown (exactly one story), not a
      multi-story epic. Drive it through the real injection seam so the constraint block actually
      reaches the prompt; assert on the resulting story count, never on the instruction merely being
      present.


      **Verification bar:** builder unit tests green for both sizes; advisory prints the full
      classification surface and returns without blocking; the outcome test demonstrates a `story`
      verdict produces one story through the existing planner.
  - id: story-045-003
    title: 'Confirm mode: CLI checkpoint to accept or override type and size'
    description: >-
      At `confirm`, print the same classification surface, then prompt the operator to accept the
      classification or override type and/or size before planning proceeds; planning then routes on
      the confirmed-or-overridden verdict via the advisory routing path. Define and document
      non-interactive behavior.
    acceptance_criteria:
      - >-
        At `confirm`, the operator is prompted to accept the classification or override type and/or
        size before planning proceeds.
      - >-
        The routed verdict reflects any override — the final type/size replaces the routed verdict;
        confidence and rationale are not operator-editable.
      - >-
        Planning routes on the confirmed-or-overridden verdict using the same planner
        sizing-constraint path as advisory.
      - >-
        A defined non-interactive behavior is implemented when no interactive terminal is available
        (hard error or documented degrade to advisory), and the chosen behavior is documented.
      - >-
        The confirm prompt is a self-contained CLI checkpoint and only `confirm` mode blocks for
        input (NFR-2).
    estimated_complexity: medium
    dependencies:
      - story-045-002
    tech_notes: >-
      Add `confirmRouting(verdict)` in `loom-cli/intake/confirmRouting.ts` using `node:readline`
      (stdlib — do NOT add `inquirer`/`prompts`), mirroring the `readStdin()`/`process.stdin.isTTY`
      usage already in `cli/commands/guard.ts:113`; constrain overrides to the `type`/`size` enums
      (confidence and rationale are read-only) so only known tokens reach
      `buildSizingConstraintBlock`. Wire it into `resolveIntakeRouting`'s confirm branch, which then
      routes the confirmed-or-overridden verdict through the *same* `EffectiveRouting`→planner path
      as advisory (ADR-003). The key trade-off (ADR-004): when `process.stdin.isTTY` is false, do
      not hard-error — degrade to advisory with a loud warning so headless/CI planning never stalls
      (NFR-2); story-045-005 documents this degrade.
    test_plan: >-
      **Levels:** Unit for `confirmRouting` driving `node:readline` over an injected input stream
      (never a real TTY); unit/integration for `resolveIntakeRouting`'s confirm branch including the
      `isTTY:false` degrade.


      **Key cases:**

      - [ ] `confirmRouting(verdict)` — operator **accepts** → `{decision:'accepted', type, size}`
      equal to the classifier verdict. (AC1, AC2)

      - [ ] Override **type only** → `decision:'overridden'`, type changed, size unchanged. (AC2)

      - [ ] Override **size only** → `decision:'overridden'`, size changed, type unchanged. (AC2)

      - [ ] Override **both** type and size → `decision:'overridden'` with both new values. (AC2)

      - [ ] Override input constrained to the `type`/`size` enums: an out-of-enum entry is
      rejected/re-prompted so only one of the five known tokens can reach
      `buildSizingConstraintBlock` (boundary / injection guard). (AC2)

      - [ ] Confidence and rationale are NOT editable — no prompt path mutates them; the routed
      `confidence` is the classifier's. (AC2)

      - [ ] Confirm + `isTTY:true`: the confirmed-or-overridden verdict routes through the **same**
      `EffectiveRouting`→planner path as advisory (`source:'operator-override'` when overridden).
      Reuse 045-002's outcome assertion — don't re-prove single-story here, prove the override value
      is what reaches routing. (AC3)

      - [ ] **Non-interactive degrade (AC4):** confirm + `isTTY:false` → prints a loud warning, does
      NOT read stdin, routes as advisory on the classifier verdict
      (`mode:'confirm-degraded-advisory'`). Assert it never blocks.

      - [ ] Only `confirm` blocks: assert `off` and `advisory` branches never invoke readline/read
      stdin. (AC5, NFR-2)


      **Verification bar:** `confirmRouting` returns correct `decision`+values for accept and each
      override variant via injected readline input with no real terminal; the headless path degrades
      to advisory loudly and non-blockingly; the overridden verdict is the one handed to the
      planner.
  - id: story-045-004
    title: Record confirm-mode decision in the audit log with provenance
    description: >-
      Record the confirm-mode decision alongside the original verdict in the audit log,
      distinguishing accepted from overridden and capturing both the original verdict and the final
      routed values.
    acceptance_criteria:
      - >-
        The confirm-mode decision is recorded in the audit log distinguishing `accepted` from
        `overridden`.
      - >-
        The record captures both the original classifier verdict and the final routed type/size
        values.
      - Provenance is recorded for every confirm-mode run.
      - No existing guardrail is weakened by the new audit record (NFR-3).
    estimated_complexity: small
    dependencies:
      - story-045-003
    tech_notes: >-
      In the confirm branch of `resolveIntakeRouting`, record provenance via the existing
      `AuditLog.record({ action: 'intake_routed', command: epicId, detail: {...} })`
      (`core/state/AuditLog.ts:12`) — a NEW action, no schema/migration change. Put `decision`
      (`accepted`|`overridden`), `original` (classifier verdict), `routed` (final type/size),
      `confidence`, and `mode` (`confirm` or `confirm-degraded-advisory`) into the free-form JSON
      `detail` column; leave the observe-only `intake_classified` record untouched. The trade-off
      (ADR-005): provenance lives inside `detail` JSON so accepted-vs-overridden queries need JSON
      extraction rather than an indexed column — acceptable at audit-log volume, and the append-only
      write weakens no guardrail (NFR-3).
    test_plan: >-
      **Levels:** Integration against a real `better-sqlite3` (in-memory or temp DB) through
      `AuditLog.record` — the audit write to the `detail` JSON column is the contract under test;
      mocking the DB would prove nothing.


      **Key cases:**

      - [ ] **Accepted run:** after a confirm-accept, `audit_log` has an `intake_routed` row with
      `detail.decision==='accepted'`, `detail.original` == classifier verdict, `detail.routed` ==
      original (unchanged), `detail.confidence` present, `detail.mode==='confirm'`. (AC1, AC2)

      - [ ] **Overridden run:** `detail.decision==='overridden'`, `detail.original` == classifier
      verdict, `detail.routed` == the final overridden type/size. (AC1, AC2)

      - [ ] **Degraded-advisory run:** non-interactive confirm writes a row with
      `detail.mode==='confirm-degraded-advisory'` (ties to 045-003). (AC3)

      - [ ] Provenance written for **every** confirm-mode run — accepted, overridden, and degraded
      all produce exactly one `intake_routed` record. (AC3)

      - [ ] The observe-only `intake_classified` record is untouched and coexists — both actions
      present after a confirm run; the two actions cleanly separate 'what the classifier said' from
      'what was routed'.

      - [ ] **NFR-3:** no migration / no schema change — `detail` is the existing free-form JSON
      column; existing `AuditLog` / `PolicyEngine` / guard regression tests still pass (no guardrail
      weakened, write is append-only). (AC4)


      **Verification bar:** querying `audit_log` after accepted, overridden, and degraded confirm
      runs returns an `intake_routed` row whose `original` and `routed` correctly reflect each case,
      with `intake_classified` left intact and no existing audit/guard test broken.
