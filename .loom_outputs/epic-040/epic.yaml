stories:
  - id: story-040-001
    title: Inventory deep importers and freeze the intake surface
    description: >-
      Before relocating intake, inventory every deep importer of intake modules (e.g.
      dist/eval/<intakeModule>.js and src/eval/<intakeModule>) across the repo, and enumerate
      intake's current package-root public surface. This confirms the move cannot silently break a
      deep import and gives the frozen-surface check its baseline.
    acceptance_criteria:
      - >-
        A documented list of every file importing an intake module by deep path (not via the package
        root) is produced.
      - >-
        The inventory confirms whether any code outside src/index.ts and the two known runner
        scripts (scripts/eval-brief-quality.mjs, scripts/eval-skill-judge.mjs) deep-imports an
        intake module, flagging any that would break on relocation.
      - >-
        Intake's current public surface — the exact symbols re-exported from eval/index.ts into the
        package root — is enumerated as the byte-for-byte baseline for the frozen-surface check.
    estimated_complexity: small
    dependencies: []
    tech_notes: >-
      Read-only inventory story — produce two artifacts. (1) Deep-importer list: grep the whole repo
      for any reference to a flat intake module by path — both `dist/eval/<module>.js` and
      `src/eval/<module>` forms (e.g. `runIntakeEval`, `IntakeJudge`, `loadIntakeEvalSet`,
      `intakeConsumer`) — and confirm the only hits outside `src/eval/` are the two runner scripts
      (`scripts/eval-brief-quality.mjs`, `scripts/eval-skill-judge.mjs`, both of which deep-import
      `run.js`, not intake) plus the `scripts/build-intake-fixture.mjs` KEEP-IN-SYNC comment (a
      comment, not a live import). (2) Frozen-surface baseline: enumerate every symbol the package
      root re-exports through `eval/index.ts` (the intake group + framework named list around lines
      50–68), capturing it byte-for-byte against the checklist in Data Models §2 so story-040-002
      has an oracle. The one trade-off: this baseline must be captured BEFORE any edit — it is
      circular if taken after — so this story touches no source, only documents.
    test_plan: >-
      Level: a small reproducible verification script plus a captured snapshot — this story writes
      no source, so there are no unit tests; the deliverables ARE the test oracle for story-040-002.


      Key cases:

      - Reproducible deep-importer inventory (AC1): grep the whole repo for each flat intake module
      by path in BOTH `dist/eval/<module>.js` and `src/eval/<module>` forms (runIntakeEval,
      IntakeJudge, loadIntakeEvalSet, scoreIntakeEval, refineEvalCases, runRefinedIntakeEval,
      renderIntakeReport, recoverBriefText, intakeConsumer, intakeEvalTypes). The documented hit
      list must be exactly reproducible by re-running the same grep.

      - Completeness / no missed importer (AC2): assert the ONLY hits outside `src/eval/` are
      scripts/eval-brief-quality.mjs and scripts/eval-skill-judge.mjs (which deep-import `run.js`,
      NOT an intake module) plus the scripts/build-intake-fixture.mjs KEEP-IN-SYNC *comment*;
      explicitly classify that comment as a non-import so it is not flagged as a relocation breaker.

      - Frozen-surface baseline (AC3): enumerate byte-for-byte every symbol the package root
      re-exports through eval/index.ts — the intake group + the framework named list (~lines 50-68)
      — against the Data Models §2 checklist. Capture it as a machine-checkable snapshot (e.g. the
      sorted list of names importable from `@loom/loom-core`), not prose, so story-040-002 has a
      diffable oracle.

      - Boundary: confirm each baseline name actually resolves from the package root TODAY
      (build/import succeeds) — a baseline listing a symbol that isn't really exported is a poisoned
      oracle.


      Verification bar: the inventory reproduces exactly and proves no live deep importer exists
      outside the two runner scripts; the surface snapshot is captured BEFORE any source edit (it is
      circular if taken after) and every listed symbol verifiably imports from the package root
      today.
  - id: story-040-002
    title: Promote intake to its own consumer directory and thin the top barrel
    description: >-
      Move intake's case loader, judge, scorer, runner, and types into a new eval/intake/ directory
      wired by direct relative imports, expose them via a new intake/index.ts sub-barrel, relocate
      intake tests into intake/__tests__/, and thin eval/index.ts to re-export only the shared
      framework plus each consumer's public surface with explicit named collision-avoidance exports.
      Relocation and barrel thinning land together so the build never breaks mid-flight.
    acceptance_criteria:
      - >-
        eval/intake/ exists containing the intake case loader, judge, scorer, runner, and types, all
        wired via direct relative imports — none through the top barrel.
      - >-
        eval/intake/index.ts exposes intake's public surface as its single consumer entry; all four
        consumers (framework, brief-quality, skill-judge, intake) expose their surface through a
        per-consumer index.ts.
      - >-
        eval/index.ts contains no flat intake-module re-exports; it re-exports only the framework
        plus each consumer's public surface.
      - >-
        Every symbol importable from the eval package root before the change (per the story-040-001
        baseline) remains importable from the same place after — no call-site changes in runner
        scripts, tests, or cross-package imports.
      - >-
        Collision-avoidance is preserved via explicit, named re-exports (e.g. GateOutcome,
        JudgeOutcome<T>); no wildcard in the top barrel re-introduces those colliding types at the
        package root.
      - >-
        Intake test files are relocated alongside their modules (e.g. intake/__tests__/) with
        coverage intact.
      - >-
        Adding an internal module to a consumer requires editing only that consumer's own files
        (zero edits to eval/index.ts); adding a new consumer requires at most one top-barrel
        re-export line.
      - >-
        npm run build and npm run test pass, all existing eval suites are green, and there is no
        behavior change.
    estimated_complexity: large
    dependencies:
      - story-040-001
    tech_notes: >-
      Large single-owner story (tightly-coupled region — do not split). Create
      `packages/loom-core/src/eval/intake/` and move the 10 intake modules (`intakeEvalTypes.ts`,
      `loadIntakeEvalSet.ts`, `IntakeJudge.ts`, `runIntakeEval.ts`, `scoreIntakeEval.ts`,
      `refineEvalCases.ts`, `runRefinedIntakeEval.ts`, `renderIntakeReport.ts`,
      `recoverBriefText.ts`, `intakeConsumer.ts`) plus the 11 test files into `intake/__tests__/`;
      keep every NodeNext `.js`-suffixed relative specifier identical since siblings move together
      (only the directory prefix changes, never the extension). Add `intake/index.ts` re-exporting
      exactly the frozen intake surface from Data Models §2, and add the missing
      `skill-judge/index.ts` mirroring `brief-quality/index.ts` (use `export *` for safe modules,
      re-export by name for any collider). Thin `eval/index.ts` to: shared-framework lines
      (unchanged) + `export * from './intake/index.js'` + the explicit named framework list that
      deliberately omits `GateOutcome<T>`/`JudgeOutcome<T>`. The one trade-off to know: prefer
      `export * from './intake/index.js'`, but you MUST diff the resolved root surface against the
      story-040-001 baseline first — if any intake name collides at the root (history shows some
      did), fall back to an explicit named re-export group of the intake surface instead of the
      wildcard. Land relocation + barrel-thinning + test moves atomically so the build never breaks
      mid-flight; verify with `npm run build` and `npm run test` (both must stay green, zero
      behavior change).
    test_plan: >-
      Level: lean on the EXISTING eval suites (unit/integration) staying green, plus a new
      surface-contract test and the full cross-workspace build. The bar is 'no behavior change', so
      the regression oracle is the frozen surface, not new behavior tests. Reference: the
      story-040-001 baseline and Data Models §2.


      Key cases:

      - Build green (AC8): `npm run build` across ALL workspaces passes — tsc fails closed on any
      missing or ambiguous re-export, so this is the primary collision/drift trap.

      - Full suite green (AC8, NFR-3): `npm run test` green across the whole repo, not only eval
      suites.

      - Surface contract, happy path (AC4): a test that imports the package root and asserts every
      baseline symbol is importable from the SAME place — value exports (EvalRunner, evaluateChecks,
      loadEvalSuite, loadIntakeEvalSet, runIntakeEval, computeAxisAccuracy, IntakeJudge,
      computeJudgeVsHumanAgreement, scoreIntakeEval, refineEvalCases, runRefinedIntakeEval,
      renderIntakeReport, writeIntakeReportFiles, renderIntakeReportDual,
      writeIntakeReportDualFiles, createIntakeConsumer, runGateEval, coreMetrics, decide,
      resolveEvalModels, DEFAULT_JUDGE_MODEL, the zod schemas) are defined; type-only exports
      compile under an `import type {...}` probe. Diff resolved names against the baseline — the
      diff must be empty.

      - Collision regression (AC5): assert the package-root `GateOutcome` is still the orchestrator
      type from brief/gate.ts, and that framework's generic `GateOutcome<T>`/`JudgeOutcome<T>` and
      brief-quality's distinct `EvalReport` are NOT surfaced at the root (root `EvalReport` resolves
      to types.ts). Compile-time/type probe; an ambiguous-export build error here is the failure
      mode to catch.

      - Wildcard-vs-named fallback (tech_notes): diff the resolved root surface against the baseline
      first; prefer `export * from './intake/index.js'`, but if any intake name collides at the root
      fall back to an explicit named intake re-export group. Verify the chosen form yields zero
      collisions.

      - Internal wiring (AC1): grep/assert that no module under eval/intake/ imports from the top
      barrel (`../index.js`); siblings cross-import via direct `./<module>.js` specifiers only,
      NodeNext `.js` suffixes unchanged (only the directory prefix moved).

      - No flat intake re-exports in top barrel (AC3): structural assertion that eval/index.ts
      re-exports only framework + per-consumer index surfaces, with no `from './<intakeModule>.js'`
      lines.

      - Deep-import preservation: confirm `dist/eval/brief-quality/run.js` and
      `dist/eval/skill-judge/run.js` still resolve and export `main`, so the two runner scripts are
      unaffected.

      - skill-judge barrel (AC2): skill-judge/index.ts exists and exposes its surface (export * for
      safe modules, named re-export for any collider) WITHOUT re-introducing a root collision — all
      four consumers now expose one entry.

      - Test relocation + coverage (AC6): all 11 intake test files run from intake/__tests__/, every
      one green, coverage not reduced versus pre-move.

      - Chokepoint goal (AC7): confirm intake/index.ts is the single absorbing point — a
      hypothetical new intake module needs zero edits to eval/index.ts, and adding a new consumer
      needs at most one top-barrel re-export line.


      Verification bar: build + full test suite green; baseline surface diff empty (every baseline
      symbol importable from the same place, no new colliding symbol at the root); relocated intake
      suites green with coverage intact; both runner deep-imports resolve; no eval logic changed.
