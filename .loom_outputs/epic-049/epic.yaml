stories:
  - id: story-049
    title: Present routed standalone stories as stories, not one-story epics
    description: >-
      When loom intake routing classifies incoming work as a standalone story, the record is
      correctly a parentless standalone story, but the work still leaks its epic-prefixed run id
      (epic-NNN) and one-story-epic framing across several user-facing surfaces: the `loom weave`
      summary prints `epic-NNN` and `N epic(s), 1 stories`, the `approve` and `run` commands are
      invoked with the `epic-NNN` id, the finalize PR title reads `epic-NNN: …`, and status lines
      say `Epics processed: epic-NNN`. The root cause is that `loom weave` reserves an epic id
      before classification, then repurposes that already-reserved epic row as the standalone story
      while keeping the `epic-NNN` id, so the identity is never reconciled to read as a story. Build
      an identity/presentation-consistency fix so a routed standalone story reads as `story-NNN` —
      never as `epic-NNN` or `1 epic, 1 story` — everywhere the operator sees, types, or reviews it,
      while leaving the full-epic pipeline and the `intake_routing=off` path completely untouched.
      The reconciliation of the pre-classification epic reservation (new story-prefixed id
      allocation, row rename, or presentation mapping) is an architect's-choice decision bounded by
      the constraint that the operator must never see a standalone story labeled as an epic and the
      non-routed paths stay byte-identical to today.
    acceptance_criteria:
      - >-
        A routed standalone story is presented as `story-NNN` and never as `epic-NNN` or `N epic(s),
        1 stories` across the `loom weave` summary, the `approve` and `run` commands, the finalize
        pull request title, and status messages.
      - >-
        The `loom weave` command summary presents a routed standalone story as a story (e.g.
        `Standalone story: story-NNN`) rather than `N epic(s), 1 stories`.
      - >-
        The `approve` and `run` commands operate on the routed standalone story via an id that reads
        as a story.
      - 'The finalize pull request title uses `story-NNN` framing instead of `epic-NNN: …`.'
      - Status/`epics processed`-style lines name the routed standalone story as a story.
      - '`loom status` continues to present the standalone story exactly as it does today, unchanged.'
      - >-
        The pre-classification epic reservation is reconciled so the standalone identity reads as a
        story end-to-end, without orphaning or double-counting the reserved id.
      - >-
        When effective size is epic, `epic-NNN` ids and `N epic(s)` framing remain, proven by a test
        on the full-epic pipeline.
      - With `intake_routing` off, behavior is byte-identical to today, proven by a test.
      - >-
        No guardrail is weakened: policy enforcement, branch protection, and worktree isolation
        invariants stay intact, and dispatch, single-PR finalize, and provenance on the standalone
        path are preserved.
      - >-
        Tests cover the standalone presentation across the weave summary, `approve`/`run`, and the
        PR title.
      - >-
        User-facing docs are updated for any changed id or wording and the `docs/capabilities.md`
        drift check passes.
      - The full build and test suite pass.
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      Centered on the intake routing / `loom weave` standalone-story path in packages/loom-core (the
      routing/classification + epic-id reservation logic) and the surface rendering in
      packages/loom-cli (weave summary, approve, run, finalize PR title, status lines). Trace where
      the pre-classification epic id is reserved and where it is repurposed as a standalone story;
      that is the reconciliation point. The architect should choose among: (1) allocate a
      story-prefixed id on the standalone routing branch (cleaner identity, but verify it cannot
      collide with story ids minted inside real epics and that the reserved epic id is released/not
      orphan-counted, and that any branch names, worktree paths, or PR head refs derived from the id
      do not break single-PR finalize or re-introduce lingering worktrees); (2) rename the reserved
      row to a story identity on the standalone branch; or (3) apply a presentation mapping from the
      reserved epic id to a story-facing id at each surface (lowest blast radius but leaves the
      stored id as epic-NNN, which can resurface in logs/audit/future surfaces). Provenance must be
      preserved, which may mean retaining the original reserved id internally even if presentation
      changes. Gate every change behind the standalone-routed branch so the full-epic and
      `intake_routing=off` code paths are untouched — back this with a byte-identical regression
      test for the off path. Decide and document whether a previously-seen `epic-NNN` id still
      resolves in `approve`/`run` lookups during the transition. Keep scope to identity/presentation
      consistency — do not redesign intake routing or the epic/story data model beyond what
      reconciling the reservation requires. Update docs/capabilities.md and any user-facing docs for
      changed ids/wording so the drift check passes.
