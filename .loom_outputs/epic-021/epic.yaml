stories:
  - id: story-021-001
    title: Build the labeled eval set fixture
    description: >-
      Create a checked-in labeled eval set fixture the harness reads: cases bootstrapped from loom's
      19 delivered epics plus a few hand-curated anchor cases pinning the extremes. Each case stores
      brief text and human type/size labels with rationale.
    acceptance_criteria:
      - A labeled eval set fixture exists as a file the harness reads
      - >-
        Cases are bootstrapped from loom's 19 delivered epics (epics/epic-0NN.yaml) plus a few
        hand-curated anchor cases (an obvious single-story change, an obvious bug, an obviously
        large multi-story epic)
      - >-
        Each case stores brief text, a human `type` label, a human `size` label, and a short
        rationale
      - >-
        For each bootstrapped epic the actual brief text is located (from the epic YAML or a sibling
        planning artifact), and the fixture-build step confirms brief text is recoverable for every
        included case
      - >-
        Size labels are anchored on the human-curated anchors; historical story counts are treated
        as evidence only and never used as the size ground truth on their own
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      Create `packages/loom-core/eval-cases/intake-classification.yaml` (neighbour of
      `planning.yaml`) plus the schema in `packages/loom-core/src/eval/intakeEvalTypes.ts`
      (`IntakeEvalCaseSchema`/`IntakeEvalSetSchema` via zod) and the `recoverBriefText(epicId)`
      gate. Resolve brief text in order — `.loom/planning/<epicId>/project-brief.md` first, then the
      epic YAML `title`+`description` fallback — record the resolved path in `brief_source`, and
      EXCLUDE+log any epic whose brief is unrecoverable rather than fabricating one (ADR-003).
      Trade-off the implementer must internalize: `story_count` is an optional evidence-only field
      the scorer never reads — `label.size` is the only size ground truth, anchored on the
      hand-curated extremes (ADR-004), so resist using historical decomposition counts as the size
      label.
    test_plan: >-
      Levels: unit (zod schemas + `recoverBriefText`) plus one data-integrity test over the
      checked-in fixture. The fixture is the load-bearing artifact, so test it as data, not just the
      code that builds it.


      Key cases:

      - [unit] `IntakeEvalCaseSchema` accepts a fully-populated case (id, source, brief,
      brief_source, label.type, label.size, rationale).

      - [unit] Schema REJECTS: empty `brief`, missing/empty `rationale`, `label.type` outside
      {feature,bug,chore}, `label.size` outside {story,epic}. Confirms a malformed label can never
      enter the corpus silently.

      - [unit] `IntakeEvalSetSchema` rejects an empty `cases` array (`.min(1)`).

      - [unit] `recoverBriefText(epicId)` resolution order: returns `{ok:true,
      source:'.loom/planning/<id>/project-brief.md'}` when that file exists; falls back to
      `{ok:true}` from epic YAML title+description when the brief md is absent; returns `{ok:false,
      reason}` when neither is recoverable (ADR-003). Drive these with temp fixtures, not the real
      repo tree, so the test is deterministic.

      - [unit] An unrecoverable epic is EXCLUDED and logged — assert it is absent from the returned
      set and that no brief was fabricated (no synthesized text appears).

      - [data] Load the actual `packages/loom-core/eval-cases/intake-classification.yaml`: it
      parses, validates against `IntakeEvalSetSchema`, and EVERY case has non-empty `brief` + a
      `brief_source` provenance string (FR-2 recoverability gate).

      - [data] The three anchors exist with `source:'anchor'`: an obvious single-story change
      (size:story), an obvious bug (type:bug), an obviously large multi-story epic (size:epic). Each
      carries a rationale.

      - [data] FR-3/ADR-004 guard: `story_count` is optional (schema passes with it absent) and
      `label.size` is present independently on every case — size truth never depends on a count
      field.


      Verification bar: the fixture file loads and validates; every included case has recoverable
      brief text with recorded provenance; the extremes are pinned by human-labeled anchors;
      unrecoverable epics are excluded rather than stubbed. Every AC has a named case above.
  - id: story-021-002
    title: Scaffold harness and run the Phase 0 classifier
    description: >-
      Add the offline harness entry point following the loom-bench / scripts/eval.mjs convention (no
      operator CLI command), run every case's brief through the Phase 0 IntakeClassifier, and
      compute per-axis exact-match accuracy vs the human labels.
    acceptance_criteria:
      - >-
        The harness entry point follows the `loom-bench` binary and `scripts/eval.mjs` convention
        and adds no operator-facing CLI command
      - >-
        Every case's brief is passed through the Phase 0 `IntakeClassifier`, collecting `type`,
        `size`, `confidence`, and `rationale`, with exactly one classifier call per case
      - >-
        Exact-match accuracy of classifier verdict vs human label is computed and reported
        separately for `type` and for `size`
      - >-
        Phase 0 `IntakeClassifier` behavior and output are unchanged (observe-only), and no planning
        or execution path is wired in
    estimated_complexity: medium
    dependencies:
      - story-021-001
    tech_notes: >-
      Add `scripts/eval-intake.mjs` + an `npm run eval:intake` script mirroring `scripts/eval.mjs`
      exactly — a thin shell over logic exported from `@loom-ai/core` (`loadIntakeEvalSet()`,
      `runIntakeEval()` scaffold, per-axis exact-match scoring in `packages/loom-core/src/eval/`).
      Consume the real Phase 0 `classifyIntake` from `@loom-ai/core` with `model = triage_model`
      (`claude-haiku-4-5-20251001`) via `createLLMClient(backend)` (honoring
      `LOOM_EVAL_BACKEND`/`LOOM_EVAL_MODEL`), issuing exactly one classifier call per case and
      recording `{ok:false}` results as classifier failures. Trade-off: this is deliberately NOT a
      `loom` commander subcommand (ADR-005), so you get no operator plumbing — keep all imports
      flowing harness→classifier and never the reverse, so `weave-observe-only.test.ts` stays green
      (NFR-3).
    test_plan: >-
      Levels: unit (loader + per-axis exact-match scoring — pure, fast) and integration
      (`runIntakeEval` driven by a fake `LLMClient` stub — deterministic, no network). The
      observe-only invariant is verified by a topology test, not behavior.


      Key cases:

      - [unit] `loadIntakeEvalSet()` with no arg loads the default
      `eval-cases/intake-classification.yaml` and returns schema-validated cases; with an explicit
      path loads that file.

      - [int] `runIntakeEval(cases, deps)` issues EXACTLY ONE `classifyIntake` call per case — spy
      on the fake LLM client and assert classifier call count === cases.length (NFR-1, FR-4). No
      retry counted as a second sample.

      - [int] The classifier is invoked with `model = triage_model` (`claude-haiku-4-5-20251001`),
      via the real `classifyIntake` from `@loom-ai/core` — assert the model passed. The harness does
      NOT re-implement the prompt and does NOT read `epics.intake_verdict`.

      - [int] A `{ok:false}` classifier result (llm_error/timeout/invalid_output) is recorded as a
      classifier failure on the run record — distinct from a judge inconclusive, and not silently
      scored as a correct match.

      - [unit] Per-axis exact-match accuracy computed SEPARATELY for `type` and `size` (FR-5): feed
      hand-built records covering all-correct, all-wrong, and mixed; assert `{correct, scored}` per
      axis. A classifier failure is excluded from the correct count (not credited).

      - [topology] `packages/loom-cli/src/__tests__/weave-observe-only.test.ts` stays green: no
      import from the harness into planner/weave/execution; imports flow harness→classifier only
      (NFR-3).

      - [build/wiring] `npm run eval:intake` script exists and mirrors `scripts/eval.mjs`; the
      `.mjs` is a thin shell over `@loom-ai/core` exports and honors
      `LOOM_EVAL_BACKEND`/`LOOM_EVAL_MODEL`. No `loom` commander subcommand is registered (grep the
      CLI command table to prove the operator surface is unchanged — ADR-005).


      Verification bar: one classifier call per case on the triage tier; type and size accuracy
      reported independently; classifier failures recorded honestly; observe-only topology guard
      green and no new operator command. Mock the LLM — never hit the network in CI.
  - id: story-021-003
    title: Add stronger-tier LLM judge with inconclusive handling
    description: >-
      For each brief, make exactly one call to a stronger/different-tier LLM judge that
      independently classifies the brief and grades the classifier verdict, reusing the SkillJudge
      pattern. Record missing judge results as inconclusive and compute judge-vs-human agreement.
    acceptance_criteria:
      - >-
        For each brief, exactly one call to a stronger/different-tier LLM judge (planning-tier, not
        the cheap triage model) independently classifies the brief and grades the classifier's
        verdict + rationale as agree / disagree-with-reason
      - >-
        The judge reuses the `SkillJudge` pattern (zod-validated output, bundled prompt) rather than
        parallel judge infrastructure
      - >-
        A missing or unavailable judge result is recorded as `inconclusive` and excluded from
        agreement counts — never silently counted as agreement (overriding SkillJudge's
        permissive-accept degradation)
      - Judge-vs-human agreement is computed per axis (type, size)
    estimated_complexity: medium
    dependencies:
      - story-021-002
    tech_notes: >-
      Build `IntakeJudge` in `packages/loom-core/src/eval/IntakeJudge.ts` with a bundled prompt
      `packages/loom-core/personas/intake-judge.md` loaded via `loadBundledPrompt('intake-judge')`,
      zod-validated against `IntakeJudgeResultSchema`, model resolved by
      `modelFor(policy,'planning')` (Opus, strictly stronger than triage per NFR-2/ADR-002). Reuse
      the `SkillJudge` *pattern* (validation + bundled prompt + `modelFor`) but NOT the class — its
      permissive-accept degradation returns `{score:999,verdict:'accept'}`, which is exactly wrong
      here. Trade-off (ADR-001): on any outage/parse-failure return `{status:'inconclusive'}`, never
      a synthesized agreement, and ensure the scorer excludes `inconclusive` from both
      `judgeVsHuman` and `judgeVsClassifier` denominators while still counting it in
      `inconclusiveJudgeCount`.
    test_plan: >-
      Levels: integration for `IntakeJudge.judge()` with a fake `LLMClient` (the inconclusive paths
      are the whole point — they must be exercised deterministically), plus unit for the
      judge-vs-human agreement scoring. No real LLM calls.


      Key cases:

      - [int] Happy path: LLM returns a schema-valid `{type,size,grade,reason}` → `judge()` returns
      `{status:'ok', result}` validated against `IntakeJudgeResultSchema`.

      - [int] Exactly ONE judge call per case (NFR-1, FR-6) — spy and assert call count.

      - [int] Judge runs on the strictly-stronger tier: model resolves via
      `modelFor(policy,'planning')` (Opus), NOT `triage_model` (NFR-2/ADR-002) — assert the model
      passed to the client is the planning tier.

      - [int] INCONCLUSIVE on outage: client throws / times out → `{status:'inconclusive', detail}`
      — NEVER a synthesized `agree`/`accept` (FR-9). This is the explicit override of SkillJudge's
      permissive-accept; assert the result is not `{grade:'agree'}` and not `score:999`.

      - [int] INCONCLUSIVE on parse/validation failure: client returns malformed or non-conforming
      JSON → `{status:'inconclusive'}`, not a coerced verdict.

      - [int] Prompt is the bundled `intake-judge` prompt loaded via
      `loadBundledPrompt('intake-judge')` (reuses the SkillJudge pattern, not the class) — assert
      the bundled prompt is loaded, not an inline string.

      - [unit] Judge-vs-human agreement computed per axis (type, size) (FR-7): from hand-built
      records assert agree/disagree counts; and assert `inconclusive` outcomes are EXCLUDED from the
      agreement denominator while still incrementing `inconclusiveJudgeCount`.


      Verification bar: one judge call per case on the planning tier; valid output validated, every
      failure mode lands as `inconclusive` (never agreement); per-axis judge-vs-human agreement
      computed with inconclusives excluded from denominators but counted separately. Determinism is
      mandatory — stub all LLM responses.
  - id: story-021-004
    title: Emit the per-axis report artifact
    description: >-
      Emit the report artifact that, per axis, presents accuracy, a confusion matrix, both agreement
      measures, the disagreement list, and a plain proceed/don't-proceed verdict expressed in terms
      of dangerous confusions with honest small-sample counts.
    acceptance_criteria:
      - The harness emits a report artifact
      - >-
        Per axis (`type`, `size`) the report shows overall accuracy, a confusion matrix of predicted
        vs labeled (accommodating `feature`/`bug`/`chore`, even when `chore` cases are few),
        judge-vs-classifier agreement, judge-vs-human agreement, and the full list of disagreements
        with rationales
      - >-
        The report includes a plain-language statement of whether the classifier clears the bar for
        Phase 1
      - >-
        Per-cell confusion counts are presented as raw counts (small-sample honesty), and the Phase
        1 bar is expressed in terms of dangerous confusions (e.g. epic→story under-sizing) per the
        asymmetric-cost rule, not a single accuracy threshold
    estimated_complexity: medium
    dependencies:
      - story-021-002
      - story-021-003
    tech_notes: >-
      Implement `scoreIntakeEval(records): IntakeEvalReport` and `renderIntakeReport(report):
      {markdown, json}` in `packages/loom-core/src/eval/`; the `.mjs` writes both
      `.loom/eval/intake-report.md` and `.loom/eval/intake-report.json` from that single source
      (ADR-007). Build a `ConfusionMatrix` per axis as raw `counts[labeled][predicted]` (type labels
      `['feature','bug','chore']`, size `['story','epic']`) — never percentages — and surface
      `dangerousConfusions` with the epic→story under-sizing cell called out explicitly per the
      asymmetric-cost rule. Trade-off (ADR-006): phrase `verdict.statement` against
      dangerous-confusion counts, not a single rounded accuracy threshold, since with ~22 cases a
      headline accuracy rounds away exactly the rare costly confusions the gate exists to catch.
    test_plan: >-
      Levels: unit only — `scoreIntakeEval` and `renderIntakeReport` are pure functions over
      `IntakeRunRecord[]`; test them with hand-built record fixtures and assert exact numbers (no
      snapshot-only tests — assert the load-bearing cells explicitly). Add one thin integration
      check that the `.mjs` writes both files.


      Key cases:

      - [unit] `ConfusionMatrix` per axis holds RAW `counts[labeled][predicted]` — never percentages
      (FR-10). For `type`, all three labels feature/bug/chore appear in the matrix even when `chore`
      count is 0. For `size`, story/epic. Drive with a record set and assert exact cell values.

      - [unit] Each `AxisReport` contains: `accuracy {correct,scored}` (exact-match vs human), the
      confusion matrix, `judgeVsClassifier` and `judgeVsHuman` {agree,disagree,inconclusive}, and
      the FULL `disagreements` list with caseId + labeled + predicted + judge + rationale (FR-8) —
      assert a known disagreement appears with its rationale.

      - [unit] `dangerousConfusions` surfaces the epic-labeled→story-predicted under-sizing cell
      with its count and the contributing `caseIds` (ADR-006/asymmetric-cost). Construct a record
      where an epic is under-sized and assert it lands in this list.

      - [unit] `verdict.statement` per axis and `overall.statement` are phrased against
      dangerous-confusion COUNTS, not a single rounded accuracy threshold; `clearsBar`/`proceed`
      booleans are present. Assert the statement text references the dangerous-cell count, not just
      a headline percentage.

      - [unit] `inconclusiveJudgeCount` is surfaced on the report and reflects the judge
      inconclusives in the records.

      - [unit] `renderIntakeReport` returns `{markdown, json}` from one source: `JSON.parse(json)`
      deep-equals the `IntakeEvalReport`; the markdown contains the confusion-matrix cells, both
      agreement numbers, judge-vs-human, the disagreement rationales, and the plain
      proceed/don't-proceed statement — proving the two artifacts cannot drift (ADR-007).

      - [int] The `.mjs` writes `.loom/eval/intake-report.md` and `.loom/eval/intake-report.json`
      (write to a temp dir in the test).


      Verification bar: per-axis matrices are honest raw counts including the empty `chore`
      row/column; both agreement measures and the full disagreement list are present; the dangerous
      epic→story cell is called out by count; markdown and JSON agree because they derive from the
      single `renderIntakeReport` source.
  - id: story-021-005
    title: Register Phase 0.5 go/no-go gate in the architecture doc
    description: >-
      Register Phase 0.5 as the named go/no-go gate in docs/architecture/intake-classification.md,
      which currently folds the measurement into P0's 'Measures:' bullet with no explicit Phase 0.5
      entry.
    acceptance_criteria:
      - >-
        `docs/architecture/intake-classification.md` contains an explicit Phase 0.5 entry
        registering it as the named go/no-go gate for Phase 1
      - >-
        The entry references the evaluation harness and its report artifact as the evidence basis
        for the Phase 1 decision
    estimated_complexity: small
    dependencies:
      - story-021-004
    tech_notes: >-
      Documentation-only edit to `docs/architecture/intake-classification.md`: add an explicit Phase
      0.5 entry naming this the go/no-go gate for Phase 1, pulling the measurement out of Phase 0's
      existing 'Measures:' bullet (ADR-008/FR-12). Reference the harness (`scripts/eval-intake.mjs`)
      and the `.loom/eval/intake-report.md` artifact as the evidence basis for the Phase 1 decision.
      Trivial; no code changes.
    test_plan: >-
      Level: documentation content check — keep it light, no test theater for a doc edit, but assert
      the required content exists so the registration can't silently regress.


      Key cases:

      - [content] `docs/architecture/intake-classification.md` contains an explicit Phase 0.5
      section/entry naming it the go/no-go gate for Phase 1 (assert the heading/phrase is present).

      - [content] The entry references the harness (`scripts/eval-intake.mjs`) and the report
      artifact (`.loom/eval/intake-report.md`) as the evidence basis for the Phase 1 decision.

      - [content] The measurement is named under the Phase 0.5 gate rather than only buried in Phase
      0's existing 'Measures:' bullet (FR-12/ADR-008).


      Verification bar: the doc has a locatable, named Phase 0.5 go/no-go gate that points at the
      harness and its report artifact. No code change; a simple presence assertion (or reviewer
      check if the repo has no docs-test convention) is sufficient.
  - id: story-021-006
    title: Run full build and test suite; fix regressions
    description: >-
      Run the full build and entire test suite across packages, and fix any cross-cutting
      regressions introduced by the harness work spanning loom-cli and loom-core.
    acceptance_criteria:
      - The full build passes
      - The entire test suite passes
      - >-
        Any cross-cutting regressions across loom-core and loom-cli are fixed, and no guardrail is
        weakened
    estimated_complexity: small
    dependencies:
      - story-021-001
      - story-021-002
      - story-021-003
      - story-021-004
      - story-021-005
    tech_notes: >-
      Run `npm run build` and `npm run test` across all workspace packages and fix any cross-cutting
      regressions spanning `loom-core` (new `src/eval/` exports) and `loom-cli`. Specifically
      confirm `packages/loom-cli/src/__tests__/weave-observe-only.test.ts` still passes, proving the
      harness added no import into the planning/weave/execution topology (NFR-3).
      Trade-off/guardrail: no policy or guardrail file is in any story's ownership, so this story's
      job is to PROVE none was weakened in passing (NFR-4) — do not 'fix' a failing guardrail test
      by relaxing the guardrail.
    test_plan: >-
      Level: this story IS the verification gate — the full build and suite are the test; add
      nothing new except fixing real regressions. Do not write tests here; run the existing ones and
      prove invariants hold.


      Key cases:

      - [build] `npm run build` passes across all workspace packages (NFR-5) — confirm the new
      `packages/loom-core/src/eval/` exports resolve for `@loom-ai/core` consumers in `loom-cli`.

      - [suite] `npm run test` passes across every package (NFR-5).

      - [invariant] `packages/loom-cli/src/__tests__/weave-observe-only.test.ts` is green, proving
      the harness added no import into the planning/weave/execution topology (NFR-3).

      - [guardrail] No guardrail/policy test is relaxed: if a guardrail test fails, fix the cause,
      NEVER weaken the guardrail to make it pass (NFR-4). Confirm no policy/guardrail file was
      modified by any story in this epic.

      - [cross-cut] Resolve any cross-package regressions spanning loom-core and loom-cli surfaced
      by the run.


      Verification bar: green `npm run build` and green `npm run test`; the observe-only topology
      guard passes unchanged; all guardrail tests pass without any guardrail being relaxed; any
      regression fix is a genuine fix, reported with the failing output it resolved.
