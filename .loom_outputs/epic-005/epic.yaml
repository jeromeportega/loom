stories:
  - id: story-005-001
    title: 'Lesson persistence: schema v18 lessons table + LessonStore'
    description: >-
      Add a new LessonStore backed by a schema v18 `lessons` table so extracted lessons can be
      persisted and queried. Bump SCHEMA_VERSION 17 to 18 with an additive, idempotent migration.
    acceptance_criteria:
      - >-
        `lessons` table is created with columns epic_id, category, observation, root_cause,
        general_rule, evidence, applied_as, applied_ref, created_at
      - >-
        `Database.ts` SCHEMA_VERSION is 18 and migration uses CREATE TABLE IF NOT EXISTS
        (idempotent, additive)
      - A pre-v18 database opens and auto-creates the lessons table transparently (test)
      - >-
        LessonStore exposes insert and query-by-epic operations, validated against the existing
        Lesson schema (findings/lesson.ts)
      - Unit tests cover insert + read round-trip
    estimated_complexity: small
    dependencies: []
    tech_notes: >-
      Add `packages/loom-core/src/state/LessonStore.ts` as a `better-sqlite3` `Store` wrapper
      (mirror `OpportunityStore.ts`) exposing `insert(Lesson[]): LessonRow[]`, `getByEpic`,
      `list({category?,appliedOnly?,limit?})`, and `markApplied(id, applied_as, applied_ref)`. In
      `Database.ts` bump `SCHEMA_VERSION` 17→18 and add the `lessons` DDL via `CREATE TABLE IF NOT
      EXISTS` plus `idx_lessons_epic`/`idx_lessons_category` (additive, idempotent — a pre-v18 db
      must open and auto-create transparently). Validate every row through the evolved `Lesson` zod
      schema (story-005-002 redefines it) with `Lesson.parse` before write, and accept `created_at`
      as a caller-passed arg — never call `Date.now()` inside the store. Trade-off (ADR-005): the
      row carries only the latest `applied_as`/`applied_ref`; full N-application history lives in
      the audit log, so don't model it as an array here.
    test_plan: >-
      **Level:** Unit only — pure persistence over an in-memory `better-sqlite3` handle; no LLM, no
      network, fully deterministic.


      **Setup:** Open a fresh DB via the real `Database.ts` init path so the v18 DDL actually runs
      (do NOT hand-CREATE the table in the test).


      **Cases:**

      - *Schema shape* — after init, `lessons` exists with exactly the FR-6 columns `epic_id,
      category, observation, root_cause, general_rule, evidence, applied_as, applied_ref,
      created_at` (query `PRAGMA table_info(lessons)`); `idx_lessons_epic` and
      `idx_lessons_category` exist.

      - *SCHEMA_VERSION* — assert `SCHEMA_VERSION === 18`.

      - *Idempotent/additive migration* — run the migration twice on the same DB (re-init) and
      assert no throw and one `lessons` table (proves `CREATE TABLE IF NOT EXISTS`).

      - *Pre-v18 upgrade* — build a DB stamped at v17 with NO `lessons` table, open it through the
      normal path, assert `lessons` is auto-created transparently and existing tables/data survive.

      - *Insert→read round-trip* — `LessonStore.insert([lesson])` returns `LessonRow[]` with an
      `id`; `getByEpic(epic_id)` returns the same row verbatim.

      - *Validation on write* — passing a row missing a required field (e.g. no `general_rule`)
      makes `insert` throw via `Lesson.parse` (proves store validates, not just SQLite).

      - *`created_at` is caller-supplied* — insert with a fixed `created_at` string and assert it
      round-trips unchanged; assert the store source contains no `Date.now()`/`new Date()` call.

      - *`markApplied`* — after `markApplied(id, 'worker_guidance', 'story-x')`, the row's
      `applied_as`/`applied_ref` reflect the latest values; `list({appliedOnly:true})` includes it
      and `list({category})` filters correctly.


      **Verification bar:** A fresh init and a simulated v17 DB both yield a correctly-columned,
      indexed `lessons` table; an insert/read round-trip preserves all fields; invalid rows are
      rejected at the store boundary. No `Date.now()` inside the store.
  - id: story-005-002
    title: Real LLM-backed lesson-extractor handler with pre-parse field injection
    description: >-
      Replace the lesson-extractor stub with a genuine LLM-backed handler mirroring the
      reviewer-skill / SkillGenerator factory pattern: load SKILL.md as a cached system prefix, send
      epic telemetry as the user message, inject handler-owned fields before the zod parse, and
      parse to the existing Lesson schema.
    acceptance_criteria:
      - >-
        Handler loads lesson-extractor SKILL.md as a cached system prefix and sends epic telemetry
        as the user message
      - >-
        Handler-owned fields (e.g. source, epic_id) are injected BEFORE the zod parse against the
        Lesson schema
      - >-
        Regression test with a field-less model response proves parsing succeeds because fields were
        stamped pre-parse
      - LLM dependency is injectable and stubbed in tests
      - Malformed model output triggers exactly one repair attempt before failing
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      Create `packages/loom-core/src/findings/LessonExtractor.ts` copying the
      `SkillGenerator.ts`/`reviewerSkills.ts` factory: load the lesson-extractor SKILL.md as a
      cached system prefix (`system: [{text, cache: true}]` → `cache_control`), send serialized
      `EpicTelemetry` as the user message, take exactly one `LLMClient.complete` call,
      `extractJsonBlock` the `{lessons}`, then stamp handler-owned fields (`epic_id`, `created_at`,
      null `applied_*`) onto each raw object BEFORE `Lesson.parse`. Also evolve the `Lesson` schema
      in `findings/lesson.ts` to the FR-6 column set (split `LessonContent` LLM-owned from the
      stamped full shape) — this breaks the old `kind/summary/context` enum, which you must update.
      The pre-parse stamping is the exact reviewer bug from commits #7/#9; add the FR-2 regression
      test that a field-less model response still parses. Trade-off (ADR-003): post-stamp validity
      means the schema alone can't validate a raw model response. Keep the `llm` injectable/stubbed
      (NFR-2) and allow exactly one repair retry only on malformed output.
    test_plan: >-
      **Level:** Unit with an injected stub `LLMClient` — exercise the extract pipeline and the
      schema evolution in isolation; the LLM must be stubbed (NFR-2), never live.


      **Setup:** Construct `LessonExtractor` with a fake `llm.complete` returning canned text; point
      `skillMdPath` at the real lesson-extractor `SKILL.md`.


      **Cases:**

      - *Cached system prefix + user message* — assert `llm.complete` was called with `system`
      carrying the SKILL.md text marked cacheable (`cache:true` → `cache_control`) and the
      serialized `EpicTelemetry` as the `user` message (not in system).

      - *One batched call (happy path)* — for well-formed output, assert `llm.complete` called
      exactly once.

      - *Pre-parse field stamping (FR-2 regression — the #7/#9 reviewer bug)* — stub returns lessons
      that OMIT `epic_id`/`created_at`/`applied_*` (field-less, LLM-owned fields only); assert
      `extract` succeeds and every returned `Lesson` has `epic_id === telemetry.epic_id`,
      `created_at` set, `applied_as===null`, `applied_ref===null`. This is the load-bearing test.

      - *Schema evolution* — `Lesson.parse` accepts the FR-6 shape
      (`category/observation/root_cause?/general_rule/evidence?` + stamped fields); a leftover
      old-shape object (`kind/summary/context`) is rejected. Confirm no remaining import references
      the dropped `kind` enum.

      - *Malformed output → exactly one repair* — stub returns non-JSON / schema-invalid text on
      first call, valid on second; assert `llm.complete` called exactly twice (one repair) and
      lessons returned. Then stub returns malformed on BOTH calls; assert it fails after exactly two
      calls (no infinite retry).

      - *Empty lessons array* — stub returns `{lessons:[]}`; `extract` returns `[]` without
      throwing.


      **Verification bar:** A field-less model response parses cleanly (proves stamp-before-parse);
      SKILL.md rides as cached system prefix with telemetry as the user turn; happy path is one
      call, malformed path is exactly one repair then stop; the old `kind/summary/context` shape is
      fully removed.
  - id: story-005-003
    title: Auto-retrospective on terminal epic state (best-effort)
    description: >-
      Hook the EpicFinalizer/Supervisor finalize path so that when an epic reaches done or failed,
      loom gathers that epic's telemetry, makes exactly one batched lesson-extractor call, and
      persists the resulting lessons via LessonStore — strictly best-effort.
    acceptance_criteria:
      - >-
        On an epic reaching done or failed, telemetry (decision traces, review summary, handoff,
        audit log) is gathered and one batched lesson-extractor call is made
      - >-
        An epic with real seeded telemetry persists >=1 lesson to the lessons table (test with
        stubbed LLM)
      - >-
        Finalize never blocks or fails due to the retro: LLM-unavailable or malformed output yields
        one repair attempt then skip-with-audit-note
      - An epic with zero usable telemetry produces zero lessons cleanly (no error)
      - Exactly one batched LLM call per retro is asserted by test
    estimated_complexity: medium
    dependencies:
      - story-005-001
      - story-005-002
    tech_notes: >-
      Add `packages/loom-core/src/orchestrator/AutoRetrospective.ts` with `run(epicId, finalStatus):
      Promise<void>` that MUST NOT throw; wire it into the tail of `EpicFinalizer.finalize()` AFTER
      the `epic_finalize` audit row, inside a try/catch that records `auto_retro_skipped` on any
      error (ADR-001). It calls a `gatherEpicTelemetry` helper pulling from
      `DecisionTraceStore.getByEpic`, `AgentStore.listByEpic` (review_summary, log_tail), and
      `AuditLog`, builds `EpicTelemetry`, and on the empty contract (all arrays empty) returns `[]`
      WITHOUT an LLM call (FR-5). Persist via `LessonStore.insert`. Trade-off: both `done` and
      `failed` terminal paths must reach this call-site — if `failed` epics finalize through a
      different code path, you must wire `run()` there too rather than relying on a hidden global
      hook. Assert exactly one batched LLM call per retro with the stubbed extractor.
    test_plan: >-
      **Level:** Integration (the `EpicFinalizer.finalize()` tail wiring) + unit for
      `gatherEpicTelemetry`, all with a stubbed extractor/LLM. This is where 'finalize is sacred' is
      proven, so cover both terminal paths.


      **Setup:** Real `LessonStore` (in-memory DB) + a stub `LessonExtractor` whose call count is
      observable; seed `DecisionTraceStore`, `AgentStore` (review_summary/log_tail), and `AuditLog`
      for one epic.


      **Cases:**

      - *Happy retro on `done`* — finalize an epic that reached `done` with seeded telemetry; assert
      telemetry was gathered from all three sources, the extractor was called once, and ≥1 lesson is
      persisted to `lessons` for that `epic_id`.

      - *Happy retro on `failed`* — same assertion driving the `failed` terminal path; if `failed`
      finalizes through a different code path, assert `run()` is still reached there (guards the
      ADR-001 wiring trade-off).

      - *Exactly one batched call* — assert the stub extractor's `complete`/`extract` invocation
      count is exactly 1 per retro.

      - *Finalize never blocks (LLM unavailable)* — make the extractor throw; assert `finalize()`
      still returns success, no lesson is written, and an `auto_retro_skipped` audit row is recorded
      with the reason. The retro runs AFTER the `epic_finalize` audit row.

      - *Finalize never blocks (malformed)* — extractor exhausts its one repair and fails; assert
      same skip-with-audit-note outcome and finalize success.

      - *Ordering* — assert `auto_retro` runs last: the `epic_finalize` audit row exists even when
      the retro throws (no finalize write is reordered or lost).

      - *Empty telemetry (FR-5)* — all three sources empty; assert `run()` returns cleanly, persists
      zero lessons, and makes NO LLM call (empty contract short-circuits before the extractor).


      **Verification bar:** Both `done` and `failed` finalizes persist lessons on the happy path
      with exactly one LLM call; any extractor failure leaves finalize succeeding plus an
      `auto_retro_skipped` note and zero lessons; empty telemetry yields zero lessons and zero LLM
      calls.
  - id: story-005-004
    title: Lesson guidance injection into future worker prompts
    description: >-
      Inject applicable persisted lessons into a future worker's assembled prompt through the
      existing operator-guidance / context-notes seam, matching by general_rule/category area
      keywords, and record the lesson as applied.
    acceptance_criteria:
      - >-
        At least one persisted lesson is demonstrably injected into a subsequent worker's assembled
        prompt via the guidance/context seam (test)
      - >-
        Relevance uses a simple area/category keyword match between a lesson's general_rule/category
        and the target epic/story area
      - An injected lesson is recorded as applied with applied_as and applied_ref set
      - No semantic-matching machinery is introduced (keyword/area match only)
    estimated_complexity: medium
    dependencies:
      - story-005-001
    tech_notes: >-
      Add `packages/loom-core/src/findings/lessonMatch.ts` with deterministic
      `selectLessonsForStory(story, epicTitle, lessons, {topK=3})` — token-overlap between
      `tokenize(category + ' ' + general_rule)` and `tokenize(story.title + description +
      epicTitle)`, ranked by overlap count, no embeddings/LLM (ADR-004). Inject the selected lessons
      through the existing `contextAssembler.assembleWorkerContext` operator-guidance/context-notes
      seam as a clearly-delimited, advisory "Lessons from prior epics" block (never as system
      instructions — T-1), and call `lessonStore.markApplied(id, 'worker_guidance', story.id)` on
      injection. Trade-off: keyword matching misses synonyms/paraphrases (a 'migrations' lesson
      won't match a 'schema upgrade' story); that's accepted at v4.0, and the seam is isolated to
      one function so a semantic ranker can replace it later.
    test_plan: >-
      **Level:** Unit for `lessonMatch.selectLessonsForStory` (pure, deterministic) + integration
      for the `contextAssembler.assembleWorkerContext` injection seam and `markApplied`.


      **Setup:** Real `LessonStore` with seeded `LessonRow`s; build story objects with controlled
      title/description.


      **Cases:**

      - *Match by keyword overlap* — a lesson whose `category`/`general_rule` shares tokens with
      `story.title + description + epicTitle` is selected; a clearly-unrelated lesson is not.

      - *Ranking + topK* — given several overlapping lessons, results are ranked by overlap count
      and capped at `topK` (default 3); assert order and cap.

      - *No-match boundary* — a story with zero token overlap yields `[]` (no spurious injection).

      - *Injection into prompt (FR-7)* — `assembleWorkerContext` for a subsequent story includes a
      clearly-delimited, advisory **"Lessons from prior epics"** block containing the selected
      lesson text, located in the operator-guidance/context-notes section — NOT as system
      instructions (T-1). Assert the delimiter/heading is present.

      - *Records application* — after injection, `lessonStore.markApplied(id,'worker_guidance',
      story.id)` is called; the row's `applied_as==='worker_guidance'` and `applied_ref===story.id`.

      - *No semantic machinery* — assert no embeddings/LLM/network dependency is imported or invoked
      by `lessonMatch.ts` (deterministic, free). Document the known synonym miss (a 'migrations'
      lesson not matching a 'schema upgrade' story) as expected, not a bug.

      - *Determinism* — same inputs produce identical selection across runs (no wall-clock/random
      ordering).


      **Verification bar:** A relevant persisted lesson appears verbatim in the next worker's
      assembled prompt as an advisory block and is marked applied with `applied_as`/`applied_ref`;
      matching is pure keyword overlap with stable ranking and no semantic dependency.
  - id: story-005-005
    title: Policy-suggestion application mode
    description: >-
      Add a second lesson-application mode that writes a recorded policy suggestion artifact / audit
      row without ever mutating policy.
    acceptance_criteria:
      - A lesson can be applied as a policy suggestion with applied_as = 'policy_suggestion'
      - The suggestion is recorded as an artifact / audit row and is auditable
      - Test proves no policy file or policy state is mutated by the suggestion mode
    estimated_complexity: small
    dependencies:
      - story-005-001
    tech_notes: >-
      Add `applyAsPolicySuggestion(deps, lessonId, suggestion)` that writes
      `audit.record({action:'policy_suggestion', detail:{lessonId, suggestion}})` and then
      `lessonStore.markApplied(lessonId, 'policy_suggestion', auditRef)` — returning `{auditRef}`.
      It must have NO handle to the policy file or `PolicyEngine` (T-3/NFR-3); the test asserts no
      policy file or policy state is mutated. Trade-off: this is the second writer of
      `applied_as`/`applied_ref`, so a lesson injected as worker_guidance and later raised as a
      suggestion will show only the latest on the row (ADR-005) — the audit log is the authoritative
      history.
    test_plan: >-
      **Level:** Unit — small, pure audit-only writer with a real `LessonStore` and a spy/real
      `AuditLog`.


      **Setup:** Seed one `LessonRow`; provide `deps` containing `lessonStore` and `audit` only
      (deliberately NO policy file / `PolicyEngine` handle).


      **Cases:**

      - *Suggestion recorded* — `applyAsPolicySuggestion(deps, lessonId, suggestion)` writes an
      audit row `action:'policy_suggestion'` with `detail:{lessonId, suggestion}` and returns
      `{auditRef}`.

      - *Row marked* — the lesson row's `applied_as==='policy_suggestion'` and
      `applied_ref===auditRef`.

      - *Auditable* — the audit row is retrievable and contains the suggestion text (auditable
      end-to-end).

      - *No policy mutation (T-3/NFR-3)* — assert the function signature/closure has no reference to
      a policy file path or `PolicyEngine`; with a policy file present on disk/in state, assert it
      is byte-for-byte unchanged after the call and no `PolicyEngine` mutator is invoked.

      - *Latest-write semantics (ADR-005)* — apply the same lesson first as `worker_guidance` then
      as `policy_suggestion`; assert the row shows only the latest (`policy_suggestion`), while BOTH
      applications exist as separate audit rows (audit log is the history).


      **Verification bar:** A lesson is recorded as a policy suggestion via an audit row and
      `applied_as='policy_suggestion'`, fully auditable, with a test proving zero policy file/state
      mutation and that the audit log—not the row—holds multi-application history.
  - id: story-005-006
    title: Explicit human-triggered self-proposal (proposeNextEpic)
    description: >-
      Implement proposeNextEpic() that, only on explicit operator action, combines top-ranked
      lessons with top open opportunities into a brief, runs it through the existing brief gate and
      Planner/BriefRefiner, and lands a real planned + manual epic marked proposed_by='loom'. Expose
      it via CLI (loom propose), an MCP tool, and a mission-control button.
    acceptance_criteria:
      - >-
        proposeNextEpic() combines top-ranked lessons (recency + category frequency) with top open
        opportunities into a brief and runs it through the brief gate and Planner
      - >-
        Output is a real planned + manual epic marked proposed_by='loom' that stays planned until
        explicit approval (test)
      - Proposal surfaces in GET /api/inbox
      - Exposed via CLI `loom propose`, an MCP tool, and a mission-control button
      - Exactly one batched LLM call per proposal is asserted by test
      - A structural test proves no auto-trigger / auto-approve / scheduler path exists
    estimated_complexity: large
    dependencies:
      - story-005-001
    tech_notes: >-
      Add `packages/loom-core/src/planner/proposeNextEpic.ts` generalizing `scopeOpportunity.ts`:
      rank lessons by recency+category-frequency (ADR-006, top-N), pull top open opportunities via
      `opportunityStore.listRanked({status:'open',limit})`, compose a brief, run `refiner.refine` →
      `evaluateBriefGate(refinement, minBriefQualityScore)` → on pass `planner.run` →
      `epicStore.setProposedBy(epicId,'loom')`, leaving the epic `planned`+`manual`, and audit
      `epic_proposed`. Add the `proposed_by` column to `epics` via the per-column `ALTER` idiom in
      `runMigrations`. Reach it ONLY from explicit entry points — `loom propose` (`runPropose()` in
      loom-cli), `loom_propose` MCP tool (TOOL_DEFINITIONS+HANDLERS), and a mission-control button —
      and add the structural test (NFR-3) asserting no `setInterval`/`setTimeout`/cron/auto-approve
      path references this code. Trade-off: frequency-weighted ranking amplifies the
      currently-noisiest category, which may not be the most valuable — accepted for v4.0. Assert
      exactly one batched LLM call (the BriefRefiner) on the happy path.
    test_plan: >-
      **Level:** Integration for the `proposeNextEpic` pipeline (stubbed `BriefRefiner`/`Planner`
      LLM) + integration for the surfaces (CLI `runPropose`, MCP `loom_propose`, `GET /api/inbox`) +
      a dedicated structural test for NFR-3. Largest story — fuller checklist.


      **Setup:** Real `LessonStore`, `OpportunityStore`, `EpicStore` on an in-memory DB; stub
      `refiner.refine` (the single batched LLM call) and `planner.run`; add the `proposed_by` column
      via the `runMigrations` ALTER idiom.


      **Cases:**

      - *Brief composition + ranking* — seed lessons of varying recency/category frequency and open
      opportunities; assert the brief fed to `refiner.refine` contains the top-N
      recency+frequency-ranked lessons (ADR-006) and top-M `listRanked({status:'open'})`
      opportunities.

      - *Gate pass → planned epic* — on `evaluateBriefGate` pass, `planner.run` produces a real
      epic, `epicStore.setProposedBy(epicId,'loom')` is set, and the epic is `status:'planned'` +
      autonomy `manual`, frozen (stays `planned` until explicit approval — assert no auto-approve
      transition).

      - *Gate fail path* — when the brief scores below `minBriefQualityScore`, `proposeNextEpic`
      returns `{ok:false, critique}` and creates NO epic.

      - *Exactly one batched LLM call* — assert `refiner.refine` is invoked exactly once on the
      happy path; `planner.run` adds no second model call beyond the contract.

      - *Audit* — an `epic_proposed` audit row is written before returning.

      - *Inbox surfacing* — `GET /api/inbox` includes the proposed epic as a `plan_approval` entry
      (real route test).

      - *CLI entry* — `loom propose` → `runPropose()` invokes `proposeNextEpic` and prints the
      resulting epic id.

      - *MCP entry* — `loom_propose` is registered in both `TOOL_DEFINITIONS` and `HANDLERS`, takes
      `{}`, returns `{ok, epicId}`.

      - *Structural no-auto path (NFR-3/T-3)* — assert `proposeNextEpic` and its callers contain NO
      `setInterval`/`setTimeout`/cron/scheduler/auto-approve reference; it is reachable ONLY from
      the CLI/MCP/button entry points (grep-style source assertion).

      - *Migration* — `proposed_by` column is added idempotently (re-run safe); NULL = human,
      `'loom'` = self-proposed.


      **Verification bar:** An explicit invocation lands a `planned`+`manual` epic stamped
      `proposed_by='loom'` that surfaces in the inbox and never self-approves; exactly one batched
      LLM call occurs; all three entry points work; and a structural test proves no
      scheduler/auto-trigger/auto-approve path references this code.
  - id: story-005-007
    title: 'Read-only flywheel view: GET /api/lessons + board'
    description: >-
      Add a federated, read-only GET /api/lessons route and a mission-control board that renders
      lessons (with where each was applied) and current self-proposals, including a defined empty
      state.
    acceptance_criteria:
      - GET /api/lessons serves federated, read-only flywheel data, covered by a real-createApp test
      - The board renders lessons (showing where each was applied) and current self-proposals
      - A defined empty state is rendered when there are no lessons or proposals
      - Any new mutating route (if added) is token-gated and audit-logged
    estimated_complexity: medium
    dependencies:
      - story-005-001
      - story-005-006
    tech_notes: >-
      Add `packages/loom-web/src/server/routes/lessons.ts` exporting `registerLessonRoutes(app,
      deps)` mounted in `createApp`, serving read-only `GET /api/lessons` returning
      `LessonsResponse` (lessons + `proposed_by='loom'` planned proposals + `empty` flag for FR-12).
      It must pass `accessGuard` without a token in read-only mode; any mutating route (e.g. `POST
      /api/propose`) must be token-gated and call `audit.record()` (NFR-5/T-5). Build the vanilla-JS
      mission-control flywheel board matching the existing inbox/fleet/opportunities boards,
      rendering where each lesson was applied (join the audit log for full history per ADR-005) and
      a defined empty state. Trade-off (per the epic-003 orphaned-route lesson): write the test
      against the real `createApp`, not a hand-mounted router, so the route can't silently go
      unmounted.
    test_plan: >-
      **Level:** Integration against the REAL `createApp` (supertest-style) — per the epic-003
      orphaned-route lesson, never test a hand-mounted router. Plus a light frontend assertion for
      the board's render states.


      **Setup:** Boot the app via `createApp` with `registerLessonRoutes` mounted; seed
      `LessonStore` with applied/unapplied lessons and one `proposed_by='loom'` `planned` epic.


      **Cases:**

      - *Route mounted + read-only* — `GET /api/lessons` returns 200 with the `LessonsResponse`
      shape (`lessons[]`, `proposals[]`, `empty`) WITHOUT a token (passes `accessGuard` in read-only
      mode). Asserting via `createApp` proves the route isn't silently unmounted.

      - *Federated content* — response `lessons` include `applied_as`/`applied_ref`; `proposals`
      include only `proposed_by='loom'` + `status='planned'` epics.

      - *Empty state (FR-12)* — with no lessons and no proposals, `empty:true` and the board renders
      the defined empty state.

      - *Board render* — the mission-control flywheel board lists lessons showing where each was
