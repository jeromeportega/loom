stories:
  - id: story-005-001
    title: Finalize push to a fresh, finalizer-owned ref
    description: >-
      Change EpicFinalizer to push the integrated epic branch to a fresh, uniquely-named ref it owns
      (e.g. epic-id plus a finalize suffix) rather than reusing a ref rolling integration may have
      diverged. Naming must be deterministic and collision-proof across retries and concurrent
      epics.
    acceptance_criteria:
      - >-
        EpicFinalizer pushes to a new finalizer-owned ref, never reusing the rolling-integration
        epic branch ref
      - The ref name is deterministic and collision-proof across retries and concurrent epics
      - A finalize whose normal push would be non-fast-forward succeeds by pushing to the fresh ref
      - No force push is ever issued under any condition
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      Edit `EpicFinalizer.ts`: add the single private helper `finalizeRef(epicId, integratedHead):
      string` returning `loom/finalize/${epicId}-${integratedHead.slice(0,7)}`, and change the push
      target from `epic/<id>` to that ref (also pass it as `gh pr create --head`). Use the existing
      `gitSafe(cwd, args)` porcelain (returns `{ok, output}`, never throws) — do NOT introduce a new
      git wrapper and never add a `--force`/`--force-with-lease` path. Trade-off to know: the
      sha-suffixed name is deterministic so a retry re-pushes the identical ref as a fast-forward
      no-op, but each distinct integrated state leaves one stale `loom/finalize/*` ref on the remote
      (GC is out of scope).
    test_plan: >-
      Level: UNIT (the ref-naming helper is a pure function — cheapest, highest-leverage) plus a
      thin INTEGRATION-style test of the finalizer push path with a spy/fake over `gitSafe` and the
      `openPr`/`gh pr create` injection point (capture arg arrays; do not hit a real remote).


      Key cases:

      - Naming determinism: `finalizeRef('epic-005', '1a2b3c4dabc...')` ===
      `loom/finalize/epic-005-1a2b3c4` (assert exact `slice(0,7)`); same (epicId, integratedHead)
      called twice ⇒ identical string. [AC2]

      - Collision-proof: different `epicId` ⇒ different ref; same epic but different
      `integratedHead` sha ⇒ different ref; two concurrent epics never collide. [AC2]

      - Push target swapped: finalizer's push goes to `finalizeRef(...)`, NEVER to `epic/<id>`;
      assert the captured `gitSafe` push refspec and that `gh pr create --head` uses the same fresh
      ref. [AC1]

      - Non-fast-forward survival: with a fake remote whose `epic/<id>` has diverged, the push to
      the fresh `loom/finalize/*` ref returns `{ok:true}` and finalize proceeds — no
      second/retry/override push is issued. [AC3]

      - No force, ever: scan every captured `gitSafe` arg array across all the above; none contains
      `--force` or `--force-with-lease`. [AC4]


      Verification bar: the push refspec and `--head` both equal the deterministic
      `loom/finalize/<epicId>-<head7>` string, a divergent rolling `epic/<id>` no longer causes a
      non-fast-forward failure, and no captured git invocation carries a force flag.
  - id: story-005-002
    title: Add a recoverable, non-terminal publish-pending lifecycle state
    description: >-
      Introduce a new epic lifecycle state for 'work complete, only publish remains' that is
      distinct from both terminal `failed` and `rejected`. Persist it additively and update any
      state-machine guards so existing in-flight epics are never misclassified.
    acceptance_criteria:
      - A new recoverable, non-terminal state exists, distinct from `failed` and `rejected`
      - >-
        State-machine guards permit the new state additively without altering `failed`/`rejected`
        semantics
      - Persisted/in-flight epics are not misclassified into the new state by migration
      - The `failed` = infrastructure failure / `rejected` = human decision distinction is preserved
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      Add `'publish_pending'` to `EpicStatusSchema` in `packages/loom-core/src/types.ts` (DB-only —
      do NOT add it to `EpicYamlSchema`), and bump `SCHEMA_VERSION` 18→19 in `state/Database.ts`
      adding `finalize_ref TEXT` and `publish_note TEXT` via `ALTER TABLE` in the existing
      `runMigrations()` ladder. The migration must be purely additive — no `UPDATE` of existing rows
      (FR-8). Critical trade-off: the new value widens the blast radius across every `EpicStatus`
      switch (cli `status.ts`, loom-web union + frontend); rely on the zod enum for compile-time
      coverage but audit each consumer.
    test_plan: >-
      Level: UNIT for the `zod` enum (`EpicStatusSchema` / `EpicYamlSchema`) and INTEGRATION for the
      SQLite migration (`runMigrations()` against a temp better-sqlite3 DB).


      Key cases:

      - Enum accepts new value: `EpicStatusSchema.parse('publish_pending')` succeeds; the value is
      distinct from `'failed'` and `'rejected'`. [AC1]

      - DB-only constraint: `EpicYamlSchema` REJECTS `'publish_pending'` (it must not be a plan-time
      status). [AC1, AC4]

      - Migration is additive: seed a v18 DB with rows in `failed`, `rejected`, `finalizing`,
      `in_progress`; run migrations; assert `SCHEMA_VERSION === 19`, columns `finalize_ref` and
      `publish_note` now exist and are NULL on every pre-existing row, and NO existing row's
      `status` changed (no `UPDATE`/backfill ran). [AC3]

      - Semantics preserved: the seeded `failed` and `rejected` rows still read back as
      `failed`/`rejected`. [AC4]

      - Idempotent ladder: running `runMigrations()` again on the v19 DB is a no-op and does not
      throw. [AC2]


      Verification bar: the enum and column additions exist, `EpicYamlSchema` still rejects the new
      value, and a v18→v19 migration leaves every existing row's status byte-for-byte unchanged with
      the two new columns NULL.
  - id: story-005-003
    title: Route publish-failed gate-green epics into the recoverable state
    description: >-
      When all stories are done and the integration gate passed but push or PR fails, EpicFinalizer
      transitions the epic into the new recoverable state instead of terminal `failed`.
    acceptance_criteria:
      - A done-and-gate-green epic whose push/PR fails lands in the recoverable state, not `failed`
      - Integration-gate behavior is unchanged
      - No force push is attempted as part of the transition
    estimated_complexity: small
    dependencies:
      - story-005-001
      - story-005-002
    tech_notes: >-
      In `EpicFinalizer.ts`, on push-rejected (non-fast-forward), remote-disallowed, or PR-open
      failure for a gate-green epic, call a new `EpicStore.publishPending(id, finalizeRef, note)`
      (status='publish_pending') and return `FinalizeResult.status: 'publish_pending'`. Mirror the
      existing `fail()`/`recordPrUrl()` write shape in `EpicStore.ts`; leave `IntegrationGate`
      untouched so gate-BLOCKED still routes to `in_progress`. Add ONE branch to
      `Supervisor.finalizeAndGateDone()` BEFORE the `failed` branch: `if (fin.status ===
      'publish_pending') return;` — the finalizer already wrote state, so the Supervisor must not
      `fail()` or flip `done`, and the RUNNABLE set `{approved, in_progress}` stays unchanged so it
      is never re-dispatched.
    test_plan: >-
      Level: UNIT/INTEGRATION on `EpicFinalizer` (mock `gitSafe` and the `gh pr create` path, real
      or faked `EpicStore`) plus a focused UNIT on `Supervisor.finalizeAndGateDone()`.


      Key cases:

      - Push rejected (non-fast-forward) on a gate-green, all-stories-done epic ⇒ finalizer calls
      `EpicStore.publishPending(id, finalizeRef, note)`, returns `FinalizeResult.status ===
      'publish_pending'`, and does NOT call `fail()`. [AC1]

      - Remote-disallowed push (gate green) ⇒ same `publish_pending` outcome. [AC1]

      - PR-open failure (`gh pr create` fails, gate green) ⇒ same `publish_pending` outcome. [AC1]

      - Negative — genuine infra failure: a merge/worktree/gate-run error still returns `failed`
      (publish_pending must not swallow real failures). [AC1 boundary]

      - Gate behavior untouched: a BLOCKED integration gate still routes to `in_progress`, never
      `publish_pending`. [AC2]

      - Supervisor branch: when `fin.status === 'publish_pending'`, `finalizeAndGateDone()` returns
      WITHOUT `epics.fail()` or `updateStatus(id,'done')`; assert the early branch sits BEFORE the
      `failed` branch. Confirm RUNNABLE set is still `{approved, in_progress}` so a
      `publish_pending` epic is never re-dispatched. [AC2]

      - No force push issued anywhere in the transition (scan captured git args). [AC3]


      Verification bar: each of the three publish-friction paths lands the epic in `publish_pending`
      (not `failed`), the Supervisor neither fails nor completes it, a BLOCKED gate still goes to
      `in_progress`, and no force flag appears.
  - id: story-005-004
    title: Surface 'work complete / publish pending' in status output
    description: >-
      Update status surfaces to communicate that a recoverable epic's work is complete and only the
      publish step remains, with a clear label rather than a failure indication.
    acceptance_criteria:
      - Status output for a recoverable epic shows a clear 'work complete / publish pending' label
      - A recoverable epic is not rendered as failed
      - Status for `failed` and `rejected` epics is unchanged
    estimated_complexity: small
    dependencies:
      - story-005-002
    tech_notes: >-
      Teach the status surfaces the new value: the cli icon/label switch in `loom-cli` `status.ts`,
      plus the loom-web status union type and its frontend renderer. Render `publish_pending` with a
      distinct 'work complete / publish pending' label (use `publish_note` for detail) — explicitly
      NOT a failure indicator — and leave `failed`/`rejected` rendering byte-for-byte unchanged.
      Trade-off: this is the surface where a missed switch case would silently mislabel a
      recoverable epic, so cover each consumer the zod enum flags.
    test_plan: >-
      Level: UNIT on the CLI renderer (`loom-cli` `status.ts` icon/label switch) and UNIT on the
      loom-web status union type + frontend renderer.


      Key cases:

      - CLI: an epic with status `publish_pending` renders a distinct 'work complete / publish
      pending' label (using `publish_note` for detail) with a non-failure icon. [AC1]

      - CLI: assert the rendered line is NOT the failure indicator used for `failed`. [AC2]

      - CLI regression: `failed` and `rejected` epics render exactly as before (exact-string /
      snapshot assertion, byte-for-byte). [AC3]

      - Web: the status union type includes `publish_pending` (type-level) and the frontend renderer
      maps it to the publish-pending label, not the failure style; `failed`/`rejected` rendering
      unchanged. [AC1, AC2, AC3]

      - Exhaustiveness: no `default`/fallthrough case silently renders `publish_pending` as failed —
      every consumer the zod enum flags has an explicit arm.


      Verification bar: across CLI and web surfaces a `publish_pending` epic shows the recoverable
      label (never a failure indicator), and `failed`/`rejected` output is identical to pre-change.
  - id: story-005-005
    title: Operator recovery command to drive a stranded epic to done
    description: >-
      Add an operator command that takes a publish-pending epic to `done` by opening the PR from the
      already-integrated, gate-green branch, recording the epic PR URL, and flipping the epic to
      `done`. It must be distinguishable from `reconcile`, and existing `reconcile` (gate-blocked)
      behavior must be unchanged.
    acceptance_criteria:
      - >-
        The command opens the PR from the gate-green finalizer-owned branch and records the epic PR
        URL
      - The command flips a recoverable epic to `done`
      - The recovery command is clearly distinguishable to the operator from `reconcile`
      - Existing `reconcile` gate-blocked behavior is unchanged
      - Any new CLI command/policy knob is reflected in docs/capabilities.md in the same change
    estimated_complexity: medium
    dependencies:
      - story-005-001
      - story-005-002
      - story-005-003
    tech_notes: >-
      Create `loom-cli/src/commands/publish.ts` → `EpicPublisher` with `publish(epicId):
      PublishResult` ({status:'published'|'noop'|'refused'|'failed'}). Refuse unless `epic.status
      === 'publish_pending'`; read `epic.finalize_ref`, open the PR with the finalizer's exact `gh
      pr create --head <finalize_ref>` path (via `execFileSync`), then in one transaction
      `recordPrUrl → clearFinalizePhase → audit → updateStatus('done')`. Leave `EpicReconciler`
      untouched — its precondition (already-merged into main) is the opposite of publish-pending;
      keep the verbs distinct. Per CLAUDE.md, add the `loom publish` row to `docs/capabilities.md`
      in the same change.
    test_plan: >-
      Level: INTEGRATION on `EpicPublisher.publish()` (real `EpicStore` over a temp DB, mock the `gh
      pr create`/`execFileSync` PR call) plus a docs assertion.


      Key cases:

      - Happy path: on a `publish_pending` epic, `publish(epicId)` reads `epic.finalize_ref`, calls
      `gh pr create --head <finalize_ref>` (the finalizer's exact path), then records the returned
      URL and flips status to `done`; returns `{status:'published', prUrl}`. [AC1, AC2]

      - Transaction ordering: assert the single-txn order `recordPrUrl → clearFinalizePhase → audit
      → updateStatus('done')`, and that an audit row is written (Key Invariant 5). [AC2]

      - Refusal precondition: calling `publish` on an epic NOT in `publish_pending` (e.g.
      `in_progress`, `failed`, `done`) returns `{status:'refused'}`, opens NO PR, and changes NO
      state — this is what makes it distinct from `reconcile`. [AC3]

      - PR-open failure: if `gh pr create` fails, returns `{status:'failed'}`, the epic stays
      `publish_pending`, and NO partial write (no URL, status not flipped) lands. [AC1 boundary]

      - `reconcile` untouched: `EpicReconciler`'s already-merged-into-`main` precondition and
      behavior are unchanged; an already-merged (not publish_pending) epic is refused by `publish`,
      confirming the two verbs do not overlap. [AC3, AC4]

      - Docs: `docs/capabilities.md` gains a `loom publish` row in the same change. [AC5]


      Verification bar: a `publish_pending` epic is driven to `done` with its PR URL recorded via
      one atomic transaction; any non-`publish_pending` epic is refused with no side effects;
      `reconcile` behavior is unchanged; and the capabilities page lists `loom publish`.
