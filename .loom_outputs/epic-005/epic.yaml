stories:
  - id: story-005-001
    title: 'Schema migration v15: finalize_phase, epic PR URL, and epic error'
    description: >-
      Add additive columns to the epics table for finalize_phase, the epic PR URL of record, and a
      runtime error message, via an ALTER TABLE migration in packages/loom-core/src/state/ with a
      SCHEMA_VERSION bump from v14 to v15. Extend EpicStatusSchema with finalizing and failed, and
      add the finalize_phase value type, in types.ts.
    acceptance_criteria:
      - >-
        SCHEMA_VERSION is bumped to v15 in Database.ts and the migration runs additively on an
        existing v14 DB without data loss
      - epics table gains columns for finalize_phase, epic PR URL, and a runtime error message
      - >-
        EpicStatusSchema includes finalizing and failed; a finalize_phase type
        (merging|gate|review|pushing|opening_pr) is defined in types.ts
      - EpicYamlSchema.status is left unchanged (failed is DB-only)
      - >-
        A co-located __tests__/ test asserts the v14→v15 migration applies and the new zod statuses
        parse
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      Foundation story — all others depend on it, so freeze the contract precisely. In
      `packages/loom-core/src/state/Database.ts`, bump the `SCHEMA_VERSION` constant 14→15 and add
      one idempotent block to `runMigrations()` following the existing v7–v14 `PRAGMA
      table_info`→conditional `ADD COLUMN` pattern (guard each with `if (!epicCols.some(c => c.name
      === '<col>'))`): `finalize_phase TEXT`, `epic_pr_url TEXT`, `error TEXT`, all nullable. In
      `packages/loom-core/src/types.ts` add `'finalizing'` and `'failed'` to `EpicStatusSchema` (the
      zod runtime enum only — leave `EpicYamlSchema.status` untouched per ADR-4), define `export
      type FinalizePhase = 'merging'|'gate'|'review'|'pushing'|'opening_pr'`, and add the three
      nullable fields to `EpicRecord` mirroring how `planning_phase` is already typed/nullable. The
      trade-off to know: this is a deliberate second overlay parallel to `planning_phase` (ADR-1),
      so mirror that column's nullability and read-mapping exactly rather than generalizing — a
      generic `phase` column would break the `PlanningPhase` typing. Co-locate a `__tests__/` test
      asserting the v14→v15 migration applies loss-free on a seeded v14 DB and that the new zod
      statuses parse.
    test_plan: >-
      Level: unit only — this is schema + zod typing with no I/O seams beyond the in-process SQLite
      file, so a co-located `__tests__/` unit test against a real (temp-file or in-memory)
      `better-sqlite3` DB is the cheapest confidence. Migration is a true seam (real DB), but it
      runs in-process so keep it unit-level. Key cases: (1) Happy — seed a DB at SCHEMA_VERSION 14
      with at least one existing epic row populated, run `runMigrations()`, assert SCHEMA_VERSION is
      now 15, the three columns (`finalize_phase`, `epic_pr_url`, `error`) exist via `PRAGMA
      table_info('epics')`, and the pre-existing row's data is intact with the new columns
      defaulting to NULL (loss-free, additive). (2) Idempotency — run migrations twice (or against a
      DB already at v15); the guarded `if (!epicCols.some(...))` blocks must not throw or
      double-add. (3) Fresh DB — a brand-new DB initializes directly at v15 with all columns
      present. (4) Zod parse — `EpicStatusSchema.parse('finalizing')` and `.parse('failed')`
      succeed; a bogus value still rejects. (5) Negative/guard —
      `EpicYamlSchema.status.parse('failed')` must THROW (failed is DB-only per ADR-4) and
      `'finalizing'` must also reject there; assert the plan-time enum still accepts only
      `planned|approved|in_progress|done|rejected`. (6) Type shape — assert `FinalizePhase` accepts
      each of `merging|gate|review|pushing|opening_pr` (a const round-trip or zod-mirror is fine)
      and that an `EpicRecord` carrying the three new nullable fields parses/round-trips.
      Verification bar: the v14→v15 migration applies additively and loss-free and is idempotent;
      `EpicStatusSchema` parses `finalizing`+`failed` while `EpicYamlSchema.status` rejects them;
      the three columns exist and `EpicRecord`/`FinalizePhase` types are present. Do not test SQLite
      itself — assert column presence and data survival, not driver behavior.
  - id: story-005-002
    title: Finalizing lifecycle and PR-URL recording in EpicFinalizer
    description: >-
      Drive the finalizing status and finalize_phase transitions (merging → gate → review → pushing
      → opening_pr) from EpicFinalizer.finalize() as a thin status overlay around existing steps,
      and persist the captured prUrl on the epic. Flip to done only once the PR URL is recorded; map
      each non-PR early-return path (skipped, gated, partial, push-gate confirm, no-remote,
      remote-not-allowed) to a defined terminal status without stranding a PR-less successful run.
    acceptance_criteria:
      - >-
        finalize() writes finalizing + the corresponding finalize_phase around each step without
        moving the existing step logic
      - The epic status becomes done only after the epic PR URL is persisted
      - The captured prUrl is persisted to the new epic PR-URL storage
      - >-
        Every early-return path lands in a documented terminal status and no successful PR-less path
        is left stranded
      - >-
        A co-located __tests__/ test covers the phase transitions and the done-requires-PR-URL
        invariant
    estimated_complexity: large
    dependencies:
      - story-005-001
    tech_notes: >-
      Largest story; edits `packages/loom-core/src/orchestrator/EpicFinalizer.ts` `finalize()`
      (signature UNCHANGED, still returns `FinalizeResult`) plus coordinates the `done` gate in
      `Supervisor.run()` (~lines 452–464). Wrap the existing steps with the new `EpicStore` methods
      from story-001 — `beginFinalizing(id,'merging')`, then `updateFinalizePhase` at
      gate→review→pushing→opening_pr — WITHOUT moving any of the six early-return paths (lines
      244–629); insert around them only (Constraint 4). Persist the captured `prUrl` (line ~593) via
      `recordPrUrl()` BEFORE any `status='done'` write, and move the supervisor's unconditional
      `'done'` flip to AFTER `finalize()` returns, gated on `epic_pr_url` being non-null (ADR-3
      write-ordering, no trigger). Honor the ADR-2 mapping table exactly: happy path→`done`;
      `merged`/`partial` push-gate-confirm and no-remote/remote-not-allowed→a defined
      terminal-but-not-`done` state (surface PR-less success via the finalizer `note`/`reason`, do
      NOT strand); `gated`→`in_progress` unchanged; `failed`→`fail(id, message)`. The one trade-off:
      `done` now strictly means 'a PR URL exists', so legitimately PR-less successes intentionally
      don't reach `done`. Co-located test must assert phase transitions and the `done ⇒ epic_pr_url
      != null` invariant.
    test_plan: >-
      Level: unit (integration-flavored) — exercise `EpicFinalizer.finalize()` and the `Supervisor`
      `done`-gate against a real temp `better-sqlite3` DB and a real `EpicStore`, but stub the
      external git/`gh`/gate seams so each `FinalizeResult` branch is deterministic (no network, no
      shell). This is the highest-risk story: the no-false-done invariant lives in code, so test it
      hard. Key cases (drive each `FinalizeResult` branch from ADR-2's mapping table): (1) Happy PR
      path — finalize opens a PR: assert phase advances `merging→gate→review→pushing→opening_pr`,
      `recordPrUrl()` is called and `epic_pr_url` is persisted BEFORE `status='done'` is written
      (assert ordering, not just final state — e.g. spy/record write sequence or assert that at the
      moment status flips, `epic_pr_url` is already non-null), and the epic ends `done`. (2)
      **Invariant** — `done ⇒ epic_pr_url != null`: there is NO path that reaches `done` with a null
      PR URL; assert directly. (3) `merged`/`partial` push-gate `confirm` — lands in the defined
      terminal-but-not-`done` state with the PR-less success surfaced via the finalizer
      `note`/`reason`, NOT stranded and NOT `done`. (4) `merged`/`partial` no-remote AND
      remote-not-allowed — both reach the PR-less-success terminal state (phases up to `pushing`),
      not `done`, not stranded. (5) `gated` (block mode) — status stays `in_progress` (unchanged
      behavior), `finalize_phase` up to `gate`. (6) `skipped` (no succeeded stories / per-story) —
      status unchanged, no PR URL, no `done`. (7) `failed` (push failed or `gh pr create` failed) —
      `fail(id, message)` writes `status='failed'` with a non-empty `error`, `finalize_phase`
      cleared. (8) Crash-between-writes — simulate failure after `recordPrUrl` but before the `done`
      flip; epic must read `finalizing`/terminal-non-done, never `done` (ADR-3). (9) Step logic
      untouched — assert the six early-return paths still return their original `FinalizeResult` and
      are not reordered (the overlay only wraps). Verification bar: every `FinalizeResult` branch
      maps to its ADR-2 terminal status; `done` is reachable ONLY after `epic_pr_url` is persisted
      (ordering proven, not just end-state); no PR-less successful path is stranded or mislabeled
      `done`; `failed` carries a retrievable error. Test observable status/phase/url state and call
      ordering — do not assert on the internal step implementations.
  - id: story-005-003
    title: Surface finalizing, finalize_phase, planning_phase, and PR URL across CLI + MCP
    description: >-
      Render the new finalizing status with its phase, the already-stored planning_phase, and the
      epic PR URL across loom status and loom_get_status. Make loom run print the epic PR URL at run
      end instead of the 'run loom status for PR links' fallback.
    acceptance_criteria:
      - >-
        loom status shows finalizing with the current finalize_phase, and shows the active
        planning_phase instead of (planning…)
      - loom_get_status payload includes finalize_phase, planning_phase, and the epic PR URL
      - loom run output ends with the epic PR URL for PR-producing runs
      - >-
        A co-located __tests__/ test asserts the rendered/serialized fields for finalizing,
        planning, and PR URL
    estimated_complexity: medium
    dependencies:
      - story-005-002
    tech_notes: >-
      Pure reader story (Constraint 2) — touch only render paths, never writers. In
      `packages/loom-cli/src/commands/status.ts` add `finalizing` (and any `failed`) entries to the
      `STATUS_ICONS` map and extend the per-epic render loop to print the live phase using the
      symmetric branch `status==='planning' ? planning_phase : status==='finalizing' ?
      finalize_phase : …` (ADR-1), replacing the bare `(planning…)`. In
      `packages/loom-mcp/src/mcp/tools/handlers.ts` the `renderEpic` closure already spreads
      optional fields conditionally — add `finalize_phase?`, `planning_phase?`, `epic_pr_url?`,
      `error?` the same way (present only when their status is live). For `loom run`, edit
      `packages/loom-cli/src/commands/run.ts` (~line 469) to query the epic row via
      `EpicStore.get()` after `supervisor.run()` returns and print `epic_pr_url`, replacing the 'run
      loom status for PR links' fallback (ADR-7 — read the persisted URL, don't widen
      `SupervisorRunResult`). Trade-off: one extra `EpicStore.get()` per epic at run end, negligible
      and keeps the run-result contract stable. Co-located tests assert the rendered/serialized
      fields for finalizing, planning, and PR URL.
    test_plan: >-
      Level: unit — pure reader story, so test the render/serialize functions directly against
      seeded epic rows (no live finalize, no orchestrator). Use a real `EpicStore` seeded into known
      states; assert on rendered strings (CLI) and returned objects (MCP). Key cases: (1) CLI `loom
      status` finalizing — seed `status='finalizing', finalize_phase='review'`; assert the row shows
      the `finalizing` icon/label AND the live phase text, NOT the old `(planning…)`/bare status.
      (2) CLI planning — seed `status='planning', planning_phase='architecture'`; assert it renders
      the active `planning_phase` (e.g. `architecture`) replacing the opaque `(planning…)`. (3) CLI
      symmetric branch — confirm a `finalizing` row shows `finalize_phase` and a `planning` row
      shows `planning_phase` and neither leaks the other's phase (ADR-1 symmetry). (4) CLI PR URL
      via `loom run` — after `supervisor.run()` returns, `run.ts` queries the epic row
      (`EpicStore.get()`) and prints `epic_pr_url`; assert a PR-producing run's tail prints the
      actual URL and NOT the 'run `loom status` for PR links' fallback. (5) MCP `loom_get_status`
      payload — `renderEpic` includes `finalize_phase` only when `status='finalizing'`,
      `planning_phase` only when `status='planning'`, `epic_pr_url` once recorded, and `error` when
      `status='failed'`; assert each optional field is ABSENT when its status isn't live
      (conditional spread, no null pollution). (6) STATUS_ICONS coverage — `finalizing` (and
      `failed`) have icon entries so the table doesn't render blank/undefined. Verification bar:
      `loom status` shows `finalizing`+phase and the active `planning_phase` (never `(planning…)`);
      `loom_get_status` serializes all four optional fields conditionally; `loom run` ends with the
      real PR URL. No writer logic touched — assert only on rendered output and serialized shape,
      not DB writes.
  - id: story-005-004
    title: Truthful failure taxonomy and re-attachable loom_start_epic
    description: >-
      Record an infra-killed planning run as failed (distinct from human rejected) with the error
      message retrievable, and backfill placeholder (planning…) titles with the real title once
      known. Make loom_start_epic return the epic id within seconds while planning continues
      in-process, re-attachable via the existing status tools, with the behavior documented.
    acceptance_criteria:
      - >-
        An infra-killed planning run lands as failed with a non-empty, retrievable error message —
        not rejected
      - Placeholder (planning…) titles are replaced with the real title once it is known
      - >-
        loom_start_epic returns the epic id within seconds and the run is re-attachable via
        loom_get_status / loom status
      - The in-process-continuation behavior of loom_start_epic is documented
      - >-
        A co-located __tests__/ test covers the failed-vs-rejected distinction and early epic-id
        return
    estimated_complexity: medium
    dependencies:
      - story-005-001
    tech_notes: >-
      Two writer-side fixes plus a doc note. In `packages/loom-core/src/orchestrator/Planner.ts`
      (~line 153) change the infra-killed catch from recording `'rejected'` to `fail(id, (err as
      Error).message)` so a crash is `failed` with a retrievable, non-empty message — distinct from
      a human `rejected` (ADR-4, FR-5); keep it the `.message` string not the full stack (Security
      Model). Reuse the existing `completePlanning(id, title?)` which already backfills the
      placeholder `(planning…)` title once known — call it from the planner rather than adding new
      title logic. In `packages/loom-mcp/src/mcp/tools/handlers.ts` make `loom_start_epic` return
      the epic id within seconds while planning continues in-process (fire-and-forget the planner
      promise, return the id immediately) so the run is re-attachable via `loom_get_status`/`loom
      status`; document this in-process-continuation contract in the tool description
      (`registry.ts`) and note it for story-006. Trade-off: an in-process detached planner means a
      process exit before completion leaves the epic in `planning` — which is the honest state.
      Co-located test covers failed-vs-rejected and the early epic-id return.
    test_plan: >-
      Level: unit, plus one light integration test for the early-return timing. Test the planner
      failure path and the MCP entry point against a real `EpicStore`; stub the planner's actual
      work (the LLM/persona run) so you can force a crash and control timing deterministically (no
      sleeps, no wall-clock — use a controllable promise/fake). Key cases: (1) Infra-killed →
      `failed` — force `Planner.run()` to throw at the infra point (~line 153); assert the epic
      lands `status='failed'` with a non-empty, retrievable `error` (the `.message`, not a stack),
      via `fail(id, msg)` — explicitly assert it is NOT `rejected`. (2) Human decline still
      `rejected` — the human-decline path remains `rejected` (regression guard so the taxonomy split
      is real, not a rename). (3) Error is a message string — assert `error` is the `(err as
      Error).message`, not the full multi-line stack (Security Model). (4) Title backfill — a run
      that started as placeholder `(planning…)` gets its title replaced via the existing
      `completePlanning(id, title?)` once the real title is known; assert the stored title is the
      real one, and that no new title-writing logic was introduced (reuse path). (5)
      `loom_start_epic` early return — assert it resolves with a non-empty epic id promptly while
      planning is still in flight (use a pending/controlled planner promise; assert the id returns
      BEFORE the planner promise resolves — deterministic, not a timeout race). (6) Re-attachable —
      after the early return, `loom_get_status`/`loom status` can look up that epic id and see it
      `planning` (with `planning_phase`); fire-and-forget didn't drop the row. (7) Detached-exit
      honesty — if the process/planner never completes, the epic stays `planning` (the honest
      state), not silently `done`/`failed`. Verification bar: an infra crash is `failed` with a
      retrievable message and is distinguishable from `rejected`; placeholder titles are backfilled
      via the reused method; `loom_start_epic` returns a usable epic id before planning finishes and
      that id is immediately re-attachable. Assert on stored status/error/title and on
      return-before-completion ordering; do not assert on planner internals.
  - id: story-005-005
    title: >-
      Payload hygiene: current-project default, opt-in federation, retry-row collapse, DAG
      completion copy
    description: >-
      Default loom_get_status to the current project and make cross-project federation opt-in via an
      explicit parameter. Verify the listLatestByEpic + history retry-row collapse holds on every
      path including CLI --json and close any duplicate-row leak. Replace BaseCliWorker's
      unconditional completion copy with DAG-accurate copy reflecting terminal-vs-has-dependents and
      whether the story changed code (commitCount).
    acceptance_criteria:
      - loom_get_status defaults to current-project scope; federation requires an explicit parameter
      - >-
        No duplicate blocked+done rows appear on any path, including CLI --json (one row per story
        with a history array)
      - >-
        Terminal-story completion copy names no nonexistent downstream stories and reflects whether
        the story changed code
      - >-
        A co-located __tests__/ test covers default scoping, no-duplicate-rows, and the
        completion-copy variants
    estimated_complexity: medium
    dependencies:
      - story-005-001
    tech_notes: >-
      Four hygiene fixes across MCP, state read, and the worker. (1) In
      `packages/loom-mcp/src/mcp/tools/handlers.ts` (~lines 430–438) flip `loom_get_status` default
      scope from federate-all to current-project, adding an explicit opt-in arg (e.g. `all_projects:
      true`) to `registry.ts`'s tool def and the handler's scan branch (ADR-6, FR-6) — this is a
      breaking default change, so the opt-in restores the old behavior. (2) Verify
      `AgentStore.listLatestByEpic` + history collapse yields one row per story (with a `history[]`
      array) on EVERY path including `loom status --json` in
      `packages/loom-cli/src/commands/status.ts`; close any duplicate blocked+done leak. (3) In
      `packages/loom-core/src/orchestrator/BaseCliWorker.ts` (~lines 374–389) make the completion
      summary consume `{ commitCount, hasDependents }` rather than its current unconditional copy;
      `commitCount` already exists on `WorkerResult` (WorkerRunner.ts:174) but `hasDependents` must
      be added as a NEW optional field on `WorkerAssignment` and set by the Supervisor from the epic
      DAG (ADR-5) — do NOT topo-derive it in the worker, since only the Supervisor holds the full
      story set. Trade-off: the new `WorkerAssignment.hasDependents?` is additive/optional, so mock
      and bench workers are unaffected when unset. Co-located test covers default scoping,
      no-duplicate-rows, and the completion-copy variants.
    test_plan: >-
      Level: unit — four independent hygiene fixes; test each against its own seam (MCP handler,
      state read, worker copy) with a real `EpicStore`/`AgentStore` and stubbed externals. Key
      cases: SCOPE — (1) default current-project: call `loom_get_status` with no scope arg on a DB
      holding multiple projects; assert ONLY the current project's epics return. (2) opt-in
      federation: with `all_projects: true`, assert peer/registered projects are included; assert
      the param exists in the `registry.ts` tool def. (3) regression: a caller that previously
      relied on federate-all gets current-only by default (the documented breaking change).
      RETRY-ROW COLLAPSE — (4) one row per story: seed a story with a blocked attempt then a done
      attempt (the classic duplicate `blocked`+`done`); assert `listLatestByEpic` returns exactly
      ONE row for it with the earlier attempt in a `history[]` array. (5) `--json` path: assert
      `loom status --json` emits the SAME collapsed shape (one row + history), closing the CLI
      duplicate-row leak specifically. COMPLETION COPY — (6) terminal + changed code
      (`hasDependents=false, commitCount>0`): copy names NO downstream stories and acknowledges code
      changed. (7) terminal + no code (`commitCount=0`): copy reflects 'no code changed' and still
      no downstream claim. (8) has-dependents (`hasDependents=true`): copy may reference downstream
      work (it truthfully exists). (9) `hasDependents` unset (mock/bench path): copy degrades safely
      (additive/optional field — no crash, no false downstream claim). Verification bar: default
      scope is current-project and federation is explicit/opt-in; every status path (MCP and CLI
      `--json`) yields exactly one row per story with history; completion copy is driven by
      `{commitCount, hasDependents}` and never invents downstream stories for a terminal one. Assert
      on returned rows and emitted copy strings, not on store internals.
