stories:
  - id: story-047-001
    title: Standalone (parentless) story record in the state model
    description: >-
      Resolve the central design question of whether stories can exist without an epic parent, and
      implement the chosen representation — a true standalone-story record or a minimal internal
      wrapper — in the state model. The result must give a standalone story a coherent id and
      null/standalone parent handling so downstream planning, dispatch, status, and provenance can
      treat it as a first-class story.
    acceptance_criteria:
      - >-
        A story can be persisted and retrieved without an epic-NNN parent (null-parent or standalone
        id scheme), using the architect's chosen representation.
      - >-
        Existing epic-parented stories continue to load and persist unchanged (no migration
        regression).
      - >-
        The standalone record exposes the fields a single story needs: id, title, description,
        acceptance criteria, technical notes.
      - Targeted unit tests cover creating, reading, and listing a standalone story record.
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      Bump `SCHEMA_VERSION` 23→24 in `packages/loom-core/src/state/Database.ts` with a single
      additive `ALTER TABLE epics ADD COLUMN kind TEXT` (NULL/'epic'=legacy,
      'standalone'=container), following the v23 `intake_verdict` precedent — never DROP/TRUNCATE.
      Relax `StorySchema.id` in `packages/loom-core/src/types.ts:630` from `/^story-\d{3}-\d{3}$/`
      to the backward-compatible superset `/^story-\d{3}(-\d{3})?$/`, and add
      `createStandalone(epicId,title)`, `isStandalone(epicId)`, and a `list({includeStandalone})`
      that excludes `kind='standalone'` by default to `packages/loom-core/src/state/EpicStore.ts`.
      The trade-off (ADR-002): keep the `agents.epic_id NOT NULL REFERENCES epics(id)` FK and model
      a standalone story as one `agents` row under a marked container row — do NOT make the FK
      nullable, which would force lease/dispatch/finalize rewrites.
    test_plan: >-
      Level: unit tests in loom-core (state layer + schema). This is pure persistence/schema work —
      no integration needed.


      Key cases:

      - [migration v24] Open a DB initialized at v23, run migration; assert SCHEMA_VERSION === 24
      and the additive `ALTER TABLE epics ADD COLUMN kind TEXT` ran. Assert pre-existing
      epics/agents rows survive with `kind` NULL (AC2 — no migration regression). Confirm migration
      never DROP/TRUNCATEs.

      - [createStandalone] `EpicStore.createStandalone(epicId, title)` inserts an epics row with
      `kind='standalone'`; `EpicStore.isStandalone(epicId)` returns true. A normal `createEpic`
      yields `kind` NULL/'epic' and `isStandalone` returns false.

      - [standalone story round-trip] Persist one `agents` row with `epic_id` = container `epic-NNN`
      and `story_id` = `story-NNN`; read it back and assert id, title, description,
      acceptance_criteria (>=1), and tech_notes survive intact (AC1, AC3).

      - [list exclusion] `EpicStore.list()` excludes `kind='standalone'` by default;
      `list({includeStandalone:true})` includes it (AC4 listing).

      - [epic-parented unchanged] Round-trip an existing `story-NNN-MMM` under a normal epic; assert
      load/persist identical to today (AC2).

      - [StorySchema regex] `StorySchema` parse accepts `story-047` AND `story-047-001`; rejects
      malformed (`story-47`, `story-1-2`, `storyfoo`) — proves the relaxed
      `/^story-\d{3}(-\d{3})?$/` is a strict superset (NFR-1).


      Verification bar: all four ACs proven by unit tests — a standalone story is
      created/read/listed without an epic-NNN parent semantics, every existing parented id and row
      still validates and loads unchanged, and the v24 migration is provably additive.
  - id: story-047-002
    title: Standalone planning path — route detection and lightweight single-story generation
    description: >-
      In the planner, branch to the standalone-story path exactly when intake_routing ∈ {advisory,
      confirm} and the effective (post-override) size is story; otherwise run the unchanged epic
      pipeline. On the standalone branch, produce exactly one story (title, description, acceptance
      criteria, technical notes) from the refined brief with no epic-level PRD and no multi-story
      decomposition pass. The classifier stays on the non-agentic path classifying the refined
      brief.
    acceptance_criteria:
      - >-
        Routing selects the standalone path only when intake_routing is advisory or confirm AND
        effective size=story after any operator override.
      - >-
        A confirm-mode story→epic override routes to the full epic pipeline; an epic→story override
        (if permitted) routes to the standalone path.
      - >-
        On the standalone path, no epic-level PRD is generated and no multi-story decomposition pass
        runs.
      - >-
        The standalone path emits exactly one story populated with title, description, acceptance
        criteria, and technical notes from the refined brief.
      - >-
        The classifier remains non-agentic and continues to classify the refined brief (placement
        unchanged).
      - Targeted tests cover the routing decision table including both override directions.
    estimated_complexity: medium
    dependencies:
      - story-047-001
    tech_notes: >-
      Add the single-source-of-truth predicate `isStandalone(routing?)` to
      `packages/loom-core/src/intake/routing.ts` returning `routing !== undefined && routing.size
      === 'story'`, then branch inside `Planner.run()` (`packages/loom-core/src/planner/Planner.ts`)
      AFTER `AnalystAgent` refines the brief — keep the `run(brief, reservedId)` signature
      unchanged. The standalone branch calls a new `StandaloneStoryAgent`
      (`packages/loom-core/src/planner/StandaloneStoryAgent.ts`) mirroring `PMAgent`'s shape but
      emitting exactly one `Story` with no PRD and no decomposition; apply prompt caching on its
      persona prompt (Invariant 3). The trade-off (ADR-001): gate on `routing` presence so
      `routing===undefined` (off path and classification failure) can never enter the branch, and
      place the branch in the planner not the CLI so MCP/test callers inherit it; note that
      confirm-mode story→epic override already lands as `size:'epic'` and correctly falls through to
      the epic pipeline.
    test_plan: >-
      Level: unit tests for the `isStandalone` predicate; unit/integration tests on `Planner.run()`
      with the LLM stubbed (`ctx.llm`) and spies on
      `PMAgent`/`ArchitectAgent`/`StandaloneStoryAgent`. No real LLM calls — routing is
      deterministic logic.


      Key cases:

      - [predicate table] `isStandalone(undefined) === false`; `isStandalone({size:'story',...}) ===
      true`; `isStandalone({size:'epic',...}) === false` (covers FR-1/FR-2/FR-3 guard).

      - [route to standalone] `Planner.run` with `routing` present and effective `size==='story'`
      (advisory and confirm) calls `StandaloneStoryAgent.run` exactly once and does NOT call
      `PMAgent.run` or the Architect decomposition pass (assert via spies — AC1, AC3).

      - [override directions] confirm-mode story→epic override arrives as `size:'epic'` → epic
      pipeline runs (`PMAgent` called); epic→story override → standalone path (AC2).

      - [off / classification-failure] `routing === undefined` → epic pipeline; never enters the
      standalone branch.

      - [single story emitted] On the standalone path exactly one `Story` is returned, populated
      with title, description, acceptance_criteria (>=1), and tech_notes from the refined brief
      (AC4).

      - [analyst + classifier placement] `AnalystAgent.run` executes on BOTH paths; assert the
      classifier (`classifyIntake`) runs non-agentically on the refined brief before planning and
      its placement is unchanged (AC5, FR-9).

      - [signature] `run(brief, reservedId)` signature unchanged (compile-time/call-site assertion).


      Verification bar: the full routing decision table is green including both override directions;
      on the standalone path zero PRD and zero decomposition stages execute (spy-verified) and
      exactly one populated story is produced.
  - id: story-047-003
    title: Standalone dispatch, single-PR finalize, and full provenance
    description: >-
      Dispatch the standalone story through the existing worker / branch / worktree /
      integration-gate machinery without modifying it, and finalize it to exactly one pull request
      with a coherent branch/PR naming scheme the finalize machinery accepts. Record decision
      traces, audit entries, and logs for the standalone story equivalent to a story under the epic
      path today.
    acceptance_criteria:
      - >-
        The standalone story dispatches via the existing story execution flow with no changes to
        worker/branch/worktree/integration-gate machinery.
      - >-
        Branch and PR naming for a standalone story is coherent and accepted by the finalize
        machinery without encoding a phantom epic id.
      - Finalize produces exactly one pull request for the standalone story.
      - >-
        Decision traces, audit_log entries, and logs are written for the standalone story equivalent
        to an epic-parented story.
      - Guardrails and the integration gate apply to the standalone story unchanged.
      - Targeted tests cover dispatch, single-PR finalize, and provenance write-through.
    estimated_complexity: medium
    dependencies:
      - story-047-001
      - story-047-002
    tech_notes: >-
      Dispatch the `kind='standalone'` container through the UNMODIFIED `Supervisor` →
      `WorktreeManager` → `IntegrationGate` → `EpicFinalizer` stack (FR-5) — it is keyed by
      `epic_id`, so a one-story container needs zero dispatch changes. Use branch name
      `story/story-NNN` (flat, no phantom epic segment) and rely on `EpicFinalizer.finalize(epic,
      stories)` yielding exactly one PR for a single-story container; provenance flows automatically
      because the standalone unit is a real `agents` row with an `agent_id`/`story_id` that the
      existing `audit_log` and `decision_traces` writers key off. The trade-off: resist touching the
      push/PR seams or the `policy.git.allowed_remotes` gate — guardrails (Invariant 1) and worktree
      isolation (Invariant 2) must apply structurally regardless of `kind`.
    test_plan: >-
      Level: integration tests driving `Supervisor → WorktreeManager → IntegrationGate →
      EpicFinalizer` against a temp/fake git remote; unit tests for branch naming; DB assertions for
      provenance. This story crosses real seams (dispatch, git, finalize), so integration is
      required — unit only for naming.


      Key cases:

      - [dispatch unmodified] A `kind='standalone'` container with one story leases via
      `loom_lease.epic_id` and runs through the existing worker/worktree flow with no machinery
      change — assert observable dispatch behavior matches an epic-parented story (AC1, FR-5).

      - [branch naming] Branch is `story/story-NNN` — flat, no phantom epic segment; assert the
      finalize machinery accepts it (AC2).

      - [single PR] `EpicFinalizer.finalize(epic, [story])` on a one-story container produces
      exactly ONE pull request (AC3, FR-6).

      - [provenance parity] After a standalone run, `audit_log` and `decision_traces` rows are
      written keyed off `agent_id`/`story_id`, equivalent in shape/coverage to an epic-parented
      story (AC4, FR-8).

      - [guardrail parity] Policy engine still exits non-zero for a forbidden command (Invariant 1);
      a push to a protected/disallowed remote is blocked by the unchanged
      `policy.git.allowed_remotes` gate regardless of `kind` (AC5, NFR-2).

      - [integration gate parity] The standalone story passes through the same `IntegrationGate`
      checks as any story.


      Verification bar: a standalone story dispatches and finalizes to exactly one PR over
      unmodified machinery, writes full audit/trace provenance equivalent to an epic-parented story,
      and is subject to identical guardrails and integration gate — no push/PR or allowed_remotes
      seam touched.
  - id: story-047-004
    title: Standalone story presentation in output and loom status
    description: >-
      Update user-facing output and loom status to present a standalone story by its story id with
      story framing, never as epic-NNN with one story, and without regressing epic display or
      trace/audit rendering for parented stories.
    acceptance_criteria:
      - >-
        A standalone-routed unit surfaces a story id with story framing in user-facing output and
        loom status.
      - It is never rendered as 'epic-NNN with 1 story'.
      - Epic display and existing parented-story rendering are unchanged (no regression).
      - Trace/audit rendering handles a parentless story id without error.
      - Targeted tests cover standalone-story rendering and confirm epic rendering is unchanged.
    estimated_complexity: small
    dependencies:
      - story-047-001
    tech_notes: >-
      Apply one render predicate — `epic.kind === 'standalone'` ⇒ render its single story with story
      framing — at every epic-enumeration site, primarily `packages/loom-cli/src/commands/status.ts`
      and the loom-web dashboard, never emitting 'epic-NNN with 1 story' (FR-7/Goal 2). Lean on
      `EpicStore.list()`'s default exclusion of standalone containers (story-047-001) so enumeration
      is correct by default rather than scattering `if (kind===…)` checks. The trade-off (ADR-005):
      trace/audit rendering must tolerate a parentless `story-NNN` id (no `-MMM` segment) without
      parsing it for an epic — any code inferring an epic from a story id needs the no-epic-segment
      form covered.
    test_plan: >-
      Level: unit tests on the render predicate in `packages/loom-cli/src/commands/status.ts` and
      the loom-web dashboard render function; string/snapshot assertions on rendered output.
      Presentation logic — unit level is sufficient and cheapest.


      Key cases:

      - [story framing] A `kind='standalone'` container renders its single story by its `story-NNN`
      id with story framing in `loom status` and web output (AC1).

      - [no one-story-epic] Output for a standalone container NEVER contains an `epic-NNN with 1
      story` framing — assert the forbidden string/shape is absent (AC2, Goal 2).

      - [epic regression] A normal multi-story epic still renders as `epic-NNN` with its stories
      unchanged (snapshot before/after) (AC3).

      - [enumeration default] Status enumeration relies on `EpicStore.list()` default exclusion so
      standalone containers don't leak as epics; assert the container is absent from the epic
      listing path and present via the story-framing path.

      - [parentless id rendering] Trace/audit rendering of a parentless `story-NNN` id (no `-MMM`)
      does not throw and does not attempt to infer an epic from the id (AC4).


      Verification bar: standalone work shows a story id with story framing and is never rendered as
      `epic-NNN with 1 story`; epic and existing parented-story rendering are byte-stable
      (snapshot), and parentless ids render without error.
  - id: story-047-005
    title: 'Golden/snapshot test proving intake_routing: off is byte-identical'
    description: >-
      Add a deterministic snapshot/golden test asserting that with intake_routing: off the planner
      runs the full epic pipeline with planning output byte-identical to today, regardless of brief
      size. Establish a stable, deterministic comparison point for the assertion.
    acceptance_criteria:
      - >-
        A golden/snapshot test captures the off-path planning output against a stable, deterministic
        reference.
      - The test asserts byte-identity of off-path planning output and fails on any drift.
      - The test runs deterministically in CI (no nondeterministic inputs in the compared output).
      - The test passes with the standalone-path changes present.
    estimated_complexity: small
    dependencies:
      - story-047-002
    tech_notes: >-
      Add a deterministic snapshot/golden test (in loom-core's planner test suite) that runs
      `Planner.run()` with `routing: undefined` (the `intake_routing: off` path) and asserts
      byte-identity against a frozen reference, independent of brief size. Scope the comparison to
      exclude nondeterministic fields — timestamps, token/usage counts, run ids — so it is stable in
      CI (ADR-006). The trade-off: the test must pass WITH the regex relaxation (story-047-001) and
      the new agent (story-047-002) present, proving those changes never alter off-path output; mock
      or stub the LLM so the snapshot is reproducible.
    test_plan: >-
      Level: a single deterministic golden/snapshot test in loom-core's planner suite with the LLM
      stubbed/mocked so output is reproducible. This is the proof artifact for NFR-1.


      Key cases:

      - [byte-identity] Run `Planner.run()` with `routing: undefined` and assert the planning output
      is byte-identical to a frozen reference — run for BOTH a story-sized and an epic-sized brief
      to prove size-independence (AC1, AC2).

      - [determinism scoping] The compared output excludes nondeterministic fields (timestamps,
      token/usage counts, run ids); assert the test is stable across repeated runs in CI (AC3).

      - [drift trip-wire] A deliberate change to off-path output makes the test fail (sanity-check
      the assertion actually bites).

      - [coexistence] The test passes WITH the StorySchema regex relaxation (story-047-001) and the
      new `StandaloneStoryAgent` (story-047-002) present — proving those changes never alter
      off-path output (AC4).


      Verification bar: the golden test asserts byte-identity of off-path planner output against a
      stable reference, runs deterministically in CI, fails on any drift, and is green with all
      standalone-path changes in place.
