stories:
  - id: story-012-001
    title: Branch the brief gate into three outcomes with distinct exit statuses
    description: >-
      Split the brief-quality gate into pass-clean, pass-with-clarifications, and below-threshold
      outcomes, assigning a new documented exit code to pass-with-clarifications without changing
      scoring or force-override semantics.
    acceptance_criteria:
      - >-
        The gate distinguishes three outcomes: pass-clean, pass-with-clarifications, and
        below-threshold.
      - >-
        Pass-clean (at or above threshold with no clarifications) proceeds to planning unchanged
        (FR-6).
      - Pass-with-clarifications exits with a status distinct from the below-threshold failure code.
      - A below-threshold brief continues to fail with its existing behavior and exit code (FR-8).
      - The gate critique remains audit-logged before returning (NFR-2).
      - The scoring threshold and force-override semantics are unchanged.
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      Extend `packages/loom-core/src/brief/types.ts` with the `GateOutcome` union (`'pass-clean' |
      'pass-with-clarifications' | 'below-threshold'`) and add `outcome` to `GateVerdict`, keeping
      `pass` defined as `outcome === 'pass-clean'` for back-compat (ADR-4). In
      `packages/loom-core/src/brief/gate.ts`, keep `evaluateBriefGate`'s signature unchanged but
      derive `outcome` from `quality_score`, `threshold`, and `ready` only — no new refiner fields.
      In `packages/loom-cli/src/commands/epic.ts`, switch `runEpic` on `verdict.outcome`:
      `pass-clean` → existing proceed/exit 0, `below-threshold` → existing reject/`process.exit(1)`
      untouched (FR-8), `pass-with-clarifications` → new block exiting `3` (avoid `2`, which means
      blocked-with-feedback in `commands/guard.ts`, per ADR-5) and document the new code in `epic`'s
      `spec.exitCodes`. Keep the critique `AuditLog.record()` write before any return/exit (NFR-2);
      the trade-off is `GateVerdict` now carries both `pass` and `outcome`, accepted to avoid a
      breaking signature change.
    test_plan: >-
      Levels: unit for `evaluateBriefGate` (pure — `outcome` derived from `quality_score`,
      `threshold`, `ready` only); integration for `runEpic` exit-code routing via the `capture()`
      helper. No dependency on the message wording (that's 012-002).


      Key cases — `evaluateBriefGate` (`brief/gate.ts`):

      - score ≥ threshold AND `ready: true` → `outcome === 'pass-clean'`, `pass === true`.

      - score ≥ threshold AND `ready: false` → `outcome === 'pass-with-clarifications'`, `pass ===
      false`.

      - score < threshold → `outcome === 'below-threshold'`, `pass === false`.

      - Boundary: score EXACTLY equal to threshold lands on the pass side (clean or
      with-clarifications per `ready`), not below-threshold.

      - Back-compat invariant: `pass === (outcome === 'pass-clean')` holds for all three outcomes
      (ADR-4).


      Key cases — `runEpic` (`commands/epic.ts`) via `capture()`:

      - pass-clean → proceeds to planning, exits 0 (FR-6 unchanged).

      - below-threshold → existing reject block, `process.exit(1)` — assert byte-for-byte unchanged
      behavior/exit (FR-8).

      - pass-with-clarifications → exits 3, distinct from the below-threshold 1 (ADR-5; assert it is
      not 0/1/2).

      - Audit ordering (NFR-2): the gate critique is written via `AuditLog.record()` BEFORE any
      return/`process.exit` in every branch — assert the record exists when the process exits.

      - `--force` bypasses all three branches, proceeds to planning, and writes the existing
      `brief_gate_forced` audit row.

      - Semantics-unchanged guard: threshold value and force-override path are not altered by this
      story.


      Verification bar: the three outcomes map to exit codes 0 / 3 / 1 respectively, the threshold
      boundary resolves to a pass, the critique is audit-logged before exit in all paths, and
      `--force` behavior is unchanged.
  - id: story-012-002
    title: Author the PASSED-with-clarifications message
    description: >-
      Render a clearly labeled pass-with-clarifications message that lists clarifications as
      optional and names the actual force flag as the way to plan as-is (or invites tightening the
      brief).
    acceptance_criteria:
      - >-
        On pass-with-clarifications, the gate prints a clearly labeled PASSED-with-clarifications
        message.
      - The message lists the open clarifications as optional.
      - >-
        The message names the actual force-flag spelling, confirmed against the CLI, as the way to
        plan as-is or invites tightening the brief.
      - The message is visibly distinct from the below-threshold rejection output.
    estimated_complexity: small
    dependencies:
      - story-012-001
    tech_notes: >-
      Author the `pass-with-clarifications` branch's `console.log` block in
      `packages/loom-cli/src/commands/epic.ts` (the branch added in story-012-001): a clearly
      labeled PASSED-with-clarifications header, the open `questions[]` from `BriefRefinement`
      listed as optional, and the actual `--force` flag spelling verbatim as the way to plan as-is
      (or an invitation to tighten the brief). Confirm the flag's real spelling against the
      command's option definition in `epic.ts` rather than assuming it, and make the output visibly
      distinct from the `below-threshold` `console.error` rejection block.
    test_plan: >-
      Level: integration — assert on `runEpic`'s captured stdout/stderr for the
      pass-with-clarifications branch via `capture()`. Depends on story-012-001's `outcome` branch
      existing.


      Key cases:

      - On `pass-with-clarifications`, stdout contains a clearly labeled PASSED-with-clarifications
      header.

      - The open `questions[]` from `BriefRefinement` are printed and framed as OPTIONAL (assert the
      optional framing, not just that questions appear).

      - The message contains the ACTUAL `--force` flag spelling taken from the command's option
      definition in `epic.ts` (the test should reference the same flag constant/definition rather
      than hardcoding a guess), presented as the way to plan as-is — or an invitation to tighten the
      brief.

      - Visible distinctness: the pass-with-clarifications stdout differs from the below-threshold
      `console.error` rejection text (assert it does not reuse the rejection block's label/phrasing
      and is emitted on the success-style channel, not as a rejection).


      Verification bar: a pass-with-clarifications run prints a distinctly labeled message that
      lists clarifications as optional and names the real force flag, and is unmistakably different
      from the below-threshold rejection output.
