stories:
  - id: story-022-001
    title: Wire classifier into loom weave with best-effort observe-only persistence
    description: >-
      Make `loom weave` call the IntakeClassifier before invoking the epic planner and persist the
      resulting verdict against the created epic in all three existing sinks (database column, audit
      log, status surface). Persistence is best-effort and strictly observe-only.
    acceptance_criteria:
      - '`loom weave` invokes the classifier before the epic planner runs.'
      - >-
        The resulting verdict is persisted against the created epic to the database column, the
        audit log, and the status surface.
      - >-
        A classifier failure (timeout, parse failure, or other error) does not block or abort weave;
        the epic is still planned and created.
      - >-
        An end-to-end test exercises the real weave code path and asserts a non-null verdict is
        persisted to all three sinks (the test absent in Phase 0).
      - >-
        A diff test shows planning and execution output is byte-identical with the verdict present
        vs. absent.
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      Add an optional `intake?: IntakeStage` hook to `runEpic` (packages/loom-cli, `epic.ts`) firing
      right after epic-id reservation (~epic.ts:89) and before `Planner.run` — `loom weave`
      (`runWeave`) passes it, `loom epic` does not (ADR-009/010). Wrap the `classifyIntake` call so
      every failure collapses to a recorded `null` and never throws upward (FR-3), then fan the
      `ClassifyResult` to all three existing sinks: `EpicStore.recordIntakeVerdict(id, verdict)`
      (EpicStore.ts:454) on success, `AuditLog.record({ action: 'intake_classified', detail: {
      epicId, ok, reason?, verdict? } })` on every attempt, and rely on `status.ts:321` reading the
      column. Add the missing end-to-end test asserting a non-null verdict in all three sinks, plus
      the observe-only diff test asserting byte-identical planning/execution output with the verdict
      present vs. absent (NFR-1, sacred); the one trade-off: `runEpic` now carries an optional
      branch rather than a standalone orchestrator, accepted to avoid plumbing the reserved id
      across module boundaries.
  - id: story-022-002
    title: Fit and expose a backend-appropriate classification timeout
    description: >-
      Replace the hardcoded 20s classification timeout with a bound that accommodates the ~100s real
      session-backend latency and make it configurable.
    acceptance_criteria:
      - The fixed 20s timeout is replaced with a generous default comfortably above ~100s.
      - The timeout is configurable.
      - A single cheap classification is never capped below the backend's real latency.
    estimated_complexity: small
    dependencies: []
    tech_notes: >-
      Replace the hardcoded 20s default in `classifyIntake` (IntakeClassifier.ts) with
      `INTAKE_TIMEOUT_DEFAULT_MS = 180_000`, keep the existing `Promise.race` enforcement, and
      source the effective value as `max(policy.agents.intake_classify_timeout_ms ??
      INTAKE_TIMEOUT_DEFAULT_MS, INTAKE_TIMEOUT_FLOOR_MS)` with `INTAKE_TIMEOUT_FLOOR_MS = 120_000`.
      Add the optional key `intake_classify_timeout_ms: z.number().int().min(1000).optional()` to
      `PolicySchema.agents` (the only new config surface — rides the existing `PolicyEngine.load`).
      The hard floor structurally guarantees FR-5: even a misconfigured `policy.yaml` cannot cap one
      cheap call below backend latency; trade-off is a genuinely hung backend stalls weave up to ~3
      min before the best-effort path gives up.
  - id: story-022-003
    title: Harden JSON verdict extraction from prose- and fence-wrapped output
    description: >-
      Harden the classifier's verdict extraction so responses wrapped in surrounding prose or
      markdown fences still yield a parseable verdict, using a more forceful instruction and an
      assistant prefill that opens the JSON object where it helps.
    acceptance_criteria:
      - Verdict extraction recovers the JSON object from responses wrapped in surrounding prose.
      - Verdict extraction recovers the JSON object from responses wrapped in markdown fences.
      - >-
        The classifier uses a more forceful instruction and, where it helps, an assistant prefill
        that opens the JSON object.
      - >-
        Tests feed realistic prose- and fence-wrapped responses (not idealized pure JSON) through
        the parsing path and confirm a parseable verdict.
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      Promote `IntakeJudge`'s tolerant `extractJsonBlock` into a single owned module
      `packages/loom-core/src/llm/extractJson.ts` exporting `extractJsonObject(text): unknown`, and
      call it from BOTH the judge and the classifier — this kills the divergence where
      `IntakeClassifier.ts:57` used bare `JSON.parse` while the judge tolerated prose/fences
      (ADR-012). Add a forceful system instruction plus an assistant-turn prefill (`messages: [...,
      { role: 'assistant', content: '{' }]`, re-prepending `{` to the response) to steer the Haiku
      model toward emitting the bare object. Always `IntakeVerdictSchema.safeParse` after extraction
      so a malformed-but-salvaged object degrades to `reason: 'invalid_output'`, never a corrupt
      verdict; tests must feed realistic prose- and fence-wrapped responses, not idealized pure
      JSON.
  - id: story-022-004
    title: Make the eval go/no-go gate fail closed with honest reporting
    description: >-
      Harden the offline intake eval gate so it fails closed: require a minimum number of
      successfully scored cases before PROCEED is possible, downgrade to DO NOT PROCEED or
      INCONCLUSIVE on high failure/inconclusive rates, and surface failure-reason counts instead of
      silently dropping failed cases.
    acceptance_criteria:
      - PROCEED is impossible without a minimum number of successfully scored cases.
      - >-
        The gate reports DO NOT PROCEED or INCONCLUSIVE when the classifier-failure rate or
        judge-inconclusive rate exceeds a low threshold.
      - >-
        The report surfaces failure-reason counts (timeout, invalid output, other errors) rather
        than silently dropping failed cases.
      - >-
        A run where all classifier calls fail produces a non-PROCEED decision with failure-reason
        counts surfaced.
      - The chosen minimum-scored-cases count and rate thresholds are recorded.
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      Rewrite the gate in `scoreIntakeEval.ts` (the fail-open `continue` at ~lines 29/95 is the
      defect) as a pure `decideGate(report)` returning tri-state `GateDecision` ('PROCEED' |
      'DO_NOT_PROCEED' | 'INCONCLUSIVE'); `PROCEED` is unreachable unless `scored ≥ minScoredCases`,
      with `classifierFailureRate`/`judgeInconclusiveRate` above threshold downgrading to
      DO_NOT_PROCEED/INCONCLUSIVE (ADR-013). Extend `IntakeEvalReport` (intakeEvalTypes.ts) with
      `failureCounts` (timeout/invalid_output/llm_error/scored/total), the recorded `thresholds`
      (start at `minScoredCases=18`, `maxClassifierFailureRate=0.10`,
      `maxJudgeInconclusiveRate=0.10`), and replace `overall: { proceed: boolean }` with `overall: {
      decision, statement }` — update `renderIntakeReport()` so the .md and .json stay in lockstep.
      Map the decision to exit codes in `scripts/eval-intake.mjs` (PROCEED→0, DO_NOT_PROCEED→1,
      INCONCLUSIVE→2); cover the canonical all-22-fail case asserting `scored=0` yields
      INCONCLUSIVE, never PROCEED.
  - id: story-022-005
    title: Re-run the eval and record per-axis accuracy and the honest gate decision
    description: >-
      Re-run the offline intake eval against the labeled set with the hardened classifier and
      fail-closed gate, confirm parseable verdicts across cases, and record per-axis accuracy and
      the gate's honest go/no-go decision in the report.
    acceptance_criteria:
      - The eval is re-run against the labeled set end-to-end.
      - >-
        Cases produce parseable verdicts, including ones recovered from prose- and fence-wrapped
        output.
      - Per-axis accuracy is recorded in the report.
      - The gate's honest decision is recorded (an honest DO NOT PROCEED is an acceptable outcome).
    estimated_complexity: small
    dependencies:
      - story-022-002
      - story-022-003
      - story-022-004
    tech_notes: >-
      Re-run `scripts/eval-intake.mjs` against the existing labeled case set with the hardened
      classifier (-002/-003) and fail-closed gate (-004), then commit the regenerated
      `.loom/eval/intake-report.{md,json}` with real per-axis accuracy and the gate's honest
      decision. This is a measurement task, not an accuracy-improvement task: a legitimate
      `DO_NOT_PROCEED` is the accepted, recorded outcome (ADR-014) — do not tune the classifier or
      force PROCEED. Confirm cases recovered from prose- and fence-wrapped output parse correctly as
      part of the run.
