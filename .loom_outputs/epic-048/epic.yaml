stories:
  - id: story-048
    title: Make loom revert remove lingering worktrees before deleting branches
    description: >-
      Fix `loom revert` so it no longer crashes on epics that have lingering git worktrees. Today
      `EpicReverter` deletes the epic and story branches with `git branch -d/-D` without first
      removing the worktrees still holding those branches checked out, so git refuses with 'cannot
      delete branch <name> used by worktree' and the revert aborts partway through. This is the
      common path for any epic that was stopped, blocked, or abandoned mid-flight, leaving an
      integration worktree at `.loom/integration/<epic-id>` and one or more story worktrees at
      `.loom/worktrees/<story-id>` behind. Make `EpicReverter` worktree-aware: before deleting any
      branch, remove the worktree(s) that have it checked out and prune stale worktree metadata, in
      the strict order worktree removal → prune → branch delete, so branch deletion always operates
      on branches no worktree is holding. The result is a revert that completes in a single command
      with no manual `git worktree remove` cleanup.
    acceptance_criteria:
      - >-
        Before deleting the epic branch, `EpicReverter` removes the epic's integration worktree at
        `.loom/integration/<epic-id>` (path derived from the epic ID).
      - >-
        Before deleting each story branch, `EpicReverter` removes the corresponding lingering story
        worktree at `.loom/worktrees/<story-id>` (path derived from the story ID).
      - >-
        `EpicReverter` runs `git worktree prune` to clear stale worktree metadata after removing
        worktrees and before deleting any branch.
      - >-
        Worktree removal, prune, and branch deletion execute in the order: worktree removal → prune
        → branch delete.
      - Clean worktrees are removed without the `--force` flag (non-force removal).
      - >-
        Attempting to remove a worktree that has already been removed is treated as success rather
        than an error, so re-running revert after a partial prior run completes idempotently.
      - >-
        Reverting an epic that has a lingering integration worktree completes successfully with no
        manual worktree cleanup, and both the integration worktree directory and the epic branch are
        gone afterward.
      - >-
        Reverting an epic with lingering story worktrees deletes their story branches without
        producing the `cannot delete branch used by worktree` error.
      - >-
        Reverting an epic that has no lingering worktrees still succeeds (no regression to the
        previously-working path).
      - >-
        A new regression test sets up an epic with a lingering integration worktree, runs revert,
        and asserts both the worktree and its branch are gone.
    estimated_complexity: small
    dependencies: []
    tech_notes: >-
      Single-module change to `EpicReverter` (in packages/loom-core) plus one new regression test;
      do not touch the revert CLI surface, policy engine, or other modules. In the branch-deletion
      path, before each `git branch -d/-D`, remove the holding worktree with `git worktree remove
      <path>` (non-force) and tolerate a missing worktree (e.g. catch/ignore the 'is not a working
      tree' / path-not-found failure and treat it as success for idempotency). Derive paths from IDs
      using the fixed conventions: integration worktree at `.loom/integration/<epic-id>`, story
      worktrees at `.loom/worktrees/<story-id>`. Run a single `git worktree prune` after removals
      and before branch deletes — per-worktree pruning is not required. Enumerate story IDs from
      existing planning/state metadata the reverter already has; if that is unavailable, fall back
      to scanning `.loom/worktrees/`. Preserve non-force removal so a dirty worktree's failure
      surfaces (abort with a clear message) rather than silently discarding uncommitted work —
      confirm this dirty-worktree behavior during implementation per the brief's open question.
      Ordering is load-bearing: worktree removal → prune → branch delete; reversing it reproduces
      the original crash.
