stories:
  - id: story-014-001
    title: Investigate and fix cumulative stream-json usage harvest
    description: >-
      Investigate the claude-code `stream-json` usage harvest to find where usage is lost (parse,
      accumulation, or persistence), then fix it to accumulate usage across the full stream and
      persist cumulative input, output, cached, and cache-creation totals plus request-count.
    acceptance_criteria:
      - >-
        The root cause of the under-count is identified and documented (parse, accumulation, or
        persistence), following the evidence rather than the leading hypothesis alone
      - Usage is accumulated across the full worker stream, not a partial or final delta
      - Persisted input, output, cached, and cache-creation totals reflect cumulative run usage
      - The request-count column is populated from the same accumulated harvest
      - The backend-reported cost figure is not modified
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      Per ADR-004, investigate before editing: the leading suspect is `result.usage` at
      `ClaudeCodeWorker.ts:193` carrying only the final turn's delta, while the true cumulative
      total should come from summing `assistant`-event `message.usage` (around line 216) or a
      session-cumulative field — confirm with evidence, then fix inside
      `parseStreamLine`/`parseUsage`, NOT `mergeWorkerUsage` (the cross-spawn fold is already
      correct). Also populate `request_count` from a real stream signal such as `num_turns` on the
      `result` event instead of the hardcoded `requestCount: 1` at `ClaudeCodeWorker.ts:200`. The
      one trade-off the implementer must pin precisely: REPLACE-vs-ADD semantics across `assistant`
      events, since getting it wrong silently double- or under-counts; and `cost_usd` must remain
      the backend `total_cost_usd`, untouched (NFR-2).
    test_plan: >-
      Level: unit for the stream parser/accumulator (`parseStreamLine`/`parseUsage`); integration
      for persistence via `setUsage`. Per ADR-004, the investigation must confirm root cause (parse
      vs accumulation vs persistence) before code changes — tests then lock the discovered
      semantics.


      Key cases (each AC mapped):

      - [AC1] Document the root cause with evidence (leading suspect: `result.usage` at
      ClaudeCodeWorker.ts:193 carrying only the final turn's delta vs. cumulative from summing
      `assistant` `message.usage` near line 216). The fix lives in `parseStreamLine`/`parseUsage`,
      NOT `mergeWorkerUsage` (cross-spawn fold already correct).

      - [AC2+AC3] Replay a multi-event stream (several `assistant` events each carrying
      `message.usage`, then a final `result`) and assert the accumulated `WorkerUsage` equals the
      summed stream usage — pinning the REPLACE-vs-ADD semantics precisely so totals neither double-
      nor under-count. Assert persisted `tokens_input/output/cached/cache_creation` equal those
      cumulative totals.

      - [AC4] `request_count` is derived from a real stream signal (e.g. `num_turns` on the `result`
      event), not the hardcoded `requestCount: 1` at ClaudeCodeWorker.ts:200 — assert it equals the
      turn count (>1 for a multi-turn fixture).

      - [AC5] `cost_usd` remains the backend `result.total_cost_usd`, untouched by the harvest fix —
      assert it is unchanged by accumulation (NFR-2).

      - [edge] Missing/empty usage fields default to 0 (not NaN/undefined); cache_read vs
      cache_creation handled exactly as the backend stream emits (no synthetic split).


      Verification bar: root cause documented from evidence; persisted token totals equal the
      cumulative summed stream usage; `request_count` reflects real turns; `cost_usd` is
      byte-for-byte the backend value.
  - id: story-014-002
    title: Add regression test replaying a representative usage stream
    description: >-
      Add a regression test that drives a representative `stream-json` usage sequence and asserts
      the persisted totals equal the summed usage across the stream.
    acceptance_criteria:
      - A test replays a representative `stream-json` usage sequence through the harvest
      - >-
        The test asserts persisted totals (input, output, cached, cache-creation) equal the summed
        usage across the stream
      - The test passes within the existing suite
    estimated_complexity: small
    dependencies:
      - story-014-001
    tech_notes: >-
      Add a `node:test` regression following the existing `WorkerUsageAccumulation.test.ts` /
      `CursorAgentWorkerStream.test.ts` style: replay a representative scripted `stream-json`
      sequence through the harvest and assert the persisted
      `tokens_input/output/cached/cache_creation` and `request_count` equal the summed stream usage
      (FR-9). The fixture is the executable definition of 'cumulative' that locks the semantics
      story-014-001 discovers. Trade-off: the fixture encodes claude-code's current stream event
      shape, so it must be updated if the backend changes its `stream-json` format — an explicit,
      updatable fixture is preferred over trusting an undocumented field implicitly.
    test_plan: >-
      Level: a `node:test` regression following the `WorkerUsageAccumulation.test.ts` /
      `CursorAgentWorkerStream.test.ts` style — the executable definition of 'cumulative' that locks
      the semantics found in story-014-001.


      Key cases (each AC mapped):

      - [AC1] Build a representative scripted `stream-json` fixture: a `system/init` line, multiple
      `assistant` events with `message.usage`, and a final `result` carrying `num_turns` and
      `total_cost_usd`. Replay it through the real harvest path.

      - [AC2] Assert persisted `tokens_input`, `tokens_output`, `tokens_cached`,
      `tokens_cache_creation` each equal the summed usage across the fixture stream; assert
      `request_count` equals the derived turn count; assert `cost_usd` equals the fixture
      `total_cost_usd` (telemetry vs. cost separation).

      - [AC3] The test is discovered and passes within the existing suite (`npm run test`).


      Verification bar: a replay regression asserts persisted cumulative `tokens_*` and
      `request_count` equal the summed fixture usage (and cost equals the backend value), passes in
      the existing suite, and would fail if a future refactor reintroduced the partial-delta
      under-count.
