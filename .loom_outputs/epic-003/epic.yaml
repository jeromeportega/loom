stories:
  - id: story-003-001
    title: Make checkShellMetacharacters redirection-aware while preserving backgrounding block
    description: >-
      Update the metacharacter regex logic in PolicyEngine.checkShellMetacharacters so
      fd-duplication/redirection forms (2>&1, >&2, m>&n, &>file, >&-, plus symmetric cases like <&
      and n<&m) are permitted, while trailing 'cmd &' and mid-command 'a & b' backgrounding remain
      blocked. Extend the existing suite in packages/loom-core/src/__tests__/PolicyEngine.test.ts to
      pin both directions.
    acceptance_criteria:
      - >-
        loom guard check --command "npm test 2>&1" exits 0; same for "npm test >&2" and "npm test &>
        out.log"
      - >-
        loom guard check --command "sleep 10 &" and --command "a & b" exit non-zero citing
        backgrounding
      - >-
        All pre-existing metacharacter blocks (;, &&, ||, backticks, $() ) remain blocked and the
        full existing metacharacter test suite stays green
      - >-
        New tests in PolicyEngine.test.ts cover permitted redirection forms (including symmetric <&
        cases), blocked backgrounding forms, and at least one ambiguous form that stays blocked
        (fail-safe)
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      Add a module-level stripRedirectionForms() in
      packages/loom-core/src/guardrails/PolicyEngine.ts, sibling to stripQuoted(), applying the five
      closed-set regexes (\d*>&\d+, \d*<&\d+, \d*>&-, \d*<&-, &>>?) and replacing each match with a
      metacharacter-free placeholder; wire it into checkShellMetacharacters as stripQuoted(raw) →
      stripRedirectionForms(...) → the existing blockers loop, which stays byte-for-byte unchanged
      (do NOT touch the /(?<!&)&(?!&)/ backgrounding regex per ADR-1). Extend
      packages/loom-core/src/__tests__/PolicyEngine.test.ts with permitted forms (2>&1, >&2, n<&m,
      &>out.log, 2>&-), blocked backgrounding (trailing 'cmd &', 'a & b'), still-blocked chaining
      smuggled past redirection (foo 2>&1 && rm -rf /), and at least one ambiguous form like '>&
      $FD' that must stay blocked. Trade-off: anything outside the five token forms keeps its & and
      stays blocked — fail-safe over completeness.
    test_plan: >-
      Level: unit only, extending packages/loom-core/src/__tests__/PolicyEngine.test.ts — this is
      pure string classification, no seams. Test through the public check()/checkShellMetacharacters
      surface, never by calling stripRedirectionForms() directly, so the tests survive internal
      refactors. Cases: (1) PERMITTED — each closed-set form passes: 'npm test 2>&1', 'npm test
      >&2', 'cmd 3>&2' (m>&n), 'cmd <&0', 'cmd 4<&3' (n<&m symmetric), 'cmd 2>&-', 'cmd <&-', 'npm
      test &> out.log', 'npm test &>> out.log'. (2) BLOCKED backgrounding — 'sleep 10 &' (trailing)
      and 'a & b' (mid-command) fail with the backgrounding reason specifically, not a generic
      message. (3) UNCHANGED blockers — one case each for ';', '&&', '||', backticks, '$(': all
      still blocked. (4) SMUGGLING — 'foo 2>&1 && rm -rf /' is blocked (stripping the redirection
      token must not eat the '&&'), and 'foo 2>&1 ; bar' likewise. (5) AMBIGUOUS/fail-safe — '>&
      $FD' is blocked; add '{fd}>&1' as a second exotic form that stays blocked. (6) MIXED — 'npm
      test 2>&1 &' is blocked: redirection stripped, trailing '&' still caught. Verification bar:
      all new cases green AND the entire pre-existing metacharacter suite passes untouched; a
      reviewer can point at one test for each direction of each AC.
  - id: story-003-002
    title: Implement gate-command preflight check with bare-worktree prerequisite heuristics
    description: >-
      Build a preflight that validates the configured-or-auto-detected test_command against
      bare-worktree structural prerequisites (lockfile present for npm test, Makefile target exists
      for make test), exposing the gate's command-detection logic from IntegrationGate so other
      surfaces can call it. The result is advisory data only and never blocks anything.
    acceptance_criteria:
      - >-
        Preflight resolves the same test_command the integration gate would use (configured or
        auto-detected)
      - >-
        Preflight flags npm test without a lockfile and make test without the Makefile target as
        non-viable
      - On failure, the message states exactly which test_command to set
      - >-
        Detection/preflight logic is callable outside IntegrationGate without changing gate
        execution semantics or warn/block behavior
      - Unit tests under __tests__/ cover viable and non-viable detection cases
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      Create packages/loom-core/src/orchestrator/GatePreflight.ts owning resolveGateCommand() and
      preflightGateCommand() returning the ResolvedGateCommand / GatePreflightResult shapes from the
      architecture; move the bodies of IntegrationGate's private detectCommand, findScopedTestDir,
      resolveDiffRange, and commonAncestor here and have IntegrationGate.ts delegate via one
      internal call so resolution is identical by construction (ADR-2). Accept injectable
      fileExists/fileReader probes mirroring IntegrationGateOptions so unit tests in src/__tests__/
      need no disk; implement the structural viability table (npm test → lockfile at cwd, make test
      → ^test: target in Makefile, pytest → pytest config, configured → annotate only) and always
      populate recommendation when !viable, e.g. 'npm ci && npm test'. Export from
      orchestrator/index.ts. Trade-off: preflight is pure data with zero blocking power — viability
      is structural-only and may report viable for commands that still fail at runtime.
    test_plan: >-
      Level: unit only, in packages/loom-core/src/__tests__/ — use the injectable
      fileExists/fileReader probes so no test touches disk. Cases for resolveGateCommand(): (1)
      configured testCommand wins with source 'configured'; (2) auto-detect yields source
      'auto-detected' with the same command IntegrationGate previously detected (port the gate's
      existing detection tests or add a delegation assertion so IntegrationGate.run() resolves via
      GatePreflight — identical-by-construction is the AC, prove it); (3) nothing resolvable yields
      source 'none' and command undefined. Cases for preflightGateCommand(): (4) 'npm test' +
      lockfile present at cwd → viable, reasons empty; (5) 'npm test' + no lockfile → viable false,
      recommendation exactly 'npm ci && npm test'; (6) 'make test' + Makefile with '^test:' target →
      viable; (7) 'make test' + Makefile missing the target (and Makefile absent entirely) →
      non-viable with a named test_command recommendation; (8) pytest with and without a pytest
      config; (9) source 'none' → reported informational, suggestion to set test_command; (10)
      configured command → reported viable/annotated only. Invariant cases: recommendation is always
      populated when viable is false (assert across all non-viable cases), and preflightGateCommand
      never throws on a missing/unreadable file (probe returns null). Also keep
      IntegrationGate.test.ts green unmodified — gate semantics untouched is an AC. Verification
      bar: every row of the architecture's viability table has a passing named test, and the failure
      messages contain the literal test_command string an operator would paste.
  - id: story-003-003
    title: Surface preflight in loom doctor and advisory warnings in loom epic and loom run
    description: >-
      Add the gate-command preflight as a self-contained loom doctor check, and emit a loud advisory
      warning from loom epic and at loom run start when the epic will use the integration gate with
      a non-viable command. Warnings never block a run.
    acceptance_criteria:
      - >-
        loom doctor reports the gate-command preflight result, and the addition is self-contained
        (no shared edits that would conflict with the concurrent doctor-extending epic)
      - >-
        loom epic and loom run emit the advisory warning when the gate will be used with a
        non-viable command, naming the test_command to set
      - No code path allows preflight alone to block or fail a run
      - Tests cover the doctor check output and the warning emission at plan time and run start
    estimated_complexity: medium
    dependencies:
      - story-003-002
    tech_notes: >-
      Create two new loom-cli files: packages/loom-cli/src/commands/doctorGateCheck.ts exporting
      gateCommandCheck() returning doctor's existing Check shape with required: false hard-coded,
      and gatePreflightWarning.ts exporting maybeWarnGatePreflight(projectRoot, policy) that prints
      a loud console.warn block when integration_gate !== 'off' and preflightGateCommand() reports
      non-viable, naming the exact test_command to set. Wire each with exactly one insertion line: a
      checks.push(...) in doctor.ts (ADR-4 — a sibling epic is concurrently editing doctor.ts, keep
      your diff to one line), a call in runEpic() after policy load, and one in runRun() before
      supervisor.run(). The function returns void and must never exit or throw outward (NFR-2).
      Trade-off: message formatting is duplicated between the doctor check and the run-start warning
      by design (ADR-3) — the surfaces want different verbosity.
    test_plan: >-
      Level: unit, in loom-cli's __tests__/, mocking preflightGateCommand and capturing console.warn
      — the logic is pure rendering/wiring, no disk or process needed. Cases for gateCommandCheck():
      (1) viable preflight → Check with ok true; (2) non-viable → ok false with the test_command
      recommendation in detail; (3) required is false in BOTH cases (this is the NFR — assert it
      explicitly so a future edit can't flip doctor's exit code). Cases for
      maybeWarnGatePreflight(): (4) integration_gate !== 'off' + non-viable → exactly one
      console.warn block naming the test_command to set; (5) gate 'off' → silent; (6) viable →
      silent; (7) preflight throws internally → function swallows it, returns void, no exception
      escapes (pin NFR-2 structurally: wrap in a test that fails if anything propagates); (8) never
      calls process.exit (stub it and assert zero calls). Wiring cases: (9) runEpic invokes
      maybeWarnGatePreflight after policy load and still proceeds when non-viable; (10) runRun
      invokes it before supervisor.run() and supervisor.run() is still called — i.e., the warning
      provably does not block. Verification bar: doctor renders the check via its existing Check
      shape, the warning appears at both plan time and run start in tests, and there is a test that
      would go red if preflight ever gained the power to stop a run.
  - id: story-003-004
    title: Add opt-in dry-run that executes the gate command in a throwaway worktree
    description: >-
      Add a doctor subcommand/flag that, on explicit request only, executes the gate command once in
      a throwaway worktree, reusing the gate's existing worktree-creation path. Planning never runs
      the command silently.
    acceptance_criteria:
      - >-
        The dry-run executes the gate command exactly once in a throwaway worktree, only when the
        explicit doctor opt-in flag/subcommand is given
      - loom epic and loom run never execute the gate command as part of preflight
      - The dry-run reuses the gate's existing worktree-creation path
      - Tests cover that the dry-run runs only on explicit opt-in and reports the command's outcome
    estimated_complexity: small
    dependencies:
      - story-003-002
      - story-003-003
    tech_notes: >-
      Create packages/loom-core/src/orchestrator/GateDryRun.ts exporting runGateDryRun(), which uses
      the git()/gitSafe() helpers in orchestrator/git.ts to 'git worktree add --detach
      .loom/integration/gate-dryrun-<pid> HEAD' (under .loom/integration/, NOT .loom/worktrees/, so
      WorktreeJanitor never reaps it), calls the real IntegrationGate.run({ projectRoot: <worktree>
      }) to inherit timeout/kill/output-tail semantics, and force-removes the worktree in a finally
      block, returning GateDryRunOutcome. Expose it as a --dry-run-gate flag on the existing doctor
      command in packages/loom-cli/src/index.ts plus runGateDryRunCommand() in doctorGateCheck.ts —
      a flag, not a subcommand, to avoid colliding with the sibling doctor epic (ADR-5). Tests must
      pin that the command executes only under the explicit flag. Trade-off: the detached-HEAD
      worktree validates the command's runnability against the current tree, not a future integrated
      epic tree.
    test_plan: >-
      Levels: unit for the opt-in gating, integration for the worktree lifecycle (real seam: git).
      Unit cases, mocking runGateDryRun/IntegrationGate.run: (1) doctor WITHOUT --dry-run-gate →
      gate command executed zero times (this is the headline AC — pin it); (2) doctor WITH the flag
      → executed exactly once and the GateDryRunOutcome is printed; (3) runEpic and runRun never
      reach the dry-run path (assert the mock is uncalled through both). Integration cases for
      runGateDryRun() in a temp git repo: (4) creates a detached worktree at
      .loom/integration/gate-dryrun-<pid> — assert the path prefix is .loom/integration/, NOT
      .loom/worktrees/ (the janitor-safety property); (5) invokes the real IntegrationGate.run with
      projectRoot = worktree path and returns its GateOutcome verbatim; (6) worktree is removed in
      finally — assert cleanedUp true and the directory gone both on gate success AND when the gate
      throws or times out (force a failing/raising gate to cover the unhappy branch). Verification
      bar: a green suite proves the command runs once and only under the explicit flag, planning
      paths are inert, and no dry-run ever leaks a worktree.
