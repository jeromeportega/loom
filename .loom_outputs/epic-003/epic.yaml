stories:
  - id: story-003-001
    title: Add per-epic autonomy schema foundation
    description: >-
      Add an autonomy_level column (full-auto | checkpoint | manual, default manual) to the epics
      table and a durable paused indicator for checkpoint mode, then expose getters/setters on
      EpicStore. Migration must be backward-compatible so existing epics read as manual.
    acceptance_criteria:
      - epics table has an autonomy_level column defaulting to 'manual'
      - A durable paused indicator persists per epic and survives a restart
      - EpicStore exposes get/set for autonomy_level and the paused indicator
      - Migration is backward-compatible; pre-existing epics read as 'manual'
      - Unit test asserts a newly created epic defaults to autonomy_level 'manual'
    estimated_complexity: small
    dependencies: []
    tech_notes: >-
      Bump `runMigrations` in `packages/loom-core/src/state/Database.ts` to schema v16 with three
      additive `ALTER TABLE epics ADD COLUMN` statements: `autonomy_level TEXT NOT NULL DEFAULT
      'manual'`, `paused_at DATETIME`, `paused_after_story TEXT` — defaulted so existing rows read
      as `manual` with no backfill (ADR-1). Add `AutonomyLevelSchema =
      z.enum(['full-auto','checkpoint','manual'])` to `loom-core/src/types.ts` and extend the `Epic`
      interface; add `getAutonomy/setAutonomy/pauseAfterStory/resume/isPaused` to `EpicStore`, where
      `pauseAfterStory` sets `paused_at = CURRENT_TIMESTAMP`. Trade-off: storing the paused
      indicator as epic columns (not in the single-row global `ControlStore`) costs two extra
      columns but is what makes the pause per-epic durable across restarts and readable by the
      federating inbox.
    test_plan: >-
      Level: unit only — this is pure schema + store code with a real (temp-file or in-memory)
      better-sqlite3 DB; no HTTP or Supervisor needed. Use a fresh DB per test for isolation.


      Key cases:

      - Migration applies cleanly: open a DB, run `runMigrations` (Database.ts), assert `PRAGMA
      user_version` is 16 and `PRAGMA table_info(epics)` includes `autonomy_level`, `paused_at`,
      `paused_after_story`.

      - Default value: insert an epic via EpicStore without specifying autonomy → `getAutonomy(id)`
      returns `'manual'` (covers AC: column defaults to 'manual'; AC: newly-created epic defaults to
      'manual').

      - Backward-compat: seed a DB at the PRE-v16 schema (epics with no autonomy columns), run
      `runMigrations`, then read an existing epic → `getAutonomy` returns `'manual'` with no
      backfill error (covers AC: pre-existing epics read as 'manual').

      - Idempotency: run `runMigrations` twice on the same DB; second run does not throw / does not
      duplicate columns.

      - Setter round-trip: `setAutonomy(id,'full-auto')` then `getAutonomy(id)==='full-auto'`;
      repeat for `'checkpoint'`.

      - AutonomyLevelSchema: `.parse('manual'|'checkpoint'|'full-auto')` succeed; `.parse('auto')` /
      `''` throw.

      - Durable paused indicator (covers AC: persists per epic & survives restart):
      `pauseAfterStory(id,'story-x')` sets `paused_at` non-null and
      `paused_after_story==='story-x'`; `isPaused(id)===true`. Then CLOSE and REOPEN the DB file
      (new EpicStore instance) and assert `isPaused`/`paused_after_story` still hold — this proves
      durability across a restart, not just in-memory state. `resume(id)` clears both →
      `isPaused(id)===false`.


      Verification bar: a brand-new epic reads `manual`; a DB migrated from the prior schema reads
      `manual` for all old rows; autonomy and the paused indicator survive a DB reopen. All five
      EpicStore methods are exercised against a real SQLite DB, not a mock.
  - id: story-003-002
    title: Supervisor enforces all three autonomy modes
    description: >-
      Make the Supervisor honor each autonomy_level: manual gates on explicit human approval,
      checkpoint pauses after each story and resumes on re-dispatch, and full-auto auto-approves,
      auto-dispatches, and runs to completion while writing the same audit row and policy snapshot
      as a human approve.
    acceptance_criteria:
      - >-
        manual mode blocks dispatch until explicit human approval (current behavior preserved),
        covered by a unit test
      - >-
        checkpoint mode pauses after each story, sets the durable paused indicator, and
        re-dispatches on resume, covered by a unit test
      - >-
        full-auto mode auto-transitions planned->approved, auto-dispatches, and runs to completion,
        covered by a unit test
      - >-
        full-auto writes the epic_approved audit row AND the policy snapshot identical to a human
        approve, asserted in a test
    estimated_complexity: large
    dependencies:
      - story-003-001
    tech_notes: >-
      Implement both Supervisor seams in `packages/loom-core/src/orchestrator/Supervisor.ts`: Seam 1
      at the planner-completion `planned→approved` gate (manual leaves `planned`; checkpoint and
      full-auto both call the new shared `approveAndDispatch({actor:'full-auto'})`), and Seam 2
      inside `dispatchLoop` after `integrateStory()` where checkpoint calls
      `epicStore.pauseAfterStory(epicId, storyId)` and stops dispatching further stories. Extract
      `approveAndDispatch()` as the single approve path (capture `policy_snapshot`, write the
      `epic_approved` audit row via `AuditLog`, transition status, dispatch) so full-auto and human
      approve are literally the same code (ADR-2/ADR-3, FR-7). The one trade-off to know: the
      existing MCP approve handler does NOT currently write `epic_approved` — converging onto
      `approveAndDispatch` intentionally fixes that gap, so assert the audit row + snapshot are
      byte-identical across human and full-auto in your test.
    test_plan: >-
      Level: unit (Supervisor with real stores against an in-memory/temp SQLite DB, agent dispatch
      stubbed at the seam). This is the highest-risk story — autonomy decides who approves — so test
      each mode in isolation and assert the audit record, not just the status. Do NOT test via HTTP
      here; drive the Supervisor seams directly.


      Key cases (one named test per acceptance criterion):

      - manual gate (Seam 1): epic at `planned`, autonomy `manual`, run the planner-completion path
      → epic stays `planned`, no dispatch occurs, no `epic_approved` audit row written. Proves
      current behavior preserved (FR-4).

      - full-auto run-through (Seam 1): autonomy `full-auto` → Supervisor calls
      `approveAndDispatch({actor:'full-auto'})`, epic transitions `planned→approved`, dispatch is
      invoked, and the loop runs straight through (no pause). Assert status reaches completion with
      the dispatch stub called for each story.

      - checkpoint pause (Seam 2): autonomy `checkpoint` → after the first `integrateStory()`,
      assert `epicStore.pauseAfterStory` was called, `isPaused(epicId)===true`, `paused_after_story`
      equals the just-finished story id, and NO further story is dispatched. Then call `resumeEpic`
      → pause cleared and the next story dispatches (covers pause-and-resume AC).

      - Audit parity (the load-bearing one): capture the `epic_approved` audit row +
      `policy_snapshot` produced by a HUMAN approve (call `approveAndDispatch({actor:'human'})`) and
      by `full-auto`; assert the two rows are byte-identical in every field except `actor`, and that
      BOTH paths went through the same `approveAndDispatch` (e.g. spy/asserting one code path). This
      also pins the intentional fix that the prior MCP path wrote no `epic_approved` row.

      - Boundary: full-auto epic with zero stories completes without dispatching; checkpoint epic on
      its LAST story pauses (or cleanly completes per chosen semantics) — assert whichever the
      implementation specifies, and that no story is double-dispatched.


      Verification bar: each of the three modes has a dedicated passing unit test exhibiting its
      exact dispatch behavior, and the full-auto `epic_approved` row + policy snapshot are proven
      identical to a human approve. Determinism: stub the worker dispatch and integration so no real
      subprocess/network runs.
  - id: story-003-003
    title: Autonomy-setting endpoint and MCP tool
    description: >-
      Add POST /api/epics/:id/autonomy and the loom_set_autonomy MCP tool to set an epic's autonomy
      level. Both are token-gated and audit-logged with identical effect.
    acceptance_criteria:
      - POST /api/epics/:id/autonomy sets and persists the autonomy level
      - loom_set_autonomy MCP tool sets the autonomy level with identical effect
      - Both surfaces reject the request without the write token
      - Both surfaces write an audit row on success
      - Test asserts the persisted value and the audit row for both surfaces
    estimated_complexity: medium
    dependencies:
      - story-003-001
    tech_notes: >-
      Add `POST /api/epics/:id/autonomy` to `createApp()` in `loom-web/src/server/index.ts` and the
      `loom_set_autonomy` tool in `loom-mcp/src/tools/{registry,handlers}.ts` (mirror the
      `loom_approve_plan` pattern), both delegating to one shared `setEpicAutonomy(deps, epicId,
      level, actor)` core action that persists via `EpicStore.setAutonomy` and writes an
      `autonomy_set` audit row. Validate the body/`inputSchema` against `AutonomyLevelSchema` from
      story-003-001, and gate the web route behind the existing token check. The trade-off: keep
      zero mutation logic in the handlers themselves — both surfaces must call the identical core
      action so the persisted value and audit row are provably the same (FR-3).
    test_plan: >-
      Level: integration for each surface (web route via supertest against `createApp()`; MCP
      handler called directly), plus a shared-action unit assertion. Both surfaces must funnel
      through `setEpicAutonomy` — assert that, not two parallel implementations.


      Key cases:

      - Web happy path: `POST /api/epics/:id/autonomy` with valid token and body
      `{level:'full-auto'}` → 200, and `EpicStore.getAutonomy(id)==='full-auto'` (covers AC: sets &
      persists via web).

      - MCP happy path: invoke the `loom_set_autonomy` handler with `{epic_id, level:'checkpoint'}`
      → success, and `getAutonomy(id)==='checkpoint'` (covers AC: MCP sets with identical effect).

      - Identical effect: drive both surfaces to the same level on equivalent epics and assert the
      persisted value AND the written `autonomy_set` audit row match field-for-field except actor
      (`web` vs `mcp`).

      - Token gate (web): same POST WITHOUT the `x-loom-token` header (and with a wrong token) →
      401/403 and autonomy UNCHANGED (covers AC: rejects without write token). For MCP, assert the
      tool is registered/exposed only behind the server's existing auth path consistent with
      `loom_approve_plan`.

      - Audit on success: after each successful set, assert exactly one `autonomy_set` row exists in
      AuditLog with the epic id, new level, and actor (covers AC: both surfaces write an audit row;
      AC: test asserts persisted value + audit row for both).

      - Validation boundary: body/`inputSchema` with `level:'turbo'`, missing `level`, or empty body
      → rejected by `AutonomyLevelSchema` (400 / validation error), no persistence, no audit row.

      - Unknown epic id → handled gracefully (404/error), no audit row.


      Verification bar: both web and MCP persist the level and write an `autonomy_set` audit row
      through the single shared `setEpicAutonomy` action; both reject tokenless/invalid requests
      without mutating state; a test asserts the persisted value and audit row for each surface.
  - id: story-003-004
    title: Cross-epic decision inbox endpoint and view
    description: >-
      Add GET /api/inbox that federates every pending decision across registered projects, each
      tagged with project_root and a type of plan_approval | checkpoint_resume | escalation plus the
      minimum fields to act. Add an inbox view with inline Approve/Reject, Resume/Stop, Retry/Kill
      wired to the existing mutation endpoints.
    acceptance_criteria:
      - >-
        GET /api/inbox returns all pending decisions across registered projects, each with
        project_root, type, epic id, title, project, story id, and age
      - Checkpoint-paused epics surface as checkpoint_resume entries
      - >-
        The inbox view approves AND rejects a plan end-to-end, with the status change and audit row
        asserted in a test
      - Inbox actions call the existing mutation endpoints with no duplicated mutation logic
    estimated_complexity: large
    dependencies:
      - story-003-002
    tech_notes: >-
      Add `GET /api/inbox` to `loom-web/src/server/index.ts` built on the existing `/api/status`
      federation pattern — iterate `ProjectRegistry.list()`, open each project DB, and emit
      `InboxEntry[]` (`loom-web/src/shared/types.ts`) from three sources:
      `epicStore.listByStatus('planned')` → `plan_approval`, epics with `paused_at IS NOT NULL` →
      `checkpoint_resume`, and `AgentStore.listLatestByEpic` blocked agents → `escalation`. Inline
      inbox actions in `public/index.html` must reuse the existing mutation endpoints with no
      duplicated logic, passing `?project=<project_root>` so the new `resolveProjectDb(req)` helper
      (registry-validated) targets the peer DB and correct spawn `cwd` (ADR-5). Trade-off: each
      inbox load opens N project DBs synchronously — acceptable at operator scale; do not add
      caching now.
    test_plan: >-
      Level: integration (supertest against `createApp()` with a ProjectRegistry pointing at ≥2 temp
      project DBs) for the endpoint; the view's approve/reject is asserted at the API level
      end-to-end. Federation + cross-project action is the risk here.


      Key cases:

      - Empty inbox: registry with projects that have no pending decisions → `GET /api/inbox`
      returns `[]`.

      - plan_approval source: seed a `planned` epic → inbox entry with `type:'plan_approval'`,
      correct `project_root`, `project` (basename), `epic_id`, `title`, `story_id:null`, and a
      plausible `age_ms` derived from `updated_at`.

      - checkpoint_resume source (covers AC): seed an epic with `paused_at` non-null and
      `paused_after_story` set → entry with `type:'checkpoint_resume'` and
      `story_id===paused_after_story`.

      - escalation source: seed a blocked latest agent (`AgentStore.listLatestByEpic`) → entry with
      `type:'escalation'` and its `story_id`.

      - Cross-project federation (covers AC: all pending decisions across registered projects): two
      projects each with a pending decision → inbox contains BOTH, each tagged with the correct
      `project_root`; no entry attributed to the wrong project.

      - End-to-end approve (covers AC): call the inbox's approve action (the EXISTING `POST
      /api/epics/:id/approve?project=<root>`) → target peer epic transitions `planned→approved` in
      the correct project DB and an `epic_approved` audit row is written there.

      - End-to-end reject (covers AC: approves AND rejects): call `POST
      /api/epics/:id/reject?project=<root>` → epic moves to rejected state and the decision leaves
      the inbox; assert status change + audit row.

      - No duplicated mutation logic (covers AC): assert inbox actions hit the existing
      approve/reject/retry/stop/kill routes — e.g. there is no new mutation handler;
      `resolveProjectDb` resolves `?project` to the peer DB.

      - Security boundary: `?project=<root not in ProjectRegistry.list()>` → rejected BEFORE any DB
      is opened (no traversal); mutation without token → 401/403.


      Verification bar: `/api/inbox` returns every pending decision across ≥2 registered projects
      with the full field set and correct type for all three sources; a single test approves AND
      rejects a plan end-to-end through the existing endpoints with the status change and audit row
      asserted in the peer project's DB.
  - id: story-003-005
    title: Fleet board endpoint and live view
    description: >-
      Add GET /api/fleet that aggregates epics into board cards carrying status, per-story states,
      cost roll-up (reusing aggregateEpicCost), and blocker count, with every story correctly
      attributed to its epic/project. Add a board view that renders the cards and updates live off
      the existing SSE agent/epic events.
    acceptance_criteria:
      - >-
        GET /api/fleet returns board cards with status, per-story states, cost roll-up via
        aggregateEpicCost, and blocker count
      - >-
        Every story is attributed to the correct epic/project with no cross-epic state bleed when
        >=2 epics run concurrently, proven by a test with two epics' agents in the DB
      - The board view renders cards and updates live off the existing SSE agent/epic events
      - Live updates respect the existing per-project SSE scoping
    estimated_complexity: large
    dependencies: []
    tech_notes: >-
      Add `GET /api/fleet` to `loom-web/src/server/index.ts` federating per project into
      `FleetCard[]`, building each card from `AgentStore.listLatestByEpic(epic_id)` and reusing
      `aggregateEpicCost(epic, agents)` verbatim for the cost roll-up plus a blocker count of
      stories in `{'blocked','failed'}`. Cross-epic correctness is structural — never use a shared
      accumulator spanning epics; the two-epic test loads two epics' agents into one DB and asserts
      card membership by `epic_id`. Render the board view in `public/index.html` subscribing to the
      existing `epic`/`agent` SSE events from `loom-web/src/server/events.ts` (which already diff
      the DB every 500 ms); per ADR-6 the `epic` payload gains additive `autonomy_level`/`paused`
      fields, so the frontend updates live and ignores unknown keys.
    test_plan: >-
      Level: integration for the endpoint (supertest against `createApp()` with a real DB) and a
      focused cross-epic unit/integration test; the live-view behavior is asserted against the
      existing SSE stream. The marquee risk is cross-epic state bleed — pin it explicitly.


      Key cases:

      - Card shape (covers AC): seed one epic with several latest agents → `GET /api/fleet` returns
      a `FleetCard` with `status`, `stories[]` (each `{story_id,status}` from `listLatestByEpic`),
      `cost` produced by `aggregateEpicCost(epic, agents)` (reused verbatim — assert it equals a
      direct call), and `autonomy_level`/`paused`.

      - Blocker count: stories in `{'blocked','failed'}` are counted in `blockers`; healthy stories
      are not (boundary: 0 blockers, all-blocked).

      - Cross-epic attribution (covers AC, the required two-epic test): load TWO epics' agents into
      one DB, call `/api/fleet`, and assert each card's `stories` contains ONLY that epic's story
      ids — zero bleed. Add a case where both epics share a story_id string to prove filtering is by
      `epic_id`, not story_id.

      - Live update (covers AC: renders + updates live off SSE): with the existing
      `eventStreamHandler`, change an epic row (e.g. set `paused_at` / a story status) and assert
      the `epic`/`agent` SSE event fires carrying the additive `autonomy_level`/`paused` fields; the
      frontend ignores unknown keys (no crash on extra fields).

      - Per-project SSE scoping (covers AC): a subscriber scoped to project A does NOT receive
      project B's events.

      - Empty/edge: epic with no agents → card with empty `stories`, zero cost, zero blockers, no
      throw.


      Verification bar: `/api/fleet` returns cards with status, per-story states,
      `aggregateEpicCost`-derived cost, and blocker count; the two-epic test proves no cross-epic
      bleed by asserting card membership by `epic_id`; live updates arrive via the existing
      `epic`/`agent` SSE events and respect per-project scoping.
  - id: story-003-006
    title: Deployable read-only public mode with centralized mutation-guard
    description: >-
      Add LOOM_WEB_READONLY=1 and loom web --read-only to serve GET/read routes plus SSE without a
      token while every mutation route returns 403 without the write token, enforced by a single
      centralized mutation-guard. The default (non-read-only) path stays byte-compatible with today.
    acceptance_criteria:
      - Both LOOM_WEB_READONLY=1 and loom web --read-only enable read-only mode
      - In read-only mode all GET routes and SSE serve without a token
      - >-
        In read-only mode every mutation route returns 403 without the write token, enforced by a
        single centralized mutation-guard (no per-handler copies)
      - >-
        An enumerated-route test proves zero mutation routes succeed without the write token while
        every GET route serves without one
      - >-
        Default (non-read-only) mode is unchanged and the token gates all of /api/*
        (byte-compatible)
    estimated_complexity: medium
    dependencies:
      - story-003-003
    tech_notes: >-
      Replace the blanket `app.use('/api', requireToken(...))` in `loom-web/src/server/index.ts`
      with a single `accessGuard({ token, readOnly })` middleware in `loom-web/src/server/auth.ts`:
      `readOnly=false` (default) requires the token on all `/api/*` (byte-identical to today), while
      `readOnly=true` lets GET/HEAD/SSE pass and 403s any non-GET without the write token, using
      `crypto.timingSafeEqual` for comparison. Wire `LOOM_WEB_READONLY=1` and the `loom web
      --read-only` CLI flag (commander, `loom-cli`) to set the option. The trade-off: correctness
      depends on every mutation being a non-GET verb — make this load-bearing with the
      enumerated-route test that walks the Express route table asserting zero mutations succeed
      tokenless and every GET serves, so a misclassified future route fails loudly (ADR-4, FR-13).
    test_plan: >-
      Level: integration via an ENUMERATED-ROUTE test that walks the Express route table from
      `createApp()` — this is mandated and is the heart of the story. Run the app once in default
      mode and once in read-only mode.


      Key cases:

      - Default mode unchanged (covers AC: byte-compatible): with `readOnly=false`, every `/api/*`
      route (GET and mutation) WITHOUT a valid token → rejected exactly as today's `requireToken`;
      with a valid token → served. Assert this reduces to current behavior.

      - Enumerated read-only proof (covers the AC verbatim): with `readOnly=true`, programmatically
      enumerate the route table; for EVERY GET/HEAD route assert it serves WITHOUT a token; for
      EVERY mutation (non-GET) route assert it returns 403 WITHOUT the write token. The test
      iterates the actual route list so a future route is covered by construction — no hardcoded
      subset.

      - SSE in read-only: `GET /api/events` (SSE) serves without a token in read-only mode.

      - Mutation with token in read-only: a valid write token on a mutation still succeeds
      (read-only blocks tokenless mutation, not all mutation).

      - Both enablement paths (covers AC): `LOOM_WEB_READONLY=1` env and `loom web --read-only` CLI
      flag (commander, loom-cli) each set `readOnly=true`; assert both produce the same guard
      behavior.

      - Single guard (covers AC: no per-handler copies): assert the blanket `app.use('/api',
      requireToken)` is gone and exactly one `accessGuard` is mounted; no individual handler
      re-checks the token.

      - Comparison safety: token check uses `crypto.timingSafeEqual` (guard against length-leak); a
      wrong-length token is rejected without throwing.

      - Misclassification trip-wire: a deliberately-added GET that mutates, or POST that reads,
      should make the enumerated test FAIL loudly — note this expectation so the classification
      stays load-bearing.


      Verification bar: the enumerated-route test proves zero mutation routes succeed tokenless
      while every GET serves tokenless in read-only mode, both enablement paths flip the mode, and
      default mode is byte-identical to today's token-gates-everything behavior — all enforced by a
      single centralized guard.
  - id: story-003-007
