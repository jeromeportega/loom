stories:
  - id: story-003-001
    title: Delete `packages/loom-mcp` and remove `loom serve`
    description: >-
      Delete the `loom-mcp` package entirely and remove the `loom serve` command along with its
      dynamic import. Only begins once Epic 002 parity is verified.
    acceptance_criteria:
      - The `packages/loom-mcp` directory is deleted entirely
      - The `loom serve` command and its dynamic import are removed
      - '`loom serve` no longer appears in CLI help and resolves as an unknown command'
    estimated_complexity: medium
    dependencies:
      - story-002-006
    tech_notes: >-
      Delete the entire `packages/loom-mcp` directory and remove the `serve` command plus its
      dynamic import from `packages/loom-cli/src/index.ts` (the block around lines 402–409). After
      removal `loom serve` must be absent from `--help` and resolve as an unknown command (exiting
      non-zero). Gated on story-002-006 parity being green. Do NOT touch
      `packages/loom-core/src/mcp/*` — that provisioning tree is on the retain side of the boundary
      (ADR-003).
    test_plan: >-
      Levels: e2e CLI invocation (spawn the built `loom` binary) — assert observable command
      behavior, not source presence. Key cases: (1) `loom --help` output does NOT list `serve`. (2)
      `loom serve` resolves as an unknown command → exit non-zero (commander's unknown-command
      path), one-line message, no stack trace. (3) CLI smoke — a known-good command (e.g. `loom
      --version` or `loom status`) still starts cleanly, proving the deleted dynamic import left no
      dangling reference that breaks CLI startup. (4) Retain-side guard —
      `packages/loom-core/src/mcp/*` is untouched (a quick assertion or by relying on the
      provisioning regression tests still passing). Verification bar: `serve` is gone from help and
      errors as unknown, and the CLI still boots — the build/suite-green proof is deferred to
      story-003-006.
  - id: story-003-002
    title: Remove `loom init --mcp` and loom-server `.mcp.json` generation
    description: >-
      Remove the `loom init --mcp` flag and all loom-server `.mcp.json` generation, including the
      `mcpConfig` module and its use in `init`, while retaining third-party worker-provisioning
      wiring.
    acceptance_criteria:
      - The `loom init --mcp` flag is removed and no longer generates a loom-server `.mcp.json`
      - The `mcpConfig` module and its use in `init` are removed
      - Third-party worker-provisioning wiring is retained where needed
      - >-
        Retained surfaces (`loom mcp add`/`list`, `policy.mcp.registry`, `McpRegistry`,
        `WorktreeMcp`, adapters, `CursorMcpEnforcer`) remain intact and functional
    estimated_complexity: medium
    dependencies:
      - story-002-006
    tech_notes: >-
      Remove the `loom init --mcp` flag and the `mcpConfig` module (the loom-server `.mcp.json`
      generator) and its call site in the `init` command in `packages/loom-cli/src/index.ts`. Leave
      all worker-provisioning wiring intact: `loom mcp add`/`list`, `policy.mcp.registry`, and
      `packages/loom-core/src/mcp/{McpRegistry,WorktreeMcp,adapter,CursorMcpEnforcer}` must remain
      functional. Per ADR-005, ship no migration to scrub stale `loom` entries already written into
      user repos — a dead entry now points at a non-existent `serve` and fails closed. The hazard is
      an over-broad delete catching provisioning code; keep the cut surgical.
    test_plan: >-
      Levels: integration — the real risk is an over-broad delete amputating the retained
      provisioning subsystem (ADR-003), so the retain-side regression tests carry this story. Key
      cases: (1) `loom init --mcp` → the `--mcp` flag is gone (unknown-option error, exit non-zero).
      (2) `loom init` (plain) → generated `.mcp.json` contains NO loom-server entry; the `mcpConfig`
      generator and its `init` call site are removed. (3) Retain regression — `loom mcp add
      <server>` then `loom mcp list` still works end-to-end. (4) Retain regression — `McpRegistry`,
      `WorktreeMcp.materializeWorktreeMcpConfig`, `adapter`, and `CursorMcpEnforcer` remain
      functional: materialize a worktree config and assert third-party servers are written and
      `CursorMcpEnforcer` still disables non-allowlisted servers. (5) `policy.mcp.registry` still
      drives provisioning. Verification bar: the loom-self generation is gone while every retained
      provisioning path stays green — the boundary holds in tests, not just in review.
  - id: story-003-003
    title: Strip the @loom-ai/mcp dependency and its tests
    description: >-
      Remove the `@loom-ai/mcp` (`at-loom-ai-slash-mcp`) dependency and the MCP-driven test in
      loom-web, and update or delete every test referencing the mcp package across loom-core,
      loom-cli, and loom-web.
    acceptance_criteria:
      - The `@loom-ai/mcp` (`at-loom-ai-slash-mcp`) dependency is removed
      - The MCP-driven test in loom-web is removed
      - >-
        Every test referencing the mcp package across loom-core, loom-cli, and loom-web is updated
        or deleted
    estimated_complexity: small
    dependencies:
      - story-003-001
      - story-003-002
    tech_notes: >-
      Remove the `@loom-ai/mcp` dependency (npm-mangled as `at-loom-ai-slash-mcp` in lockfiles) from
      any `package.json` that declares it, delete the MCP-driven test in `packages/loom-web`, and
      update or delete every remaining test across loom-core, loom-cli, and loom-web that imports or
      references the mcp package. Grep for the import specifier and the package name before
      declaring done; depends on the server and init removals (003-001/003-002) being merged so the
      references are actually dead.
    test_plan: >-
      Levels: grep/meta check + re-run the per-package suites. Key cases: (1) Grep the repo for the
      import specifier and the package name (`@loom-ai/mcp`, npm-mangled `at-loom-ai-slash-mcp`) →
      no `package.json` still declares the dependency. (2) The MCP-driven test in
      `packages/loom-web` is deleted. (3) No remaining test across loom-core, loom-cli, loom-web
      imports or references the mcp package (grep is clean). (4) Each package's suite still runs
      with no dangling-import / module-not-found failures. Verification bar: the dependency and all
      referencing tests are gone, and `npm run test` per package is green with zero
      unresolved-module errors — depends on 003-001/003-002 having removed the live references
      first.
  - id: story-003-004
    title: Drop the mcp workspace from build/test/publish wiring
    description: >-
      Update root `package.json` build/test scripts to drop the mcp workspace and update the npm
      publish workflow and releasing runbook to stop publishing the mcp package.
    acceptance_criteria:
      - Root `package.json` build and test scripts no longer reference the mcp workspace
      - The npm publish workflow no longer publishes the mcp package
      - The releasing runbook no longer lists the mcp package for publishing
    estimated_complexity: small
    dependencies:
      - story-003-001
    tech_notes: >-
      In the root `package.json`, drop `-w @loom-ai/mcp` from the `build` (line 8) and `test` (line
      9) scripts, remove the package from the npm publish workflow, and delete its entry from
      `docs/operations/releasing.md`. Per ADR-006, do NOT run `npm deprecate` and do not publish —
      removing it from the workflow is sufficient to stop future publishes; treat it as a major bump
      for records only. Trade-off: the last-published `@loom-ai/mcp` stays installable with no
      deprecation notice, which is the accepted quiet tail.
    test_plan: >-
      Levels: config assertion + an actual `npm run build` / `npm run test` run (the scripts must
      not reference a deleted workspace). Key cases: (1) Root `package.json` `build` and `test`
      scripts no longer contain `-w @loom-ai/mcp`. (2) The npm publish workflow file no longer
      publishes the mcp package. (3) `docs/operations/releasing.md` no longer lists the mcp package.
      (4) `npm run build` and `npm run test` both exit 0 — the regression guard that the scripts
      don't try to target a missing workspace. (5) Negative — confirm NO `npm deprecate`/publish
      step was added (ADR-006). Verification bar: scripts/workflow/runbook are scrubbed AND
      build+test still succeed; the previously-published version is left installable by design (no
      deprecation).
  - id: story-003-005
    title: Scrub all docs and positioning that advertise an MCP surface
    description: >-
      Update `docs/capabilities.md` and all positioning to reframe loom as CLI = usability and web =
      observability, removing every reference to a loom MCP server.
    acceptance_criteria:
      - >-
        `docs/capabilities.md` drops MCP-as-server rows, the two-interfaces framing, `loom serve`
        and `loom init --mcp` entries, MCP tool listings, and first-class Claude Code/Cursor-via-MCP
        rows, and is reframed as CLI = usability, web = observability
      - >-
        `CLAUDE.md`, `README.md`, `docs/getting-started`, `docs/index.md`, and
        `docs/operations/releasing.md` are updated to remove loom-MCP-surface language
      - >-
        Repo search for `loom-mcp`, `loom serve`, `loom init --mcp`, `mcp__loom`, `first-class`,
        `primary surface`, and `two interfaces over the same engine` returns no hits except inside
        `docs/research/cursor-mcp-strictness.md` and retained worker-provisioning code paths
    estimated_complexity: medium
    dependencies:
      - story-003-001
      - story-003-002
      - story-003-004
    tech_notes: >-
      Reframe `docs/capabilities.md` to CLI = usability, web = observability: delete MCP-as-server
      rows, the two-interfaces framing, `loom serve` / `loom init --mcp` entries, the MCP tool
      listing, and first-class Claude-Code/Cursor-via-MCP rows. Apply the same scrub to `CLAUDE.md`,
      `README.md`, `docs/getting-started`, `docs/index.md`, and `docs/operations/releasing.md`. The
      done-ness bar (ADR-004) is a search: `loom-mcp`, `loom serve`, `loom init --mcp`, `mcp__loom`,
      `first-class`, `primary surface`, and `two interfaces over the same engine` return zero hits
      except inside `docs/research/cursor-mcp-strictness.md` and retained worker-provisioning code.
      Use the precise forbidden strings, not a blanket `mcp` match, so you don't flag the retained
      provisioning subsystem.
    test_plan: >-
      Levels: a re-runnable grep/search test (this IS the done-ness definition per ADR-004) plus
      targeted doc-content checks. Key cases: (1) Forbidden-string search for `loom-mcp`, `loom
      serve`, `loom init --mcp`, `mcp__loom`, `first-class`, `primary surface`, and `two interfaces
      over the same engine` returns ZERO hits except inside `docs/research/cursor-mcp-strictness.md`
      and retained worker-provisioning code paths. (2) `docs/capabilities.md` — MCP-as-server rows,
      the two-interfaces framing, `loom serve` / `loom init --mcp` entries, the MCP tool listing,
      and first-class Claude-Code/Cursor-via-MCP rows are removed; reframed as CLI = usability, web
      = observability. (3) `CLAUDE.md`, `README.md`, `docs/getting-started`, `docs/index.md`,
      `docs/operations/releasing.md` carry no loom-MCP-surface language. (4) Precision guard — use
      the exact forbidden strings, NOT a blanket `mcp`; assert retained mentions (`loom mcp
      add`/`list`, provisioning docs) are PRESERVED, not scrubbed. Verification bar: the search
      returns only the two allowlisted classes of hits — the mechanical, CI-re-runnable definition
      of done.
