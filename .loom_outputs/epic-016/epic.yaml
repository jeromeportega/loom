stories:
  - id: story-016-001
    title: Path-aware overlap detection
    description: >-
      Tighten the cross-epic overlap detector so a token is treated as a candidate file path only
      when it contains a path separator or a known source-file extension. File existence is a
      tiebreaker, not a gate.
    acceptance_criteria:
      - >-
        A token is treated as a candidate file only if it contains a path separator or a known
        source-file extension; tokens failing this bar are excluded
      - >-
        A path-shaped token is included even when the file does not yet exist under the project
        (in-flight epics legitimately create new files)
      - The advisory remains advisory-only and never blocks approval
      - >-
        A test over a planning input that previously produced false entries reports zero non-path
        entries (no bare words, no code fragments)
      - >-
        The same (or a companion) test confirms a genuinely shared file is still reported — the
        advisory has not gone silent
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      Add a private `isPathLike(token: string): boolean` predicate to
      `packages/loom-core/src/orchestrator/ContractOwnership.ts` and wire it in as the FINAL gate of
      `normalizePath` (return `''` when `!isPathLike(posix)`), so every producer inherits the bar.
      Use exactly the contract's pinned definition — `token.includes('/') ||
      /\.(ts|tsx|js|jsx|mjs|cjs|json|md|ya?ml|sql|sh|css|html)$/i.test(token)` — and do NOT
      re-derive a different extension set, since story-016-002 depends on this same allow-list. Add
      no `fs` access (existence is neither gate nor tiebreaker per ADR-1/ADR-2; the no-fs invariant
      at lines 3–7 and its regression test must stay green). Trade-off to know: extensionless root
      files like `Makefile`/`Dockerfile` are excluded as candidates — accepted, and addressable via
      a leading `./`; add a test proving previously-false bare-word entries now report zero AND a
      companion assertion that a genuinely shared path-shaped file is still reported (advisory must
      not go dark).
    test_plan: >-
      Level: unit only — `ContractOwnership.ts` (`isPathLike`, `normalizePath`, `parseOwnershipMap`,
      `computeOverlaps`, `renderOverlapAdvisory`) is pure, total, and dependency-free, so unit tests
      give full confidence at the cheapest level; no integration/e2e. Write tests-first against the
      new predicate.


      Key cases (checklist):

      - isPathLike TRUE: `src/foo.ts`, `a/b`, `./Makefile`, `config.yaml`, `x.md`,
      `packages/loom-core/src/orchestrator/ContractOwnership.ts` (separator and/or known-ext). Cover
      each extension family in the pinned set once
      (`ts/tsx/js/jsx/mjs/cjs/json/md/ya?ml/sql/sh/css/html`, case-insensitive e.g. `Foo.TS`). [AC1]

      - isPathLike FALSE: bare words (`computeOverlaps`, `loom`, `Makefile`, `Dockerfile`,
      `LICENSE`), and code fragments (`foo()`, `if(!x)`, `${VAR}`). [AC1]

      - normalizePath returns `''` for every non-path-like token (final gate), so such tokens never
      enter the OwnershipMap. Confirm the existing pure-punctuation rejection still holds. [AC1]

      - Non-existence is NOT a gate: a path-shaped token for a file that does not exist under
      projectRoot is still included; assert no `fs`/`stat`/`open` call occurs on parsed paths (the
      existing no-fs regression test at `ContractOwnership.ts:3-7` must stay green — do not add fs
      access). [AC2]

      - Regression fixture: feed a planning/contract input that previously yielded bare-word and
      code-fragment entries; assert the resulting OwnershipMap / rendered advisory contains ZERO
      non-path entries. [AC4]

      - Companion (advisory-not-dark): a genuinely shared, path-shaped file owned by two epics is
      still surfaced by `computeOverlaps` and appears in `renderOverlapAdvisory` output, owners
      length >= 2. [AC5]

      - Advisory-only: `renderOverlapAdvisory` returns display strings and the approve path does not
      throw/exit non-zero on overlaps (no gating behavior introduced). [AC3]


      Verification bar: use exactly the contract's pinned extension regex (do not re-derive —
      016-002 shares it). All five AC have at least one passing case; the false-entry fixture
      reports zero non-path entries WHILE the genuine shared path is still reported; the no-fs
      invariant test remains green; advisory stays non-blocking.
  - id: story-016-002
    title: Prefer story-declared file ownership over free-text scraping
    description: >-
      Where stories declare file ownership, derive each epic's claimed-files set from that
      declaration as the preferred source. Free-text scraping becomes the fallback only, subject to
      the path-validity filter.
    acceptance_criteria:
      - >-
        Each epic's claimed-files set is derived from story-declared file ownership when that
        information exists
      - >-
        Free-text scraping is used only as a fallback and applies the same path-validity filter from
        story-016-001, so it can never emit bare words or non-path code fragments
      - >-
        [ASSUMPTION] If story schemas do not carry a declared file-ownership field, the fallback
        path is used and still holds the path-validity bar
      - A genuinely shared file declared via story ownership is still reported
    estimated_complexity: medium
    dependencies:
      - story-016-001
    tech_notes: >-
      This sequences AFTER story-016-001 and shares `ContractOwnership.ts` with it (one owner,
      ordered — do not edit in parallel). Per ADR-3, there is NO per-story file-ownership field on
      `StorySchema` (`types.ts:~578`, verified), so the contract's 'File & module ownership map'
      table rows — already attributed to story ids by `parseOwner`/`parseOwnershipMap` — ARE the
      story-declared ownership; treat that table as the preferred source and any free-text scrape as
      fallback, with both routed through the same `isPathLike` gate inherited from 016-001. Do not
      add a zod schema field (that is redesign, out of scope). Trade-off: the declaration lives in
      LLM-generated markdown, not a validated field, so a malformed table silently degrades to fewer
      entries (the parser is total); add a test confirming a genuinely shared, ownership-declared
      path is still reported.
    test_plan: >-
      Level: unit only — same module (`ContractOwnership.ts`,
      `parseOwnershipMap`/`parseOwner`/`computeOverlaps`). Sequential after 016-001; reuse its
      `isPathLike` gate, do not introduce a second extension set. No zod schema field is added
      (ADR-3), so there is nothing to integration-test.


      Key cases (checklist):

      - Preferred source = contract 'File & module ownership map' table: given a contract with `|
      story-016-001 | path |` rows, the derived claimed-files set comes from those rows and each
      OwnershipEntry carries the correct `storyId` attribution via `parseOwner`. [AC1]

      - Free-text fallback still filtered: when ownership is scraped from free text, every emitted
      token passes `isPathLike`; feeding free text containing bare words / code fragments yields
      zero non-path entries. [AC2]

      - No-schema-field assumption: confirm derivation works from the contract table (the structured
      declaration) with no per-story schema field present, and the path bar still holds. [AC3]

      - Total-parser degradation: a malformed/partial ownership table does not throw — bad rows are
      silently skipped, valid path-shaped rows still parse. [AC2/robustness]

      - Genuine shared file via declared ownership: a path-shaped file declared in the ownership
      table of two epics is still reported by `computeOverlaps` with both owners (storyId
      populated). [AC4]


      Verification bar: claimed-files are derived from the contract ownership table when present
      (with correct story attribution) and from filtered free text only as fallback; the fallback
      can never emit a non-path token; a genuinely shared declared path is still reported; the
      public surface of the advisory
      (`parseOwnershipMap`/`loadOwnershipMap`/`computeOverlaps`/`renderOverlapAdvisory`/`printOverlapAdvisory`)
      is unchanged.
  - id: story-016-003
    title: Remove dead loom-self-server materialization path
    description: >-
      Verify the dead-code claim across the codebase, then remove the optional loom-server entry
      parameter on worker-config materialization, the supervisor cursor-backend branch that fed it,
      and the misleading comments — leaving third-party provisioning untouched.
    acceptance_criteria:
      - A repo-wide search confirms no remaining caller passes the loom-server entry before deletion
      - The optional loom-server entry parameter on worker-config materialization is removed
      - >-
        The supervisor branch that would have fed the loom-server entry for the cursor backend is
        removed
      - >-
        All comments describing the cursor backend as receiving the loom server are removed; no code
        or comment implies loom injects its own server into a worker config
      - >-
        Materialization of operator-approved third-party servers from the policy registry into the
        worker config is unchanged and its existing tests still pass
      - The loom MCP server is not reintroduced in any form
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      First satisfy FR-6: run a repo-wide search proving no live caller passes a loom-server entry
      BEFORE deleting. Then remove `MaterializeOptions.loomServerEntry` from
      `packages/loom-core/src/mcp/WorktreeMcp.ts` (and retire the 'includes loom iff…' comment on
      `serverNames`), delete the `SupervisorOptions.loomServerEntry` field plus the `backend ===
      'cursor-cli' ? this.opts.loomServerEntry : undefined` branch in `orchestrator/Supervisor.ts`
      (~line 1378) and drop `loomServerIncluded`/`loomServerEntry` from the `worker_mcp_servers`
      audit record, and sweep the CLI wiring (`loomScriptPath()` + loomServerEntry thread) in
      `commands/run.ts`. Delete outright — no flag, no dormant branch (ADR-4, NFR-2). Hard scope
      line (FR-10/NFR-3): `pickPackage`/`toMcpJsonEntry`/the registry loop in `mcp/adapter.ts` and
      `worktree-mcp.test.ts` change by zero bytes; the materializer still emits exactly the
      policy-registry servers. Surface the open `CursorMcpEnforcer.ts` `ALWAYS_ALLOWED='loom'`
      boundary during the search — retain the enforcer mechanism but bring its loom-specific comment
      under FR-9 (no comment may imply loom injects its server), verifying
      `cursor-mcp-enforcer.test.ts` does not regress; if a test depends on `loom` being
      always-allowed, that dependency is residue and is updated here.
    test_plan: >-
      Level: verification-by-search + existing unit suites — this is a deletion, so the bar is
      'compiles, search is clean, retained suites stay green', plus pruning now-dead test cases.
      Touch `WorktreeMcp.ts`, `Supervisor.ts`, `commands/run.ts`; do NOT touch `mcp/adapter.ts` or
      `worktree-mcp.test.ts`'s third-party assertions (FR-10/NFR-3, zero bytes).


      Key cases (checklist):

      - FR-6 pre-deletion proof: repo-wide search (`loomServerEntry`, `loomServerIncluded`,
      `loomScriptPath`, `loom-server`) shows no live caller passes the entry BEFORE deleting; record
      the result. Re-run after deletion as a guard — expect zero live references. [AC1]

      - Materializer signature: `materializeWorktreeMcpConfig` compiles with `loomServerEntry`
      removed from `MaterializeOptions`; called with a registry it emits exactly the policy-registry
      servers (sorted) and `serverNames` no longer mentions/includes `loom`; retire the 'includes
      loom iff…' comment. [AC2]

      - Third-party provisioning UNCHANGED: `worktree-mcp.test.ts` stays green;
      `pickPackage`/`toMcpJsonEntry`/registry loop behavior identical; secrets remain `${VAR}`
      references. [AC5]

      - Supervisor: the `backend === 'cursor-cli' ? this.opts.loomServerEntry : undefined` branch
      (~Supervisor.ts:1378) and the `SupervisorOptions.loomServerEntry` field are gone; the
      `worker_mcp_servers` audit record no longer carries `loomServerIncluded`/`loomServerEntry`.
      Add/adjust a unit assertion on the audit detail shape. [AC3]

      - Comments / no-injection: no remaining code or comment implies loom injects its own server
      into a worker config. Bring `CursorMcpEnforcer.ts` `ALWAYS_ALLOWED='loom'` and its 'link back
      to the orchestrator' comment under FR-9; verify `cursor-mcp-enforcer.test.ts` shows no
      third-party enforcement regression — if a test asserts `loom` is always-allowed, that
      dependency is residue and is updated here. [AC4]

      - No reintroduction: TypeScript build passes with no dead `loomScriptPath`/`loomServerEntry`
      imports; the loom MCP server is not re-added in any form. [AC6]


      Verification bar: search proves no live caller before and after; build green; the
      materializer/worktree-mcp/adapter/cursor-enforcer suites pass with only residue-specific cases
      removed or updated; the retained third-party path emits exactly the policy-registry servers
      and behaves byte-for-byte as before.
