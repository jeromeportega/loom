stories:
  - id: story-006-001
    title: Add attempt-classification state column and audit detail
    description: >-
      Add a dedicated attempt-classification column (`infra_failure` vs. null/`work_failure`) to the
      better-sqlite3 store via a packages/loom-core/src/state/ migration, with an accompanying
      audit-log detail. This is a separate column, not a new agent-status enum value (owned by the
      sibling epic).
    acceptance_criteria:
      - >-
        A state migration under packages/loom-core/src/state/ adds the attempt-classification column
        to the store.
      - >-
        Attempts can be recorded as `infra_failure`, `work_failure`, or null, and read back from the
        column.
      - An audit-log detail records the attempt cause.
      - No new agent-status enum value is introduced.
      - A test asserts the migration applies and the column round-trips values.
    estimated_complexity: small
    dependencies: []
    tech_notes: >-
      Add `attempt_class TEXT` to the `agents` table via the idempotent per-column migration in
      `packages/loom-core/src/state/Database.ts` — copy the `PRAGMA table_info(agents)` + `if
      (!agentCols.some(c => c.name === 'attempt_class')) db.exec('ALTER TABLE agents ADD COLUMN
      attempt_class TEXT')` idiom already used for `worker_pid`/`review_status`/`request_count`, and
      bump `SCHEMA_VERSION` 14 → 15. Expose read/write through `AgentStore` and record the cause via
      `AuditLog.record({ action: 'attempt_classified', command: storyId, detail: {...} })` (the
      `detail` field is already JSON TEXT — no audit schema change). Define
      `AttemptClass`/`InfraSignature`/`Classification` in a new `orchestrator/resilience/types.ts`
      so downstream stories import them. The one trade-off: this is a separate column, NOT a status
      enum value — keep it strictly orthogonal to `status` (ADR-1) so you don't collide with the
      sibling epic's lifecycle work.
  - id: story-006-002
    title: Infra-signature classifier with loudness invariant
    description: >-
      On worker death, detect the four infra signatures (cursor-agent connection loss, spawn ENOENT,
      cli-config.json rename race, exit-before-any-output) wired to existing streaming signals
      (parseStreamLine, WorkerTimeoutGuard). Structure the classifier to admit new signatures
      cheaply, and enforce that a non-zero exit after producing output is a work failure, never
      reclassified as infra.
    acceptance_criteria:
      - >-
        Each of the four infra signatures is classified `infra_failure`, driven via the spawnChild
        seam in BaseCliWorker, each as its own asserted test (four separate tests).
      - >-
        A worker exiting non-zero after producing output is classified `work_failure` and never
        reclassified as infra — asserted by test (loudness invariant).
      - >-
        The classifier consumes existing streaming signals (parseStreamLine, WorkerTimeoutGuard) and
        exposes a structure that accepts new signatures without rewiring.
      - Classified causes are persisted to the attempt-classification column from story-006-001.
    estimated_complexity: medium
    dependencies:
      - story-006-001
    tech_notes: >-
      Create `packages/loom-core/src/orchestrator/InfraFailureClassifier.ts` exporting
      `classifyAttempt(o: SpawnOutcome): Classification`, an ordered `INFRA_SIGNATURES:
      SignatureMatcher[]` table, and a `SpawnOutcome` interface that carries `producedOutput`. Wire
      `producedOutput=true` into `BaseCliWorker`'s existing `child.stdout`/`stderr` `'data'`
      handlers, and source signature evidence from existing streaming signals (`parseStreamLine` for
      `connection_loss`, the `child 'error'` event message for `spawn_enoent`/`cli_config_rename`,
      exit code + no output for `exit_before_output`). The non-negotiable trade-off (ADR-2): the
      loudness gate `producedOutput && code !== 0 ⇒ work_failure` MUST run BEFORE any matcher in the
      table, and each of the four signatures plus the loudness case gets its own asserted test
      through the `spawnChild` seam; persist the result to story-006-001's column.
  - id: story-006-003
    title: Bounded auto-retry with deterministic backoff and jitter
    description: >-
      Auto-retry a detected infra_failure in-place on a fixed schedule (30s / 2m / 8m; cap 3
      attempts; no complexity scaling) with ±20% full-jitter from an injectable seeded source. Infra
      retries do not touch the story's failure budget. All retry/backoff constants live in one
      source location with no new policy knobs.
    acceptance_criteria:
      - >-
        Detected infra_failure attempts auto-retry in-place on the 30s / 2m / 8m schedule, capped at
        3 attempts.
      - >-
        Backoff applies ±20% full-jitter drawn from an injectable seeded source; tests perform no
        real sleeps (injectable clock/timer/seed).
      - Infra retries do not decrement the story's failure budget.
      - Each of the four signatures retries and the story still lands, asserted per-signature.
      - >-
        All retry/backoff constants are defined in a single source location; no new policy knobs are
        exposed.
    estimated_complexity: medium
    dependencies:
      - story-006-002
    tech_notes: >-
      Add `resilience/constants.ts` (`INFRA_RETRY_SCHEDULE_MS=[30_000,120_000,480_000]`,
      `INFRA_RETRY_MAX_ATTEMPTS=3`, `INFRA_RETRY_JITTER_FRACTION=0.2`), `resilience/RetryClock.ts`
      (the `RetryClock`/`JitterSource` interfaces plus a `jitter()` helper and a ~30-line
      `mulberry32`-style seeded PRNG), and `InfraRetryController.ts` with
      `shouldRetry(attempt)`/`waitBeforeRetry(attempt)`. Integrate by adding `protected
      spawnWithInfraRetry(...)` inside `BaseCliWorker.run()` that wraps the single `spawnAgent` call
      (do NOT add a new public method) and emits `assignment.onAttemptClassified?(...)`. The
      trade-off (ADR-3/ADR-5): infra retries re-enter the same worktree and must NOT decrement the
      failure budget — keep the budget-counting at the existing single point in `run()`, and thread
      the injectable `clock`/`jitter` everywhere so tests assert backoff with zero real sleeps.
  - id: story-006-004
    title: Spawn staggering to clear the cli-config rename herd
    description: >-
      Stagger concurrent cursor-agent spawns with 1–2s jitter to clear the ~/.cursor/cli-config.json
      rename herd, drawn from the injectable seeded/timer source.
    acceptance_criteria:
      - Concurrent cursor-agent spawns are staggered with 1–2s jitter.
      - Jitter is drawn from the injectable seeded/timer source; tests perform no real sleeps.
      - A test asserts concurrent spawns are spaced under deterministic timing.
    estimated_complexity: small
    dependencies:
      - story-006-003
    tech_notes: >-
      Add a small `SpawnStagger` (in `orchestrator/`, drawing from the `JitterSource`/`RetryClock`
      from story-006-003 and `SPAWN_STAGGER_MIN_MS`/`SPAWN_STAGGER_MAX_MS` from `constants.ts`) and
      await a 1–2s jittered delay before each concurrent `cursor-agent` spawn at the
      `BaseCliWorker.spawnChild` seam. Test deterministically by injecting the seeded source and
      asserting spacing via `clock.setTimeout` — no real sleeps. The trade-off (ADR-7): this accepts
      1–2s of per-worker start latency to clear the `cli-config.json` rename herd rather than taking
      a cross-process lock on a file loom doesn't own; the classifier remains the backstop if the
      race still fires.
  - id: story-006-005
    title: Sleep-proof monotonic timers with suspend detection
    description: >-
      Use monotonic process.hrtime.bigint() for all duration math, with heartbeat-based suspend
      detection (wall-clock jump > 6× poll interval). On detected sleep, re-arm all timers from the
      resume instant and route the worker through the shared infra-retry path, extending the
      existing WorkerTimeoutGuard injectable-now pattern.
    acceptance_criteria:
      - All worker duration math uses monotonic process.hrtime.bigint() rather than wall-clock.
      - A wall-clock jump greater than 6× the poll interval is detected as a suspend.
      - >-
        A simulated suspend (mocked monotonic-vs-wall divergence) does not kill a streaming worker;
        all timers re-arm from the resume instant.
      - The slept worker is routed through the shared infra-retry path from story-006-003.
      - Timer/clock sources are injectable; tests perform no real sleeps.
    estimated_complexity: medium
    dependencies:
      - story-006-003
    tech_notes: >-
      Extend `WorkerTimeoutGuard` (and `WorkerTimeoutGuardOptions`) with `monotonicNow?: () =>
      bigint` (production `process.hrtime.bigint()`) so ALL duration math uses monotonic time, plus
      an `onSuspendDetected?` sink; in `check()`, when the wall delta since last tick exceeds
      `SUSPEND_POLL_MULTIPLE × pollMs` (from `constants.ts`) while the monotonic delta is small,
      re-arm `startMs`/`lastActivityMs` from the resume instant and return a no-op kill instead of
      killing, then route the worker through story-006-003's shared infra-retry path. Mirror the
      existing injectable-`now`/`setTimeout`/`setInterval` pattern proven in
      `WorkerTimeout.test.ts`. The trade-off (ADR-4): two clocks now feed the guard and tests must
      mock both wall and monotonic — suspend forgives only the gap, so a worker still silent after
      resume is killed normally.
  - id: story-006-006
    title: loom retry CLI command (lease-aware)
    description: >-
      Add `loom retry <story-id> [--clean]` built on the existing StoryRetryService: if a live epic
      lease exists, reset-to-ready and let the lease-holder dispatch; self-dispatch only when no
      lease is held. Resets both the story and a fresh auto-retry budget, and the output text states
      that retry grants a fresh auto-retry budget.
    acceptance_criteria:
      - >-
        `loom retry <story-id>` resets and re-dispatches a failed story end-to-end with no
        hand-written scripts.
      - >-
        When a live epic lease exists, the story is reset-to-ready and the lease-holder dispatches
        (queue path); when no lease is held, the command self-dispatches.
      - The command resets both the story and a fresh auto-retry budget.
      - Command output text states that retry grants a fresh auto-retry budget.
      - The `--clean` flag is supported.
      - >-
        The known MCP orphaning hazard for loom_retry_story is documented on the tool (no behavior
        fix).
    estimated_complexity: medium
    dependencies:
      - story-006-003
    tech_notes: >-
      Add `packages/loom-cli/src/commands/retry.ts` exporting `runRetry(storyId, { clean })`,
      registered as a `commander` subcommand alongside `run`/`stop`, built on the existing
      `StoryRetryService({ projectRoot, db, clean })`. Make it lease-aware: when
      `LeaseStore.heldByOther(epicId)` is true, reset-to-ready and let the lease-holder dispatch
      (queue path); only build a `Supervisor` and `run([epicId])` (self-dispatch) when no lease is
      held. Reset BOTH the story and a fresh auto-retry budget and say so in the output text. The
      trade-off (ADR-5): two retry paths now exist (worker auto-retry vs. operator retry) sharing
      only constants + budget semantics; also add a doc comment on the MCP `loom_retry_story` tool
      noting the one-shot-stdio orphaning hazard (document only, no behavior fix).
  - id: story-006-007
    title: Checkpoint-on-stop before SIGTERM
    description: >-
      Before SIGTERM, `loom stop` attempts a bounded (30s/worker) WIP-commit in each in-flight
      worktree using the existing timeout-path commit machinery; stop proceeds regardless of
      checkpoint outcome.
    acceptance_criteria:
      - >-
        `loom stop` leaves a checkpoint commit in every in-flight worktree before terminating
        workers.
      - >-
        The checkpoint attempt is bounded to 30s per worker using the existing timeout-path commit
        machinery.
      - >-
        A hung checkpoint does not block the stop; stop proceeds regardless of checkpoint outcome —
        asserted by test.
      - Timeout/clock sources are injectable; tests perform no real sleeps.
    estimated_complexity: small
    dependencies: []
    tech_notes: >-
      Add `checkpointInFlightWorktrees(db, clock)` to `packages/loom-cli/src/commands/stop.ts`,
      invoked in the run-wide branch BEFORE the stop signal triggers SIGTERM. For each in-flight
      worktree (from the `agents` store), attempt a bounded WIP commit reusing
      `BaseCliWorker.checkpointUncommitted`'s proven `wip: … [loom]` `--no-verify` machinery, capped
      at `STOP_CHECKPOINT_TIMEOUT_MS` (30s) per worker via `clock.setTimeout`. The trade-off: a hung
      checkpoint is abandoned at the bound and stop proceeds regardless of outcome — assert this
      with an injected clock and a never-resolving checkpoint, no real sleeps; this is the existing
      accepted `--no-verify` exception documented in `worker-resilience.md`, so introduce no new
      bypass.
