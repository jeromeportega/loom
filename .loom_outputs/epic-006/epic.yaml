stories:
  - id: story-006-001
    title: Guard-compatible records-only release command
    description: >-
      Add a release path that cuts a records-only version release by bumping the version via the
      existing versioning script and opening a release PR, with no direct push to `main` and no
      hand-made release branch. The flow runs under the protected-branch guard.
    acceptance_criteria:
      - The release bumps the version using the existing versioning script
      - The release opens a PR rather than pushing directly to `main`
      - No hand-made release branch is required and no push to `main` is blocked
      - The flow runs under the protected-branch guard with no force push
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      Create `loom-cli/src/commands/release.ts` implementing phase 1: shell out to the existing
      `node scripts/bump-versions.mjs <version>` (idempotent, do NOT reimplement bumping), then `git
      checkout -b release/v<version>`, commit `chore(release): v<version>`, `git push -u origin
      release/v<version>`, and `gh pr create --head release/v<version>` against `main`. Route all
      git through `gitSafe` so it passes `PolicyEngine` — never push `main` and never `--force`.
      Trade-off: releasing now requires a PR-merge step before the tag can be cut, which is exactly
      the guard guarantee being preserved.
    test_plan: >-
      Level: INTEGRATION on `loom-cli/src/commands/release.ts` with the version script, `git`, and
      `gh` calls captured/mocked (no real remote or tag), plus a UNIT asserting the routed git
      commands pass `PolicyEngine.check()`.


      Key cases:

      - Reuses the bump script: the command shells out to `node scripts/bump-versions.mjs <version>`
      (assert invocation; do NOT reimplement bumping). [AC1]

      - Branch + PR shape: creates `release/v<version>`, commits `chore(release): v<version>`, runs
      `git push -u origin release/v<version>`, and opens the PR via `gh pr create --head
      release/v<version>` targeting `main`. [AC2, AC3]

      - Never pushes `main`: scan every captured push refspec — none is `main`; the only branch push
      is `release/v<version>`. [AC2, AC3]

      - Guard-clean: feed each captured git invocation through `PolicyEngine.check()` and assert all
      pass (a `release/v*` ref is not a protected branch); no `--force`/`--force-with-lease` flag
      appears in any command. [AC4]


      Verification bar: running `loom release <version>` produces a version bump via the existing
      script and an opened PR from `release/v<version>` with zero pushes to `main` and zero force
      flags, every git call passing the guard.
  - id: story-006-002
    title: Confirm guard-compatible tag push after merge
    description: >-
      Ensure the post-merge tag push succeeds under the guard: verify tag refs are not caught by the
      protected-branch guard, or define and implement the operator step to push the tag.
    acceptance_criteria:
      - >-
        Tag-ref push after release-PR merge is confirmed permitted by the guard, or a defined
        operator step pushes the tag
      - The protected-branch guard remains fully in force for worker agents and protected branches
      - No force push is involved in the tag push
    estimated_complexity: small
    dependencies:
      - story-006-001
    tech_notes: >-
      Do NOT add a new guard rule — `PolicyEngine.checkGit()` matches `cmd.args[2]` (refspec
      destination) against `protected_branches` globs (`main`/`master`), which tag refs
      (`v<version>`) and `release/v*` branches already miss. Add a regression test pinning that `git
      push origin v<version>` and `git push origin release/v*` pass `PolicyEngine.check()` and that
      `--force` stays blocked, and document the post-merge operator step `git tag v<version>
      <merge-sha> && git push origin v<version>`. Trade-off: the tag must point at the merged `main`
      commit, so it is a separate documented step rather than part of the `loom release` command.
    test_plan: >-
      Level: UNIT regression on `PolicyEngine.check()` / `checkGit()` (no new rule — pin existing
      behavior), plus a doc check for the operator step.


      Key cases:

      - Tag push permitted: `git push origin v<version>` passes `PolicyEngine.check()` (the refspec
      destination does not match the `main`/`master` `protected_branches` globs). [AC1]

      - Release branch permitted: `git push origin release/v<version>` (and a `release/v*` form)
      passes. [AC1]

      - Protected branch still blocked: `git push origin main` is rejected — the guard stays fully
      in force for workers and protected branches. [AC2]

      - Force still blocked: `git push --force` / `--force-with-lease` remain rejected on any ref.
      [AC3]

      - Defined operator step: the post-merge `git tag v<version> <merge-sha> && git push origin
      v<version>` step is documented (the tag must point at the merged `main` commit, so it is a
      separate step). [AC1]


      Verification bar: regression tests prove tag and `release/v*` pushes pass the guard while
      `main` and force pushes stay blocked, with no new rule added to `PolicyEngine`, and the
      post-merge tag step is written down.
