stories:
  - id: story-006-001
    title: Delete vendored bmad-* directories, preserve loom-* commands
    description: >-
      Delete every bmad-* directory from both .agents/skills/ and .claude/skills/ (~44 in each),
      while preserving every loom-* slash command in both folders. Make no change under skills/ or
      packages/loom-core/personas/.
    acceptance_criteria:
      - No bmad-* directory remains under .agents/skills/
      - No bmad-* directory remains under .claude/skills/
      - >-
        Every loom-* entry in both directories is preserved unchanged (loom-approve, loom-epic,
        loom-status, loom-ux-designer, and any others)
      - Nothing under skills/ or packages/loom-core/personas/ is modified
    estimated_complexity: small
    dependencies: []
    tech_notes: >-
      Stage the deletion atomically with `git rm -r .claude/skills/bmad-* .agents/skills/bmad-*` so
      `git status --porcelain` shows ONLY `D …/bmad-*` lines (GATE 2). Do not assume symmetry
      between folders: `.claude/skills` holds 4 loom-* commands (loom-approve, loom-epic,
      loom-status, loom-ux-designer) while `.agents/skills` holds only loom-approve — PRESERVE per
      the observed per-folder inventory, never an assumed list (threat T5). Touch nothing under
      `skills/` (the 5 ported review skills) or `packages/loom-core/personas/`; verify completion
      with `find .agents/skills .claude/skills -maxdepth 1 -name 'bmad-*'` returning empty (GATE 1).
      Trade-off: `git rm` over a wildcard is reversible and auditable, but the wildcard must not
      accidentally match a loom-* dir — confirm the staged file list before committing.
    test_plan: >-
      Level: shell/filesystem verification only — this is a deletion of directories, so there is no
      unit logic to test; correctness is proven by deterministic git/find gates run against repo
      state. Write no test files. Key cases (run as a checklist before commit): (1) HAPPY — GATE 1:
      `find .agents/skills .claude/skills -maxdepth 1 -name 'bmad-*'` returns EMPTY. (2) SCOPE GUARD
      — GATE 2: `git status --porcelain -- .claude/skills .agents/skills` shows ONLY `D  .../bmad-*`
      lines; zero lines mention loom-*, skills/, or personas/. (3) ASYMMETRIC SURVIVOR INVENTORY
      (boundary, threat T5) — `find .claude/skills -maxdepth 1 -name 'loom-*'` lists exactly
      loom-approve, loom-epic, loom-status, loom-ux-designer; `find .agents/skills -maxdepth 1 -name
      'loom-*'` lists exactly loom-approve. Assert against the observed per-folder list, never an
      assumed symmetric one. (4) NEGATIVE/OFF-LIMITS — `git status --porcelain -- skills/
      packages/loom-core/personas/` is EMPTY. (5) WILDCARD SAFETY — inspect the staged delete list
      (`git status --porcelain | grep '^D'`) and confirm no `loom-*` path was matched before
      committing. Verification bar: AC met only when GATE 1 is empty, GATE 2 shows deletions-only
      under both skill dirs, both loom-* survivor inventories match exactly per folder, and the diff
      touches nothing under skills/ or personas/.
  - id: story-006-002
    title: Reconcile docs/ tree so no document references a removed skill
    description: >-
      Grep the docs/ tree for bmad and update every hit so no document references a removed skill,
      including the known reference files. In docs/capabilities.md, remove rows for vendored BMAD
      skills and make no other edits to that page.
    acceptance_criteria:
      - git grep -i bmad over docs/ returns nothing that references a removed skill
      - >-
        Known reference files are updated: docs/architecture/index.md,
        docs/reviews/epic-2-review.md, docs/testing/runbook.md, docs/operations/bootstrap.md,
        docs/research/live-agent-guidance.md
      - >-
        In docs/capabilities.md, rows for vendored BMAD skills are removed and no other edits are
        made to that page
    estimated_complexity: medium
    dependencies:
      - story-006-001
    tech_notes: >-
      Run `git grep -in bmad -- docs/` and triage each hit against the A/B/C/D taxonomy: only
      Class-A hits (names of a now-deleted bmad-* skill) must change; Class-B provenance ("BMAD
      originals", "BMAD-era") may stay or be softened to "the planning originals." Edit the five
      known files (docs/architecture/index.md, docs/reviews/epic-2-review.md,
      docs/testing/runbook.md, docs/operations/bootstrap.md, docs/research/live-agent-guidance.md)
      with targeted `Edit` calls — no `sed` sweeps that could clobber prose. Per ADR-004, treat
      docs/capabilities.md as VERIFY-ONLY: `git grep -i bmad -- docs/capabilities.md` currently
      returns nothing, so do not invent rows to delete; only remove a row if a real vendored-skill
      row actually appears. You solely own `docs/`; the one trade-off is that you observe
      story-006-001's deletions but must not re-perform them.
    test_plan: >-
      Level: grep-gate verification plus per-file triage — no test framework; the gate commands are
      the tests. Depends on story-006-001's deletions being present. Key cases: (1) HAPPY — GATE 3:
      `git grep -in bmad -- docs/` triaged so ZERO Class-A hits (names of a now-deleted bmad-*
      skill) remain; Class-B provenance ('BMAD originals', 'BMAD-era') may stay or be uniformly
      softened. (2) KNOWN-FILE COVERAGE — after editing, re-grep each individually: `git grep -in
      bmad -- docs/architecture/index.md docs/reviews/epic-2-review.md docs/testing/runbook.md
      docs/operations/bootstrap.md docs/research/live-agent-guidance.md` and confirm each remaining
      hit is non-Class-A. (3) CAPABILITIES VERIFY-ONLY (ADR-004) — `git grep -i bmad --
      docs/capabilities.md` currently returns nothing, so make NO edit; additionally READ the file
      (don't trust grep count alone) to catch 'BMAD' embedded in a larger word, and only remove a
      row if a real vendored-skill row actually appears. (4) NO-PROSE-CLOBBER — use targeted Edit
      calls, not sed sweeps; spot-check that softened sentences still read correctly. (5)
      OWNERSHIP/SCOPE — `git status --porcelain` shows changes confined to docs/. Verification bar:
      AC met when docs/ has zero Class-A references, all five known files are reconciled,
      capabilities.md is byte-identical unless a genuine row existed, and the diff is confined to
      docs/.
  - id: story-006-003
    title: Repo-wide grep sweep for dangling bmad references
    description: >-
      Run a repo-wide git grep -i bmad beyond docs/ and update any loom-* command internal, code
      comment, README, config, or CI reference that names a removed skill. Confirm via grep across
      the test tree that no test, fixture, or snapshot references a removed bmad skill.
    acceptance_criteria:
      - >-
        Repo-wide git grep -i bmad (outside docs/) is reviewed and any loom-* command internal, code
        comment, README, config, or CI reference to a removed skill is updated
      - No loom-* command transitively references a removed bmad-* skill
      - >-
        git grep -i bmad across the test tree confirms no test, fixture, or snapshot references a
        removed bmad skill
    estimated_complexity: small
    dependencies:
      - story-006-001
    tech_notes: >-
      Run `git grep -in bmad` with the Class-D pathspec exclusions `':!docs/' ':!.loom_outputs/'
      ':!_bmad-output/' ':!epics/' ':!buildday/'` and triage every hit. The ONLY mandatory source
      edit is the Class-A reference at `packages/loom-core/src/worker/contextAssembler.ts:54` (the
      `bmad-distillator` graceful-degradation path name) — reconcile it to the ported skill name.
      Leave Class-B provenance comments (LessonExtractor.ts:28, reviewerSkills.ts:11) and especially
      DO NOT delete the Class-C guard tests (`headlessPurity.ts` / `withHiddenBmadPaths`,
      `init.test.ts:134`, and the ported-skill load tests) — they contain `bmad` precisely to prove
      loom is independent of the BMAD runtime (threat T1). Confirm via GATE 5 (`git grep -c
      'withHiddenBmadPaths'` count unchanged) and GATE 6 (`git grep -in 'bmad-'` over the test tree
      is empty); you own `packages/**/src` + the test tree but must NOT modify
      `test/fixtures/headlessPurity.ts`.
    test_plan: >-
      Level: grep gates plus running the existing guard-test suites (those tests ARE the regression
      net — do not author new ones). Depends on story-006-001. Key cases: (1) THE ONE MANDATORY EDIT
      — reconcile the Class-A reference at packages/loom-core/src/worker/contextAssembler.ts:54
      (`bmad-distillator` graceful-degradation path) to the ported skill name (doc-distiller);
      confirm the new name resolves to a skill that exists under skills/. (2) GATE 4 — `git grep -in
      bmad -- ':!docs/' ':!.loom_outputs/' ':!_bmad-output/' ':!epics/' ':!buildday/'`: every
      remaining hit is Class-B provenance (LessonExtractor.ts:28, reviewerSkills.ts:11) or Class-C
      guard, with ZERO Class-A. (3) FALSE-GREEN TRIPWIRE — GATE 5: `git grep -c
      'withHiddenBmadPaths' -- packages/loom-core/test/` equals the pre-change count. (4) GATE 6 —
      `git grep -in 'bmad-' -- packages/loom-core/test/ packages/loom-cli/src/__tests__/` is EMPTY.
      (5) PRESERVE GUARDS (threat T1, negative case) — do NOT modify
      packages/loom-core/test/fixtures/headlessPurity.ts, init.test.ts:134, or the ported-skill
      registration/load tests; they contain `bmad` to prove independence from the BMAD runtime. (6)
      BEHAVIOR CHECK — run the suites touching the edited path (contextAssembler.test.ts) and the
      load/registration + init tests; all stay green after the rename. Verification bar: AC met when
      contextAssembler points at a real ported skill, Class-A count is zero outside docs/,
      withHiddenBmadPaths count is unchanged, the test tree names no `bmad-` skill, and the guard
      tests still pass unmodified.
  - id: story-006-004
    title: Verify green suite and assemble single PR with rationale
    description: >-
      Run the full build and test suite across all workspace packages and fix any cross-cutting
      breakage from the deletion. Deliver the work as one clean PR whose body documents the 5-of-44
      ported rationale.
    acceptance_criteria:
      - npm run build passes across all workspace packages
      - npm run test passes across all workspace packages
      - >-
        Delivered as a single PR whose body states that only 5 of ~44 skills were ported (the
        review/verify skills) and confirms the removal drops manual IDE commands, not autonomous
        capability
    estimated_complexity: small
    dependencies:
      - story-006-001
      - story-006-002
      - story-006-003
    tech_notes: >-
      Assemble the single PR after 001/002/003 land, then run `npm run build` and `npm run test`
      across all four workspaces (loom-core/cli/mcp/web) — build catches any TS reference to a
      deleted name, tests prove behavior is unchanged AND that the five ported skills still load
      with `_bmad` hidden. Green alone is insufficient (Constraint 3): before declaring success,
      re-run GATES 1, 2, 5, and 6 to confirm no guard test was silently dropped. The PR body must
      document the 5-of-44 ported rationale (only the review/verify skills: adversarial-review,
      doc-distiller, edge-case-hunter, failure-investigator, lesson-extractor) and state that this
      removes manual IDE commands, not autonomous capability; per ADR-004 note the operator-command
      removal here rather than editing capabilities.md.
    test_plan: >-
      Level: full workspace build + test run (the integration/regression gate) plus re-running the
      structural gates from the prior stories. Depends on 001/002/003. Key cases: (1) BUILD — GATE
      7: `npm run build` returns 0 errors across loom-core, loom-cli, loom-mcp, loom-web (catches
      any lingering TS reference to a deleted name). (2) TEST — `npm run test` green across all four
      workspaces. (3) PORTED-SKILL LOAD ASSERTION (not-skipped check) — confirm the five
      ported-skill load tests actually execute and pass with `_bmad` hidden (inspect runner output /
      count, don't infer from overall green). (4) ANTI-HOLLOW RE-GATE (Constraint 3) — re-run GATE 1
      (find empty), GATE 2 (deletions-only status), GATE 5 (withHiddenBmadPaths count stable), and
      GATE 6 (test tree free of `bmad-`) to prove no guard test was silently dropped between
      branches. (5) PR-BODY CONTENT — single PR whose body states only 5 of ~44 skills were ported
      (adversarial-review, doc-distiller, edge-case-hunter, failure-investigator, lesson-extractor)
      and that the removal drops manual IDE slash commands, not autonomous pipeline capability.
      Verification bar: AC met when build and test are green across all four packages, the five load
      tests demonstrably ran and passed, GATES 1/2/5/6 still hold post-assembly, and the work ships
      as one PR whose body documents the 5-of-44 rationale and the operator-command-only impact.
