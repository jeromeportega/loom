stories:
  - id: story-019-001
    title: Persist full worker output to a per-agent file with a durable offset pointer
    description: >-
      In loom-core, append each worker's streamed output to a per-agent file under the loom state
      directory as it is produced, applying the existing redaction before each write. Never
      overwrite the file with the tail at completion. Continue writing the small rolling tail to the
      database and additionally record a durable length/offset pointer, defined as the
      post-redaction byte length of the file.
    acceptance_criteria:
      - >-
        Each worker's streamed output is appended to a per-agent file under the loom state
        directory, covered by existing ignore rules and never committed.
      - >-
        At worker completion the file is NOT overwritten or truncated; it contains 100% of the
        streamed (post-redaction) output.
      - >-
        Existing streamed-output redaction is applied to data before it is written to the file, so
        the file contains no secrets.
      - >-
        The durable offset is defined as the post-redaction byte length of the file, and both the
        database pointer and the file writer derive from this single definition.
      - >-
        The database still holds the small rolling tail for fast status rendering, and the tail is
        not removed.
      - Full logs are stored on disk (not as a database blob) and not in the system temp directory.
      - >-
        Targeted unit tests cover append-on-stream, no-overwrite-at-completion,
        redaction-before-write, and offset accounting.
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      Create `packages/loom-core/src/state/WorkerLogStore.ts` as the single owner of path + offset
      semantics (`pathFor`/`append`/`byteLength`/`read`/`remove`, rooted at `<loomdir>/logs`), using
      `fs.appendFileSync` per chunk — no `WriteStream`. Wire it into the `Supervisor.onOutput`
      chokepoint (~`Supervisor.ts:1449`) so `redactSecrets` from `util/redact.ts` runs ONCE before
      both the existing `appendToTail` and `workerLogs.append`, and have the file append return the
      cumulative post-redaction byte length that `flushTails` writes to the new `agents.log_bytes`
      column via `AgentStore.updateLog(id, logTail, logBytes)`. Add the additive nullable column
      (bump `SCHEMA_VERSION` 21→22 with a `runMigrations` step in `Database.ts`), key files by
      `story-id` not agent id, and add `.loom/logs/` to the loom-managed `.gitignore` block. The
      trade-off: per-chunk `appendFileSync` reaches the OS page cache immediately (the durability
      guarantee) at the cost of fd churn — acceptable at LLM-stream write rates, with a per-agent
      held fd as the documented fallback if profiling shows churn.
    test_plan: >-
      **Levels:** Unit (loom-core) for `WorkerLogStore` and the `Supervisor.onOutput`/`flushTails`
      wiring; one small integration test for the schema migration in `Database.ts`. This story is
      pure persistence logic with no network seam, so unit tests give the cheapest confidence; mock
      nothing real except a temp `loomdir`.


      **Key cases (write tests first):**

      - `WorkerLogStore` in isolation against a `tmp` dir: `pathFor(storyId)` resolves to
      `<loomdir>/logs/<story-id>.log`; `append` creates the file and returns the *cumulative*
      post-redaction byte length; successive appends accumulate; `byteLength` (statSync size) equals
      the last `append` return; `read(storyId)` round-trips the full content.

      - **Append-on-stream:** feed N chunks and assert each is on disk immediately after its
      `append` call (not buffered until completion).

      - **No-overwrite-at-completion (FR-1, critical):** stream content larger than the 4 KB DB tail
      (`Supervisor.LIVE_TAIL_CHARS`), drive the run to completion, and assert the file still holds
      100% of the concatenated stream — strictly larger than `log_tail` and never
      truncated/rewritten.

      - **Redaction-before-write (FR-4, critical):** push a chunk containing `sk-ant-...`,
      `ghp_...`, and `github_pat_...`; assert the file bytes are redacted AND that `redactSecrets`
      runs exactly once at the `onOutput` chokepoint feeding both `appendToTail` and
      `workerLogs.append` (no unredacted path to disk or to `log_tail`).

      - **Offset accounting (FR-3):** `log_bytes == Buffer.byteLength(redacted, 'utf8')`; include a
      multibyte (UTF-8) chunk to prove byte (not char) counting; the DB pointer derives from
      `append`'s return value, not a recomputation.

      - **Ordering invariant:** file is appended before `flushTails` writes the pointer, so
      `agents.log_bytes <= file size` always.

      - **Tail preserved (FR-2):** `log_tail` remains the bounded 4096-char rolling tail and is
      still updated via `AgentStore.updateLog(id, logTail, logBytes)`.

      - **Migration:** `SCHEMA_VERSION` 21→22 adds nullable `log_bytes`; pre-existing agent rows
      read back `NULL`/`0` with no error.

      - **Storage location (NFR-1):** assert the file lives under `<loomdir>/logs` (not a DB blob,
      not `os.tmpdir()`), and that `.loom/logs/` is present in the loom-managed `.gitignore` block.


      **Verification bar:** Every AC met when: a completed multi-chunk run leaves an on-disk file
      byte-identical to the full post-redaction stream (proving no-overwrite + append-on-stream),
      redaction is provably applied before any write, `log_bytes` equals the file's post-redaction
      byte length and is the single source the DB pointer derives from, the rolling tail still
      updates, and the v22 migration applies cleanly to a DB with existing agents.
  - id: story-019-002
    title: Serve the full persisted log with from-offset fetch
    description: >-
      Add a read path that serves an agent's full persisted log and supports a from-offset query,
      returning only the bytes after the supplied offset. Reads must tolerate a file being actively
      appended by the sole writer process.
    acceptance_criteria:
      - A read path returns the complete persisted log for a given agent.
      - >-
        Supplying a from-offset query returns only the bytes after that offset, using the same
        post-redaction byte-length offset definition as the writer.
      - A from-offset equal to the current durable length returns no new bytes.
      - Reads succeed while the file is being concurrently appended by the writer.
      - >-
        Targeted tests cover full fetch, from-offset fetch, and the boundary case where offset
        equals current length.
    estimated_complexity: small
    dependencies:
      - story-019-001
    tech_notes: >-
      Add `GET /api/agents/:id/log[?from=<int>]` to `loom-web` `index.ts` alongside the existing
      `/api/agents/:id` route, resolving `:id` → `story_id` through `AgentStore` (never concatenate
      the raw param into a path; unknown id → 404) and serving `WorkerLogStore.read(storyId, from ??
      0, log_bytes)` as `text/plain; charset=utf-8` with an `X-Log-Length: <log_bytes>` header.
      Bound every read to the durable `agents.log_bytes` pointer so a concurrently-appending writer
      is tolerated, and return an empty 200 body when `from === log_bytes`. The trade-off:
      `loom-web` takes a `loom-core` dependency on `WorkerLogStore` rather than reimplementing the
      file read — accepted to guarantee byte-identical offset semantics with the writer.
    test_plan: >-
      **Levels:** Integration (loom-web) — exercise `GET /api/agents/:id/log` against a real Express
      handler, a real `AgentStore`, and a real `WorkerLogStore` file in a temp `loomdir`. This is an
      HTTP↔filesystem seam (the whole point of the story), so test it end-to-end through the route
      rather than unit-testing the handler in isolation.


      **Key cases (write tests first):**

      - **Full fetch:** with a known `story_id` log on disk, `GET /api/agents/:id/log` (no `from`)
      returns the complete body, `Content-Type: text/plain; charset=utf-8`, and `X-Log-Length` equal
      to `agents.log_bytes`.

      - **From-offset (FR-5):** `?from=N` returns exactly the bytes after offset N, byte-identical
      to `WorkerLogStore.read(storyId, N, log_bytes)`, using the same post-redaction byte-length
      offset definition as the writer.

      - **Boundary — `from === log_bytes`:** empty body, status 200, `X-Log-Length` still set.

      - **Boundary — `from === 0`** behaves identically to no `from`.

      - **Concurrent append tolerated (NFR-5):** append more bytes to the file *after* the pointer
      is read, then issue the request; the read is bounded to `log_bytes` so it returns the
      pointer-consistent prefix and never errors or over-reads.

      - **Unknown id → 404 (security):** an id with no matching agent returns 404 and never touches
      the filesystem; confirm the raw `:id` is resolved through `AgentStore` to a validated
      `story_id` and is never concatenated into a path (path-traversal guard).

      - **Missing file:** agent exists but no log file yet → empty body with `X-Log-Length: 0` (or
      404 per chosen convention; assert the deliberate behavior, not a 500).


      **Verification bar:** Every AC met when a real HTTP request returns the complete log for full
      fetch, returns only the suffix for `from-offset` (offset semantics byte-identical to the
      writer), returns an empty 200 at the `from === log_bytes` boundary, and succeeds against a
      file being actively appended — all while resolving id→story safely with a 404 on unknown ids.
  - id: story-019-003
    title: Rebuild web log panes authoritatively on connect with correct incremental merge
    description: >-
      In loom-web, on opening or re-entering an epic view or on page reload, fetch the full log for
      each visible worker via the read path and rebuild that worker's pane from it. After rebuild,
      carry only true incremental appends over SSE keyed by the durable offset, anchoring pane
      content to the fetched full log and extending it by appends only.
    acceptance_criteria:
      - >-
        Opening or re-entering an epic view, or reloading the page, rebuilds each visible worker's
        pane from the full-log read path.
      - >-
        After an idle period or dropped connection, the pane shows the complete log, not a small
        tail.
      - >-
        Reconnect resumes from the last known durable offset rather than resending a tail; appends
        are not truncated and not duplicated.
      - The pane is byte-identical to the persisted full log after rebuild and subsequent appends.
      - >-
        The connection-generation signal the stream already emits forces a full rebuild when the
        server restarts.
      - Only visible workers are fetched and rebuilt, not all workers in the epic.
      - Existing live-streaming behavior for an actively-watched pane continues to work.
    estimated_complexity: medium
    dependencies:
      - story-019-002
    tech_notes: >-
      In `loom-web` modify `events.ts` to track `emittedOffset[agentId]` (seeded to current
      `log_bytes` on connect, streaming only NEW appends as `{from, bytes}` keyed to the absolute
      durable offset) and replace the fragile `chunk.startsWith(prev)` merge in `public/index.html`
      (~line 702) with offset-anchored reconcile: on view-enter/reload GET `/api/agents/:id/log` for
      each VISIBLE worker only, set `pane.textContent = body` and `clientOffset = X-Log-Length`,
      then on `output` append `bytes.slice(clientOffset - from)` (refetch full if `from >
      clientOffset`). Consume the already-emitted `hello`/`epoch` signal (`events.ts:43`) to force a
      full rebuild on server restart. The trade-off: the GET-then-SSE connect handshake has a small
      overlap/gap window, resolved by slicing overlap and a single refetch on gap, rather than
      adding a stateful subscribe protocol to GET-only EventSource.
    test_plan: >-
      **Levels:** Unit/component for the client offset-reconcile logic (extract the merge into a
      pure, testable function over `{from, bytes}` + `clientOffset` so it is not buried in DOM
      handlers); integration for `events.ts` SSE offset emission; one e2e/browser test for the
      reconnect journey (idle → reconnect → full pane). The client merge is the highest-risk surface
      (it replaces the buggy `startsWith` heuristic at ~line 702), so spend the most cases there.


      **Key cases (write tests first):**

      - **events.ts seeding (FR-7):** on connect, `emittedOffset[agentId]` is seeded to the current
      `agents.log_bytes` — the server streams only NEW appends and never replays history.

      - **events.ts ticks:** when `log_bytes > emittedOffset`, emit `{ agent_id, story_id, from,
      bytes }` with `from` the absolute durable offset, then advance `emittedOffset`; no emission
      when nothing new.

      - **Authoritative rebuild (FR-6):** on view-enter / reload, for each VISIBLE worker the client
      GETs `/api/agents/:id/log`, sets `pane.textContent = body` and `clientOffset = X-Log-Length`.

      - **Append, no duplication (FR-8, critical):** an `output` event with `from <= clientOffset`
      appends `bytes.slice(clientOffset - from)`; a resent/overlapping tail (`from < clientOffset`)
      trims the overlap and does NOT duplicate; `clientOffset` advances to `from + bytes.length`.

      - **Gap self-heal (critical):** `from > clientOffset` triggers a full refetch (re-anchor) — no
      truncation, no silent loss.

      - **Server restart (FR-8):** a changed `hello`/`epoch` (`events.ts:43`) forces
      `rebuildAllVisible()`.

      - **Visible-only (scope):** only visible workers are fetched/rebuilt; offscreen workers in the
      epic are not fetched.

      - **Idle/dropped-connection:** after a simulated idle gap the pane shows the complete log, not
      a small tail.

      - **Byte-identical:** after rebuild + a sequence of appends, `pane.textContent` equals the
      persisted full log byte-for-byte.

      - **No live regression (Goal 3):** an actively-watched pane still updates incrementally from
      SSE as before.


      **Verification bar:** Every AC met when the reconcile function provably appends-only (overlaps
      sliced, gaps refetched, never truncates or duplicates) under unit tests, `events.ts` streams
      from the seeded durable offset, a reconnect/reload rebuilds visible panes to a byte-identical
      copy of the persisted log, an epoch change forces rebuild, and live streaming for a watched
      pane is unbroken.
  - id: story-019-004
    title: Prune full-log files under the worktree lifecycle
    description: >-
      Bring full-log files under the existing worktree prune lifecycle: retain logs for failed and
      blocked workers for debugging, and remove logs for done workers, behind the existing prune
      behavior.
    acceptance_criteria:
      - Pruning removes full-log files for done workers.
      - Pruning retains full-log files for failed and blocked workers.
      - Pruning is wired into the existing worktree prune behavior rather than a separate mechanism.
      - Targeted tests cover retention for failed/blocked and removal for done.
    estimated_complexity: small
    dependencies:
      - story-019-001
    tech_notes: >-
      Inject a nullable `WorkerLogStore` into `WorktreeManager` and call
      `this.workerLogs?.remove(storyId)` inside `WorktreeManager.remove` (`WorktreeManager.ts:136`),
      the single chokepoint both `WorktreeJanitor.prune` and `EpicFinalizer` already route through.
      No extra branching is needed for retention: `failed`/`blocked` agents are in
      `WorktreeJanitor.PRESERVE` so their worktrees (and therefore logs) are never removed, while
      only `done`/`no-agent` removals reach `remove()`. The trade-off: `WorktreeManager` gains an
      optional dependency — keep it injected and nullable so existing constructions keep working.
    test_plan: >-
      **Levels:** Unit (loom-core) on `WorktreeManager.remove` plus the
      `WorktreeJanitor`/`EpicFinalizer` routing. No new I/O seam beyond an `unlink`, so unit
      coverage with a temp `WorkerLogStore` is sufficient.


      **Key cases (write tests first):**

      - **Removal for done (FR-9):** `WorktreeManager.remove(storyId)` calls
      `workerLogs?.remove(storyId)` and the `<story-id>.log` file is deleted; covers both removal
      sites (`WorktreeJanitor.prune` for orphans/`completed`/`no-agent` and `EpicFinalizer` for
      clean merge) since both route through `remove`.

      - **Retention for failed/blocked (FR-9, critical):** agents with `failed`/`blocked` status are
      in `WorktreeJanitor.PRESERVE`, so prune never calls `remove` for them and the log file remains
      on disk — assert the file still exists after a prune pass that includes such agents.

      - **Nullable dependency:** with no `WorkerLogStore` injected, `remove` completes without error
      (existing constructions keep working).

      - **Idempotent:** calling `remove(storyId)` when the file is already gone does not throw.

      - **Single chokepoint:** assert pruning is wired through `WorktreeManager.remove`, not a
      separate sweep — i.e. removing a worktree is the only thing that removes its log.


      **Verification bar:** Every AC met when a prune removes done workers' log files, leaves
      failed/blocked workers' log files intact (via `PRESERVE`, no extra branching), and the removal
      happens through the existing `WorktreeManager.remove` chokepoint with the dependency
      optional/nullable so unrelated callers are unaffected.
  - id: story-019-005
    title: Run the full build + test suite and fix any cross-cutting regressions
    description: >-
      Run the complete build and test suite across all packages to surface cross-service regressions
      between the loom-core persistence layer, the read path, and the loom-web reconnect logic, and
      fix any that appear.
    acceptance_criteria:
      - The full build passes.
      - The entire test suite passes.
      - No existing policy or guardrail is relaxed by the changes.
    estimated_complexity: small
    dependencies:
      - story-019-001
      - story-019-002
      - story-019-003
      - story-019-004
    tech_notes: >-
      Run `npm run build` and `npm run test` across all workspace packages to surface integration
      drift between the `WorkerLogStore` offset definition, the read endpoint, and the client
      reconcile — pay special attention to the v22 schema migration (existing agents have
      `log_bytes` NULL/0) and that the redaction chokepoint did not alter the live tail or status
      rendering. Confirm no policy or guardrail was relaxed (the change is purely additive
      persistence + read plumbing). The trade-off: this is a verification-only story, so resist the
      urge to refactor — fix cross-cutting regressions in place and route any new behavior back to
      its owning story.
    test_plan: >-
      **Levels:** Whole-suite verification — `npm run build` and `npm run test` across all workspace
      packages. No new tests authored here except any needed to pin a regression you actually find;
      this story's job is to catch cross-package drift between the `WorkerLogStore` offset
      definition (story-019-001), the read endpoint (-002), the client reconcile (-003), and pruning
      (-004).


      **Key cases:**

      - **Build passes:** `npm run build` green across loom-core, loom-cli, loom-web.

      - **Suite passes:** `npm run test` green across all packages with no skipped/quarantined tests
      masking failures.

      - **v22 migration under real data:** open a DB that has pre-existing agents (with `log_bytes`
      NULL/0) and confirm status views and the new pointer reads behave — no migration crash, no NaN
      offsets.

      - **No live-path regression (Goal 3):** confirm the redaction chokepoint did not change the
      `log_tail` content/shape or status rendering versus prior behavior.

      - **Guardrails intact (NFR-3):** `loom guard check` still exits non-zero for forbidden
      commands and protected-branch invariants hold — the change must be purely additive.


      **Verification bar:** Both AC met when a clean `npm run build` and full `npm run test` pass
      across every package, the v22 migration applies to a DB with legacy agents, and a spot-check
      confirms no policy/guardrail was relaxed. Fix cross-cutting regressions in place; route any
      genuinely new behavior back to its owning story rather than refactoring here.
