  - id: story-043-002
    title: Case set with rubric expectations and case loader
    description: >-
      Add a curated case set of completed-story inputs across the three buckets (skill-worthy →
      expects a good SKILL.md; trivial/one-off → expects NONE; borderline), each paired with rubric
      expectations, plus a loader that reads and validates them against the foundation case schema.
      Adds only its own non-shared fixture and loader files.
    acceptance_criteria:
      - >-
        Cases cover all three buckets: clearly skill-worthy (expects a good SKILL.md), clearly
        trivial/one-off (expects NONE), and borderline.
      - >-
        Each case carries the original work context (work summary + diff context) and rubric
        expectations (correct NONE-vs-generate call; for generate cases, the qualities a good skill
        must have).
      - >-
        A case loader reads the cases and validates them against the foundation's case schema,
        failing on malformed cases.
      - Deterministic unit tests cover the loader and validation and make no real model calls.
      - Only non-shared files are added; the foundation case schema is not modified.
    estimated_complexity: medium
    dependencies:
      - story-043-001
    tech_notes: >-
      Add `packages/loom-core/eval-cases/skill-generator.yaml` (operator-curated YAML matching
      `lesson-extractor.yaml`/`opportunity-engine.yaml`) and `src/eval/skill-generator/loadCases.ts`
      exporting `loadSkillGeneratorCases(fixturePath?)`, defaulting to
      `<projectRoot>/eval-cases/skill-generator.yaml` and validating via
      `SkillGeneratorCaseSetSchema.parse` so malformed cases throw. Curate all three buckets per
      ADR-004: `source:'worthy'` with `expected_decision:'generate'`, `source:'trivial'` with
      `expected_decision:'none'` (these carry the spurious-generation regression signal), and
      `source:'borderline'` with `expected_decision:'either'`. Each case's
      `rubric.expected_themes`/`spurious_traps` must be populated so the judge and deterministic
      scorer have ground truth. Trade-off: the trivial bucket is the only defense against
      spurious-generation drift, so invest curation effort there — too few or too-easy trivial cases
      and the spurious-rate metric is meaningless. Cover the loader and zod-rejection paths with
      Jest using no real model calls; import only the foundation's `caseSchema` — do not edit it.
    test_plan: >-
      Levels: unit only (loader + validation), no model calls. Import the foundation `caseSchema` —
      do NOT edit it. Cases: (1) `loadSkillGeneratorCases()` with no arg loads the default
      `<projectRoot>/eval-cases/skill-generator.yaml` and returns ≥1 case in EACH bucket — assert at
      least one `source:'worthy'`/`expected_decision:'generate'`, one `source:'trivial'`/`'none'`,
      one `source:'borderline'`/`'either'`; (2) a data-integrity guard over the committed fixture:
      every worthy case has non-empty `expected_themes`, every trivial case has populated
      `spurious_traps`, and the trivial bucket has enough non-trivial cases that
      `spuriousGenerationRate` is meaningful (don't ship 1 toy trivial case); (3)
      `loadSkillGeneratorCases(path)` reads from an explicit fixture path; (4) malformed input
      throws — point the loader at a temp YAML missing a required field (e.g. no
      `rubric.expected_decision`) and assert it throws via zod; (5) empty `cases:` list throws
      (min(1)); (6) the committed `skill-generator.yaml` itself validates clean against
      `SkillGeneratorCaseSetSchema`. Verification bar: loader returns schema-validated cases
      spanning all three buckets, throws on malformed/empty fixtures, the real fixture parses, and
      only non-shared files (`loadCases.ts`, `skill-generator.yaml`, tests) were added.
  - id: story-043-003
    title: Rubric-based LLM-as-judge
    description: >-
      Implement a rubric LLM-as-judge, adapting the lesson-extractor / opportunity-engine
      rubric-judge pattern, that scores decision correctness (generate-vs-NONE) and generated-skill
      quality, and explicitly flags spurious generation and low-quality/unfaithful skills. Emits the
      foundation's judge-result types. Adds only its own non-shared judge files.
    acceptance_criteria:
      - >-
        The judge scores (a) decision correctness — generate-vs-NONE matches what the work warranted
        — and (b) for generated skills, skill quality (well-formed per the skill format, reusable,
        faithful to the work, appropriately scoped).
      - >-
        The judge explicitly flags spurious generation (skill manufactured from trivial work) and
        low-quality/unfaithful skills, emitting the foundation judge-result types.
      - >-
        Borderline-case scoring semantics are defined precisely (single expected call vs. tolerance
        band) so scores stay stable.
      - Model selection is environment-configurable with safe defaults.
      - Deterministic mocked-LLM unit tests cover the judge wiring and make no real model calls.
    estimated_complexity: medium
    dependencies:
      - story-043-001
    tech_notes: >-
      Implement `src/eval/skill-generator/judge.ts` exporting `judgeSkillGeneration(c, output,
      deps)`, adapting `opportunity-engine/judge.ts`. Return `{status:'skipped'}` when
      `output.decision==='none'` (nothing to score); for `'generate'`, prompt the judge model via
      `loadBundledPrompt('skill-generator-judge')` (new persona file
      `personas/skill-generator-judge.md`) with `nonAgentic:{ excludeDynamicSections:true }`,
      scoring ONLY the subjective `SkillGeneratorJudgment` dimensions
      (`well_formed`/`reusable`/`faithfulness`/`scope_appropriateness`, plus advisory
      `spurious`/`low_quality` booleans) — do NOT compute decision-correctness or spurious-rate here
      (that is `score.ts`, ADR-003). Wrap all case-derived content (`output.skillMd`, `c.work.*`) in
      the standard untrusted-data delimiter preamble (T1). A parse failure must resolve to
      `'inconclusive'`, not a silent pass. Use `resolveSkillGeneratorModels` from `models.ts` for
      env-overridable model selection. Trade-off: keep the judge confined to irreducibly-subjective
      quality — pulling objective decision logic in here would make the headline gate gameable by
      judge-model drift. Test with a mocked `LLMClient` only.
    test_plan: >-
      Levels: unit with a mocked `LLMClient` only — no real model calls. Adapt
      `opportunity-engine/judge.ts`. Cases: (1) `output.decision==='none'` → `judgeSkillGeneration`
      returns `{status:'skipped'}` and the mock LLM's `complete()` is NEVER called (assert call
      count 0 — nothing to score); (2) `decision==='generate'` with a mock returning a valid score
      payload → returns a `SkillGeneratorJudgment` with
      `well_formed`/`reusable`/`faithfulness`/`scope_appropriateness` all in [0,1] and
      `spurious`/`low_quality` booleans + `reason`; assert it scores ONLY these subjective dims and
      does NOT compute decision-correctness or spurious-rate (that's score.ts, ADR-003); (3)
      fail-closed parse path: mock returns malformed/non-JSON → resolves to `'inconclusive'`, never
      a silent pass; (4) prompt-injection control (T1): assert the rendered prompt wraps
      `output.skillMd` and `c.work.*` in the standard untrusted-data delimiter/preamble and that the
      prompt is loaded with `nonAgentic:{ excludeDynamicSections:true }` via
      `loadBundledPrompt('skill-generator-judge')`; (5) model selection:
      `resolveSkillGeneratorModels` honored — `LOOM_EVAL_JUDGE_MODEL` env override respected,
      default `claude-opus-4-8`; (6) borderline: a generated skill from an `'either'` case is still
      quality-scored (the judge never gates on the generate/NONE call). Verification bar: judge
      skips on NONE without a model call, scores only subjective dimensions on generate, fails to
      `'inconclusive'` on parse error, and delimits untrusted content — all proven with a mocked
      client and a new `personas/skill-generator-judge.md` present.
  - id: story-043-004
    title: Runner over the production skill generator
    description: >-
      Implement a runner that drives the production skill generator unchanged over each case,
      capturing its NONE-or-SKILL.md output in the shape the judge consumes. Reuse, not a
      reimplementation; observe-only. Adds only its own non-shared runner files.
    acceptance_criteria:
      - >-
        The runner invokes the production skill generator unchanged over each case and captures its
        NONE-or-SKILL.md output.
      - >-
        The runner reuses the production generator (no reimplementation) and does not alter
        production behavior (observe-only).
      - Runner output is produced in the shape the judge consumes, using the foundation types.
      - Model selection is environment-configurable with safe defaults.
    estimated_complexity: small
    dependencies:
      - story-043-001
    tech_notes: >-
      Implement `src/eval/skill-generator/runGate.ts` exporting `runSkillGeneratorGate(c, deps)`,
      modeled on `opportunity-engine/runGate.ts`. Per ADR-006 marshal the case into the generator's
      real dependencies: `createDatabase(':memory:')` fresh per case, seed one `AgentStore` row
      (`log_tail = c.work.diff_context`, `epic_id`) and one `AuditLog` `completion` row (`detail:
      JSON.stringify({ summary: c.work.summary })`), and point a `new SkillStore({ projectRoot:
      <ephemeral temp dir> })` so `writeSkill` never reaches `.loom/skills/` (T2, NFR-1/4). The
      critical mechanism (ADR-002): wrap `deps.llm` in a recording client where the FIRST
      `complete()` (the extractor call) is forwarded to `deps.gateModel` and its `response.text`
      captured, while SUBSEQUENT `complete()` calls (the internal non-injectable `SkillJudge`)
      return a canned `accept` so the generator runs deterministically. Run `new SkillGenerator({db,
      llm: recordingClient, model: deps.gateModel, skillStore: store}).afterStory(...)`, discard its
      `SkillManifest|null` return, and derive `SkillGeneratorDecision` from the recorded raw text:
      `null ⇒ {status:'failed'}`, else `decision = (raw.length===0 ||
      raw.toUpperCase().startsWith('NONE')) ? 'none' : 'generate'`. Trade-off: this couples the
      runner to the generator's internal call ordering (first call = extraction) — document that
      coupling in-file, since it's the price of leaving `SkillGenerator.ts` byte-unchanged.
    test_plan: >-
      Levels: integration — drive the REAL production `SkillGenerator` against a `:memory:` db, with
      the LLM seam mocked (this is the genuine seam; unit-mocking the generator would defeat the
      point). Model on `opportunity-engine/runGate.ts`. Cases: (1) recording-client first-call-wins
      (ADR-002): first `complete()` returns a `SKILL.md` body → result `decision:'generate'`,
      `skillMd` holds the raw captured text; (2) first `complete()` returns `'NONE'` →
      `decision:'none'`, `skillMd:null`; also assert empty-string and lowercase/`'none '`-prefixed
      raw both derive `'none'` (`raw.length===0 || raw.toUpperCase().startsWith('NONE')`); (3)
      subsequent `complete()` calls (the internal non-injectable `SkillJudge`) receive a canned
      `accept` so the generator runs deterministically without a second model hit — assert only the
      first call is forwarded to `gateModel` and later calls return the canned value; (4) recorded
      raw is `null` (extractor never recorded) → `{status:'failed'}`; (5) isolation (T2/NFR-1/4):
      `SkillStore` is pointed at an ephemeral temp dir and after a generate case nothing was written
      to the repo `.loom/skills/`; a fresh `:memory:` db per case means no cross-case leakage; (6)
      db marshaling: the seeded `AgentStore` row's `log_tail===c.work.diff_context` and `AuditLog`
      completion row's `detail.summary===c.work.summary` are what the generator actually reads (the
      captured skill reflects the seeded work). Verification bar: `runSkillGeneratorGate` returns a
      correctly-derived `SkillGeneratorDecision` (foundation type) for generate/none/failed under
      the first-call-wins rule, runs the byte-unchanged `SkillGenerator` observe-only against
      temp/`:memory:` state, and the gate model is env-overridable (default haiku). Confirm `git
      diff skills/SkillGenerator.ts` empty.
  - id: story-043-005
    title: Scorer with fail-closed thresholded decision
    description: >-
      Implement a scorer that aggregates decision-correctness and skill-quality metrics plus a
      spurious-generation rate, ending in a fail-closed thresholded pass/fail decision. Adds only
      its own non-shared scorer files.
    acceptance_criteria:
      - >-
        The scorer aggregates decision-correctness and skill-quality metrics plus a
        spurious-generation rate.
      - >-
        The scorer ends in a fail-closed thresholded decision: ambiguous or missing results fail
        rather than pass.
      - >-
        Initial thresholds and target spurious-generation rate are env/config-overridable
        [ASSUMPTION] placeholder defaults to be tuned.
      - >-
        Deterministic mocked-LLM unit tests cover the scorer, including fail-closed behavior on
        missing/ambiguous input, with no real model calls.
    estimated_complexity: medium
    dependencies:
      - story-043-001
    tech_notes: >-
      Implement `src/eval/skill-generator/score.ts`: `scoreSkillGenerator(records)` producing
      `SkillGeneratorMetrics extends CoreMetrics`, `skillGeneratorVerdict(m)`,
      `SKILL_GENERATOR_THRESHOLDS`, and `resolveSkillGeneratorBar(opts?)` mirroring
      `opportunity-engine`'s `resolveQualityBar`. Compute `decisionCorrectness` and
      `spuriousGenerationRate` DETERMINISTICALLY from the code-derived `decision` and the rubric
      (ADR-003/T5) — never from the judge — and per ADR-004 EXCLUDE `expected_decision:'either'`
      borderline cases from `decisionCorrectness` while still quality-scoring their generated
      skills. Derive `skillQuality`/`faithfulness`/`lowQualityRate` as means over judged
      generate-cases. Ship the verdict bars as env-overridable `[ASSUMPTION]` placeholders (ADR-005:
      `LOOM_EVAL_SKILLGEN_MIN_DECISION_CORRECTNESS` ≥0.80, `…_MIN_SKILL_QUALITY` ≥0.70,
      `…_MIN_FAITHFULNESS` ≥0.80, `…_MAX_SPURIOUS_RATE` ≤0.15, `…_MAX_LOW_QUALITY_RATE` ≤0.20).
      Trade-off: two scoring paths (deterministic + LLM means) instead of one, but that's what keeps
      the pass/fail signal un-gameable. Jest tests must cover the fail-closed path —
      missing/ambiguous/too-few scored records must resolve `inconclusive`, not pass — with no real
      model calls.
    test_plan: >-
      Levels: unit only, over synthetic `RunRecord[]` — no model calls. Cases: (1)
      `decisionCorrectness` is computed deterministically from the code-derived `decision` vs
      `rubric.expected_decision` and EXCLUDES borderline `'either'` cases from the denominator
      (ADR-004) — feed a mix of worthy/trivial/borderline and assert borderline cases don't move it;
      (2) `spuriousGenerationRate = (none-expected cases that generated) / none-expected` — craft
      trivial cases that did vs didn't generate and assert the ratio; (3)
      `skillQuality`/`faithfulness`/`lowQualityRate` are means over JUDGED generate-cases only
      (skipped/none/failed records excluded from the means); (4) `skillGeneratorVerdict` returns
      `'proceed'` when every metric meets its bar, and `'do-not-proceed'` when spurious-rate exceeds
      max (the Goal-2 over-generation regression flip), or decision-correctness/quality/faithfulness
      fall below their mins; (5) `resolveSkillGeneratorBar` precedence opts > env > default and the
      five `LOOM_EVAL_SKILLGEN_*` env vars override the `[ASSUMPTION]` defaults
      (0.80/0.70/0.80/0.15/0.20); (6) FAIL-CLOSED (T4, critical): fewer than `minScoredCases` scored
      records, missing metrics, or all-records-skipped resolve to `inconclusive`/`do-not-proceed` —
      NEVER pass; (7) division-by-zero guards: zero none-expected cases and zero judged
      generate-cases yield stable metrics (no NaN) and a deterministic verdict. Verification bar:
      headline metrics are deterministic (never read from the judge), borderline excluded from
      correctness, verdict provably fail-closed on missing/ambiguous/too-few input, and bars
      env-overridable — all on mocked records.
  - id: story-043-006
    title: Runner script, eval docs, and capabilities drift check
    description: >-
      Add an operator-run runner script consistent with the existing eval scripts that wires loader
      → runner → judge → scorer → fail-closed decision, plus eval docs describing how to run it.
      Ensure the capabilities drift check passes if a user-visible surface changed.
    acceptance_criteria:
      - >-
        A runner script lets the operator run the full eval on demand, consistent with existing eval
        scripts, wiring the case loader, runner, judge, and scorer into the fail-closed decision.
      - >-
        Eval docs describe how the operator runs the eval and what the verdict and metrics mean, and
        state that the full (real-model) eval is operator-run — never a worker story or CI.
      - >-
        The capabilities drift check passes; capabilities.md is updated if any user-visible surface
        changed.
      - No worker story or CI path invokes the full real-model eval.
    estimated_complexity: small
    dependencies:
      - story-043-001
      - story-043-002
      - story-043-003
      - story-043-004
      - story-043-005
    tech_notes: >-
      Add `scripts/eval-skill-generator.mjs` mirroring `scripts/eval-lesson-extractor.mjs` as the
      ONLY operator entry point that hits a real model; it calls `main()` from `run.ts`, which wires
      `loadSkillGeneratorCases → runGateEval(cases, createSkillGeneratorConsumer(...), deps) →
      scoreSkillGenerator → decide` and writes `.loom/eval/skill-generator-report.{md,json}`
      (returning `EvalReport`). Implement/finalize `run.ts` with the `MainOptions`/`EvalReport`
