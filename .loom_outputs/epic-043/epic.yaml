    test_plan: >-
      Levels: whole-suite verification — no new feature tests; the deliverable is a green build+test
      across all packages and any cross-cutting fixes. Cases: (1) `npm run build` passes across
      loom-core/loom-cli/loom-web; (2) `npm run test` passes for the entire suite (not just the new
      consumer's tests); (3) barrel wiring resolves end-to-end — importing the top barrel
