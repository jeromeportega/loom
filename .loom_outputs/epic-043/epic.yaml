      operator runs it, what `decisionCorrectness`/`spuriousGenerationRate`/`skillQuality` mean, and
      stating plainly that the full real-model eval is operator-run — never a worker story or CI
      (T3, NFR-3). Per CLAUDE.md, run the capabilities drift check and update `docs/capabilities.md`
      only if a user-visible surface actually changed (a new operator script likely warrants a row).
      Trade-off: this story depends on all of 001–005, so it lands last among the feature stories —
      keep it thin (wiring + docs), pushing no logic that belongs in the typed consumer files.
    test_plan: >-
      Levels: a thin integration test of `main()` with a mocked `LLMClient`, plus
      presence/consistency checks on the script and docs. The full real-model run is operator-only
      and is NOT exercised with a real model in any test. Cases: (1) `main({llm: mockClient,
      projectRoot: <temp>, fixturePath: <small fixture>})` wires `loadSkillGeneratorCases →
      runGateEval(cases, createSkillGeneratorConsumer(...), deps) → scoreSkillGenerator → decide`,
      returns an `EvalReport` with `metrics`/`decision`/`perCase`/`markdown`, and writes
      `.loom/eval/skill-generator-report.{md,json}` under the temp root; (2) the report decision is
      fail-closed on a degenerate fixture (too few cases → inconclusive) end-to-end; (3)
      `scripts/eval-skill-generator.mjs` exists, mirrors `scripts/eval-lesson-extractor.mjs`, and
      calls `main()` from `run.ts` — it is the ONLY entry that touches a real model; (4) docs under
      `docs/` exist and explain what `decisionCorrectness`/`spuriousGenerationRate`/`skillQuality`
      mean and state plainly the full real-model eval is operator-run, never a worker story or CI
      (T3/NFR-3); (5) guard: no test or CI/worker path imports `run.ts`/`main()` with a real client
      (grep/assert); (6) run the capabilities drift check — it passes, and `docs/capabilities.md`
      gains a row only if a user-visible surface (the new operator script) changed. Verification
      bar: `main()` produces a fail-closed `EvalReport` plus the two report files from a mocked LLM;
      script and docs match the lesson-extractor precedent and assert operator-only execution; drift
      check green; this story adds only wiring + docs, no logic that belongs in the typed consumer
      files.
  - id: story-043-007
    title: Full build + test suite verification and cross-cutting fixes
    description: >-
      Run the full build and the entire test suite together and fix any cross-cutting regressions
      introduced by the parallel consumer stories (barrel/sub-barrel wiring, type compatibility
      across loader/runner/judge/scorer).
    acceptance_criteria:
      - The full build passes across all packages.
      - The entire test suite passes.
      - >-
        No existing guardrail is weakened and the skill generator's production behavior remains
        unchanged.
    estimated_complexity: small
    dependencies:
      - story-043-001
      - story-043-002
      - story-043-003
      - story-043-004
      - story-043-005
      - story-043-006
    tech_notes: >-
      No new feature code — run `npm run build` and `npm run test` across all packages together and
      fix only cross-cutting regressions from the parallel merge: barrel/sub-barrel wiring (the
      single named top-barrel re-export from ADR-001 plus the `skill-generator/index.ts` exports),
