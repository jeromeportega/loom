stories:
  - id: story-026-001
    title: Bounded internal retry on unparseable classifier output
    description: >-
      Add a small bounded retry (1–2 additional attempts) inside the classifier when model output
      cannot be parsed into a verdict, returning a verdict if a retry succeeds and a failure once
      retries are exhausted. The retry is internal and transparent to callers.
    acceptance_criteria:
      - >-
        When output cannot be parsed into a verdict, the classifier retries a small bounded number
        of additional attempts (1–2) before returning a failure.
      - >-
        Only parse failures trigger a retry; timeouts and genuine errors are returned unchanged,
        exactly as before.
      - >-
        The retry is internal — the caller makes exactly one logical classify call per intake
        regardless of internal attempts.
      - The internal attempt count is capped so cost cannot run away.
      - >-
        A test proves an invalid first response followed by a valid second response yields a
        successful verdict.
      - A test proves exhausting the bounded retries returns a failure.
      - The observe-only invariant is preserved and no guardrail is weakened.
      - The non-agentic completion mode and its existing regression test stay intact and green.
    estimated_complexity: small
    dependencies: []
    tech_notes: >-
      Edit only `packages/loom-core/src/intake/IntakeClassifier.ts`: extract the current attempt
      body (the `llm.complete` + `recoverJsonText` + `IntakeVerdictSchema` Zod parse, ~lines 91-134)
      verbatim into a private `async function classifyOnce(brief, opts): Promise<ClassifyResult>`,
      then make `classifyIntake` a bounded `for` loop over it — return immediately on `r.ok`, return
      immediately when `r.reason !== 'invalid_output'` (so `timeout`/`llm_error` are never retried,
      FR-2), otherwise loop. Add a module constant `const MAX_CLASSIFY_RETRIES = 1;` (additional
      attempts; 2 total) so cost is provably bounded (NFR-1), and keep `timeoutMs` per-attempt —
      each retry is a fresh `complete` with its own timer, never consuming a timeout as jitter. Add
      two `node:test` cases to `IntakeClassifier.test.ts` with a stub `LLMClient` returning scripted
      responses: invalid-then-valid yields a verdict; all-invalid exhausts to `{ ok: false, reason:
      'invalid_output' }`. The one trade-off: a single intake can now cost up to `1 +
      MAX_CLASSIFY_RETRIES` model calls and latency budgets with zero visibility at the caller —
      accepted to keep the `classifyIntake` signature and the `classifyWithTiebreak` wrapper
      untouched. Do not edit any `.yaml` file; re-issue the identical request on retry (no prompt
      mutation) and leave the FR-8 `llm/__tests__/nonAgenticArgs.regression.test.ts` guard green.
    test_plan: >-
      LEVEL: Unit only — this is pure control flow over a stubbed transport, so use `node:test`
      cases in `IntakeClassifier.test.ts` with a stub `LLMClient` whose `complete` returns scripted
      responses and records call count + args. No real model calls; fully deterministic, no sleeps.


      KEY CASES (checklist):

      - Happy path / no retry: valid verdict JSON on the first attempt → `{ ok: true }` with a
      schema-valid verdict; assert `complete` called exactly once (the loop must not add a call when
      the first attempt succeeds).

      - Invalid-then-valid (FR-4, AC5): garbage/unparseable first response, valid verdict second →
      `{ ok: true }`; assert `complete` called exactly 2 times.

      - Both `invalid_output` trigger sites retry identically (ADR-002): (a) malformed JSON that
      survives `recoverJsonText` but throws on `JSON.parse`, and (b) well-formed JSON that fails
      `IntakeVerdictSchema.safeParse` (e.g. missing field / out-of-enum `type`). Each followed by a
      valid response → success. Proves the single retry trigger covers both parse-failure sources.

      - Exhaustion (FR-4, AC6): every attempt returns unparseable output → `{ ok: false, reason:
      'invalid_output' }`; assert `complete` called exactly `1 + MAX_CLASSIFY_RETRIES` times and
      never more (AC4/NFR-1 — proves the cost cap, not just a failure).

      - Timeout is never retried (FR-2, AC2): first attempt yields `reason: 'timeout'` → returned
      unchanged, `complete` called exactly once.

      - `llm_error` is never retried (FR-2, AC2): first attempt yields `reason: 'llm_error'` →
      returned unchanged, `complete` called exactly once.

      - Identical request on retry (NFR-2 / verdict-tampering control): capture the args passed to
      `complete` on attempt 1 and attempt 2 and deep-equal them — same prompt, same `nonAgentic`
      flags, same prefill; no prompt mutation between attempts.

      - Caller transparency (FR-3, AC3): `classifyIntake` and `classifyWithTiebreak` signatures and
      return type are unchanged; one logical call still yields exactly one `ClassifyResult` union.


      REGRESSION GUARD (AC8, NFR-3): do NOT modify `llm/__tests__/nonAgenticArgs.regression.test.ts`
      or the existing non-agentic call-site test; both must stay green unchanged.


      VERIFICATION BAR: all pre-existing classifier tests plus the new cases pass; `complete` call
      counts concretely prove (a) retry only on `invalid_output`, (b) the hard cap at `1 +
      MAX_CLASSIFY_RETRIES`, and (c) byte-identical re-issue; timeout/llm_error short-circuit
      unchanged; the nonAgentic regression test remains green. No guardrail or observe-only behavior
      is touched.
  - id: story-026-002
    title: Rewrite unrepresentative fragment briefs in the eval set, preserving labels
    description: >-
      Identify the eval briefs phrased as a title plus comma-separated component list and rewrite
      each into a well-formed task brief that preserves the original intent and the original human
      type and size labels. Document each rewrite with its rationale.
    acceptance_criteria:
      - >-
        The eval briefs phrased as a title plus comma-separated component list (rather than as a
        task a person would submit) are identified.
      - >-
        Each identified fragment is rewritten into a well-formed task brief that preserves the
        original intent.
      - >-
        Every rewrite preserves the original human type and size labels — only the brief text is
        altered and no label is changed.
      - >-
        Well-formed briefs are left untouched; only genuinely unrepresentative fragments are
        rewritten (no score-chasing).
      - Each rewrite is documented with its rationale, in the spirit of the prior relabeling note.
    estimated_complexity: small
    dependencies: []
    tech_notes: >-
      Pure content edit to `eval-cases/intake-classification.yaml`: touch no `.ts` file. Identify
      rows whose `brief` is a title-plus-comma-separated-component-list fragment rather than a brief
      a person would submit, and rewrite only the `brief` string into a well-formed task brief
      preserving intent; leave well-formed briefs byte-for-byte intact (no score-chasing).
      `label.type` and `label.size` are frozen — the `IntakeEvalCaseSchema`
      (`eval/intakeEvalTypes.ts`) still validates, and any label change must be visible-on-sight in
      the diff. Document every rewrite in an `eval-cases/RELABEL.md`-style note following the
      existing precedent: case `id`, original fragment, rewritten brief, one-line rationale, and an
      explicit assertion that type/size are unchanged. The trade-off: neither this story nor its
      review runs the live eval, so a bad rewrite is only caught by the human eval run post-merge —
      which is why the label freeze and per-case rationale exist as the cheap pre-merge guard.
    test_plan: >-
      LEVEL: Fixture/data validation — no behavior tests and explicitly NO live eval run. The cheap
      pre-merge guard is a schema-load test plus a diff-based label-freeze check; the human diff
      review is the backstop.


      KEY CASES (checklist):

      - Loader + schema still green: load the edited `eval-cases/intake-classification.yaml` via
      `loadIntakeEvalSet.ts` and assert every row validates against `IntakeEvalCaseSchema`
      (`eval/intakeEvalTypes.ts`) — a malformed rewrite that breaks YAML parsing or the schema fails
      here.

      - Label freeze (AC3, FR-6 — the load-bearing guard against score-chasing): assert the id →
      `{label.type, label.size}` mapping is identical before and after the change. Concretely,
      verify `git diff` on the YAML touches zero lines under any `label:` (`type:` / `size:`); only
      `brief:` strings may change.

      - No collateral edits (AC4, FR-7): assert the diff changes `brief` only on the identified
      fragment rows (plus the new doc file) — every well-formed brief is byte-for-byte intact.

      - Non-empty rewrites: every rewritten `brief` is non-whitespace (schema enforces `min(1)`, but
      sanity-check no rewrite collapsed to blank).

      - Documentation completeness (AC5, FR-8): the set of ids whose `brief` changed equals the set
      of ids documented in the `eval-cases/RELABEL.md`-style note, and each note entry carries case
      `id`, original fragment text, rewritten brief, a one-line rationale, and an explicit
      "type/size unchanged" assertion.


      VERIFICATION BAR: cleaned YAML loads and every case validates; the id→label map is provably
      unchanged (no `label:` line in the diff); only genuine fragment briefs were rewritten with no
      well-formed brief altered; every rewritten id has a documented rationale and a
      labels-unchanged assertion. The live eval is NOT run in this story — these checks are the
      entire pre-merge guarantee.
  - id: story-026-003
    title: Prepare the cleaned eval for operator-run post-merge decision
    description: >-
      Make the intake eval ready to run against the cleaned labeled set as an offline developer
      harness, with documented instructions for the operator to run it after merge and record the
      honest per-axis decision. The long eval is NOT run inside this story.
    acceptance_criteria:
      - >-
        The intake eval is prepared to run against the cleaned labeled set and remains an offline
        developer harness, not wired into the worker execution path.
      - >-
        The long eval is NOT run as a worker story; the epic only prepares everything for a
        post-merge operator run.
      - >-
        Documented operator instructions specify recording per-axis accuracy, the confusion matrix,
        failure-reason counts, and the gate's honest decision — including whether epic-to-story
        under-sizing confusions stay at or below two.
      - The full build passes.
      - The entire test suite passes.
    estimated_complexity: small
    dependencies:
      - story-026-001
      - story-026-002
    tech_notes: >-
      Prepare and document the offline harness `scripts/eval-intake.mjs` (which drives
      `runIntakeEval` → `scoreIntakeEval` over the cleaned `intake-classification.yaml`); do NOT
      execute the long eval in this story (NFR-4 — keep it out of the worker execution path, never
      wired into the worker loop). Write operator-run instructions (a markdown runbook under
      `.loom/planning/epic-026/` or alongside the script) specifying exactly what to record:
      per-axis accuracy, both `type` and `size` `ConfusionMatrix` counts, failure-reason counts, and
      the `GateDecision` (`proceed` | `do-not-proceed` | `inconclusive`) — explicitly including the
      under-sizing cell `counts['epic']['story']` from the size-axis matrix and whether it stays ≤ 2
      (FR-9). Gate for this story is a full green `npm run build` and `npm run test` (NFR-3);
      depends on 026-001 and 026-002 having landed. The trade-off: the epic merges without a green
      eval number attached — the go/no-go verdict arrives out-of-band from a human operator after
      merge, which is the intended 'honest gate' rather than letting a worker mark its own homework.
    test_plan: >-
      LEVEL: Build + suite gate plus a couple of structural/smoke assertions — this story prepares
      and documents the offline harness and must NOT execute the long eval (NFR-4).


      KEY CASES (checklist):

      - Build green (AC4): `npm run build` succeeds across all workspaces.

      - Suite green (AC5): `npm run test` passes — this transitively includes story-026-001's retry
      cases and story-026-002's fixture-validation test.

      - Worker-path isolation (AC1, NFR-4): assert the eval runner is never reachable from the
      worker execution path — no production module under the worker/orchestration path imports
      `scripts/eval-intake.mjs`, `runIntakeEval`, or `scoreIntakeEval`. A structural/grep-style
      check pins this so the offline harness stays offline.

      - Harness is runnable, not run (AC1, AC2): a fast smoke check that the harness wiring
      (`loadIntakeEvalSet` over the cleaned YAML feeding `runIntakeEval` → `scoreIntakeEval`)
      imports and constructs without dispatching any model call — confirm it is prepared without
      triggering the long eval (e.g. module imports cleanly / dry construction); do not invoke the
      model.

      - Runbook completeness (AC3, FR-9): the operator runbook (under `.loom/planning/epic-026/` or
      alongside the script) exists and explicitly enumerates everything to record: per-axis accuracy
      for both `type` and `size`, both `ConfusionMatrix` count tables, failure-reason counts, the
      `GateDecision` (`proceed` | `do-not-proceed` | `inconclusive`), AND the under-sizing cell
      `counts['epic']['story']` from the size-axis matrix with its ≤ 2 threshold called out.


      VERIFICATION BAR: `npm run build` and `npm run test` are both green; the eval runner is
      provably un-imported by the worker path; the operator runbook documents every required metric
      including the `epic → story` under-sizing cell and its ≤ 2 gate. The long eval itself is
      explicitly NOT executed here — the honest go/no-go is recorded by the operator post-merge.
