stories:
  - id: story-037-001
    title: Wire refined-brief dual classification (flag-gated)
    description: >-
      For each labeled case, in addition to today's raw-brief classification, produce a refined
      brief by calling the existing production brief refiner (non-agentic completion path) and
      classify it with the existing classifier. Gate the refined path behind a flag and score it
      through the existing same-axis scoring.
    acceptance_criteria:
      - >-
        For each labeled case, the eval classifies both the raw brief (unchanged path) and a refined
        brief produced from it.
      - >-
        The refined brief is produced by reusing the existing production brief refiner, and the
        refined brief is classified by reusing the existing classifier — no parallel copies or
        reimplementations.
      - >-
        The refined-brief classification is scored on the same axes as the raw brief: per-axis
        accuracy, the epic-to-story under-sizing count, the confusion matrix, and the fail-closed
        decision.
      - >-
        The refined variant is gated behind a flag that is off by default; with the flag off, eval
        behavior is identical to today.
      - Existing raw-brief results, numbers, and behavior remain bit-for-bit unchanged.
      - >-
        The new wiring is covered by deterministic unit tests with a mocked LLM; no real model calls
        are made.
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      Add two thin glue modules — `packages/loom-core/src/eval/refineEvalCases.ts`
      (`refineEvalCases(cases, refiner)`) and `packages/loom-core/src/eval/runRefinedIntakeEval.ts`
      (`runRefinedIntakeEval(refined, deps)`) — and wire the `LOOM_EVAL_REFINED === '1'` gate (off
      by default) only in `scripts/eval-intake.mjs`; do not touch `runIntakeEval`,
      `scoreIntakeEval`, or the raw path. Reuse the production `BriefRefiner`
      (`brief/BriefRefiner.ts`) constructed with `model: modelFor(policy,'planning')` (ADR-007,
      separate from `LOOM_EVAL_MODEL`), build each refined case as `{ ...case, brief:
      refinement.refined_brief }` keeping `label` as ground truth (ADR-003), then replay the
      unchanged `runIntakeEval` so both classifier and judge see the refined brief, and score with
      the same `scoreIntakeEval`. Route a missing `refined_brief` through the existing
      `ClassifyResult` failure path as `{ ok:false, reason:'llm_error', detail:'refiner: …' }`
      (ADR-005) so the case set keeps the same N and the gate stays fail-closed. The trade-off to
      know: this roughly doubles LLM calls per run, so inject `MockLLMClient` via the `LLMClient`
      seam in all unit tests — no real model calls (NFR-1/NFR-2).
    test_plan: >-
      LEVEL: Unit only, with `MockLLMClient` injected through the `LLMClient` seam (NFR-1/NFR-2
      forbid real model calls; these are pure glue functions over injected deps, so unit is the
      cheapest level that gives confidence — no integration/e2e). Write tests-first against the two
      new modules.


      KEY CASES — `refineEvalCases(cases, refiner)` (`eval/refineEvalCases.ts`):

      - Happy: each case maps to `{ ok:true, case:{...case, brief: refinement.refined_brief},
      qualityScore }`. ASSERT `label.{type,size}` is carried over byte-for-byte (ADR-003) and only
      `brief` is replaced with the refiner output.

      - Refiner returns no `refined_brief` (optional/absent) → `{ ok:false,
      reason:'no_refined_brief', detail }` (ADR-005).

      - Refiner throws → `{ ok:false, reason:'refiner_error', detail }` (no unhandled rejection).

      - Output length and order match input `cases` exactly (same N — required so the side-by-side
      stays aligned).

      - ASSERT the production `BriefRefiner` is reused (mock its `refine`, expect one call per case)
      — no parallel/reimplemented refiner (AC2).


      KEY CASES — `runRefinedIntakeEval(refined, deps)` (`eval/runRefinedIntakeEval.ts`):

      - ok cases: replays the UNCHANGED `runIntakeEval`; ASSERT the brief text reaching BOTH
      `classifyIntake`/`classifyWithTiebreak` AND `IntakeJudge.judge` is the REFINED text, not the
      raw (ADR-004). Spy on the mock to confirm.

      - failed (`ok:false`) cases: synthesizes an `IntakeRunRecord` whose `classifier` is `{
      ok:false, reason:'llm_error', detail:'refiner: <reason>' }` (ADR-005). ASSERT same N as input
      and order preserved.

      - Feed the produced records to the UNCHANGED `scoreIntakeEval` and ASSERT it yields per-axis
      accuracy, the epic→story under-sizing count, the confusion matrix, and the fail-closed gate
      (AC3) — confirming same-axis scoring is structural (no new scoring code).

      - Fail-closed: ASSERT a refiner-failure case is EXCLUDED from `scored` accuracy yet still
      counted (never credited correct).


      KEY CASES — flag gate in `scripts/eval-intake.mjs`:

      - `LOOM_EVAL_REFINED` unset or !== '1' → refined path never entered, `refiner.refine` never
      called, only raw records produced (AC4). If the `.mjs` entry point is not directly importable,
      extract the boolean gate into a tiny tested helper OR rely on the 037-002 off-path golden test
      for the byte-identical guarantee — state which.

      - `LOOM_EVAL_REFINED='1'` → refined path runs, refiner invoked once per case.


      DETERMINISM: every test injects `MockLLMClient`; no real `complete()`, no
      `Date.now`/randomness in the new glue.


      VERIFICATION BAR: With a mocked LLM, the refined run yields an `IntakeEvalReport` scored on
      the same four axes as raw, over the same N of cases, with original labels preserved and the
      production refiner + classifier demonstrably reused; refiner misses are routed fail-closed;
      flag-off provably skips the refined path. AC6 met = zero real model calls in the suite.
  - id: story-037-002
    title: Side-by-side raw vs refined reporting
    description: >-
      Extend the eval report so raw-brief and refined-brief results are rendered together — per-axis
      accuracy and the epic-to-story under-sizing count for each — letting the operator compare
      under-sizing directly without cross-referencing two runs.
    acceptance_criteria:
      - >-
        The report renders raw-brief accuracy and under-sizing count alongside refined-brief
        accuracy and under-sizing count for the same labeled case set in a single eval run.
      - Raw and refined results are clearly labeled and unambiguously comparable.
      - With the refined flag off, the report output is unchanged from today.
      - The reporting changes are covered by deterministic unit tests with a mocked LLM.
    estimated_complexity: small
    dependencies:
      - story-037-001
    tech_notes: >-
      Extend `packages/loom-core/src/eval/renderIntakeReport.ts` additively into
      `renderIntakeReportDual(dual: DualIntakeReport)` and add the `DualIntakeReport { raw;
      refined?; comparison? }` type to `eval/intakeEvalTypes.ts`; feed its output to the unchanged
      `writeIntakeReportFiles`. When `refined` is undefined it MUST delegate to the existing
      `renderIntakeReport(raw)` so `intake-report.{md,json}` are byte-for-byte identical (FR-8 — add
      a golden-output test asserting this); when present, append a clearly-labeled 'Refined-brief
      variant' section plus a raw-vs-refined comparison table covering per-axis accuracy and the
      epic→story under-sizing count, sourced from the precomputed `comparison` deltas. The one
      trade-off: with the flag on, the JSON gains top-level `refined`/`comparison` keys while `raw`
      stays untouched, so only refined-run consumers opt into the new shape. Cover with
      deterministic `MockLLMClient` unit tests.
    test_plan: >-
      LEVEL: Unit only. `renderIntakeReportDual` is a deterministic pure function
      (`DualIntakeReport` → `{ markdown, json }`); build its input from hand-authored
      `IntakeEvalReport` fixtures (or records produced via `MockLLMClient`) so no LLM runs inside
      the render test.


      KEY CASES — `renderIntakeReportDual(dual)` (`eval/renderIntakeReport.ts`):

      - OFF-PATH GOLDEN (load-bearing, FR-8/AC3): with `refined: undefined`, output MUST delegate to
      the existing `renderIntakeReport(raw)` and be byte-for-byte identical to today's
      `intake-report.md` AND `.json`. Snapshot/golden-compare both strings. ASSERT the JSON has NO
      top-level `refined`/`comparison` keys and the `raw` object equals the legacy top-level shape
      (existing consumers see no diff).

      - ON-PATH (AC1/AC2): with `refined` present, the markdown contains a clearly-labeled
      "Refined-brief variant" section plus a raw-vs-refined comparison table showing per-axis
      accuracy (type and size) AND the epic→story under-sizing count for BOTH variants.

      - NUMERIC CONSISTENCY: comparison values match the source —
      `comparison.typeAccuracy.raw/refined`, `sizeAccuracy.raw/refined`, `underSizing.raw/refined`,
      and `refinerFailures` reflect the underlying `raw`/`refined` reports exactly (no recomputation
      drift).

      - LABELING: raw and refined columns/rows are distinctly named so an operator cannot confuse
      which number is which (AC2).

      - ON-PATH JSON SHAPE: gains top-level `refined` and `comparison` keys while `raw` stays
      untouched (additive only).

      - `writeIntakeReportFiles` is fed the dual renderer output unchanged — assert the wiring path,
      don't re-test the writer.

      - DETERMINISM: fixed fixtures; if the report embeds a timestamp, confirm it is injected/stable
      so the golden comparison is reproducible.


      VERIFICATION BAR: The off-path golden test proves md+json are byte-identical to today (FR-8).
      The on-path test proves both variants' per-axis accuracy and under-sizing counts render
      together, clearly labeled, and numerically consistent with their source reports in a single
      report. JSON additivity verified in both states (raw untouched off and on).
