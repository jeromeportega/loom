stories:
  - id: story-038-001
    title: Labeled skill-candidate case set with quality-band definitions
    description: >-
      Curate a labeled case set of representative skill candidates spanning clearly-good (accept),
      clearly-bad (reject — too vague, not reusable, duplicative, or unsafe), and borderline
      candidates, sized by reference to the brief-quality eval. Define the quality bands (good /
      borderline / bad) mapped to score ranges anchored to the judge-minimum-score policy default.
    acceptance_criteria:
      - >-
        A case set file exists containing good, bad, and borderline skill candidates, following the
        same case format as the brief-quality eval
      - >-
        Each case carries an expected accept/reject decision and an expected quality band (not an
        exact score)
      - 'Bad cases cover the named failure modes: too vague, not reusable, duplicative, and unsafe'
      - >-
        Quality bands (good / borderline / bad) are defined and mapped to score ranges anchored to
        the judge-minimum-score knob's default
      - The case set is loadable via the existing gate-eval case loader without framework changes
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      Create `packages/loom-core/eval-cases/skill-judge.yaml` plus
      `src/eval/skill-judge/caseSchema.ts` (the `SkillJudgeEvalCaseSchema`/`SkillJudgeEvalSetSchema`
      zod schemas), `bands.ts`, and `loadCases.ts` (`loadSkillJudgeCases(fixturePath?)`), mirroring
      the `brief-quality/` layout exactly. Anchor `BANDS` in `bands.ts` to the imported
      `JUDGE_MIN_SCORE` (=6, from `schemas/policy.schema.yaml`) — never hard-code 6 — and give
      `scoreInBand` the τ=1 tolerance (ADR-003); `expected_band` is a band enum, not an exact score
      (FR-1). Bad cases must populate `failure_mode` across all four named modes (`vague`,
      `not-reusable`, `duplicative`, `unsafe`), and `existing_skills` must mirror `SkillManifest`'s
      `{name, description}` shape so duplicative cases feed the production judge realistic context.
      The trade-off to know: the exact band ranges are an `[ASSUMPTION]` pending ratification, so
      read the policy constant rather than baking in numbers.
    test_plan: >-
      Level: unit only — this is pure data (a YAML fixture), a zod schema, a band helper, and a
      loader; no seams to integrate, no e2e.


      Key cases (node:test + node:assert/strict, no LLM):

      - loadSkillJudgeCases() with no arg loads the real
      packages/loom-core/eval-cases/skill-judge.yaml and every case parses against
      SkillJudgeEvalSetSchema; returns >= 1 case (proves AC1/AC5, brief-quality-style load with no
      framework change).

      - loadSkillJudgeCases(fixturePath) honors an explicit path (used by later mocked tests).

      - Schema rejects malformed cases at load, one assertion per failure: empty skill_md, missing
      expected_decision, bad enum for category / expected_decision / expected_band / failure_mode.
      Malformed must throw, not silently drop.

      - existing_skills defaults to [] when omitted and validates the {name, description} shape (so
      duplicative cases feed realistic context).

      - bands.ts scoreInBand: in-band true; exact band edges true; τ=1 tolerance (e.g. score 4 ∈
      borderline via lo−1, score 7 ∈ good edge); out-of-range (<0, >10) false; the 999 fail-open
      sentinel returns false (never "in band").

      - BANDS are DERIVED from the imported JUDGE_MIN_SCORE, not literal 6: assert e.g.
      BANDS.borderline brackets JUDGE_MIN_SCORE and bad's upper bound === JUDGE_MIN_SCORE - 2. If
      the constant changes, the test moves with it.

      - Fixture-content (data-as-test) assertions: at least one case per category {accept, reject,
      borderline}; every reject case has a failure_mode; the union of reject failure_modes covers
      all four {vague, not-reusable, duplicative, unsafe} (AC3); every case carries
      expected_decision AND expected_band (AC2).


      Verification bar: the loader returns a schema-valid set covering all three categories and all
      four reject failure modes; bands are computed from the policy constant (not hard-coded); and
      any malformed case fails loudly at load. AC4 is met by the band derivation + scoreInBand
      tests, AC1/AC5 by the load test.
  - id: story-038-002
    title: Independent LLM-as-judge for skill admissibility with configurable judge model
    description: >-
      Add an independent LLM-as-judge that decides on its own merits whether a candidate is worth
      admitting, then grades the skill judge on whether it got the accept/reject decision right and
      whether its score sits in a defensible band. Make the judge model environment-configurable
      with a safe default, defaultable to a different model from the gate to mitigate circularity.
    acceptance_criteria:
      - An LLM-as-judge module exists, modeled on the brief-quality eval's judge
      - >-
        It returns an independent accept/reject assessment plus a grade of the skill judge's
        decision correctness and band defensibility
      - The judge model is selectable via an environment variable with a safe default
      - >-
        The default permits the judge model to differ from the gate-under-eval model to mitigate
        judge–gate circularity
      - No production SkillJudge code is modified
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      Add `src/eval/skill-judge/judge.ts` (`judgeSkillAdmissibility(c, output, deps)`) and
      `judgeTypes.ts` (`SkillJudgeJudgment`), modeled on `brief-quality/judge.ts`, plus a NEW
      `packages/loom-core/personas/skill-admissibility-judge.md` that must be distinct from
      production's `skill-judge.md`. Compute `decision_correct` and `band_in_range`
      deterministically in TypeScript (using `scoreInBand` from story-038-001's `bands.ts`); only
      `independent_verdict`, `band_defensible`, and `reason` come from the LLM via
      `JudgeDeps.llm.complete`. Resolve the model from `LOOM_EVAL_JUDGE_MODEL ?? 'claude-opus-4-8'`
      — intentionally a different, stronger model than the gate to break circularity (ADR-002,
      FR-5). The one trade-off: a separate persona+model means two rubrics to maintain and higher
      per-run cost, accepted because grading the gate with its own model would only measure
      self-agreement.
    test_plan: >-
      Level: unit with MockLLMClient — deterministic, no network. The judge's only non-deterministic
      part (the independent LLM call) is mocked; everything graded in TypeScript is asserted
      directly.


      Key cases:

      - judgeSkillAdmissibility(c, output, deps) computes decision_correct deterministically: true
      when output.verdict === c.expected_decision, false on mismatch (both branches).

      - band_in_range delegates to scoreInBand(output.score, c.expected_band): assert one in-band
      and one out-of-band case, and that the 999 sentinel score yields band_in_range=false.

      - LLM-contributed fields are surfaced from the parsed mock response: independent_verdict
      ('accept'|'reject'), band_defensible (bool), reason (string) come from deps.llm.complete, not
      from TS.

      - Wiring uses the configured judge model and the NEW persona: assert the mock receives
      deps.judgeModel and that the prompt is built from personas/skill-admissibility-judge.md.

      - Model resolution (FR-5): LOOM_EVAL_JUDGE_MODEL override is respected; default is
      'claude-opus-4-8' when unset, and that default differs from the gate's haiku default
      (mitigates circularity).

      - Inconclusive path: an unparseable / malformed mock LLM response maps to
      JudgeOutcome.status:'inconclusive' (feeds maxJudgeInconclusiveRate downstream), not a thrown
      error or a fabricated grade.

      - Guard: personas/skill-admissibility-judge.md exists and is distinct from production
      personas/skill-judge.md (the circularity firewall).


      Verification bar: with a mocked LLM, the judge returns correct deterministic grades
      (decision_correct, band_in_range) AND surfaces the three independent LLM fields; the judge
      model resolves from the env var with the opus default; the persona is a separate file from
      production. AC5 (no production SkillJudge edits) is enforced by the diff-scope guard in
      story-038-005.
  - id: story-038-003
    title: Runner driving production SkillJudge across the case set
    description: >-
      Add a runner that drives the unchanged production SkillJudge over the full case set, reusing
      the existing gate-runner pattern. Make the gate-under-eval model environment-configurable with
      a safe default.
    acceptance_criteria:
      - >-
        A runner evaluates the production SkillJudge across every case in the case set, reusing the
        existing gate-runner pattern
      - The gate-under-eval model is selectable via an environment variable with a safe default
      - >-
        The production SkillJudge and its fail-open-on-error default are invoked unchanged
        (observe-only)
      - >-
        Runner output captures, per case, the skill judge's score and accept/reject verdict for
        scoring
    estimated_complexity: small
    dependencies:
      - story-038-001
    tech_notes: >-
      Add `src/eval/skill-judge/runGate.ts` (`runSkillJudgeGate(c, deps, _judgeFactory?)`) that
      imports the production `SkillJudge` from `src/skills/SkillJudge.ts` and calls `judge(skill_md,
      existing_skills)` unchanged — observe-only, never edit `src/skills/`. Resolve `gateModel` from
      `LOOM_EVAL_GATE_MODEL ?? 'claude-haiku-4-5-20251001'` (the shipping `skill_gen` model).
      Critically, inspect the returned `JudgeResult` and map the fail-open sentinel (`score === 999`
      / 'judge unavailable') to `{status:'failed', detail:'fail-open'}` rather than recording it as
      a genuine accept (ADR-005). The `_judgeFactory` param exists ONLY for unit-test injection; the
      production path uses the default constructor — and the trade-off is that detection keys on an
      implementation sentinel, so pin it with a test against drift.
    test_plan: >-
      Level: unit with a _judgeFactory that returns a SkillJudge backed by MockLLMClient
      (deterministic). Goal is to prove the read-only adapter and the fail-open detection without
      any real model call; the production SkillJudge is exercised through its loadPrompt/llm seams,
      never edited.


      Key cases:

      - Happy path: gate returns a normal { score, verdict, reason } → runSkillJudgeGate returns {
      status:'ok', output } and output carries the score and accept/reject verdict for this case
      (AC4).

      - Fail-open sentinel (the critical risk, ADR-005): gate returns { score:999, verdict:'accept',
      reason:'judge unavailable' } → adapter returns { status:'failed', detail:'fail-open' }, NOT a
      genuine accept. This is the case that protects against a broken gate masquerading as passing.

      - Sentinel-drift pin: assert detection keys on score===999 (and/or the 'judge unavailable'
      reason) so a change in how production fails open breaks this test loudly.

      - Observe-only call-through: assert the production judge is invoked as judge(c.skill_md,
      c.existing_skills) with the case's exact args (existing_skills passed through unchanged); the
      adapter mutates nothing.

      - Gate model resolution (FR-5): LOOM_EVAL_GATE_MODEL override respected; default
      'claude-haiku-4-5-20251001' (the shipping skill_gen model — measure what ships).

      - _judgeFactory is test-only: with no factory, the default path constructs the real SkillJudge
      (assert it is used, not the injected mock).


      Verification bar: the adapter returns ok+output on normal results and failed+'fail-open' on
      the 999 sentinel, passes the case's skill_md/existing_skills to the unmodified judge, and
      resolves the gate model from the env var with the haiku default. Observe-only (AC3) is
      additionally pinned by the diff-scope guard in story-038-005.
  - id: story-038-004
    title: Scorer reporting decision accuracy, band agreement, and fail-closed pass/fail
    description: >-
      Add a scorer that aggregates runner output and judge grades into decision accuracy and
      quality-band agreement, then renders a single fail-closed thresholded pass/fail on whether the
      skill judge clears the quality bar.
    acceptance_criteria:
      - The scorer reports accept-or-reject decision accuracy across the case set
      - >-
        The scorer reports quality-band agreement between the skill judge's score band and the
        expected band
      - >-
        The scorer renders a single fail-closed pass/fail verdict against the quality bar
        (thresholds follow existing gate-eval precedent)
      - A single eval run emits both metrics and the pass/fail verdict
    estimated_complexity: medium
    dependencies:
      - story-038-002
      - story-038-003
    tech_notes: >-
      Add `src/eval/skill-judge/score.ts` (`scoreSkillJudge`, `skillJudgeVerdict`,
      `SKILL_JUDGE_THRESHOLDS`), `consumer.ts` (`createSkillJudgeConsumer`), and `run.ts` (`main`),
      wiring into the existing `runGateEval`/`decide`/`coreMetrics` framework with zero framework
      edits. `scoreSkillJudge` extends `CoreMetrics` with `decisionAccuracy`, `bandAgreement`,
      `independentAgreement`, and `failOpenObserved` over `scoredCases` (FR-4/FR-6); thresholds
      follow brief-quality precedent (`minScoredCases:5`, `maxGateFailureRate:0.25`,
      `maxJudgeInconclusiveRate:0.25`) so fail-opens from story-038-003 push the verdict closed.
      `run.ts` returns `EvalReport` (metrics, decision, perCase, markdown) and writes
      `.loom/eval/skill-judge-report.{md,json}`. Trade-off: borderline labels are contestable, so
      `bandAgreement` leans on τ=1 tolerance and is cross-checked by the judge's `band_defensible`
      rather than treated as ground truth.
    test_plan: >-
      Level: unit. scoreSkillJudge/skillJudgeVerdict are pure functions over RunRecord arrays — test
      on hand-built records. Then one mocked end-to-end main() over a tiny fixture to prove a single
      run emits both metrics and the verdict.


      Key cases (pure scorer, fully deterministic):

      - decisionAccuracy = decision_correct / scoredCases on a known record set (e.g. 3/4).

      - bandAgreement = band_in_range / scoredCases on known inputs.

      - independentAgreement = (independent_verdict === gate.verdict) / scoredCases.

      - failOpenObserved = count of fail-open records, and these records do NOT count as scored
      accepts.

      - Extends CoreMetrics: coreMetrics fields are present and computed via the framework (no
      reimplementation).

      - skillJudgeVerdict precedence using SKILL_JUDGE_THRESHOLDS (minScoredCases:5,
      maxGateFailureRate:0.25, maxJudgeInconclusiveRate:0.25):
        - all thresholds clear → 'proceed'.
        - fewer than 5 scored cases → 'do-not-proceed' (fail-closed).
        - gate failure rate > 0.25 (driven by story-038-003 fail-opens) → 'do-not-proceed'.
        - judge inconclusive rate > 0.25 → 'do-not-proceed'.
      - Consumer/run wiring (mocked): createSkillJudgeConsumer implements GateEvalConsumer and runs
      through the existing runGateEval/decide/coreMetrics with ZERO framework edits (smoke through
      the loop). main() over a small mocked fixture returns EvalReport { metrics, decision, perCase,
      markdown } and writes .loom/eval/skill-judge-report.{md,json}; assert both metrics AND the
      pass/fail decision are present from one run (AC4).


      Verification bar: all four metrics compute correctly on known inputs; the verdict is 'proceed'
      only when every threshold clears and 'do-not-proceed' on any breach (too-few cases, excess
      fail-opens, excess inconclusive); a single main() run emits both metrics and the decision plus
      the rendered report. Detailed fail-closed assertions are also exercised in story-038-005.
