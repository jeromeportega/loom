stories:
  - id: story-001-001
    title: Replace derived score with judgment-based pass signal in BriefRefiner
    description: >-
      Remove the critique-array-length arithmetic from computeQualityScore in
      packages/loom-core/src/brief/BriefRefiner.ts. Gate passes when ready === true AND the
      model-emitted holistic quality_score >= min_brief_quality_score (default 6). Preserve the
      malformed-JSON and truncation-salvage paths with fail-closed defaults (ready: false, low
      score).
    acceptance_criteria:
      - >-
        Gate pass/fail is determined by ready === true AND quality_score >= threshold; no score is
        derived from critique-array lengths
      - >-
        The refiner prompt/schema requires a holistic 0-10 quality_score in the same JSON response
        as ready
      - >-
        Malformed-JSON and truncation-salvage paths still return a usable result with ready: false
        and a low quality_score
      - >-
        A brief whose critique arrays are fully populated but whose ready is true and quality_score
        >= 6 passes the gate
      - 'With threshold 0 the gate still consults ready (ready: false fails even at threshold 0)'
      - >-
        BriefRefinement.test.ts and BriefRefinerSalvage.test.ts are updated to the new semantics and
        pass
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      Delete computeQualityScore (~lines 228-236) and its normalize() call in
      packages/loom-core/src/brief/BriefRefiner.ts; add quality_score to JSON_SCHEMA_INSTRUCTIONS as
      a model-emitted holistic 0-10 judged in the same response as ready, and update the types.ts
      comment that falsely claims derivation stability. Create the new pure function
      evaluateBriefGate(refinement, minScore) in packages/loom-core/src/brief/gate.ts returning
      GateVerdict { pass, ready, quality_score, threshold } with the invariant pass === (ready ===
      true && quality_score >= minScore) — export it through @loom-ai/core's index since
      story-001-003 consumes it from both entry points. Set fail-closed defaults as named exports:
      FALLBACK_QUALITY_SCORE = 0 in fallback(), SALVAGE_QUALITY_SCORE = 3 with ready: false (was
      true/9) in salvagePartialRefinedBrief(), preserving the partial refined_brief; normalize()
      clamps score to [0,10] and maps non-numbers to 0. Test gate.ts directly with node:test (no LLM
      needed) plus MockLLMClient shaped-JSON injection for the refiner paths; trade-off:
      salvaged-but-good briefs now refuse instead of pass, which is the accepted cost of never
      vouching for unparsed content.
    test_plan: >-
      Levels: unit only — evaluateBriefGate is a pure function and every refiner path is reachable
      via MockLLMClient shaped-JSON injection; no integration or e2e needed. Cases for gate.ts (new
      gate.test.ts, node:test, no LLM): (1) ready:true, score 6, threshold 6 → pass (boundary: >= is
      inclusive); (2) ready:true, score 5, threshold 6 → fail; (3) ready:false, score 10, threshold
      6 → fail (ready has veto); (4) ready:false, score 10, threshold 0 → fail (AC: ready consulted
      even at threshold 0); (5) ready:true, score 0, threshold 0 → pass; (6) verdict echoes
      ready/quality_score/threshold exactly as given. Cases for BriefRefiner via MockLLMClient: (7)
      response with fully populated critique arrays, ready:true, quality_score 8 → quality_score is
      8, gate passes at threshold 6 — proves no array-length derivation survives; (8) quality_score
      12 → clamped to 10; negative → clamped to 0; (9) quality_score missing or non-number → 0;
      ready missing/non-boolean → false; (10) unparseable response → fallback() yields ready:false
      and quality_score === FALLBACK_QUALITY_SCORE (assert the named export, not literal 0); (11)
      truncated response that salvage recovers → ready:false, quality_score ===
      SALVAGE_QUALITY_SCORE, AND the partial refined_brief is still present; (12) prompt assertion:
      JSON_SCHEMA_INSTRUCTIONS sent to the mock contains the quality_score field. Update
      BriefRefinement.test.ts (drop any assertion deriving score from critique lengths) and
      BriefRefinerSalvage.test.ts (flip ready:true/9 expectations to false/SALVAGE_QUALITY_SCORE).
      Verification bar: gate truth table fully covered including both boundaries (score ==
      threshold, threshold == 0); both fail-closed paths pinned to the named constants; both legacy
      test files green under the new semantics; zero references to computeQualityScore remain.
  - id: story-001-002
    title: Unify refiner model routing through modelFor on MCP and CLI entry points
    description: >-
      In packages/loom-mcp/src/tools/handlers.ts (~line 488), construct BriefRefiner with
      modelFor(policy, 'planning') instead of policy.agents.model. Audit
      packages/loom-cli/src/commands/epic.ts (~line 47) for the same defect and apply the identical
      fix only if present.
    acceptance_criteria:
      - >-
        The MCP handler resolves the refiner's model via modelFor(policy, 'planning'), matching the
        Planner's resolution
      - >-
        epic.ts has been audited; if the defect exists it is fixed the same way, and the audit
        outcome is noted in the story output
      - >-
        On the cursor-cli backend the gate honors cursor_model (no Claude-namespaced id is passed to
        cursor-agent)
      - New tests assert the refiner and planner resolve the same model on both entry points
    estimated_complexity: small
    dependencies: []
    tech_notes: >-
      In packages/loom-mcp/src/tools/handlers.ts (~line 488) change the BriefRefiner construction
      from policy.agents.model to modelFor(policy, 'planning') from
      packages/loom-core/src/llm/factory.ts — the same resolution the Planner uses, including the
      cursor_model short-circuit. The architecture confirms the identical defect exists in
      packages/loom-cli/src/commands/epic.ts (~line 38/47), so the audit will find it: apply the
      same one-line fix and note the outcome. Also update the BriefRefinerOptions.model doc comment
      ('Sonnet by default; refinement is one call...') since the worker-tier rationale no longer
      holds. Add a regression test asserting refiner and planner resolve identical models on both
      backends; trade-off: on claude-cli the gate call moves from Sonnet to the planning model
      (Opus-tier cost) in exchange for verdict fidelity (ADR-006).
    test_plan: >-
      Levels: unit — model resolution is synchronous construction logic; assert what model string
      each construction site passes, no live backend. Cases (regression test, both entry points x
      both backends): (1) claude-cli policy: the model handed to BriefRefiner in loom-mcp
      handlers.ts equals modelFor(policy, 'planning') and equals the Planner's resolved model; (2)
      same assertion for loom-cli epic.ts after the audited fix; (3) cursor-cli policy with
      cursor_model set: refiner receives cursor_model on both entry points — assert the value is the
      cursor id and explicitly NOT policy.agents.model (this is the bug being fixed; a test that
      only checks equality with modelFor could pass vacuously if modelFor itself regressed, so pin
      the cursor_model literal); (4) guard test that fails if either site is re-wired to
      policy.agents.model — easiest as: set policy.agents.model to a distinct sentinel and assert
      the refiner never receives it. Verification bar: tests fail on either construction site
      regressing; cursor_model honored end-to-end at both entry points; epic.ts audit outcome
      (defect found + fixed) noted in story output; BriefRefinerOptions.model doc comment no longer
      claims worker-tier rationale.
  - id: story-001-003
    title: Add audit-logged force override to loom epic and loom_start_epic
    description: >-
      Add a --force flag to loom epic and a force: true parameter to the loom_start_epic MCP tool
      that skips the gate for that invocation only. The refiner still runs and its critique is
      recorded; an audit row referencing the critique is written before control returns to the
      caller.
    acceptance_criteria:
      - loom epic --force proceeds past a gate rejection
      - 'loom_start_epic with force: true proceeds past a gate rejection'
      - On a forced start the refiner still runs and its critique is recorded
      - >-
        Every forced start writes an audit_log row referencing the critique before returning to the
        caller
      - Without force, gate behavior is unchanged
      - New tests cover the force path on both entry points, including the audit row
    estimated_complexity: medium
    dependencies:
      - story-001-001
    tech_notes: >-
      Wire .option('--force', ...) onto the epic command in packages/loom-cli/src/index.ts and
      thread it into runEpic(brief, { force }) in commands/epic.ts; add force?: boolean (default
      false) to the loom_start_epic inputSchema in packages/loom-mcp/src/tools/registry.ts with
      matching handler logic. Both entry points must follow the ordering invariant refine →
      evaluateBriefGate → (if !pass && force) AuditLog.record → planner: write the audit row via the
      existing AuditLog.record() in packages/loom-core/src/state/AuditLog.ts with action
      'brief_gate_forced', command set to brief.slice(0, 120), allowed: true, and detail embedding
      entry_point, ready, quality_score, threshold, the full critique, and questions (ADR-005 — no
      new table or artifact file; the synchronous better-sqlite3 insert satisfies NFR-2 for free).
      The !pass && !force MCP response keeps its shape but adds the ready field; tests must cover
      the force path on both entry points and assert the audit row exists with the embedded critique
      before the planner runs. Trade-off: force is per-invocation only — resist adding a policy key
      or env var, since that would create the standing-bypass threat the audit row exists to
      prevent.
    test_plan: >-
      Levels: unit for the verdict/branching, integration for the audit row (real better-sqlite3
      .loom/loom.db in a temp dir — the synchronous insert IS the contract under test; do not mock
      AuditLog). Mock the refiner (fixed failing refinement: ready:false, score 2) and the planner.
      Cases: (1) CLI: runEpic(brief, { force: true }) with failing gate → planner invoked, and a
      brief_gate_forced audit row exists with allowed:true, command === brief.slice(0,120),
      detail.entry_point 'cli', detail containing ready, quality_score, threshold, the full critique
      object, and questions; (2) MCP: loom_start_epic { force: true } failing gate → response {
      status: 'planned', forced: true }, audit row with detail.entry_point 'mcp'; (3) ordering
      invariant (NFR-2): planner mock queries audit_log at invocation time and asserts the
      brief_gate_forced row is already durable — not merely present after the call returns; (4)
      refiner-still-runs: on the forced path assert the refiner mock was called and its critique is
      the one embedded in the row; (5) no force, failing gate: CLI rejects, MCP returns status
      'rejected' with reason 'brief_quality_below_threshold' and the payload now includes ready
      alongside quality_score, min_quality_score, critique, questions, refined_brief — assert the
      full shape; (6) no force, passing gate: plans normally, zero brief_gate_forced rows; (7)
      force:true with a PASSING gate → normal pass path, no forced row (per the handler flow only
      !pass && force audits); (8) commander wiring: epic command exposes --force and threads it into
      runEpic. Verification bar: both entry points proven to bypass only their own invocation; every
      forced start has exactly one audit row with the embedded critique, written before the planner
      consumes anything; unforced behavior byte-compatible except the added ready field.
