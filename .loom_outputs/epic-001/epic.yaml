stories:
  - id: story-001-001
    title: Shared findings schema + skill scaffolding
    description: >-
      Define the zod findings schema (severity, category, location, description, suggested_fix?,
      source) in loom-core, and scaffold all five skill directories under skills/ with
      agentskills.io-compliant SKILL.md frontmatter. Register the five skills with SkillSelector
      with stub bodies that pass schema validation and write skill_usage + audit_log rows.
    acceptance_criteria:
      - >-
        Shared zod findings schema exported from loom-core with all required fields (severity,
        category, location, description, suggested_fix?, source)
      - Schema severity enum is exactly {blocker, high, medium, low, info}
      - >-
        Five skill directories exist under skills/ with valid SKILL.md frontmatter using
        lowercase-hyphen names: adversarial-review, edge-case-hunter, failure-investigator,
        doc-distiller, lesson-extractor
      - >-
        All five skills load via SkillSelector in a test fixture with _bmad/scripts/ and
        _bmad/bmm/config.yaml absent
      - Each stub invocation writes one skill_usage and one audit_log row before returning
      - >-
        Unit test asserts schema accepts a valid finding and rejects a malformed one (missing
        required field)
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      Create `packages/loom-core/src/findings/schema.ts` exporting `SeverityEnum`,
      `FindingLocation`, `Finding`, and `ReviewerOutput` per ADR-001 — this file is the single
      contract every other story depends on, so freeze it early. Scaffold
      `skills/{adversarial-review,edge-case-hunter,failure-investigator,doc-distiller,lesson-extractor}/SKILL.md`
      with agentskills.io frontmatter (lowercase-hyphen names per CLAUDE.md invariant #4) and
      register each via the existing `SkillSelector` in `packages/loom-core/`. Stub bodies must
      produce schema-valid output and rely on `SkillSelector.invoke` to write `skill_usage` +
      `audit_log` rows before returning (invariant #5); add a Vitest fixture that hides
      `_bmad/scripts/` and `_bmad/bmm/config.yaml` and asserts all five skills still load.
      Trade-off: lock the schema's field set now — a sixth field later forces a coordinated change
      across every reviewer.
  - id: story-001-002
    title: Port adversarial-review and edge-case-hunter as headless reviewers
    description: >-
      Port the BMAD adversarial-review and edge-case-hunter skill bodies into the scaffolded skills,
      stripping all WAIT-FOR-USER halts and menu prompts, and inlining loom-sensible defaults where
      the originals referenced _bmad/ overlays. Both emit against the shared findings schema with
      source set to the skill name. Preserve prompt-cacheable static prefixes.
    acceptance_criteria:
      - >-
        adversarial-review and edge-case-hunter SKILL.md bodies contain no WAIT-FOR-USER directives
        or interactive-menu prompts
      - >-
        Neither skill reads any path under _bmad/ at runtime (verified by fixture hiding those
        paths)
      - >-
        Both skills emit findings matching the shared zod schema on a sample input, with source set
        to the skill name
      - Static system-prompt prefixes are identical across invocations to preserve prompt-cache hits
      - No file under .agents/skills/ or .claude/skills/ is modified
    estimated_complexity: medium
    dependencies:
      - story-001-001
    tech_notes: >-
      Port body text from the vendored interactive originals under
      `.agents/skills/bmad-review-adversarial-general/` and
      `.agents/skills/bmad-review-edge-case-hunter/` into the new
      `skills/adversarial-review/SKILL.md` and `skills/edge-case-hunter/SKILL.md` — read-only from
      the vendored copies (FR-13). Per ADR-006, inline any `_bmad/scripts/` or
      `_bmad/bmm/config.yaml` defaults as constants in the SKILL.md body rather than probing at
      runtime, and excise every `WAIT-FOR-USER` / menu directive. Keep the system-prompt prefix
      block byte-identical across invocations so `cache_control` markers in the Anthropic SDK still
      hit (invariant #3); the per-diff input goes after the cache boundary. Trade-off:
      byte-identical prefixes mean any future personalization (e.g., per-story tone) requires a new
      cache key — accept it for the cache hit rate.
  - id: story-001-003
    title: Wire three-reviewer review loop with dedupe and revision trigger
    description: >-
      Extend the execution-phase review loop to invoke CodeReviewAgent, adversarial-review, and
      edge-case-hunter per revision pass, union their findings, and dedupe by (file, line,
      normalized-description) where normalization is lowercase + whitespace-collapse +
      punctuation-strip. Trigger another worker revision while any blocker or high finding remains;
      honor existing maxReviewRevisions. On per-reviewer schema-validation failure, attempt one
      repair then warn-and-continue without aborting the pass.
    acceptance_criteria:
      - Review pass invokes all three reviewers and unions their findings
      - >-
        Dedupe collapses two findings with same (file, line) and identical-after-normalization
        descriptions into one
      - 'Unit test: blocker triggers revision; high triggers revision; medium, low, and info do not'
      - >-
        Unit test: loop terminates at the existing maxReviewRevisions cap and no new ceiling is
        introduced
      - >-
        Unit test: malformed reviewer output triggers exactly one repair attempt then a
        warn-and-continue log entry, and the pass continues
      - >-
        When a ported reviewer self-fails, CodeReviewAgent findings still drive the pass (backstop
        behavior)
    estimated_complexity: large
    dependencies:
      - story-001-002
    tech_notes: >-
      Build `packages/loom-core/src/review/orchestrator.ts` exporting `runReviewPass`, `dedupeKey`,
      and `normalize` per the architecture's API contract; invoke `CodeReviewAgent`,
      `adversarial-review`, and `edge-case-hunter` via `Promise.all` (ADR-002) with a per-reviewer
      try/catch that on a zod-validation throw does exactly one repair re-prompt then logs
      `review.reviewer.warn_and_continue` to `audit_log` and skips that reviewer (FR-6, ADR-002).
      `dedupeKey` is `${file}|${line ?? ''}|${normalize(description)}` where `normalize` = lowercase
      + `\s+` collapse + strip `/[^\p{L}\p{N}\s]/u` (ADR-003); `triggers_revision` is true iff any
      post-dedupe finding has severity `blocker` or `high`. Reuse the existing `maxReviewRevisions`
      cap — do not introduce a new ceiling — and write `review.findings.deduped` +
      `review.revision.triggered` audit entries. Trade-off: `CodeReviewAgent`'s current output may
      need a thin adapter into the shared `Finding` shape; keep that adapter local to this story
      rather than mutating the agent.
  - id: story-001-004
    title: Port failure-investigator and wire deterministic retry router
    description: >-
      Port bmad-investigate as a headless skill that grades evidence as strong, weak, or
      contradictory. Wire it into retry handling on test/gate failures with a deterministic router:
      strong -> retry-with-hint (hint passed to next worker attempt), weak -> surface-to-operator,
      contradictory -> stop-epic.
    acceptance_criteria:
      - >-
        failure-investigator SKILL.md contains no WAIT-FOR-USER directives, interactive halts, or
        _bmad/ path reads
      - Skill returns an evidence grade in {strong, weak, contradictory} for sample failures
      - Router unit test covers all three grades and asserts the expected dispatch for each
      - >-
        strong -> retry-with-hint passes the investigator's hint through to the next worker
        invocation
      - >-
        weak -> surface-to-operator and contradictory -> stop-epic each write a distinguishable
        audit_log entry
      - >-
        The existing per-story retry ceiling bounds the strong -> retry loop; no new ceiling is
        added
    estimated_complexity: medium
    dependencies:
      - story-001-001
    tech_notes: >-
      Port `.agents/skills/bmad-investigate/` into `skills/failure-investigator/SKILL.md` emitting
      the `Investigation` zod shape from `packages/loom-core/src/findings/investigation.ts` (note
      the refine: `grade === 'strong'` requires a non-empty `hint`). Implement
      `packages/loom-core/src/failure/router.ts` with `routeByGrade(inv)` as a pure `switch`
      returning the tagged `RouteDecision` union (ADR-004) — no LLM, no I/O, no async — and
      `investigateAndRoute` as the thin wrapper that calls the skill then the router. Each dispatch
      must write a distinguishable `audit_log` action (`failure.routed.retry_with_hint` |
      `failure.routed.surface_to_operator` | `failure.routed.stop_epic`); the `retry-with-hint` path
      threads `hint` into the next worker invocation's input and is bounded by the existing
      per-story retry ceiling. Trade-off: a misgraded `weak` failure that was really `strong` won't
      auto-retry — operator intervention is the explicit cost of keeping the router LLM-free.
  - id: story-001-005
    title: Port doc-distiller and run it at worker-context assembly
    description: >-
      Port bmad-distillator as a headless skill targeting ~50% token reduction of combined planning
      artifacts. Acceptance criteria and explicit constraints from source artifacts must appear
      verbatim in the output. Invoke once per story at worker-context assembly.
    acceptance_criteria:
      - >-
        doc-distiller SKILL.md contains no WAIT-FOR-USER directives, interactive halts, or _bmad/
        path reads
      - Distilled output on a sample story is <=55% of the input token count
      - >-
        Every acceptance-criterion string from input artifacts appears verbatim in the distilled
        output (string-match assertion)
      - >-
        Missing the compression target is logged but does not fail the run; dropping an acceptance
        criterion DOES fail the run
      - >-
        Worker-context assembly invokes the skill exactly once per story and writes the usual
        skill_usage + audit_log rows
    estimated_complexity: medium
    dependencies:
      - story-001-001
    tech_notes: >-
      Port `.agents/skills/bmad-distillator/` into `skills/doc-distiller/SKILL.md` and add
      `packages/loom-core/src/worker/contextAssembler.ts` exporting `assembleWorkerContext(story_id,
      { prd, epic, architecture, story })` per the architecture contract; call the skill exactly
      once per story (FR-8) emitting the `Distillation` shape. Per ADR-005, throw if any
      acceptance-criterion string from the input artifacts is not present verbatim in `distilled`
      (hard fail), but only log-warn if `distilled_token_count / source_token_count > 0.55`. Reuse
      the Anthropic SDK tokenizer already used for cache telemetry for both counts; write
      `context.distilled` to `audit_log` alongside the standard `skill_usage` row. Trade-off: a
      reviewer that paraphrases an AC — even harmlessly — will fail the verbatim check and abort the
      run; accept the false-positive risk over fuzzy matching.
