    acceptance_criteria:
      - >-
        lesson-extractor SKILL.md contains no WAIT-FOR-USER directives, interactive halts, or _bmad/
        path reads
      - Skill emits lessons JSON conforming to a schema documented in its SKILL.md
      - SKILL.md explicitly marks the schema as provisional pending Epic D
      - Skill is registered with SkillSelector and callable; no runtime caller is added this epic
      - No new database table or migration is introduced
    estimated_complexity: small
    dependencies:
      - story-001-001
    tech_notes: >-
      Port the synthesis portion of `.agents/skills/bmad-retrospective/` into
      `skills/lesson-extractor/SKILL.md`, emitting the `Lesson` shape from
      `packages/loom-core/src/findings/distillation.ts` (or a sibling `lessons.ts` if cleaner).
      Register with `SkillSelector` so Epic D can call it, but do NOT add any runtime caller this
      epic (FR-9, ADR-007), and do NOT add a DB table. The SKILL.md must contain a top-of-file
      `PROVISIONAL` marker stating the schema may change once Epic D wires a consumer — this marker
      is the only backward-compat promise we make.
