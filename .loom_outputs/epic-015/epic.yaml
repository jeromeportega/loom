stories:
  - id: story-015-001
    title: Enumerate live CLI and policy-knob surfaces from authoritative sources
    description: >-
      Build the enumeration layer that derives the set of CLI subcommands from the actual command
      registration and the set of operator-visible policy knobs from schemas/policy.schema.yaml.
      Define and document an explicit rule for which schema fields count as operator-facing knobs,
      since not every schema field is one.
    acceptance_criteria:
      - >-
        The CLI subcommand set is derived programmatically from the command registry, not from a
        static or hand-maintained list.
      - The policy-knob set is derived from schemas/policy.schema.yaml.
      - >-
        The rule defining which schema fields are operator-visible knobs is explicit and documented
        in code.
      - >-
        Enumeration surfaces the actual registered subcommands (e.g. init, epic, approve, run,
        status, diff, review, artifacts, traces, audit, autonomy) without hardcoding them.
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      Create `packages/loom-cli/src/describe/coverage.ts` exporting `operatorCommands(program?)` and
      `operatorKnobs(schemaPath?)`. For commands, reuse the existing registry — `collectSpecs()` /
      `enumerateRegisteredCommands(buildProgram())` in `packages/loom-cli/src/describe/registry.ts`
      — and filter by a new `audience?: 'operator' | 'internal'` field (default 'operator') added to
      `CommandDescription`, expanding over `name` + new `aliases?: string[]`; never hardcode the
      subcommand list. For knobs, load `schemas/policy.schema.yaml` with the already-vendored
      `js-yaml` `yaml.load` and apply the explicit, code-documented rule: leaf scalar paths under
      the `git|filesystem|agents` blocks, excluding any field tagged `x-internal: true`. The one
      trade-off: introducing `audience`/`x-internal` annotations means every new internal
      command/knob needs one explicit tag, but defaulting to operator-visible means the check fails
      toward 'document it' rather than silently hiding surface.
    test_plan: >-
      Level: UNIT — these are pure enumeration functions in
      `packages/loom-cli/src/describe/coverage.ts`; no DB, network, or process side effects, so unit
      is the cheapest level that gives full confidence.


      Key cases (test `operatorCommands(program?)` and `operatorKnobs(schemaPath?)` directly):

      - [happy/AC1+AC4] `operatorCommands(buildProgram())` returns a Set containing every real
      subcommand token — assert membership of `init`, `epic`, `approve`, `run`, `status`, `diff`,
      `review`, `artifacts`, `traces`, `audit`, `autonomy`. Source it from
      `collectSpecs()`/`enumerateRegisteredCommands` — NOT a literal array.

      - [AC1 no-hardcode proof] Construct a minimal commander `Command` with a fabricated subcommand
      and assert it appears in the output — proves derivation from the registry, not a static list.

      - [AC3 subset rule — commands] A spec tagged `audience: 'internal'` (e.g. `describe`,
      `release`, `publish`, `guard hook`) is EXCLUDED; a spec with no `audience` defaults to
      operator and is INCLUDED.

      - [AC3/FR-4 aliases] A spec with `aliases: ['x']` yields both `name` and `x` tokens in the
      set.

      - [happy/AC2] `operatorKnobs(schemas/policy.schema.yaml)` returns leaf-scalar paths under the
      `git|filesystem|agents` blocks (e.g. `agents.max_concurrent`, `git.protected_branches`).

      - [AC3 subset rule — knobs] A field tagged `x-internal: true` (e.g.
      `agents.integrator_max_attempts`) is EXCLUDED; container/non-leaf nodes are NOT emitted as
      tokens; fields outside `git|filesystem|agents` are NOT included.


      Verification bar: `operatorCommands` and `operatorKnobs` each return exactly the
      operator-visible token set sourced live (registry / `js-yaml` load of the YAML), the
      documented subset rule (leaf scalars under git|filesystem|agents minus `x-internal`;
      `audience` default operator + alias expansion) is enforced and proven by the exclusion cases,
      and no returned token originates from a hardcoded inventory.
  - id: story-015-002
    title: Assert bidirectional coverage against the capabilities page and wire as a test
    description: >-
      Implement the bidirectional coverage assertion comparing the enumerated surface against a
      defined region of docs/capabilities.md, using exact token/identifier matching that tolerates
      documented aliases. Wire the check into the test suite so drift breaks the build.
    acceptance_criteria:
      - The check fails when the page omits a real subcommand or operator-visible knob.
      - The check fails when the page documents a subcommand or knob that does not exist.
      - >-
        Matching uses exact token/identifier matching against a defined page region, not substring
        coincidence.
      - >-
        A documented alias or synonym for a command or knob does not cause a false 'missing'
        failure.
      - The check runs as a test in the suite and breaks the build on drift.
    estimated_complexity: medium
    dependencies:
      - story-015-001
    tech_notes: >-
      Add `parseDocumentedTokens(markdown, kind)` and `checkCapabilitiesCoverage(opts?)` to
      `coverage.ts`, returning the `CoverageReport` shape (`ok`, `diffs: SurfaceDiff[]`,
      `messages[]`). Parse only inside HTML-comment fences (`<!-- coverage:command:start -->…:end`,
      and `:knob:`) using anchored regex over inline code spans (`` `loom <name>` `` and ``
      `policy.<path>` ``) for exact-identifier equality — not substring matching; honor documented
      synonyms via `CommandDescription.aliases` so a legit alias never reports as `missing`. Wire it
      as `packages/loom-cli/src/__tests__/capabilities-coverage.test.ts` using `node:test` +
      `assert.ok(report.ok, report.messages.join('\n'))`. Keep the module import-clean (no top-level
      argv parsing or side effects) so the doctor can reuse it in-process; trade-off: editors must
      keep new entries inside the fences, which is the price of an unambiguous 'defined region.'
    test_plan: >-
      Level: UNIT for the parse + diff logic against in-memory markdown fixtures (deterministic,
      fast, exercises every branch); plus one INTEGRATION test wiring `checkCapabilitiesCoverage()`
      into `node:test` against the real page (FR-5).


      Key cases:

      - [AC3] `parseDocumentedTokens(md, 'command')` captures only `` `loom <name>` `` identifiers
      INSIDE the `<!-- coverage:command:start -->…<!-- coverage:command:end -->` fence; a `` `loom
      run` `` span in prose OUTSIDE the fence is ignored. Same for
      `parseDocumentedTokens(md,'knob')` with `` `policy.<path>` `` inside the `:knob:` fence.

      - [AC3 exact-match, anti-substring] A documented `` `policy.agents.max` `` does NOT satisfy a
      real knob `agents.max_concurrent`; a documented `` `loom run` `` does NOT cover a command
      `runner`. Comparison is exact-identifier equality.

      - [AC1 missing] Given a fixture page that omits one real command/knob,
      `checkCapabilitiesCoverage` returns `ok:false` with that token in the relevant
      `SurfaceDiff.missing` and a `messages[]` line naming it.

      - [AC2 phantom] Given a fixture documenting a nonexistent command/knob, it lands in
      `SurfaceDiff.phantom` and `ok:false`.

      - [AC4 aliases] A command documented via a legitimate `CommandDescription.aliases` synonym is
      NOT reported `missing`.

      - [fail-loud] A page with the region fence deleted yields zero documented tokens → all real
      surface reported `missing` (does not silently pass).

      - [happy] A fixture page that fully covers a stub surface returns `ok:true`, empty `diffs`.

      - [AC5 wiring] `packages/loom-cli/src/__tests__/capabilities-coverage.test.ts` calls
      `checkCapabilitiesCoverage()` and `assert.ok(report.ok, report.messages.join('\n'))`, so a
      non-ok report fails the suite (non-zero exit). Module stays import-clean (no top-level
      argv/side effects).


      Verification bar: with controlled fixtures an omission produces `missing`, a fictional entry
      produces `phantom`, an aliased-but-documented entry produces neither, substring coincidence
      never satisfies coverage, matching is confined to the fenced region, and the `node:test` case
      fails the build whenever `report.ok` is false. (Against the real, still-uncorrected page this
      test may be red until story-015-003 — that is expected.)
