      Verification bar: `checkCapabilitiesCoverage()` (and the suite test) passes against the
      committed page with empty `missing` and `phantom` diffs, the removed-backend prose is
      confirmed against the code (not assumed), and the new check/doctor mode is documented. Prose
      remains hand-authored (NFR-3) — the test only asserts token coverage.
  - id: story-015-004
    title: Expose the drift check as a prerequisites doctor mode
    description: >-
      Surface the same coverage check through the prerequisites doctor where that surface fits. If
      no such surface exists, record the decision and treat the test-suite wiring as the binding
      requirement with the doctor mode best-effort.
    acceptance_criteria:
      - The drift check is invocable through the prerequisites doctor where that surface exists.
      - Running the doctor mode reports drift consistently with the test-suite check.
      - >-
        If no doctor surface fits, the decision is recorded and the test-suite wiring remains the
        binding requirement.
    estimated_complexity: small
    dependencies:
      - story-015-002
    tech_notes: >-
      Extend `packages/loom-cli/src/commands/doctor.ts` with a `--capabilities` mode that calls the
      same `checkCapabilitiesCoverage({ program })` and emits `report.messages` as a doctor check,
      marking the check failing when `!report.ok`. Consistency with the FR-5 test is guaranteed by
      construction since both call the one shared function (ADR-2) — do not re-implement matching.
      The doctor mode is best-effort and the test remains the binding requirement; if the doctor
      framing genuinely doesn't fit, record that decision in the story output rather than forcing a
      poor surface.
    test_plan: >-
      Level: INTEGRATION — exercise the `loom doctor --capabilities` path in
      `packages/loom-cli/src/commands/doctor.ts` end-to-end (mode dispatch + reporting), since the
      matching logic itself is already unit-covered in story-015-002 and must NOT be re-tested or
      re-implemented here.


      Key cases:

      - [AC1] Invoking the doctor capabilities mode runs `checkCapabilitiesCoverage({ program })`
      and surfaces it as a doctor check.

      - [AC2 consistency] The doctor reports a FAILING check iff `report.ok === false`, emitting
      `report.messages`; reports passing when `ok`. Prove the doctor delegates to the one shared
      function (ADR-2) rather than duplicating matching — e.g. run the mode against a fixture root
      and assert its check status and message lines equal the `CoverageReport` from calling
      `checkCapabilitiesCoverage` directly on the same root.

      - [AC3 fallback] If the doctor framing genuinely does not fit, the decision is recorded in the
      story output and the FR-5 test-suite wiring remains the binding requirement. (Default: the
      surface fits — implement the mode.)


      Verification bar: `loom doctor --capabilities` produces a failing doctor check with the shared
      `report.messages` exactly when `checkCapabilitiesCoverage` returns `ok:false`, and passes
      otherwise — consistency with the FR-5 test guaranteed by both calling the single function,
      with no re-implemented matching.
  - id: story-015-005
    title: Make the releasing runbook package list parity-checked against workspaces
    description: >-
      Make the releasing runbook's package list derive from, or be verified against, the actual
      workspace set so that adding or removing a package cannot leave the list silently stale.
    acceptance_criteria:
      - >-
        The runbook package list is derived from or verified against the actual workspace manifest,
        not a hand-maintained inventory.
      - >-
        Adding or removing a workspace package causes a mismatch with the runbook list to be caught
        mechanically.
      - No parallel hand-maintained package inventory remains that could itself drift.
    estimated_complexity: small
    dependencies: []
    tech_notes: >-
      Extend the existing `packages/loom-core/test/docs/releasing.test.ts` (this story stays in
      `loom-core` — it needs only the root manifest, no command registry, so the ADR-1 split
      applies). `JSON.parse` the root `package.json` `workspaces` glob, resolve `packages/*` to
      their npm names via `fs.readdirSync` + each package's `package.json` `name`, and assert the
      package table in `docs/operations/releasing.md` lists exactly that set. Verify against — don't
      autogenerate — so the human Purpose/publish-order prose is preserved (ADR-5); trade-off: a
      maintainer adding a package still hand-edits the runbook, the test only catches the omission.
    test_plan: >-
      Level: INTEGRATION (docs test) — extend `packages/loom-core/test/docs/releasing.test.ts`
      (`node:test`), reading the real root `package.json` and `docs/operations/releasing.md`. Stays
      in `loom-core` (needs only the manifest, no command registry — ADR-1 split).


      Key cases:

      - [AC1 derive from manifest] Resolve the expected set: `JSON.parse` root `package.json`
      `workspaces` glob (`packages/*`), `fs.readdirSync` the packages dir, read each package's
      `package.json` `name` → expected npm-name set (e.g. `@loom-ai/core`, `loom-ai`, the web
      package). No literal package list in the test.

      - [happy/AC1] Parse the package table in `docs/operations/releasing.md` and assert its name
      set equals the workspace-resolved set EXACTLY.

      - [AC2 drift both directions] A package present in the manifest but missing from the runbook
      table → test fails (omission caught). A name in the table not in the manifest → test fails
      (stale extra caught). Assert set-difference is empty in both directions.

      - [AC3/ADR-5 verify-not-generate] The test only compares the name set; assert it does not
      rewrite the table, so the human Purpose / publish-order prose columns are preserved.


      Verification bar: the test compares the runbook's parsed package-name set against the set
      resolved live from the root workspace manifest for exact equality, fails on a mismatch in
      either direction, and contains no hand-maintained package inventory of its own.
