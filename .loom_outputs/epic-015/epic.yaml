      Trade-off: this is hand-authored prose by design (NFR-3) — the check only asserts token
      coverage, so descriptions remain your judgment.
    test_plan: >-
      Level: NONE new — this is a docs-only correction; the gate is the already-wired
      `capabilities-coverage.test.ts` from story-015-002 going GREEN against the real
      `docs/capabilities.md`. Add no new test logic.


      Key cases / checklist:

      - [AC5+AC1+AC2] Run the story-015-002 test to get the exact `missing`/`phantom` token lists,
      then edit the page until `checkCapabilitiesCoverage()` returns `ok:true` — add every real
      command/knob, delete every phantom one.

      - [fences] Place every added entry INSIDE the `coverage:command` / `coverage:knob` fences so
      the parser sees it; entries outside the region don't count.

      - [AC3 — verify against code, do NOT guess] Before touching the 'What loom does NOT do'
      removed-backend entry, confirm actual current behavior in the code: per project memory the MCP
      server surface is being removed but worker provisioning is retained. State current behavior
