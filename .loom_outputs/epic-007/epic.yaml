stories:
  - id: story-007-001
    title: Accept alias cursor_model ids with a boundary-prefix advisory tier
    description: >-
      Make validateCursorModels three-tier so a working alias id (e.g. claude-opus-4-8) passes with
      an advisory recommending the suffixed form, while a strict-prefix-only-at-a-`-`-boundary rule
      prevents claude-opus-4 from matching claude-opus-4-8-high. The advisory warns, never exits
      non-zero, and flows to all three call sites (doctor/epic/run) through the shared function.
    acceptance_criteria:
      - An exact match returns status 'ok' with an empty message (unchanged).
      - >-
        A configured id that is a strict prefix of a listed id at a '-' boundary returns 'ok' with
        an advisory message recommending the explicit suffixed form.
      - >-
        'claude-opus-4' configured against a list containing 'claude-opus-4-8-high' does NOT
        alias-match (no false 'ok').
      - >-
        A genuinely bogus id still returns 'invalid' with the complete valid-model list;
        'unavailable' semantics are unchanged.
      - >-
        The three asserted cases (alias→advisory, bogus→invalid, exact→silent) pass against a
        stubbed --list-models in __tests__/.
    estimated_complexity: small
    dependencies: []
    tech_notes: >-
      Extend `CursorModelCheck` in `packages/loom-core/src/llm/cursorModels.ts` with the additive
      `advisory?: boolean` field and make `validateCursorModels` three-tier: exact match →
      `{status:'ok', message:''}`; boundary-prefix alias (`listed.startsWith(configured + '-')`,
      picking the SHORTEST listed alias) → `{status:'ok', advisory:true, message:'cursor_model "X"
      matches "X-8"; set the explicit id …'}`; no match → existing `{status:'invalid', …full
      list…}`. The `'-'` boundary is the whole point — `'claude-opus-4'` must NOT alias
      `'claude-opus-4-8-high'`; mirror `parseListModelsOutput`'s defensive style and leave the
      `status` enum and `'unavailable'` path untouched. Pin all three cases in
      `__tests__/CursorModels.test.ts` against a stubbed `--list-models`. The one trade-off: any
      consumer that switches only on `status` silently misses the advisory, so the test for this
      function is the real contract.
    test_plan: >-
      Level: unit only — this is a pure function with a stubbed `--list-models` probe; no
      integration or e2e needed. Target: `validateCursorModels` and the alias rule in
      `packages/loom-core/src/llm/cursorModels.ts`, pinned in `__tests__/CursorModels.test.ts`. Stub
      the `--list-models` output (inject `cursorBin`/list-models stub; never spawn `cursor-agent`).
      Cases (checklist): (1) exact match → `{status:'ok', message:''}` and `advisory` falsy; (2)
      alias `claude-opus-4-8` against a list containing `claude-opus-4-8-high` → `{status:'ok',
      advisory:true}` with message recommending the explicit suffixed id; (3) boundary guard:
      `claude-opus-4` against a list containing ONLY `claude-opus-4-8-high` → NOT `ok` (returns
      `invalid`) — proves the trailing-`-` boundary, no false alias on a non-`-` prefix; (4)
      shortest-alias selection: configured id matching multiple listed ids picks and recommends the
      SHORTEST listed alias; (5) bogus id → `invalid` with the complete `validModels` list
      populated; (6) `unavailable` (probe fails / cursor-agent missing) → status `unavailable`,
      unchanged, no advisory. Verification bar: each of the 5 acceptance criteria maps to a named
      assertion above, the `status` enum stays the three values (alias is `ok`+`advisory:true`,
      never a 4th status), and `claude-opus-4` provably does not alias `claude-opus-4-8-high`. This
      test IS the contract for the three call sites — assert on the returned shape, not on any
      console output.
  - id: story-007-002
    title: Surface the alias advisory at all three call sites without false failures
    description: >-
      Ensure loom doctor, loom epic, and loom run print the FR-1(b) advisory and proceed (exit 0) on
      an alias id, exit non-zero only on a confirmed-invalid id, and stay silent on an exact match —
      inheriting the behavior from the shared function with no per-site special-casing.
    acceptance_criteria:
      - >-
        loom epic and loom run print the advisory and proceed on an alias cursor_model; they exit
        non-zero only on status 'invalid'.
      - loom doctor reports the alias case as a warn (not FAIL) with the advisory text and exits 0.
      - An exact-match id produces no advisory at any of the three call sites.
      - Tests stub the --list-models probe; no real cursor-agent is spawned.
    estimated_complexity: small
    dependencies:
      - story-007-001
    tech_notes: >-
      Update the three call sites — `packages/loom-cli/src/commands/epic.ts` (`runEpic`), `run.ts`
      (`runRun`), and `doctor.ts` — to fold `m.advisory` into their EXISTING `'unavailable'` warn
      branch with no per-site special-casing: `if (m?.status==='invalid'){ console.error(m.message);
      process.exit(1); } else if (m?.status==='unavailable' || m?.advisory){
      console.warn(m.message); }`. In `doctor.ts` render the advisory as a `warn` Check with
      `required:false` so it stays exit 0. The trade-off: keep the branch shape identical across all
      three so the behavior is inherited from story-007-001, not re-derived; stub `--list-models` in
      tests, never spawn `cursor-agent`.
    test_plan: >-
      Level: unit/integration on the three CLI command modules — invoke `runEpic`, `runRun`, and the
      `doctor` check builder directly with a stubbed `validateCursorModels`/`--list-models`; capture
      `console.warn`/`console.error` and `process.exit`. No real `cursor-agent`. Cases (checklist):
      (1) alias (`status:'ok', advisory:true`) in `runEpic` and `runRun` → advisory written to
      `console.warn`, NO `process.exit(1)`, command proceeds (exit 0 / continues past the check);
      (2) `invalid` → `console.error(m.message)` then `process.exit(1)` at all three sites; (3)
      exact match (`status:'ok'`, no advisory) → NO warn, NO error at any site; (4) `doctor.ts`
      alias case → emitted as a `warn` Check with `required:false`, doctor exits 0 (not FAIL); (5)
      regression guard: the three call sites share the identical `if(invalid)…else
      if(unavailable||advisory)…` branch — assert behavior is identical for `unavailable` and
      `advisory` (same warn branch) to prove no per-site special-casing. Verification bar: alias
      never exits non-zero anywhere, `invalid` always exits non-zero, exact match is silent at all
      three sites, and doctor stays exit 0 on alias — all driven by the stub, with the advisory text
      coming from the shared function (not re-derived in the call site).
