  - id: story-007-009
    title: Add loom doctor --cross-epic-gate with union merge + suite run
    description: >-
      Add the --cross-epic-gate flag to loom doctor (no new top-level command), reusing the
      runGateDryRun ephemeral-worktree machinery. Create a throwaway worktree from the
      default-branch tip, sequentially merge every open epic branch (epic/*, or an explicit --epics
      <id,id> allowlist), then report per-pair conflicts and stop, or run policy.agents.test_command
      once and report pass/fail with union context. Real branches are never mutated. Also emit the
      FR-11 finalizer PR hint.
    acceptance_criteria:
      - >-
        Two fixture epic branches that conflict mechanically: reports the conflicting file list per
        epic pair and exits 3.
      - >-
        Two fixture epic branches that merge cleanly but fail the suite: reports the union failure
        and exits 3.
      - 'Two fixture epic branches that merge cleanly and pass the suite: exits 0.'
      - >-
        A hard operational error (worktree creation failed, no epic branches found, gate command
        unresolvable) exits 1.
      - >-
        The --epics allowlist and the 'no epic branches found → exit 1' case have explicit test
        coverage; real branches are never mutated (temp git repos, no sleeps, no real cursor-agent).
      - >-
        When the EpicFinalizer opens a PR while other epic branches have open PRs, it prints a
        one-line hint naming `loom doctor --cross-epic-gate`.
    estimated_complexity: large
    dependencies: []
    tech_notes: >-
      Create `packages/loom-core/src/orchestrator/CrossEpicGate.ts` exporting `async
      runCrossEpicGate(opts, deps?): Promise<CrossEpicGateOutcome>` and add `--cross-epic-gate` (+
      optional `--epics <id,id>`) as a `.option()` on the existing `doctor` command — NO new
      top-level command. Compose, don't re-implement: reuse `runGateDryRun`'s `git worktree add
      --detach` + `finally`-remove lifecycle and `IntegrationGate.run()`. Resolve branches
      (`opts.epics` allowlist else `git branch --list 'epic/*'`; zero → exit 1), sequentially `git
      merge --no-ff`; a conflict records per-pair files and STOPS (exit 3); all-clean → run the
      suite once (`ok:false` → exit 3, `ok:true` → exit 0); operational errors → exit 1; ALWAYS
      force-remove the worktree in `finally`, real branches read-only. Also extend
      `EpicFinalizer.ts`: after `recordPrUrl`, if other `epic/*` branches have OPEN PRs, append a
      one-line hint naming `loom doctor --cross-epic-gate` (use an injectable open-PR probe for
      tests). Use the args-array `git()`/`gitSafe()` helpers (no shell); test with temp `git init`
      repos, stubbed gate, no sleeps, no real `cursor-agent`. Trade-off: a detached union worktree
      validates 'merge + pass together now,' not against a future-moved `main` — that is the
      promised scope.
    test_plan: >-
      Level: integration with temp `git init` repos (real branches/merges) + a stubbed/injected
      `IntegrationGate.run()`; plus unit for branch resolution and the finalizer hint. NO real
      `cursor-agent`, NO sleeps, real branches never mutated. Target: `runCrossEpicGate(opts,
      deps?)` in `packages/loom-core/src/orchestrator/CrossEpicGate.ts`, the
      `--cross-epic-gate`/`--epics` options on `doctor`, and the `EpicFinalizer` PR hint. Cases
      (checklist): (1) two fixture `epic/*` branches that conflict on a file → outcome reports the
      conflicting file list per epic pair and `exitCode:3`, and merging STOPS at the first conflict;
      (2) two branches that merge clean but the (stubbed) gate returns `ok:false` → reports the
      union failure, `exitCode:3`; (3) two branches that merge clean and gate `ok:true` →
      `exitCode:0`; (4) operational errors → `exitCode:1` for: worktree creation failure (inject a
      failing `git worktree add`), no epic branches found (empty `git branch --list 'epic/*'` and
      empty allowlist), and gate command unresolvable; (5) `--epics <id,id>` allowlist resolves
      exactly those branches (not the `epic/*` glob) — explicit assertion; (6) cleanup: the
      throwaway worktree is force-removed in `finally` on EVERY path (clean, conflict, gate-fail,
      throw) — assert `cleanedUp:true` / worktree gone, and that the ORIGINAL branches/refs are
      byte-unchanged before vs after; (7) `EpicFinalizer`: after `recordPrUrl`, when other `epic/*`
      branches have OPEN PRs (injectable open-PR probe), a one-line hint naming `loom doctor
      --cross-epic-gate` is printed; when NO other open PRs, no hint. Verification bar: the three
      graded outcomes map exactly (3 conflict / 3 union-fail / 0 clean), all three operational
      errors are `exitCode:1` and distinct from advisory `3`, the allowlist and zero-branch cases
      are explicitly covered, the worktree is always cleaned up with real branches untouched, and
      the finalizer hint fires only when sibling open PRs exist. Determinism: control merge conflict
      by constructing diverging commits to the same file; stub the gate — never run the real suite.
