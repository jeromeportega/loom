  - id: story-007-004
    title: Add opt-in loom approve --run that chains into the run path
    description: >-
      Add `loom approve <epic-id> --run`, which approves then chains into the same code path as
      `loom run <epic-id>` so 'dispatching now' is only printed by a path that actually dispatches.
      Bare `loom approve --run` (no explicit id) exits non-zero with a one-line usage hint.
    acceptance_criteria:
      - '`loom approve <id> --run` approves the epic, then dispatches through the loom run code path.'
      - Bare `loom approve --run` exits non-zero and prints a one-line usage hint.
      - >-
        `--run` only triggers dispatch when given an explicit epic id; the existing non--run approve
        behavior is unchanged.
      - >-
        The overlap check (story-007-008) runs once at approve time and is suppressed in the chained
        dispatch.
    estimated_complexity: medium
    dependencies:
      - story-007-003
      - story-007-008
    tech_notes: >-
      Add a `.option('--run')` to the approve command in `packages/loom-cli/src/commands/gate.ts`
      (wired in `index.ts`); when an explicit id is present and `--run` is set, approve then chain
      into the same `runRun` path from `run.ts` so only a path that truly dispatches prints
      'dispatching now'. Bare `loom approve --run` (no id) must `process.exit(1)` with a one-line
      usage hint. Run the cross-epic overlap advisory (story-007-008) ONCE at approve time and pass
      a suppression flag into the chained `runRun` so it isn't printed twice. Trade-off: reuse
      `runRun` rather than re-implementing dispatch, accepting that approve now imports the run path
      — keep the seam thin (one function call) so the two commands don't drift.
    test_plan: >-
      Level: integration on the approve command path — invoke the approve command (via `commander`
      action or `runApprove`) with a stubbed/injected `runRun` so no real supervisor or
      `cursor-agent` runs; capture `process.exit` and stdout. Cases (checklist): (1) `loom approve
      <id> --run` with explicit id → epic is approved AND the injected `runRun` is invoked exactly
      once with that id (assert the call, and that 'dispatching now' is printed only on that path);
      (2) bare `loom approve --run` (no explicit id) → `process.exit(1)` (non-zero) with a one-line
      usage hint on stderr, and `runRun` is NEVER called; (3) `loom approve <id>` WITHOUT `--run` →
      existing behavior unchanged (approves, prints the run-hint from story-007-003, does NOT call
      `runRun`); (4) overlap-check suppression: the cross-epic overlap advisory (story-007-008) is
      computed/printed exactly ONCE at approve time and the chained `runRun` receives the
      suppression flag so it is not printed twice — assert the advisory printer is called once
      across the whole `--run` flow. Verification bar: dispatch fires only with explicit-id +
      `--run`; bare `--run` exits non-zero with a usage hint and never dispatches; non-`--run`
      approve is byte-for-byte unchanged; overlap advisory prints once. Keep the seam thin — assert
      approve calls into the SAME `runRun` (one function call), not a re-implemented dispatch.
  - id: story-007-005
    title: Reserve the epic row at submission with a single allocation site
    description: >-
      Reserve the epic row in runEpic before the BriefRefiner runs, with a derived placeholder title
      (first markdown heading, else first 60 chars), reusing beginPlanning. Refactor so the Planner
      consumes a pre-reserved epic id (optional parameter defaulting to today's self-allocation) so
      nextEpicId-style allocation never runs twice for one submission; the planner title replaces
      the placeholder at completion via the existing seam.
    acceptance_criteria:
      - >-
        Immediately after submission, loom status shows the new epic row with a derived title and a
        planning_phase.
      - >-
        The placeholder title is the brief's first markdown heading when present, otherwise its
        first 60 characters.
      - >-
        nextEpicId-style allocation runs exactly once per submission (no parallel insert path); the
        Planner accepts a pre-reserved id and defaults to self-allocation when none is passed.
      - The refined/planner title replaces the placeholder at planning completion.
      - >-
        Two stubbed-LLM planning runs where the first refiner finishes second still allocate ids in
        submission order.
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      In `runEpic` (`packages/loom-cli/src/commands/epic.ts`), allocate once via
      `Planner.nextEpicId(db)` and call `new EpicStore(db).beginPlanning(reservedId, brief)` BEFORE
      the `BriefRefiner` runs — the synchronous `better-sqlite3` insert makes the row durable
      pre-`await`, which is what gives submission-order allocation. Add an optional `reservedId?:
      string` param to `Planner.run(brief, reservedId?)` in
      `packages/loom-core/src/planner/Planner.ts` that skips self-allocation when present (default =
      today's behavior, keeping MCP/test paths byte-compatible). Add `derivePlaceholderTitle(brief)`
      (first `/^#{1,6}\s+(.+)$/m` heading, else `brief.slice(0,60)`) and write it via a new
      `EpicStore.setTitle(id,title)` seam (owned here), with the planner's real title replacing it
      at completion through the existing seam. Trade-off: two callers now share 'who allocates' —
      document it on the signature; the default preserves the old path so nothing silently breaks.
    test_plan: >-
      Level: integration with a real in-memory/temp `better-sqlite3` DB and a stubbed-LLM
      `BriefRefiner`/`Planner`; plus a unit test for `derivePlaceholderTitle`. No real
      `cursor-agent`. Cases (checklist): (1) `derivePlaceholderTitle` unit: brief with a markdown
      heading → first `/^#{1,6}\s+(.+)$/m` heading text trimmed; brief with no heading → first 60
      chars; empty/short brief → no throw, returns the (possibly short) slice; (2) reservation
      timing: in `runEpic`, after submission but BEFORE the refiner resolves, query the DB and
      assert the row exists with the derived title and a non-null `planning_phase` (drive this by
      making the stubbed refiner await a controllable deferred so you can assert mid-flight WITHOUT
      sleeps); (3) single allocation: assert `Planner.nextEpicId` allocates exactly once per
      submission and `Planner.run(brief, reservedId)` SKIPS self-allocation when `reservedId` is
      passed (spy/count the allocator); (4) default path preserved: `Planner.run(brief)` with NO
      `reservedId` self-allocates as before (MCP/test path byte-compatible); (5) title replacement:
      at planning completion the planner's real title replaces the placeholder via
      `EpicStore.setTitle`; (6) submission-order under interleaving: two submissions where the FIRST
      refiner resolves SECOND (use two deferreds resolved out of order) still allocate ids in
      submission order — assert the earlier submission got the lower id. Verification bar: row is
      durable and visible to `loom status` immediately post-submission (before the first `await`
      completes) with derived title + phase, exactly one allocation per submission, the default
      no-id path is unchanged, and out-of-order refiner completion preserves submission-order ids.
      Determinism: use deferred promises to control ordering — no `setTimeout`/sleeps.
  - id: story-007-006
    title: Define clean terminal states for gate-rejected and crashed planning runs
    description: >-
      On the reserved row from story-007-005, a brief-gate rejection flips status to 'rejected' with
      error carrying the gate verdict (e.g. 'brief gate: 3/10 — <first critique line>'); a
      refiner/planner throw flips to 'failed' via the existing epic-005 path. A --force run reserves
      before the refiner too and is never marked 'rejected'.
    acceptance_criteria:
      - >-
        A gate-rejected brief leaves the reserved row as 'rejected' with the gate verdict in error;
        no orphaned '(planning…)' row.
      - A refiner/planner crash leaves the row 'failed' (epic-005 path), not 'rejected'.
      - >-
        A --force run reserves before the refiner and is never recorded as 'rejected', even when the
        brief scores below threshold.
      - >-
        A test verifies no downstream consumer of 'rejected' mishandles the non-human quality-gate
        verdict.
    estimated_complexity: medium
    dependencies:
      - story-007-005
    tech_notes: >-
      Build on story-007-005's reserved row in `runEpic`: on `(!verdict.pass && !force)`, replace
      the bare `process.exit(1)` with `store.reject(reservedId, 'brief gate:
      ${verdict.quality_score}/10 — ${firstCritiqueLine}')`, where `EpicStore.reject` does
      `updateStatus(id,'rejected',reason)` and writes the verdict to the `error` column (NOT
      `reason`, so human vs. gate provenance stays distinguishable). Leave the refiner/planner-throw
      path on the existing epic-005 `fail()` → `'failed'`; under `--force`, reserve before the
      refiner but NEVER reject. Add a test asserting no downstream consumer of `'rejected'`
      mishandles the non-human verdict. Trade-off: you are overloading `'rejected'` with two
      provenances to avoid a schema migration during the freeze — the `error`-vs-`reason` split is
      the mitigation, so don't collapse them.
    test_plan: >-
      Level: integration on `runEpic` with a real temp/in-memory DB, a stubbed gate verdict, and a
      stubbed refiner/planner that can be forced to throw. Builds on story-007-005's reserved row.
      Cases (checklist): (1) gate reject (`!verdict.pass && !force`): the reserved row ends as
      status `'rejected'` with the verdict string `brief gate: <score>/10 — <first critique line>`
      in the `error` column (NOT `reason`); no orphaned `(planning…)` row remains; (2) provenance
      separation: assert a human reject writes `reason` while the gate reject writes `error` — the
      two are distinguishable on the same `'rejected'` status; (3) refiner/planner throw: the row
      ends `'failed'` via the existing epic-005 `fail()` path, NOT `'rejected'`; (4) `--force`
      below-threshold: reserves before the refiner and is NEVER recorded as `'rejected'` even when
      the brief scores below threshold (assert final status is the normal success/planned path, not
      rejected); (5) downstream-consumer guard: a test that drives a consumer of `'rejected'` rows
      (e.g. status rendering / any reject handler) with a gate-provenance row and asserts it does
      not mishandle the non-human verdict (no crash, no assumption that `reason` is populated).
      Verification bar: gate rejection is a clean terminal `'rejected'` with the verdict in `error`,
      crashes are `'failed'`, `--force` never rejects, no `(planning…)` orphans in any branch, and
      no consumer breaks on the gate-provenance `'rejected'` row. Assert on the persisted row
      (status/error/reason), not on log output.
  - id: story-007-007
    title: Parse the file-ownership map from epic contracts
    description: >-
      Implement a parser for the file-ownership markdown table in .loom/contract/<epic-id>.md: first
      column is the path; cells may hold multiple paths separated by ',', '·', or '<br>'. Strip
      surrounding backticks, parenthesized annotations ((new)/(delete)), and trailing prose;
      normalize to repo-relative POSIX paths. Unparseable rows are skipped, never fatal.
    acceptance_criteria:
      - >-
        The parser extracts the owning story/epic and the normalized path(s) from each row of the
        ownership table.
      - >-
        Cells split on ',', '·', and '<br>'; backticks, (new)/(delete) annotations, and trailing
        prose are stripped.
      - An unparseable row is skipped without throwing.
      - >-
        Fixtures lifted from the real contracts of epics 001–006 (which use the '·' delimiter) pin
        the parser in __tests__/.
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      Create `packages/loom-core/src/orchestrator/ContractOwnership.ts` exporting
      `parseOwnershipMap(markdown, epicId): OwnershipMap` and `loadOwnershipMap(projectRoot,
      epicId): OwnershipMap | null`. Find the 'File & module ownership map' heading, read the table
      beneath, treat col 1 as owner (story/epic id), col 2 as path(s) split on `,`/`·`/`<br>`; per
      path strip surrounding backticks, strip `/\([^)]*\)/` annotations like `(new)`/`(delete)`,
      strip trailing prose, normalize to repo-relative POSIX. `loadOwnershipMap` reads
      `.loom/contract/<epic-id>.md` via the `SharedContract` path convention and returns `null` when
      absent (shared_contract=off). Hand-rolled, total, anchored/linear regexes — an unparseable row
      is skipped, never thrown, mirroring `parseListModelsOutput`; no markdown-AST dep. Pin it with
      fixtures lifted from the real epics 001–006 contracts (the `·` delimiter) in `__tests__/`.
      Trade-off: paths are used only for string compare/display, never opened/executed — keep it
      that way (no `fs` keyed on parsed paths).
    test_plan: >-
      Level: unit only — pure parser, pinned with real-contract fixtures. Target:
      `parseOwnershipMap(markdown, epicId)` and `loadOwnershipMap(projectRoot, epicId)` in
      `packages/loom-core/src/orchestrator/ContractOwnership.ts`, tested in `__tests__/`. Cases
      (checklist): (1) heading + table extraction: given a contract with the 'File & module
      ownership map' heading, each row yields `OwnershipEntry{epicId, storyId?, path}` with col-1
      owner (story/epic id) and col-2 path(s); (2) multi-path cell splitting on all three delimiters
      — `,`, `·`, and `<br>` — each path becomes its own entry; (3) normalization per path:
      surrounding backticks stripped, `/\([^)]*\)/` annotations like `(new)`/`(delete)` stripped,
      trailing prose after the path token stripped, result is repo-relative POSIX; (4)
      unparseable/malformed row → SKIPPED, never throws (e.g. row missing the path column, garbage
      cell); (5) `loadOwnershipMap` returns `null` when `.loom/contract/<epic-id>.md` is absent
      (shared_contract=off) and a populated map when present; (6) real-contract fixtures lifted from
      epics 001–006 (which use the `·` delimiter) round-trip to the expected normalized path sets.
      Verification bar: every acceptance criterion has a named fixture/assert, the parser is total
      (no input throws), output paths are normalized repo-relative POSIX, and the 001–006 fixtures
      pin the exact extracted entries. Security guard: assert paths are only returned for
      compare/display — the parser performs NO `fs` access keyed on a parsed path.
  - id: story-007-008
    title: Cross-epic overlap advisory at approve and dispatch
    description: >-
      At loom approve and at loom run dispatch start, compare the parsed ownership maps of the
      target epic and every other planned/approved/in-progress epic by exact lexical path equality,
      and print an advisory listing each overlapping file with both epic/story owners. Warns, never
      blocks; a missing contract file (shared_contract=off) is silently skipped; copy frames the
      result as lexical-only.
    acceptance_criteria:
      - >-
        loom approve against an epic whose contract overlaps an in-flight epic's contract prints the
        overlapping files with both owners; approval still succeeds.
      - >-
        Comparison is exact lexical path equality — no globbing, directory-prefix inference, or
        semantic analysis.
      - A missing contract file for any compared epic is silently skipped (no error).
      - The advisory copy frames the result as lexical-only.
      - The same check runs at loom run dispatch start.
    estimated_complexity: medium
    dependencies:
      - story-007-007
    tech_notes: >-
      Add `computeOverlaps(target, others): Overlap[]` and `renderOverlapAdvisory(overlaps):
      string[]` (own these — put them in `crossEpicOverlap.ts` consuming `ContractOwnership` from
      007-007) using EXACT lexical path `===` after normalization — no glob, no dirname prefixing,
      no semantics. Wire the printer into `runApprove` (`gate.ts`) and at `runRun` dispatch start
      (before `supervisor.run()` in `run.ts`); compare the target against every other
      planned/approved/in-progress epic's map. A missing contract for any compared epic is silently
      skipped; advisory copy must frame the result as 'lexical path match only' and never exit.
      Trade-off: same-directory-different-filename collisions go unflagged — accepted, because
      inferring them reintroduces the false-failure mode this epic exists to kill.
    test_plan: >-
      Level: unit for the pure compute/render functions, plus light integration to confirm the
      wiring at both call sites. Target: `computeOverlaps(target, others)` and
      `renderOverlapAdvisory(overlaps)` in `crossEpicOverlap.ts` (consuming `ContractOwnership`),
