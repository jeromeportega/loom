stories:
  - id: story-007-001
    title: Build dependency packages in dependency order in the integration worktree
    description: >-
      In the throwaway integration worktree, build dependency packages (e.g., loom-core) before
      their dependents, or refresh the dependency install, so a method added to a dependency package
      in one story is visible to a dependent package built later in the same gate run.
    acceptance_criteria:
      - >-
        In the integration worktree, dependency packages are built before any dependent package that
        imports them.
      - A dependent package resolves freshly built dependency output rather than a stale built copy.
      - >-
        A correct cross-package API addition (method added to loom-core, used by a dependent
        package) builds green through the gate.
      - The gate still builds against current source — no guardrail is weakened.
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      Add the `linkWorkspaceDeps(worktreeRoot: string): void` helper (per the API contract / ADR-1)
      and call it as a preflight from `IntegrationBranch.ensure` (reached via
      `Supervisor.ensureIntegrationBranch`) before the existing ordered core→web→cli `tsc` build
      runs in `.loom/integration/<epic>/`. The helper must create worktree-local
      `node_modules/@loom-ai/{core,web}` symlinks pointing at `../../packages/{loom-core,loom-web}`
      so `loom-cli`'s `import '@loom-ai/core'` resolves the worktree's OWN freshly built `dist`
      instead of resolving upward to the main checkout's stale dist — do NOT reorder the build, the
      order is already correct. The one trade-off: the symlink helper reimplements a slice of npm's
      workspace linking (fast/offline) versus the `npm ci` policy alternative, which is boring but
      depends on the in-sync lockfile delivered by story-010-001.
    test_plan: >-
      **Levels:** Unit for the `linkWorkspaceDeps(worktreeRoot)` helper (pure filesystem behavior,
      fast/deterministic); one integration test for the preflight wiring into
      `IntegrationBranch.ensure`. Defer the full cross-package gate proof to story-007-002 — don't
      duplicate the expensive worktree build here.


      **Cases (write tests first):**

      - Unit — happy path: against a temp worktree dir with a real `packages/loom-core` and
      `packages/loom-web` layout, `linkWorkspaceDeps` creates
      `<worktree>/node_modules/@loom-ai/core` and `.../@loom-ai/web` as symlinks resolving to
      `../../packages/{loom-core,loom-web}`. Assert the link targets resolve to the worktree's OWN
      package dirs, not the parent checkout (AC1, AC2).

      - Unit — resolution proof: after linking, a module-resolution check from the worktree (e.g.
      resolve `@loom-ai/core` with the worktree as base) lands on the worktree's `dist`, not the
      main repo's `node_modules`. This is the symptom the fix targets (AC2).

      - Unit — idempotent / pre-existing: re-running when `node_modules/@loom-ai` already exists
      (stale link or real dir) does not throw and leaves correct links — the gate re-runs worktrees
      (AC2).

      - Unit — boundary: missing `node_modules` dir is created; missing `@loom-ai` scope dir is
      created. No reliance on prior state.

      - Integration — wiring: `IntegrationBranch.ensure` (reached via
      `Supervisor.ensureIntegrationBranch`) invokes `linkWorkspaceDeps` BEFORE the ordered
      core→web→cli `tsc` build, and does NOT reorder the build. Assert call order (spy/seam), not
      implementation internals.


      **Verification bar:** Links point at the worktree's own freshly built output and module
      resolution proves it; the preflight runs before the build; build order is unchanged. AC3/AC4
      (a real cross-package addition builds green, and the gate still builds against current source)
      are demonstrated end-to-end by story-007-002 — do not claim them met from this story's tests
      alone.
  - id: story-007-002
    title: Regression test for the cross-package API-addition scenario
    description: >-
      Add a regression test that reproduces the cross-package addition scenario (story A adds a
      method to loom-core, story B uses it) by exercising the actual integration worktree-and-build
      path, not a simplified stand-in, and confirm the gate still fails a genuine cross-story
      regression.
    acceptance_criteria:
      - The test exercises the real integration worktree-and-build path, not a simplified stand-in.
      - >-
        The test fails when dependents are built against a stale dependency and passes with the
        dependency-order build in place.
      - The test reproduces the actual scenario and does not pass vacuously in a fresh worktree.
      - >-
        The integration gate still fails on a genuine cross-story regression (guardrail integrity
        preserved).
    estimated_complexity: medium
    dependencies:
      - story-007-001
    tech_notes: >-
      Build a regression fixture in `packages/loom-core/src/.../__tests__` that drives the REAL
      `IntegrationBranch`/`IntegrationGate` worktree-and-build path (invoking `linkWorkspaceDeps`
      from story-007-001), staging two story merges where story A adds a method to loom-core and
      story B consumes it — not a simplified stand-in. Assert the gate fails when dependents build
      against stale dependency output and passes once the dep-link preflight is in place, and per
      NFR-1 / AC4 also assert the gate STILL fails on a genuine cross-package regression so the fix
      cannot mask real breaks. Ensure the test cannot pass vacuously in a fresh worktree (e.g., seed
      a worktree that genuinely lacks local `node_modules`); the one trade-off is test runtime,
      since it does a real build rather than a stub.
    test_plan: >-
      **Levels:** Integration regression test that drives the REAL
      `IntegrationBranch`/`IntegrationGate` worktree-and-build path (invoking `linkWorkspaceDeps`
      from story-007-001). No simplified stand-in, no mocked build — the whole point (FR-2, NFR-1)
      is to exercise the actual path. Locate under `packages/loom-core/src/.../__tests__`.


      **Cases:**

      - Reproduce the scenario: stage two story merges into the integration worktree where story A
      adds a method to `loom-core` and story B (a dependent package) calls it. Run the gate and
      assert `GateOutcome.passed === true` once the dep-link preflight is in place (AC2 pass side,
      mirrors FR-1).

      - Negative control — proves the test bites: with the dep-link preflight disabled/absent (or
      links pointed at the stale parent dist), the SAME scenario must produce `passed === false`
      with a compile error referencing the missing method. This is what makes the test non-vacuous
      (AC2 fail side, AC1).

      - Non-vacuity guard: seed the worktree so it genuinely lacks local `node_modules` (the real
      defect precondition), and assert that without the fix resolution climbs to the parent
      checkout's stale `dist`. The test must not pass merely because a fresh worktree happens to be
      clean (AC3).

      - Guardrail integrity (NFR-1, AC4): stage a GENUINE cross-package regression (story B
      references a `loom-core` symbol that does NOT exist / was removed) and assert the gate still
      reports `passed === false`. The dep-refresh must not mask real breaks. Also confirm an
      amputated merge (`GateOutcome.amputated === true`) still fails.


      **Determinism:** Each run builds in an isolated throwaway worktree; clean up between cases; no
      shared `node_modules` state. Accept the real-build runtime cost (documented trade-off) but
      keep the fixture packages minimal.


      **Verification bar:** The test fails on stale-dependency builds, passes with dependency-order
      resolution, cannot pass vacuously in a fresh worktree, AND still fails a real cross-story
      regression. All four ACs are demonstrated against the live gate code path, not a stub.
