stories:
  - id: story-028-001
    title: Extend path-aware overlap detection to act within an epic
    description: >-
      Extend the existing path-aware overlap detector so it identifies, at plan time, when two or
      more stories within a single epic declare ownership of the same real file path. Drive
      detection from each story's declared file ownership (shared contract plus tech notes), reusing
      the existing detector rather than adding a second detection path.
    acceptance_criteria:
      - >-
        Given an epic where two or more stories declare the same real file path, the detector
        reports them as a within-epic same-file overlap.
      - Detection operates on real file paths only; free-text tokens are never treated as overlaps.
      - >-
        The within-epic detection reuses the existing path-aware overlap logic; no second or
        divergent detection code path is introduced.
      - >-
        The cross-epic overlap advisory and existing path-aware detection retain their current
        behavior (existing tests still pass).
    estimated_complexity: medium
    dependencies: []
    tech_notes: >-
      Extend `packages/loom-core/src/orchestrator/ContractOwnership.ts` by adding
      `computeWithinEpicOverlaps(map: OwnershipMap): Overlap[]` that keys on `storyId` instead of
      `epicId`. Per ADR-001, refactor the path-indexing logic currently inside `computeOverlaps()`
      into one shared private helper (e.g. `groupOwnersByPath`) and have both functions call it — do
      NOT copy the loop, or the cross-epic advisory and the new within-epic path will drift. Source
      ownership from `.loom/contract/<epic>.md` via the existing
      `parseOwnershipMap()`/`loadOwnershipMap()` and keep the EXACT-lexical `normalizePath` equality
      (`ContractOwnership.ts:191`); the one trade-off to accept is that this only sees *declared*
      paths, so undeclared file edits stay invisible — don't reintroduce globbing/token-similarity
      to close that gap.
    test_plan: >-
      Level: **unit** only — `computeWithinEpicOverlaps(map: OwnershipMap): Overlap[]` is a pure
      function over an in-memory map; no I/O, no fixtures needed. Add cases to the existing
      `ContractOwnership` test file so the refactor and the new function are guarded together.


      Key cases (checklist):

      - Happy: two stories declaring the exact same normalized path → one `Overlap` whose owners
      list both distinct `storyId`s (AC-1).

      - N>2: three+ stories on one path → a single `Overlap` carrying all distinct story owners
      (sets up story-028-002's chain).

      - Different paths → empty result (AC-1 inverse; guards Goal 3).

      - Real-paths-only: entries whose values are free-text tokens / non-path strings are never
      grouped as an overlap (AC-2, FR-2).

      - Normalization: paths differing only by `normalizePath`-equivalent form (e.g. `./x.ts` vs
      `x.ts`) collapse to one path; genuinely different paths do not — exercise
      `ContractOwnership.ts:191` exact-lexical equality, no globbing.

      - Same story, same path declared twice (duplicate entry) → NOT an overlap; overlap requires ≥2
      *distinct* storyIds.

      - Empty map → empty result.

      - Reuse/no-drift (AC-3): assert `computeOverlaps()` (cross-epic) still returns identical
      results on its existing inputs after the `groupOwnersByPath` extraction, and that both
      functions route through the one shared helper (e.g. via a single shared code path, not a
      copied loop). The whole existing `ContractOwnership` suite must stay green (AC-4).


      Verification bar: all four ACs have a named case; the new function only ever flags
      ≥2-distinct-storyId exact-path collisions; the pre-existing cross-epic suite passes unchanged,
      demonstrating one detector, not two.
  - id: story-028-002
    title: Serialize same-file stories with linear ordering and recorded reason
    description: >-
      At finalize-time dependency derivation, when the within-epic detector flags two or more
      stories editing the same file, add hard dependency edges forming a single linear chain (total
      order) so they integrate sequentially. Record a machine-readable reason that each edge was
      added for same-file-conflict avoidance.
    acceptance_criteria:
      - >-
        When two or more stories share a file, dependency edges are added so no two of those stories
        remain unordered relative to each other.
      - For N>2 stories sharing a file, the added edges form a single linear chain (total order).
      - >-
        Serialization only adds dependency edges; no story content is deleted, merged, or otherwise
        modified.
      - >-
        Each added dependency carries a machine-readable reason indicating same-file-conflict
        avoidance, inspectable by the operator.
      - >-
        Stories that touch different files retain their existing parallel ordering; no edge is added
        on non-overlapping work.
    estimated_complexity: medium
    dependencies:
      - story-028-001
    tech_notes: >-
      Add a new pure (no-I/O) module `packages/loom-core/src/orchestrator/SerializeOverlaps.ts`
      exporting `deriveSameFileSerialization(stories, overlaps): SerializationEdge[]`, plus the
      integration hook `applySameFileSerialization(epics, projectRoot, audit)` in
      `packages/loom-core/src/planner/Planner.ts` (called in `persistPlanResult`, after Task C/QA,
      before YAML write). Keep `dependencies: string[]` unchanged and order each overlap's stories
      by one global key — the existing topo index tie-broken by story id (ADR-003) — chaining each
      to the previous so the union of all per-file chains is provably acyclic. Record provenance two
      ways per ADR-002: add the optional `dependency_reasons` field to `StorySchema` in `types.ts`
      (zod `.optional()`) and `schemas/epic.schema.yaml`, and write one `AuditLog.record()` row per
      shared file with `action: 'plan_serialize_same_file'`. The trade-off: the chain serializes the
      whole same-file group even if members touch disjoint regions — that's the intended
      file-granularity guarantee, not a bug.
    test_plan: >-
      Levels: **unit** for the pure derivation `deriveSameFileSerialization(stories, overlaps):
      SerializationEdge[]`; **integration** for `applySameFileSerialization(epics, projectRoot,
      audit)` covering edge mutation, `dependency_reasons`, audit rows, and schema validation. Keep
      both deterministic — no wall-clock, stub `AuditLog`.


      Unit cases (`deriveSameFileSerialization`):

      - Happy two-story overlap → exactly one edge, directed later→earlier under the global ordering
      key (topo index tie-broken by story id), carrying `path` and
      `reason:'same-file-conflict-avoidance'` (AC-1, AC-4).

      - N>2 sharing one file → a single linear chain (n-1 edges, total order), no
      redundant/transitive-extra edges (AC-2).

      - Determinism: re-running on identical input yields byte-identical edges (ADR-003 — re-plan
      reproducibility).

      - Pre-existing edge: if a story already depends on its predecessor, no duplicate edge is
      emitted (idempotent).

      - One story in two different same-file groups → chains compose, union is **acyclic** (assert
      no cycle — the ADR-003/Safety-model integrity guard).

      - No overlaps → zero edges (AC-5 basis).


      Integration cases (`applySameFileSerialization`):

      - Edges land in `story.dependencies` (still `string[]`) and a matching `dependency_reasons`
      entry (`depends_on`, `reason`, `path`) is added (AC-4, ADR-002).

      - Additive-only (AC-3): every other story field (title, description, acceptance_criteria,
      tech_notes) is byte-identical before/after — assert deep-equal except
      `dependencies`/`dependency_reasons`; nothing deleted or merged (FR-5).

      - Non-overlapping stories: `dependencies` untouched, no edge added (AC-5, Goal 3).

      - Audit: exactly one `AuditLog.record()` per shared file with
      `action:'plan_serialize_same_file'`, detail containing `path`, the `chain`, and `added_edges`
      (FR-6).

      - Quiet skip: no contract / no overlaps → no edges, no audit rows, no throw (ADR-004 degrade
      path).

      - Backward compat (NFR-2): `StorySchema` (zod) validates a story both with and without
      `dependency_reasons`; an existing plan lacking the field still parses. Round-trip a story YAML
      against `schemas/epic.schema.yaml` with the new optional field present.


      Verification bar: after apply, no two same-file stories are mutually unordered; N>2 groups
      form a total order; the graph is acyclic; story content is provably unmodified; every derived
      edge has both a `dependency_reasons` entry and an audit row; different-file work keeps its
      parallel ordering; existing plans still validate.
  - id: story-028-003
    title: Guide planning personas toward cohesive single-file stories
    description: >-
      Update the story-breakdown persona and the shared-contract persona to prefer fewer, cohesive
      stories split along independently-developable file/module boundaries, and to emit
      single-file-concentrated or tightly-coupled-region work as one story.
    acceptance_criteria:
      - >-
        The story-breakdown persona instructs emitting single-file-concentrated (or
        tightly-coupled-region) work as one story along independently-developable boundaries.
      - The shared-contract persona guidance aligns with the same file/module-boundary framing.
      - >-
        Guidance explicitly cautions against collapsing genuinely separable different-file work into
        one oversized story.
    estimated_complexity: small
    dependencies: []
    tech_notes: >-
      Pure prompt edits, no code: add a paragraph to `packages/loom-core/personas/pm.md`
      (story-breakdown / Task B) and `packages/loom-core/personas/architect.md` (shared-contract /
      Task C) instructing that single-file-concentrated or tightly-coupled-region work be emitted as
      ONE story along independently-developable boundaries. Per ADR-006 keep both prompts aligned on
      the same file/module-boundary framing and include the explicit counter-caution against
      collapsing genuinely separable different-file work into one oversized story. The trade-off the
      author should know: this prevention layer is probabilistic and not deterministically
      unit-testable — its success is measured by how rarely the serializer (story-028-002) has to
      fire, not by an assertion.
    test_plan: >-
      This is **prompt-only** work (ADR-006) — its real effect (the LLM emitting cohesive
      single-file stories) is probabilistic and NOT deterministically unit-testable. Do not fake a
      behavioral assertion over LLM output. Instead add a lightweight **content/regression** test
      plus rely on story-028-004 as the empirical signal.


      Key cases (static content checks on the persona markdown):

      - `packages/loom-core/personas/pm.md` (Task B / story-breakdown) contains guidance to emit
      single-file-concentrated or tightly-coupled-region work as ONE story along
      independently-developable boundaries (AC-1).

      - `packages/loom-core/personas/architect.md` (Task C / shared-contract) contains guidance
      aligned to the same file/module-boundary framing (AC-2).

      - Both files contain the explicit counter-caution against collapsing genuinely separable
      different-file work into one oversized story (AC-3).

      - Add a small grep/markdown-presence test asserting the key phrases exist in both files, so
      the guidance can't be silently dropped in a later refactor (regression guard only — it asserts
      presence, not effectiveness).


      Verification bar: each of the three ACs maps to a present, aligned paragraph in the two
      persona files, with the counter-caution in both. State plainly that the *effectiveness* of
      this layer is measured downstream by how rarely the serializer (story-028-002) fires on
      representative briefs — not by an assertion in this story.
  - id: story-028-004
    title: Verification fixture proving no unordered same-file stories
    description: >-
      Add a representative fixture brief whose work concentrates in one file (e.g., several changes
      to one dashboard file) and a test asserting the resulting story graph contains no two
      same-file stories that lack an ordering dependency between them.
    acceptance_criteria:
      - A fixture brief concentrating its work in a single file is added.
      - >-
        The test asserts the resulting story graph contains zero pairs of same-file stories without
        an ordering dependency between them.
      - The test passes against the implemented within-epic detection and serialization.
    estimated_complexity: small
    dependencies:
      - story-028-001
      - story-028-002
    tech_notes: >-
      Add a `vitest` fixture + test under `packages/loom-core/src/**/__tests__` (FR-9). Author a
      representative fixture epic whose stories concentrate edits in one file (e.g. several stories
      owning `packages/loom-web/public/dashboard.js`), run it through `computeWithinEpicOverlaps` +
      `deriveSameFileSerialization`, and assert the `noUnorderedSameFilePairs(stories, ownership)`
      property — for every same-file story pair, one is transitively reachable from the other in the
      dependency DAG. Also assert the resulting graph is cycle-free (the integrity guard from the
      Safety model). Depends on the real detector and serializer being in place; one trade-off:
      drive it through the actual exported functions, not a re-implementation, so the test guards
      the shipped code path rather than a copy.
    test_plan: >-
      Level: **integration fixture** in `vitest` under `packages/loom-core/src/**/__tests__` — it
      must drive the REAL exported functions end to end, never a re-implementation, so the test
      guards the shipped code path (FR-9).


      Key cases (checklist):

      - Add a representative fixture epic whose stories concentrate edits in one file (e.g. several
      stories owning `packages/loom-web/public/dashboard.js`) (AC-1).

      - Run the fixture's ownership map through the actual `computeWithinEpicOverlaps` then
      `deriveSameFileSerialization`/apply, then assert `noUnorderedSameFilePairs(stories,
      ownership)` is true — for every same-file pair, one story is transitively reachable from the
      other in the dependency DAG (AC-2, Goal 1).

      - Assert the resulting dependency graph is **cycle-free** (the integrity guard from the Safety
      model).

      - Teeth / negative control: assert the same property is FALSE on the pre-serialization graph
      (un-ordered same-file pairs exist before edges are added), proving the test isn't vacuously
      passing.

      - Confirm the assertion runs against the implemented detector + serializer, not a copy (AC-3).


      Verification bar: the fixture exists and, run through the shipped functions, yields a story
      graph with zero unordered same-file pairs and no cycles; the negative control demonstrates the
      property would fail on an un-serialized graph.
