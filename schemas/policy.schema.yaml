# Loom Policy YAML Schema
# Written to .loom/policy.yaml on loom init
# All fields have safe defaults — projects override only what they need.

$schema: "http://json-schema.org/draft-07/schema#"
type: object
properties:
  git:
    type: object
    properties:
      allowed_remotes:
        type: array
        items:
          type: string
        default: []
        description: |
          Glob patterns for allowed git remote URLs.
          Empty list = all pushes blocked by default.
          Example: ["git@github.com:myorg/*", "https://github.com/myorg/*"]
      protected_branches:
        type: array
        items:
          type: string
        default: [main, master]
        description: "Branches agents cannot push to directly (must use PR)"
      forbidden_flags:
        type: array
        items:
          type: string
        default: ["--force", "--force-with-lease", "--hard"]
        description: "git flags that are always blocked regardless of other settings"
      agents_must_use_pr:
        type: boolean
        default: true
        description: "If true, agents cannot push directly; must open a PR"

  filesystem:
    type: object
    properties:
      protected_paths:
        type: array
        items:
          type: string
        default:
          - "~/.ssh"
          - "~/.aws"
          - "~/.gnupg"
          - "/etc"
          - "/usr"
          - "/bin"
          - "/sbin"
          - ".git"
        description: "Paths agents cannot write to or delete"
      allowed_write_root:
        type: string
        default: "."
        description: |
          Root directory agents are allowed to write within.
          '.' means the project directory (resolved to absolute path on init).
      allowed_read_root:
        type: string
        default: "."
        description: Root directory agents may read/search within, in addition to their own worktree. '.' = repo root, resolved relative to the worktree at hook time (not on init). On by default; independent of cross_repo.enabled.

  commands:
    type: object
    properties:
      forbidden_programs:
        type: array
        items:
          type: string
        default:
          - curl
          - wget
          - nc
          - ncat
          - netcat
          - socat
          - telnet
          - ftp
          - tftp
          - aria2c
          - lynx
          - w3m
          - links
          - elinks
          - httpie
          - http
          - https
          - scp
          - sftp
          - ssh
          - rsync
        description: |
          Network/egress programs a WORKER may not run (operators are unaffected —
          enforced only in worker sessions, like read-scope). Matched by basename at
          any argv position, so wrappers/paths/pipes (nice curl, xargs curl,
          find … -exec curl, echo x | curl) cannot hide them. Inline-code
          interpreters (python -c, node -e, perl -e, …) are blocked by baked logic,
          not this list — running a repo script (python x.py) stays allowed. Merged
          as a union denylist (ADR-004): a team/repo layer can only ADD programs,
          never remove a default — no layer can weaken egress.

  agents:
    type: object
    properties:
      max_concurrent:
        type: integer
        minimum: 1
        maximum: 10
        default: 5
        description: |
          Max number of story agents running simultaneously for THIS
          supervisor. The machine-wide cap is set via
          `~/.loom/config.json` `max_global_workers`; when unset (the
          common case) loom uses this value as the global fallback so
          parallel `loom run`s on one machine don't collectively run
          N × max_concurrent workers.
      llm_backend:
        type: string
        enum: [claude-cli, cursor-cli]
        default: claude-cli
        description: |
          LLM backend for planning. Both 'claude-cli' and 'cursor-cli' are
          session-based — they use the developer's existing Claude / Cursor
          login (no API key, no API billing). The 'anthropic-api' backend
          was removed in v0.4 to align with the session-only auth policy.
      worker_backend:
        type: string
        enum: [claude-code, cursor-cli]
        default: claude-code
        description: "Which agent CLI implements stories — the claude CLI or cursor-agent"
      model:
        type: string
        default: "claude-sonnet-4-6"
        description: "Claude model used for story execution agents"
      planning_model:
        type: string
        default: "claude-opus-4-7"
        description: "Claude model used for the planning personas — Analyst, PM, Architect (Opus 4.7 by default — planning benefits most from deeper reasoning)"
      cursor_model:
        type: string
        default: "sonnet-4"
        description: "Model id for the cursor-cli backend; loom never uses Cursor MAX mode"
      skill_gen_model:
        type: string
        default: "claude-haiku-4-5-20251001"
        description: "Claude model used for post-story skill generation (cost-optimized)"
      test_command:
        type: string
        description: |
          Explicit command for the integration gate. When unset the gate
          auto-detects (npm test / make test / pytest). loom never auto-installs
          dependencies, so if the suite needs a fresh install encode it here,
          e.g. "npm ci && npm test".
      test_commands:
        type: array
        description: |
          Per-path test commands for polyglot repos. An entry is selected when at
          least one changed file (repo-root-relative path from git diff) matches at
          least one of the entry's glob patterns. Unselected entries produce a
          'skipped' result and do NOT fail the gate. Selected entries run
          sequentially in declaration order with no fail-fast — all run to
          completion even if an earlier entry fails (same semantics as the standard
          gate steps). When the git base commit cannot be resolved, all entries run
          unconditionally. An empty array falls through to auto-detection.
          Ignored when test_command is set (test_command takes precedence).
        items:
          type: object
          required: [name, command, paths]
          properties:
            name:
              type: string
              minLength: 1
              description: "Human label, surfaced in gate output and audit log"
            command:
              type: string
              minLength: 1
              description: "Shell command executed at project root (shell: true)"
            paths:
              type: array
              minItems: 1
              items:
                type: string
                minLength: 1
              description: |
                Non-empty minimatch globs matched against repo-root-relative changed
                paths (e.g. "packages/api/**", "src/**/*.ts"). Evaluated with
                minimatch default options: dot=false (dotfiles not matched by **/*)
                and nocase=false (case-sensitive). Paths are relative to the repo
                root, not the worktree.
      # NOTE: integration_gate_timeout_minutes was removed from the public
      # surface in v0.4 (engine-tuning knob, no operator calibration data);
      # it's hardcoded internally. Set test_command if you need to bound the
      # command — anything taking >15 min should be wrapped in a `timeout` call.
      smoke_command:
        type: string
        description: |
          Explicit smoke command run on the integrated tree after the
          EpicFinalizer merges all story branches and before opening the PR.
          When unset the gate auto-detects from package.json scripts.smoke or
          scripts.verify. Omit to rely on auto-detection.
      adversarial_review_model:
        type: string
        description: >
          Optional model ID for the adversarial review pass run by loom finalize.
          When absent or empty, no second pass runs. Example: claude-opus-4-8
      integrator_max_attempts:
        type: integer
        default: 2
        x-internal: true
        description: |
          Bounded integrator attempt cap. Removed from the operator surface in
          v0.4 (engine-tuning knob, no operator calibration data); hardcoded
          internally at 2. Declared here with x-internal: true so the schema
          documents the field exists without advertising it as a policy knob.

  mcp:
    type: object
    properties:
      registry:
        type: string
        description: |
          Path to a checkout of the org's approved-MCP registry (a directory of
          servers/<name>/server.json files). Unset = `loom mcp` is disabled.

  cross_repo:
    type: object
    properties:
      secret_globs:
        type: array
        items:
          type: string
        default:
          - '**/.env'
          - '**/.env.*'
          - '**/*.pem'
          - '**/*.key'
          - '**/id_rsa*'
          - '**/secrets/**'
          - '**/*.tfstate'
        description: |
          Glob patterns for paths excluded from BOTH search results and reads (FR-7).
          Security denylist — union-merged across layers so no layer can remove an
          entry contributed by a lower layer (ADR-004).
