# Loom Epic YAML Schema
# Validated at runtime by zod (see packages/loom-core/src/types.ts)
# This file is the human-readable reference; zod is the source of truth.

$schema: "http://json-schema.org/draft-07/schema#"
type: object
required: [epic_id, title, status, priority, prd_ref, requirements, stories]
properties:
  epic_id:
    type: string
    pattern: "^epic-\\d{3}$"
    description: "Unique identifier, e.g. epic-001"
  title:
    type: string
    minLength: 5
    maxLength: 100
  status:
    type: string
    enum: [planned, approved, in_progress, done, rejected]
    default: planned
    description: "Plan-time status; DB epics table is source of truth for runtime status"
  priority:
    type: string
    enum: [must-have, should-have, nice-to-have]
  prd_ref:
    type: string
    description: "Relative path to the PRD file"
  requirements:
    type: array
    items:
      type: string
    description: "FR-* or NFR-* IDs from the PRD"
  stories:
    type: array
    minItems: 1
    items:
      $ref: "#/definitions/story"

definitions:
  story:
    type: object
    required: [id, title, description, acceptance_criteria, estimated_complexity, dependencies]
    properties:
      id:
        type: string
        pattern: "^story-\\d{3}-\\d{3}$"
        description: "e.g. story-001-001 (epic-story)"
      title:
        type: string
        minLength: 5
        maxLength: 100
      description:
        type: string
      acceptance_criteria:
        type: array
        items:
          type: string
        minItems: 1
      estimated_complexity:
        type: string
        enum: [trivial, small, medium, large]
      repo:
        type: string
        description: "Optional registered manifest slug for the target repo; absent → resolves to the epic's primary repo"
      dependencies:
        type: array
        items:
          type: string
        description: "story IDs this story depends on"
      tech_notes:
        type: string
        description: "Architect-added technical guidance for the developer agent"
      test_plan:
        type: string
        description: "QA-added (Tessa) risk-based test plan for the developer agent; present only when policy.agents.qa_planning='advisory'"
      dependency_reasons:
        type: array
        description: "machine-readable provenance for derived dependency edges"
        items:
          type: object
          required: [depends_on, reason]
          properties:
            depends_on: { type: string }
            reason: { type: string, enum: ["same-file-conflict-avoidance"] }
            path: { type: string }
      provides:
        type: object
        description: "Key→value map of outputs this story promises to downstream stories that declare a matching requires entry. Values are any JSON-serialisable type."
        additionalProperties: true
      requires:
        type: object
        description: "Key→story-id map. Each entry declares that this story needs a specific output (keyed by name) produced by the identified upstream story."
        additionalProperties:
          type: string
      estimated_effort:
        type: integer
        minimum: 0
        description: "Estimated implementation effort in whole minutes (≥ 0). Used by the orchestrator to compute the critical path. Absent = unknown."
