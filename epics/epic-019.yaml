# Generated by loom planning — Epic 19 (Repo-specific learning review skills)
# Validated against schemas/epic.schema.yaml
epic_id: epic-019
title: "Repo-specific learning review skills — the reviewer that gets better"
status: planned
priority: nice-to-have
prd_ref: ".loom/planning/prd.md"
requirements:
  - "FR-5 (self-learning skills)"
  - "FR-6 (quality gating)"

# Context
# -------
# Epic 18 ships a static automated review pass. This epic closes the loop:
# the reviewer LEARNS from what human reviewers actually act on. Findings the
# human accepts (merge-with-no-revert / explicit thumbs-up) reinforce the
# patterns; findings the human dismisses (closed without change / commented
# 'not relevant') become anti-patterns. The skill lifecycle (Epic 7) already
# has candidate → active → disabled — this epic feeds it new signal.
#
# Repo-specific because review priorities legitimately differ — a backend
# service repo cares about different things than a frontend repo or an infra
# repo. The generated skill name is `code-review-<repo-slug>`.

stories:
  - id: story-019-001
    title: "Human PR-review outcome capture"
    description: |
      Capture the signal we need to learn from: for each PR loom opens, what
      did the human reviewer actually do? Merged as-is? Requested changes?
      Closed without merging? Which review-bot findings did they accept vs.
      dismiss?
    acceptance_criteria:
      - A new audit-log action 'pr_outcome' is recorded when loom sees a PR's
        terminal state (merged / closed / superseded)
      - For each loom-review finding attached to a PR (Epic 18), record
        whether the human acted on it: 'accepted' (file fixed before merge),
        'dismissed' (merged without the fix), 'untracked' (cannot tell)
      - A polling job (gh api or webhook later) updates these per repo
    estimated_complexity: large
    dependencies: []
    tech_notes: |
      Polling: loom can poll `gh pr view` for each open PR it opened, on a
      schedule. Match the review's findings against the merged diff to
      determine which were 'accepted'. Cost: a few gh API calls per PR per
      polling window. Webhooks are better long-term but require infra.

  - id: story-019-002
    title: "Per-repo review-skill generation from accepted patterns"
    description: |
      Extend the SkillGenerator to produce `code-review-<repo-slug>` skills
      from the outcome history. After M accepted findings of the same shape,
      generate a candidate skill that captures the pattern; the skill body
      tells the reviewer to look for X in this repo.
    acceptance_criteria:
      - SkillGenerator detects clustered accepted-finding patterns from the
        pr_outcome audit history
      - It produces a candidate skill at ~/.loom/skills/generated/code-review-<repo>/
      - The skill carries `metadata.repo: <repo-slug>` so it only auto-injects
        when loom is running in that repo
      - The skill judge gates it the same way Epic 7 gates other generated skills
    estimated_complexity: large
    dependencies:
      - story-019-001

  - id: story-019-003
    title: "Lifecycle from PR outcomes"
    description: |
      The existing skill lifecycle promotes / demotes based on injection +
      success counters. Extend it: for a generated review skill, a 'success'
      = its finding was 'accepted' on a real PR; a 'failure' = its finding
      was 'dismissed'. Promote / demote accordingly.
    acceptance_criteria:
      - SkillUsageStore records review-finding outcomes per skill
      - SkillLifecycle.evaluate uses outcome counters (not just injection
        counters) for generated review skills
      - A demoted review skill is no longer auto-injected; the user can
        promote it manually via `loom skills promote`
    estimated_complexity: medium
    dependencies:
      - story-019-002

  - id: story-019-004
    title: "Visibility and trust controls"
    description: |
      Operators need to see what the reviewer learned and to override it. A
      `loom skills review-history` command shows per-finding accepted /
      dismissed counters per skill; the user can blacklist a pattern or
      restore a dismissed one.
    acceptance_criteria:
      - `loom skills review-history` prints per-skill accepted / dismissed
        counters + the pattern body
      - The user can pin a generated review skill to 'active' against the
        lifecycle's wishes (manual override)
      - The pi dashboard surfaces a small badge when a generated review
        skill demoted itself recently
    estimated_complexity: medium
    dependencies:
      - story-019-003
