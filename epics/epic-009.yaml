# Generated by loom planning — Epic 9 added post-MVP (Shared Skill Corpus)
# Validated against schemas/epic.schema.yaml
epic_id: epic-009
title: "Shared skill corpus — an org-maintained loom-skills repo"
status: approved
priority: nice-to-have
prd_ref: ".loom/planning/prd.md"
requirements:
  - "FR-8 (skill system)"

# Context
# -------
# Today loom's learning is per-machine: a skill one engineer's loom generates
# never reaches another. Epic 9 turns 120 isolated learners into one compounding
# org brain — a shared `loom-skills` repo that every engineer's loom reads
# from and contributes to. The contribution is automated (loom opens PRs), but
# the MERGE referee is the eval suite, not loom reviewing itself.
#
# Depends on: Epic 7 (the eval harness is the merge gate) and the Epic 8 pattern
# (a repo the org points policy at). Sibling of Epic 8 — MCP provisioning vs.
# skill provisioning.
#
# Staged trust: read + propose first; eval-gated auto-merge is the end state.

stories:
  - id: story-009-001
    title: "Consume a shared skill repo — read the org corpus"
    description: |
      loom reads skills from an org-shared repo in addition to project and
      global skills. Every engineer's loom picks up the org corpus.
    acceptance_criteria:
      - policy.skills.shared points at a shared skill repo checkout (a local path); unset = feature off
      - SkillStore discovers skills from the shared repo with a 'shared' source
      - Shared skills participate in selection like project skills (always eligible)
      - A stale or missing shared checkout degrades gracefully (loom still runs on local skills)
    estimated_complexity: medium
    dependencies: []
    tech_notes: |
      Extend SkillStore with a third root (the shared repo path from policy).
      Add a 'shared' SkillSource. Mirrors Epic 8's policy.mcp.registry pattern —
      the repo is a checkout the org maintains, no auth baked into loom.
      NOTE (repo audit): the shared source need not be a bespoke loom-skills
      repo. Existing agentskills.io-format skill repos — e.g. an org's shared
      skills repo, or a team's .cursor/skills/ — already use SKILL.md frontmatter loom can
      read as-is; their manifest.yaml sidecars are harmlessly ignored. Epic 9
      should treat any such repo as a valid shared skill source.

  - id: story-009-002
    title: "Propose skills via PR — loom contributes to the shared repo"
    description: |
      When loom promotes a generated skill to 'active' (Epic 7 lifecycle), it
      opens a PR to the shared loom-skills repo adding or updating that skill,
      with its track record and eval evidence in the PR body. A human still
      merges — this is the 'propose' trust level.
    acceptance_criteria:
      - On promotion to 'active', loom opens a PR to the shared repo for that skill
      - The PR body includes the skill's track record (injections, successes, failures)
      - The PR targets the shared repo only if it is in policy.git.allowed_remotes (PR-only, never direct push)
      - Updating an existing shared skill produces a diff PR, not a duplicate
      - If PR creation fails, the skill still works locally — contribution is best-effort
    estimated_complexity: large
    dependencies:
      - story-009-001
    tech_notes: |
      Reuse the worker's gh-based PR path. A skill PR is a tiny commit to the
      shared repo. Cross-machine provenance aggregation (skill_usage is per-machine
      SQLite today) is the open data-model question — for V1, carry the track
      record in the PR body / skill frontmatter rather than a shared stats store.

  - id: story-009-003
    title: "Eval-gated merge — the eval suite is the merge referee"
    description: |
      A CI check for the shared loom-skills repo: a skill PR may merge only if
      `loom eval` holds or improves with the proposed skill included. This makes
      "maintained by loom" mean "maintained by the eval harness" — an objective
      referee, not loom reviewing its own work.
    acceptance_criteria:
      - A `loom eval --skill-pr <ref>` mode runs the eval suite with the PR's skill applied
      - The check fails the PR if the eval score regresses versus the baseline
      - The CI integration (a workflow file for the shared repo) is documented
      - Autonomous merge stays opt-in (policy flag) — default is human-merge
    estimated_complexity: large
    dependencies:
      - story-009-002
    tech_notes: |
      Extends the Epic 7 EvalRunner with a mode that applies a candidate skill
      and compares the score to the stored baseline. The shared repo gets a CI
      workflow that runs it. Autonomous merge is gated behind a policy flag —
      the org earns that trust level once the eval-as-referee is proven.
