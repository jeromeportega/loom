# Generated by loom planning — Epic 17 (PR strategy & branch consolidation)
# Validated against schemas/epic.schema.yaml
epic_id: epic-017
title: "PR strategy — one epic PR by default instead of N story PRs"
status: planned
priority: should-have
prd_ref: ".loom/planning/prd.md"
requirements:
  - "FR-7 (status tracking) — review surfaces"
  - "NFR-3 (operator experience)"

# Context
# -------
# A loom epic with N stories produces N branches and N PRs today. In a real
# source-control UI (VS Code, Cursor, GitHub's PR list) that creates noise —
# the operator wants to review the work of an epic, not chase N independent
# PRs they have to mentally re-stitch. The fix is to make the *unit of human
# review* match the *unit of loom work*: one PR per epic, with story commits
# preserved on the epic branch.
#
# Single-story epics already produce one PR; this epic targets multi-story
# epics. The strategy is configurable, defaults to per-epic for new repos.

stories:
  - id: story-017-001
    title: "policy.agents.pr_strategy + worker honors it"
    description: |
      Add a new policy field `pr_strategy` with values 'per-story' | 'per-epic'
      | 'both'. Default to 'per-epic' — that is the new behavior. Workers
      consult the strategy in `maybeOpenPr`: in per-epic mode they commit
      locally but do NOT push or open a PR; the EpicFinalizer (story-017-002)
      opens one PR at the end of the epic.
    acceptance_criteria:
      - policy.agents.pr_strategy is recognized; defaults to 'per-epic'
      - In 'per-story' mode, behavior matches today (PR per worker)
      - In 'per-epic' mode, workers commit on their story branch and do not
        push or open per-story PRs; the story branch stays local
      - In 'both' mode, workers open per-story PRs AND the finalizer also
        opens an epic PR (use this for transition / paranoid review)
      - The schema doc, the init template, and the README are updated
    estimated_complexity: small
    dependencies: []
    tech_notes: |
      Add `pr_strategy: z.enum(['per-story', 'per-epic', 'both']).default('per-epic')`
      to PolicySchema. Thread it from run.ts and the MCP approve_plan handler
      through createWorker() into BaseCliWorker's options. maybeOpenPr() reads
      it and early-returns when the strategy is 'per-epic'.

  - id: story-017-002
    title: "EpicFinalizer: merge story branches and open one PR per epic"
    description: |
      After a Supervisor run finishes an epic successfully and the strategy is
      'per-epic' or 'both', a finalize step creates `epic/<epic-id>` from the
      epic's base SHA, merges each successful story branch in dependency
      order, pushes the epic branch, and opens one PR with a description that
      lists each story's commits.
    acceptance_criteria:
      - The supervisor captures the epic's base SHA on first dispatch and
        persists it (schema v8 — epics.base_sha)
      - After the dispatch loop, for each epic that transitioned to 'done'
        and has pr_strategy != 'per-story', the finalizer runs
      - The finalizer creates `epic/<epic-id>` from base_sha, merges every
        succeeded story branch in dependency order, pushes the epic branch,
        and runs `gh pr create` once for the epic
      - The PR body lists each story's id + title + commit count
      - On merge conflict between two story branches, the conflicting story
        falls back to its own PR with an audit-log note; the epic PR is
        still opened with the non-conflicting stories
      - On any failure (push denied, gh missing) the audit log records it
        and the user can re-run; the epic data is intact
    estimated_complexity: large
    dependencies:
      - story-017-001
    tech_notes: |
      New module packages/loom-core/src/orchestrator/EpicFinalizer.ts.
      Schema v8 adds epics.base_sha; Supervisor.dispatch records it on the
      epic record the first time it dispatches a story for that epic.
      Reuse the git push + gh pr create code from BaseCliWorker — extract
      to packages/loom-core/src/orchestrator/git.ts if it isn't already
      shareable. Dependency-ordered merge: topologically sort the stories
      by their dependencies (the planner already records these); merge
      roots first.

  - id: story-017-003
    title: "Documentation, migration notes, and tests"
    description: |
      Update README's "How it works" + command reference to explain the
      strategy choice and the default. Update docs/known-limitations.md with
      the merge-conflict fallback behavior. Add tests for both strategies
      and the conflict fallback.
    acceptance_criteria:
      - README mentions pr_strategy and its default
      - known-limitations notes the conflict fallback semantics
      - Supervisor test covers: per-story (legacy behavior), per-epic happy
        path (one PR), per-epic with a forced merge conflict (fallback)
      - All tests pass; no regression in existing 293
    estimated_complexity: small
    dependencies:
      - story-017-002
