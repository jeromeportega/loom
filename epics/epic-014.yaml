# Generated by loom planning — Epic 14 (pi.dev UI surface)
# Validated against schemas/epic.schema.yaml
epic_id: epic-014
title: "pi.dev UI surface — a multi-agent management plugin"
status: approved
priority: should-have
prd_ref: ".loom/planning/prd.md"
requirements:
  - "FR-7 (status tracking)"
  - "NFR-4 (observability)"

# Context
# -------
# loom's interfaces today are the CLI and the MCP server. The richest surface
# for watching and steering many agents is a real UI — and pi.dev's extension
# API + pi-tui give us that without building a UI framework. loom-pi is a
# pi.dev plugin: pi renders the multi-agent management UI/UX, loom orchestrates.
# This is the intended pi leverage point (it was in the architecture but never
# epic'd). pi as the front-end is preferred over driving loom purely via MCP.

stories:
  - id: story-014-001
    title: "loom-pi extension scaffold"
    description: |
      A new packages/loom-pi package — a pi.dev extension that registers loom
      slash commands and connects to a loom project (its SQLite state and the
      loom-mcp server).
    acceptance_criteria:
      - packages/loom-pi is a pi.dev extension loadable by pi
      - It exposes loom slash commands in pi (epic, status, approve, run, stop)
      - It connects to a loom project's state (read-only) and the loom MCP server
      - It degrades gracefully when run outside a loom-initialized repo
    estimated_complexity: large
    dependencies: []
    tech_notes: |
      Follow the pi.dev extension API (TypeScript, dynamic load, lifecycle
      events, slash commands). The extension wraps loom-mcp tool calls and
      reads .loom/loom.db for status. Confirm the current pi extension contract.

  - id: story-014-002
    title: "Multi-agent management dashboard panel"
    description: |
      A live pi-tui panel showing every epic, story, and agent — status, PR
      links, elapsed time — with inline controls to approve, run (with
      checkpoints), and stop. The steering surface for a developer overseeing
      many agents.
    acceptance_criteria:
      - The panel renders the epic/story/agent status tree and refreshes live
      - It surfaces loom stop and the checkpoint modes as inline actions
      - It shows skill lifecycle activity (promotions/demotions) from a run
      - With Epic 11's registry, it can show more than one product at once
      - The panel is read-correct even while a supervisor run is in progress
    estimated_complexity: large
    dependencies:
      - story-014-001
    tech_notes: |
      Use pi-tui for rendering. Poll loom_get_status (and, with Epic 11,
      cross-product status). Controls map to loom_approve_plan / a run trigger /
      the control signal. Keep loom-core UI-agnostic — all UI lives in loom-pi.
