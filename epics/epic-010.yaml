# Generated by loom planning — Epic 10 added post-MVP (Onboarding & Control)
# Validated against schemas/epic.schema.yaml
epic_id: epic-010
title: "Onboarding & Control — frictionless setup and agent steering"
status: approved
priority: must-have
prd_ref: ".loom/planning/prd.md"
requirements:
  - "NFR-3 (portability)"
  - "NFR-2 (safety — the user must be able to stop the system)"

# Context
# -------
# loom has the full autonomous pipeline but a rough day-one experience and no
# way to halt or steer a run. An autonomous system you cannot stop is both
# unsafe and stressful to use — control belongs alongside the guardrails in the
# trust story. Epic 10 makes setup frictionless and gives the developer the
# brakes. Sequenced before Epic 9.
#
# Checkpoints form a trust ladder: --checkpoint=story (most cautious) ->
# --checkpoint=epic -> no flag (complete everything). That ladder is the seed
# of a future policy.agents.autonomy config.

stories:
  - id: story-010-001
    title: "loom doctor — a prerequisite-checking onboarding command"
    description: |
      A `loom doctor` command that checks the light prerequisites and reports
      exactly what is missing, so a new developer can get to a working setup in
      one command.
    acceptance_criteria:
      - loom doctor checks Node >= 20, git, the claude CLI, and gh
      - Each check reports ok / missing with a one-line fix hint
      - It reports whether the current directory is loom-initialized
      - It exits non-zero if a required prerequisite (Node, git) is missing
      - claude CLI / gh are reported as warnings (needed for real runs, not for init)
    estimated_complexity: small
    dependencies: []
    tech_notes: |
      A new packages/loom-cli/src/commands/doctor.ts. Check binaries by
      spawning `--version`. Node version from process.versions.node.

  - id: story-010-002
    title: "Developer README and npm publish preparation"
    description: |
      A clear, developer-facing README and the package metadata so
      `npm install -g loom-ai` works. The README leads with how the developer
      stays in control, then a sharp first-10-minutes path, then reference.
    acceptance_criteria:
      - README.md covers install, prerequisites, and the init -> epic -> approve -> run flow
      - The README has a distinct "first 10 minutes" path separate from full reference
      - A section covers `loom mcp` (adding org MCP servers)
      - A section covers the control commands (stop, checkpoints)
      - loom-ai package.json has the metadata for `npm install -g` (bin, files, description, repository)
      - A short release/versioning note documents how to publish
    estimated_complexity: medium
    dependencies:
      - story-010-001
    tech_notes: |
      README.md at the repo root. Lead with control/guardrails per the UX
      review. loom-ai package.json: confirm bin, files, add description +
      repository + keywords. Document `npm publish` from packages/loom-cli.

  - id: story-010-003
    title: "loom stop — graceful halt of a running supervisor"
    description: |
      A `loom stop` command that signals a running supervisor to stop
      gracefully: finish in-flight stories, dispatch no more, exit. The run is
      resumable — `loom run` continues it (completed stories are skipped).
    acceptance_criteria:
      - A control signal (a DB row) is checked by the supervisor before each dispatch
      - loom stop sets the signal; the supervisor drains in-flight work and exits
      - A fresh loom run resets the signal to 'running'
      - loom run prints how to stop ("stop anytime with `loom stop`")
      - After a stop, loom run resumes — already-completed stories are not redone
    estimated_complexity: medium
    dependencies: []
    tech_notes: |
      A loom_control table (schema v5) with a single state row
      (running | stopping). Supervisor.dispatchLoop checks it before filling the
      pool. loom stop is a tiny command that writes the row. Graceful only —
      hard-kill of in-flight workers is a documented follow-up.

  - id: story-010-004
    title: "Checkpoints — pause between stories or between epics"
    description: |
      `loom run --checkpoint <story|epic>` runs and then stops cleanly at the
      next boundary — after one story, or after one epic — so a developer can
      review and adjust the plan before continuing. `loom run` with no flag
      completes everything. The run is resumable at every boundary.
    acceptance_criteria:
      - loom run --checkpoint story stops cleanly after the next story completes
      - loom run --checkpoint epic stops cleanly after the next epic's stories complete
      - loom run with no checkpoint flag completes all approved epics
      - At a checkpoint the command prints what completed and how to continue
      - Continuing is just `loom run` again (resumable — completed stories skipped)
      - A checkpoint never abandons in-flight work — it stops at a boundary, not mid-story
    estimated_complexity: medium
    dependencies:
      - story-010-003
    tech_notes: |
      The supervisor takes a checkpoint mode. After completing a story (story
      mode) or after an epic's stories all reach terminal status (epic mode), it
      stops dispatching and returns. Leverages the existing resumability — no
      long-lived blocking. The trust ladder (story -> epic -> none) is the seed
      of a future policy.agents.autonomy setting.
