# Generated by loom planning — Epic 11 (Multi-Product Orchestration)
# Validated against schemas/epic.schema.yaml
epic_id: epic-011
title: "Multi-product orchestration — work across many repos at once"
status: approved
priority: should-have
prd_ref: ".loom/planning/prd.md"
requirements:
  - "NFR-1 (performance / throughput)"
  - "NFR-4 (observability)"

# Context
# -------
# loom is per-repo: each repo has its own .loom/ and runs independently, so
# multiple products already run in parallel as independent loom instances. Two
# gaps remain for a developer driving loom across many repos: there is no
# single view of what every product's agents are doing, and nothing caps the
# total worker concurrency a machine spawns across all products — the real
# ceiling is the shared Claude session's rate limits.

stories:
  - id: story-011-001
    title: "Global project registry and cross-product status"
    description: |
      A machine-level registry of loom-initialized repos, and a status view
      that aggregates across them — one pane of glass for a developer running
      loom on several products.
    acceptance_criteria:
      - loom init records the repo in a machine-level registry (~/.loom/projects.json)
      - loom status --all aggregates epic/agent status across every registered project
      - A registered project whose directory no longer exists is pruned, not fatal
      - The per-repo loom status is unchanged when --all is not passed
    estimated_complexity: medium
    dependencies: []
    tech_notes: |
      A ProjectRegistry in loom-core reading/writing ~/.loom/projects.json.
      loom init appends the absolute repo path. `loom status --all` opens each
      project's .loom/loom.db read-only and merges the status trees.

  - id: story-011-002
    title: "Machine-level concurrency limit across all loom runs"
    description: |
      A global cap on how many worker agents run concurrently across every
      loom instance on the machine, so N products do not collectively exhaust
      the developer's Claude session rate limits.
    acceptance_criteria:
      - policy (or a machine-level config) sets a global max concurrent workers
      - Each supervisor acquires a slot from a shared, machine-level limiter before dispatch
      - The sum of in-flight workers across all loom runs never exceeds the global cap
      - A crashed run does not permanently leak its slots (slots are reclaimed)
    estimated_complexity: large
    dependencies:
      - story-011-001
    tech_notes: |
      A file-lock or SQLite-backed semaphore under ~/.loom/. The supervisor
      acquires a slot before dispatch and releases it on completion. Reclaim
      stale slots by recording a holder pid/heartbeat and pruning dead holders.
