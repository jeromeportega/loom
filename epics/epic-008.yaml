# Generated by loom planning — Epic 8 added post-MVP (Org MCP Provisioning)
# Validated against schemas/epic.schema.yaml
epic_id: epic-008
title: "Org MCP provisioning — connect loom to an approved MCP registry"
status: approved
priority: should-have
prd_ref: ".loom/planning/prd.md"
requirements:
  - "FR-9 (MCP / IDE integration)"

# Context
# -------
# Orgs maintain a curated allowlist of approved MCP servers (e.g. an
# `awesome/mcp`-style registry — ~43 servers, each a machine-readable server.json
# with transport + declared secret env vars). loom worker agents are `claude`
# CLI sessions that already read `.mcp.json`, so provisioning approved MCPs into
# `.mcp.json` makes every worker as context-rich as a human dev — with zero
# worker-path code. loom must stay open-source-generic (the registry is
# configurable, never hardcoded) and must NEVER store credentials.

stories:
  - id: story-008-001
    title: "MCP registry reader — parse server.json from a configurable source"
    description: |
      Read approved MCP server definitions from a registry source configured in
      policy (a local path to a registry checkout). Parse the agentskills-style
      server.json schema: name, description, packages[] with transport
      (stdio | streamable-http) and declared environment_variables / headers.
    acceptance_criteria:
      - policy.mcp.registry points at a registry source (a local directory path); unset = feature off
      - McpRegistry.list() returns parsed server definitions from servers/*/server.json
      - Each definition exposes name, description, transport type, and the declared secret env vars/headers
      - A malformed server.json is skipped with a warning, not a crash
      - loom stays generic — no org-internal URL or registry is hardcoded
    estimated_complexity: medium
    dependencies: []
    tech_notes: |
      Add an McpRegistry module in packages/loom-core/src/mcp/. Parse server.json
      with the zod pattern used elsewhere. Add policy.mcp.registry to PolicySchema.
      Registry source is a local path (a checkout of the org's registry repo) —
      no auth needed, keeps loom generic.

  - id: story-008-002
    title: "loom mcp list / add — provision approved MCPs into .mcp.json"
    description: |
      A `loom mcp` command group. `loom mcp list` shows the approved servers.
      `loom mcp add <name>` writes that server's entry into .mcp.json (and
      .cursor/mcp.json), and prints exactly which secret env vars the user must
      set themselves. loom NEVER stores or prompts-and-persists a secret.
    acceptance_criteria:
      - loom mcp list prints the approved servers from the configured registry
      - loom mcp add <name> merges the server into .mcp.json via the existing upsert helper
      - stdio servers map to {command,args,env}; streamable-http servers map to {url,headers}
      - Required secret env vars are written as references (e.g. ${JIRA_TOKEN}) and listed for the user to set
      - No secret value is ever read, stored, or committed by loom
      - Workers inherit the provisioned .mcp.json with no additional code
      - A caveat is documented: approved-MCP tool calls are not Bash and bypass the policy engine
    estimated_complexity: medium
    dependencies:
      - story-008-001
    tech_notes: |
      Reuse upsertMcpServer from loom-cli's init command (extract it to a shared
      module). The server.json -> .mcp.json adapter is mechanical. Print secret
      env vars from the is_secret declarations; never collect values.
