# Generated by loom planning — Epic 18 (Pre-PR automated code review)
# Validated against schemas/epic.schema.yaml
epic_id: epic-018
title: "Pre-PR automated code review — catch issues before the human"
status: planned
priority: should-have
prd_ref: ".loom/planning/prd.md"
requirements:
  - "FR-6 (quality gating)"
  - "NFR-2 (cost) — fewer human refinement cycles"

# Context
# -------
# Today's flow: worker writes code → commit → open PR → human reviews. The
# human is the first reviewer. That wastes their attention on issues a model
# could catch. This epic inserts an automated review pass between "commits
# made" and "open PR" — running the existing `loom-code-review` skill against
# the diff, classifying findings, optionally re-prompting the worker to fix
# blockers before the PR is opened.
#
# Single-model first. Multi-model (cross-vendor review for blind-spot
# coverage) is deferred until the single-model loop is shipping and we know
# what it catches and misses. Repo-specific learning is Epic 19.

stories:
  - id: story-018-001
    title: "CodeReviewAgent — diff in, classified findings out"
    description: |
      A new agent type in loom-core that takes a story's diff and the
      loom-code-review skill body, produces a structured review:
      { findings: [{ severity: 'blocker'|'should-fix'|'nit', file, line?,
      issue, suggestion? }], summary }.
    acceptance_criteria:
      - A CodeReviewAgent class that calls the LLM with the review skill as
        system + the diff + story context as user, expecting structured JSON
      - Defensive parsing: malformed responses do not crash, are recorded as
        a single 'should-fix' note for the human
      - Tested with MockLLMClient against known diffs
    estimated_complexity: medium
    dependencies: []
    tech_notes: |
      Pattern after ResearchAgent / SkillJudge. Use the planning-tier model
      (Opus 4.7) by default; configurable via policy.agents.review_model.
      Output schema lives in loom-core/src/review/types.ts.

  - id: story-018-002
    title: "Worker integration: review step between commits and PR"
    description: |
      BaseCliWorker.run gains a review step after commits are detected and
      before maybeOpenPr. If review returns blockers, the worker is
      re-prompted with the review attached (up to N revisions, configurable).
      If still failing, the PR is opened with the review attached as a top
      comment so the human is not surprised.
    acceptance_criteria:
      - policy.agents.review_strategy: 'off' | 'comment' | 'block-and-revise'
        (default 'comment' — non-blocking)
      - 'comment' mode: review runs, findings posted as a PR comment when
        the PR opens
      - 'block-and-revise' mode: blockers trigger up to N=2 worker
        re-prompts with the review in context; non-blockers attach to the PR
      - The audit log records every review pass with its findings
    estimated_complexity: large
    dependencies:
      - story-018-001

  - id: story-018-003
    title: "PR description generation — bundled skill + prompt pass"
    description: |
      Generate a robust PR description from the diff, the commit log, and the
      story / epic context — not the hand-rolled markdown today. A bundled
      `loom-pr-description` skill defines the rubric (call out architectural
      decisions, risky spots, testing notes, files to review first, things
      reviewers can skim). A new PrDescriptionAgent runs one LLM call per PR
      with the skill as system prompt + the diff and commits as user input.
      Used by BaseCliWorker.maybeOpenPr (per-story PRs) and EpicFinalizer.finalize
      (per-epic PRs). Falls back to hand-rolled body if the LLM call fails.

      Pairs naturally with the review pass — one call could produce both the
      findings AND the description so reviewers see "what I built, what to
      review, what I already flagged" in one PR.
    acceptance_criteria:
      - Bundled skill at packages/loom-core/skills/loom-pr-description/SKILL.md
      - PrDescriptionAgent in loom-core/src/review/ (shares module with the
        CodeReviewAgent from 018-001)
      - BaseCliWorker.maybeOpenPr uses it when an LLM client is supplied;
        falls back to the existing prBody() if the call fails
      - EpicFinalizer.finalize uses it when an LLM client is supplied; falls
        back to epicPrBody() if the call fails
      - The generated body always carries a "files to review first" section
        and a "risky changes" section when the agent has any to flag
    estimated_complexity: medium
    dependencies:
      - story-018-001
    tech_notes: |
      Same plumbing as the review agent — pass an LLMClient through the
      Supervisor / Finalizer via options. Use the planning-tier model by
      default. Consider co-running with CodeReviewAgent so one diff →
      one LLM call → both outputs (review findings + PR description).

  - id: story-018-004
    title: "loom review CLI + dashboard surfacing"
    description: |
      A standalone `loom review <story-id|branch>` to run the review pass
      on demand against an existing branch or in-progress story (without
      re-running the worker). The pi dashboard's active-worker section
      gains a review-state badge: pending / passed / blocked.
    acceptance_criteria:
      - loom review accepts a story id or a branch name; prints the
        structured findings
      - The pi dashboard shows the review state for each in-flight story
      - The loom_get_status MCP tool response includes the review state per
        story
    estimated_complexity: medium
    dependencies:
      - story-018-002
