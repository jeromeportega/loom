# Generated by loom planning — Epic 7 added post-MVP (Eval & Safety)
# Validated against schemas/epic.schema.yaml
epic_id: epic-007
title: "Eval & Safety: measuring quality and preventing self-degradation"
status: approved
priority: should-have
prd_ref: ".loom/planning/prd.md"
requirements:
  - "NFR-4 (observability)"
  - "FR-8 (skill system — quality gate)"

# Context
# -------
# The original 6 epics built the autonomous pipeline but left two questions open
# (raised by Jerome, recorded in the Epic 5 review):
#   Q2 — how do we evaluate output quality, including self-built skills?
#   Q3 — how do we stop the system degrading itself as it learns?
# These are linked: you cannot prevent drift you cannot measure. Epic 7 builds
# the measurement substrate and the safety loop. The Ruflo audit confirmed loom
# should build this on its own foundation, not adopt a heavyweight framework.

stories:
  - id: story-007-001
    title: "Skill provenance — track where each skill was used and the outcome"
    description: |
      Record, every time SkillSelector injects a skill into a story, the pairing
      of skill and the eventual story outcome. This is the measurement substrate
      for everything else in the epic.
    acceptance_criteria:
      - A skill_usage table records (skill_name, agent_id, story_id, injected_at)
      - When a story reaches a terminal status, its skill_usage rows record the outcome (done/pr_open/failed/blocked)
      - SkillStore exposes trackRecord(skillName) -> { injected, succeeded, failed }
      - The Supervisor records skill_usage rows when it injects skills into an assignment
      - Provenance survives across runs (it is in the SQLite DB, not in memory)
    estimated_complexity: medium
    dependencies: []
    tech_notes: |
      Add a skill_usage table in a schema v3 migration (guarded, like v2's
      story_title). Record injection in Supervisor.dispatch and the outcome in
      applyResult. Add a SkillUsageStore in packages/loom-core/src/state/.

  - id: story-007-002
    title: "Skill lifecycle — candidate/active/disabled with canary injection"
    description: |
      Give generated skills a lifecycle. A newly generated skill starts as
      'candidate'. SkillSelector always injects hand-authored (project/global)
      skills and 'active' generated skills; 'candidate' skills are injected only
      as a CANARY — into spare slots after active skills, bounding blast radius
      while they accumulate a track record. 'disabled' skills are never injected.
      A proven candidate is auto-promoted; an active skill that goes bad is
      auto-demoted. This is the core anti-degradation mechanism.
    acceptance_criteria:
      - Generated skills carry a lifecycle in SKILL.md metadata (candidate|active|disabled); born 'candidate'
      - SkillSelector always includes project/global skills and 'active' generated skills
      - 'candidate' generated skills fill only slots not taken by active skills (canary)
      - 'disabled' skills are never injected
      - A candidate with >= skill_promote_after successes and no failures is auto-promoted to 'active'
      - An active skill with a failure ratio over threshold (min sample size) is auto-demoted to 'disabled'
      - loom skills promote/demote <name> let a human override the lifecycle
      - loom skills list shows each skill's lifecycle and track record
    estimated_complexity: large
    dependencies:
      - story-007-001
    tech_notes: |
      Lifecycle lives in SKILL.md frontmatter metadata.lifecycle. A SkillLifecycle
      module reads skill_usage track records and rewrites the metadata. Run it at
      the end of Supervisor.run() (after skill generation). Thresholds in
      policy.agents (e.g. skill_promote_after, skill_demote_failure_ratio).

  - id: story-007-003
    title: "Eval runner — curated eval set, loom eval command, drift detection"
    description: |
      An EvalRunner that runs a fixed set of eval cases and grades the outcomes,
      so quality is measurable over time. Ships a curated planning eval set
      (briefs paired with structural assertions on the produced epics). Records
      scores per run; flags regressions (drift).
    acceptance_criteria:
      - An EvalCase format (brief or scenario + graded assertions) is defined and documented
      - EvalRunner runs cases against loom components and produces a pass/score report
      - A curated planning eval set ships with loom (>= 5 cases)
      - loom eval runs the set and prints a score; runnable with MockLLMClient (CI) or a real backend
      - Eval scores are stored per run; loom eval --compare flags a score regression vs the last run
    estimated_complexity: large
    dependencies:
      - story-007-001
    tech_notes: |
      Put the EvalRunner in packages/loom-core/src/eval/. Eval cases as YAML/JSON
      fixtures bundled with the package. Planning evals assert on epic structure
      (story count, dependency soundness via validateEpicSet, schema validity) —
      fast, no code execution. Store eval runs in an eval_runs DB table.

  - id: story-007-004
    title: "Skill-quality judge — rubric gate before a skill becomes a candidate"
    description: |
      Before a generated skill is even accepted as a candidate, score it against
      a quality rubric with an LLM judge (concrete? transferable? correct? not a
      duplicate?). Junk skills are rejected at generation time rather than
      entering the lifecycle at all.
    acceptance_criteria:
      - A bundled skill-judge prompt scores a candidate skill on a documented rubric
      - SkillGenerator runs the judge before writing a skill; skills below the bar are not written
      - The judge is best-effort — a judge failure falls back to writing the skill as 'candidate' (never blocks a run)
      - The rubric and threshold are documented
    estimated_complexity: medium
    dependencies:
      - story-007-002
    tech_notes: |
      Add a bundled personas/skill-judge.md prompt. SkillGenerator calls the judge
      (same LLMClient, skill_gen_model) after extraction, before writeSkill. Reuse
      the extractJsonBlock helper for the judge's structured score output.
