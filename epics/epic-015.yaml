# Generated by loom planning — Epic 15 (Image input for UI work)
# Validated against schemas/epic.schema.yaml
epic_id: epic-015
title: "Image input — mockups and screenshots feed planning"
status: in_progress
priority: should-have
prd_ref: ".loom/planning/prd.md"
requirements:
  - "FR-2 (planning) — visual context feeds the brief"

# Context
# -------
# UI work is hard to describe in prose. A developer with a mockup, sketch, or
# screenshot wants loom to plan from it. Two shapes for getting there:
#
# A. Pi-first (DONE in story-015-001). Pi already has vision. The user pastes
#    the image into pi, a bundled skill teaches Claude-in-pi how to translate
#    the image into a loom-quality brief, and pi calls loom_plan_epic via
#    MCP with that brief. Zero loom-side code. The image is consumed by
#    pi-as-Claude; only its textual translation flows downstream.
#
# B. Deep loom-side plumbing (deferred). Images flow through loom's
#    LLMClient, through the planner personas, and through per-story worker
#    assignments — workers see the image bytes, not just a description.
#    Required only for pixel-perfect re-implementation of an existing design;
#    until that's proven necessary by real use, deferred.

stories:
  - id: story-015-001
    title: "loom-image-to-brief skill — pi-first image flow"
    description: |
      A bundled skill that teaches Claude-in-pi how to translate a pasted
      image into a loom-quality brief. The SkillSelector auto-injects it when
      the chat mentions an image / mockup / sketch / screen. After translation
      pi calls loom_plan_epic via MCP, which kicks off the normal planning
      pipeline.
    acceptance_criteria:
      - packages/loom-core/skills/loom-image-to-brief/SKILL.md exists and is
        discovered by SkillStore as a bundled skill
      - The skill body covers: artifact identification, UI inventory, flow
        mapping, state inventory, accessibility callouts, and "what the image
        does NOT tell you" (Open questions)
      - The output shape matches the loom-brief-builder format so the
        planner's Analyst consumes it without adapter logic
      - README documents the workflow (paste in pi → /loom-status or chat →
        plan)
      - The skill explicitly warns the model that worker agents will NOT see
        the original image, only the brief — so the brief must be the spec
    estimated_complexity: small
    dependencies: []
    tech_notes: |
      Pure prompt work. No code beyond shipping the SKILL.md file. Verified
      end-to-end by pasting a mockup into pi (in a loom-initialized repo)
      and asking it to plan — pi reads the image, applies the skill, calls
      loom_plan_epic via the MCP tools registered in Epic 18 foundation.

  - id: story-015-002
    title: "Deep loom-side image plumbing — pixel-perfect path (deferred)"
    description: |
      For work where the worker must see the actual image (matching a Figma
      mockup to the pixel, reproducing an existing design exactly), the image
      needs to flow through loom's LLMClient into the planner personas AND
      through WorkerAssignment into the claude / cursor-agent CLI's image
      flags. Build only when story-015-001 proves insufficient — i.e., users
      report "matched the layout but missed colors / spacing / specifics."
    acceptance_criteria:
      - LLMRequest gains image content blocks alongside text
      - loom epic --image <path> (repeatable) attaches images to the brief
        passed to the Analyst / UX / Architect personas
      - WorkerAssignment.images carries resolved image bytes / paths; the
        worker prompt template references them; BaseCliWorker passes them
        via the underlying CLI's image flag
      - Story YAML schema gains an optional images field; the Architect
        populates it for UI stories
      - Cursor backend support is best-effort (its image support may differ);
        Anthropic API and claude CLI are the primary paths
      - Per-image cost is tracked alongside text tokens
    estimated_complexity: large
    dependencies:
      - story-015-001
    tech_notes: |
      Defer until evidence shows the pi-translation path is insufficient.
      The validation signal is concrete: users running 015-001 work and
      saying "the agent matched the layout but missed the colors / spacing
      / icon details." Without that signal, the cost of this story
      (LLMClient interface change, multi-backend image support, schema
      changes, worker prompt expansion) does not pay back.

  - id: story-015-003
    title: "loom ask / loom research accept images (deferred)"
    description: |
      Quick-question and research flows also benefit from visual input —
      "what's wrong with this screen?" or "research alternatives to this UI
      pattern." Adds --image to loom ask and loom research, same plumbing as
      story-015-002.
    acceptance_criteria:
      - loom ask "<q>" --image <path> attaches the image to the ASK call
      - loom research "<q>" --image <path> attaches it to the Researcher
        persona
      - Backends that do not support images warn rather than silently drop
    estimated_complexity: small
    dependencies:
      - story-015-002
    tech_notes: |
      Reuses the LLMRequest image-content plumbing from story-015-002.
      Cheapest of the deep-plumbing stories; the dependency is purely on
      the interface change. In the meantime, users can still paste images
      into pi for ask / research questions — same pi-first path.
