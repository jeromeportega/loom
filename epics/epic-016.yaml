# Generated by loom planning — Epic 16 (Cost governance & context controls)
# Validated against schemas/epic.schema.yaml
epic_id: epic-016
title: "Cost governance — context manifests, repo digest, diff-first, full dashboard"
status: planned
priority: should-have
prd_ref: ".loom/planning/prd.md"
requirements:
  - "NFR-2 (cost / throughput per token)"
  - "NFR-4 (observability)"

# Context
# -------
# Loom already ships the cheap half of cost control: brief refinement before
# planning, tiered model routing (Opus planner / Sonnet workers / Haiku
# skill-gen), planner token tracking per epic, planner budget warnings, and
# session-based auth. The substantive next half is *context governance* — the
# primary driver of token spend at scale is not generation, it is context
# inflation: repeated repo hydration, oversized worker prompts, recursive
# agent chatter, replayed history.
#
# This epic builds the context-and-cost governance layer the doc describes.

stories:
  - id: story-016-001
    title: "Context manifests per skill (required / optional / forbidden)"
    description: |
      Each skill declares what context it needs. The SkillStore reads a new
      `context` frontmatter section; the supervisor and planner respect it
      when assembling worker / persona prompts — pruning forbidden context and
      omitting optional context unless explicitly relevant.
    acceptance_criteria:
      - SKILL.md frontmatter accepts a `context:` block with `required`,
        `optional`, and `forbidden` keys (each a list of pattern strings)
      - SkillStore.SkillManifest surfaces parsed context manifests
      - Worker prompt assembly drops files matched by any forbidden pattern
      - The bundled loom-* skills carry honest context manifests
    estimated_complexity: medium
    dependencies: []
    tech_notes: |
      Define a small ContextManifest type in loom-core/src/skills/. Patterns
      are glob-style (use fast-glob, already a dep). Worker prompts already
      attach skills via WorkerAssignment.skills; the supervisor selects which
      files the worker prompt references — that selection consults the
      manifests of the injected skills.

  - id: story-016-002
    title: "Repo digest: architecture map instead of full hydration"
    description: |
      Instead of letting worker agents explore the full repo every time,
      generate (and cache) a repo digest — an architecture map and dependency
      summary the worker starts from. Selectively expand only files the
      worker actually touches.
    acceptance_criteria:
      - `loom init` generates an initial repo digest into .loom/digest/
      - The digest contains: directory tree, package manifests summary, a
        dependency-graph summary, and a list of high-fan-in files
      - The digest is regenerated on demand (`loom digest`) or when stale
        beyond N hours (configurable)
      - Worker prompts reference the digest by path instead of inlining file
        bodies; the worker hydrates files itself
      - Token usage per worker drops measurably vs. baseline (record the
        before/after in docs/testing.md)
    estimated_complexity: large
    dependencies:
      - story-016-001
    tech_notes: |
      Possibly leverage Repomix (https://github.com/yamadashy/repomix) as a
      library, or hand-roll. Hand-rolled is small if the digest is just a
      directory tree + manifests + first-N-lines of every README.md. The
      heavier graph analysis is optional v2.

  - id: story-016-003
    title: "Diff-first worker prompts"
    description: |
      Workers today see the full worktree to explore. Switch worker prompts
      to a diff-first shape: the worker receives the story brief + the
      relevant slice of the repo (touched files, nearby deps, local arch
      summary, test commands) rather than implicit "here is the whole repo."
    acceptance_criteria:
      - The worker prompt template adds a Context section that carries: the
        story brief, a list of files the worker is expected to touch (from
        the story's tech_notes / dependencies), the local arch summary from
        the repo digest, and the project's test command
      - The "whole repo, go figure it out" implicit fallback is removed
      - A measurable reduction in input tokens per story in the eval suite
    estimated_complexity: medium
    dependencies:
      - story-016-002
    tech_notes: |
      Edit packages/loom-core/src/orchestrator/workerPrompt.ts. The story
      YAML's tech_notes already hint at touched files; promote those into
      a structured `touches: string[]` field on the Story schema, populated
      by the Architect persona.

  - id: story-016-004
    title: "Worker-level token tracking (switch to stream-json)"
    description: |
      Today only planner tokens are tracked because workers run with
      free-form stdout. Switch worker invocations to `claude --output-format
      stream-json` (or cursor-agent equivalent) and parse each event:
      content events feed the live tail; the terminal event carries the
      usage block. Persist worker tokens onto the agent row.
    acceptance_criteria:
      - BaseCliWorker invokes the agent with stream-json output and parses
        events incrementally
      - The live worker output stream (CLI --verbose, pi dashboard) still
        renders the same content lines as today
      - agents.tokens_input / tokens_output / tokens_cached are populated on
        completion
      - `loom status` shows per-story tokens alongside the existing planner
        per-epic line
    estimated_complexity: large
    dependencies:
      - story-016-001
    tech_notes: |
      ClaudeCliClient already parses --output-format json; the structure for
      stream-json is event-per-line. Reuse parseClaudeJson's defensive
      approach. Cursor's stream-json may be different — parse defensively
      with a per-backend strategy.

  - id: story-016-005
    title: "Per-story token budget + halt"
    description: |
      Enforce `policy.agents.budget_tokens_per_story` (already declared in
      the policy schema). When a worker's cumulative tokens cross the
      budget, signal a per-story stop via the same mechanism `loom_stop_agent`
      uses — the worker exits failed with reason 'over budget'. The user
      can set the budget per-project, per-machine.
    acceptance_criteria:
      - Cumulative worker tokens are tracked live (from story-016-004's
        stream events) against the policy budget
      - At budget * 0.8 the agent's audit log gets a 'warn' entry
      - At budget * 1.0 the worker is SIGTERM'd with reason 'over budget'
      - `loom status` shows the percentage of budget consumed for running
        agents
    estimated_complexity: medium
    dependencies:
      - story-016-004

  - id: story-016-006
    title: "Local cost dashboard — `loom cost`"
    description: |
      A reporting command that aggregates token spend across planning and
      execution. Per-epic, per-story, per-day. Surfaces retries, failed
      evals, and model-mix efficiency.
    acceptance_criteria:
      - `loom cost` prints a table: tokens by epic, tokens by day, retry
        share, average tokens per merged PR
      - `loom cost --by story` drills to per-story
      - `loom cost --json` emits machine-readable output for further
        analysis
      - The pi dashboard gains a small footer indicator showing today's
        loom token spend
    estimated_complexity: medium
    dependencies:
      - story-016-004
    tech_notes: |
      SQL queries against agents + epics + audit_log. Wrap in a small
      packages/loom-core/src/cost/ module so the CLI and the pi extension
      share the same aggregation logic.
