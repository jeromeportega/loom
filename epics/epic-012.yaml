# Generated by loom planning — Epic 12 (Research & Q&A Mode)
# Validated against schemas/epic.schema.yaml
epic_id: epic-012
title: "Research & Q&A mode — answer questions, not just build"
status: approved
priority: should-have
prd_ref: ".loom/planning/prd.md"
requirements:
  - "FR-2 (planning) — research feeds the plan"

# Context
# -------
# loom today is build-oriented: brief -> epic -> stories -> code -> PRs. A
# research spike is a different class of problem — "Postgres or DynamoDB?",
# "evaluate these 3 libraries", "how should we approach X?". The output is a
# decision: options, trade-offs, a recommendation — not code. loom needs a
# distinct research mode, separate from the build pipeline. BMAD already has
# the prior art (bmad-technical-research, market-research, domain-research);
# this epic gives loom a first-class research entry point.
#
# Note: the pi.dev interface (planned elsewhere) is a natural surface for the
# interactive option-presentation step — research mode produces the options;
# a richer UI can present them.

stories:
  - id: story-012-001
    title: "loom research — a research spike that produces a decision document"
    description: |
      A `loom research "<question>"` command that runs a research agent (a
      bundled research persona) to investigate a technology question against
      the codebase and the web, and writes a decision document: the question,
      options considered, trade-offs, a recommendation, and open questions.
    acceptance_criteria:
      - loom research "<question>" produces a markdown decision doc under .loom/research/
      - The doc lays out at least the question, options with trade-offs, and a recommendation
      - It does NOT touch git, worktrees, or the supervisor — research is read-only
      - It runs on the configured llm_backend (session-based by default)
      - A bundled research persona prompt drives it (BMAD-derived, like the planning personas)
    estimated_complexity: large
    dependencies: []
    tech_notes: |
      A new packages/loom-core/src/research/ module + a personas/researcher.md
      prompt. Reuse the LLMClient seam. The research agent may use the claude
      CLI's WebSearch/WebFetch when the backend is claude-cli. Output to
      .loom/research/<slug>.md. No DB epics, no worktrees.

  - id: story-012-002
    title: "loom ask — quick technology Q&A, and research that feeds planning"
    description: |
      A lightweight `loom ask "<question>"` for a quick answer (no full
      document), and a way for a research decision doc to be referenced by a
      later `loom epic` so the chosen option informs the plan.
    acceptance_criteria:
      - loom ask "<question>" prints a concise answer to the terminal, no file written
      - loom epic can take a --research <path> flag that feeds a decision doc into planning
      - The Analyst persona incorporates a referenced research doc as a persistent fact
    estimated_complexity: medium
    dependencies:
      - story-012-001
    tech_notes: |
      loom ask is a thin single-call wrapper over the LLMClient. The
      --research flag passes the decision doc text into the planner as extra
      context for the Analyst step (alongside the brief).
