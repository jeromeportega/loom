# Generated by loom planning — Epic 13 (Cursor CLI backend)
# Validated against schemas/epic.schema.yaml
epic_id: epic-013
title: "Cursor CLI backend — run loom on Cursor's session too"
status: approved
priority: should-have
prd_ref: ".loom/planning/prd.md"
requirements:
  - "FR-2 (planning)"
  - "FR-4 (story dispatch)"

# Context
# -------
# loom runs on the session-based `claude` CLI. Many orgs provide two AI usage
# avenues — Claude Code and Cursor — and adding a Cursor CLI backend lets a
# team use whichever they have, widening loom adoption. Cursor's CLI
# (cursor-agent) supports session-based auth, so this stays within the
# no-API-billing constraint. It slots into the LLMClient and WorkerRunner seams
# loom already built — this epic is the payoff of those abstractions.
#
# Hard constraints: never use Cursor "MAX" mode; always target a specific model
# (a Claude model, to mirror the claude-code path) — no implicit/default model.

stories:
  - id: story-013-001
    title: "CursorCliClient — an LLMClient backed by the Cursor CLI"
    description: |
      An LLMClient implementation that drives planning through Cursor's headless
      CLI (cursor-agent) on the developer's Cursor session — no API key. Always
      passes an explicit model; never enables MAX mode.
    acceptance_criteria:
      - CursorCliClient implements LLMClient and runs the cursor-agent CLI headless
      - It always passes an explicit --model (a configured Claude model id)
      - It never enables Cursor MAX mode
      - policy.agents.llm_backend accepts 'cursor-cli' alongside 'claude-cli' and 'anthropic-api'
      - The prompt-flattening / output-parsing logic is unit-tested (the subprocess is the seam)
    estimated_complexity: large
    dependencies: []
    tech_notes: |
      packages/loom-core/src/llm/CursorCliClient.ts, mirroring ClaudeCliClient.
      Confirm the cursor-agent flags for headless print mode, model selection,
      and JSON output. Extend createLLMClient() with the 'cursor-cli' case.

  - id: story-013-002
    title: "CursorAgentWorker — a WorkerRunner backed by the Cursor CLI"
    description: |
      A WorkerRunner that implements stories by running cursor-agent headless in
      the story's git worktree — the Cursor equivalent of ClaudeCodeWorker.
    acceptance_criteria:
      - CursorAgentWorker implements WorkerRunner and runs cursor-agent in the worktree
      - It always targets an explicit model and never uses MAX mode
      - It honours policy.git.allowed_remotes before pushing (as ClaudeCodeWorker does)
      - Commit counting, PR opening, and result interpretation match ClaudeCodeWorker
      - The loom guardrail hook still applies (Cursor reads .cursor/rules and the repo config)
    estimated_complexity: large
    dependencies:
      - story-013-001
    tech_notes: |
      packages/loom-core/src/orchestrator/CursorAgentWorker.ts. Reuse the
      worktree, commit-count, and PR helpers. Verify how Cursor's CLI honours a
      pre-tool guardrail — if it has no PreToolUse-equivalent, document the gap.

  - id: story-013-003
    title: "Backend selection across planner and workers"
    description: |
      A single, coherent backend choice that selects the LLM client and the
      worker runner together (claude-code or cursor-cli), surfaced in loom init
      and loom doctor.
    acceptance_criteria:
      - A policy setting selects the worker backend (claude-code | cursor-cli)
      - loom run constructs the matching WorkerRunner from policy
      - loom doctor checks for the cursor-agent CLI when the cursor backend is selected
      - loom init's policy template documents the backend options
      - Mixed setups are valid (e.g. claude planner + cursor workers) or explicitly disallowed — decide and document
    estimated_complexity: medium
    dependencies:
      - story-013-002
    tech_notes: |
      Add policy.agents.worker_backend (or unify under one backend field).
      Thread it through run.ts and the MCP approve handler where ClaudeCodeWorker
      is currently hardcoded.
