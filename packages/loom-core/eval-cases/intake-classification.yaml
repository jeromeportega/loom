# Labeled eval set for the intake classifier (epic-021).
#
# Each case stores: the brief text a user would submit, human-assigned
# type/size labels, and a rationale. Anchors pin the size extremes;
# epic-derived cases come from loom's 19 delivered epics.
#
# Size labels are ANCHORED on intrinsic brief scope (ADR-008, story-023-005).
# Each brief was reviewed on its own text — the sizing question is: does this
# brief span multiple functional areas / services / cross-cutting concerns (→ epic)
# or describe a single bounded change (→ story)? Low-confidence cases default to
# epic (ADR-006 conservative tiebreak). The re-anchoring review (story-023-005)
# confirmed ALL current labels are correct; see eval-cases/RELABEL.md for the
# per-case rationale.
#
# story_count fields are @deprecated — EVIDENCE ONLY. The scorer MUST NOT use
# story_count as the size ground truth; use label.size (FR-3, ADR-004, ADR-008).
#
# Validated against IntakeEvalSetSchema.

cases:
  # ── Hand-curated anchors ─────────────────────────────────────────────────────

  - id: anchor-obvious-single-story
    source: anchor
    brief: >
      Add a --version flag to the loom CLI that prints the package version and
      exits 0.
    brief_source: "anchor"
    label:
      type: feature
      size: story
    rationale: >
      Classic single-story CLI addition: one command, one test, one line of
      package.json plumbing. Clearly a story-scoped change well below epic
      threshold.

  - id: anchor-obvious-bug
    source: anchor
    brief: >
      Fix the date picker in the settings page that shows the wrong month when
      the user's timezone is west of UTC, and add a regression test.
    brief_source: "anchor"
    label:
      type: bug
      size: story
    rationale: >
      Narrow, single-symptom bug with a named repro condition. One story to
      patch the component plus a regression test — no architectural changes
      required. Anchors the bug/story corner of the label space.

  - id: anchor-obvious-large-epic
    source: anchor
    brief: >
      Build a distributed task queue that ingests jobs via a REST API, processes
      them across a fleet of workers with configurable concurrency, persists
      queue state in Postgres, exposes a real-time monitoring dashboard, and
      supports graceful draining and dead-letter handling for failed jobs.
    brief_source: "anchor"
    label:
      type: feature
      size: epic
    rationale: >
      Explicitly spans five distinct concerns (API, worker fleet, Postgres
      persistence, dashboard, drain/DLQ) that decompose to 8-15 stories across
      multiple functional areas. Anchors the feature/epic corner of the label
      space.

  # ── Historical loom epics (bootstrapped from epics/epic-0NN.yaml) ───────────

  - id: epic-001
    source: epic
    brief: "Core Engine: loom init, policy engine, SQLite state"
    brief_source: "epics/epic-001.yaml"
    label:
      type: feature
      size: epic
    rationale: >
      Foundational three-story epic covering CLI scaffolding, structural policy
      engine, and SQLite state schema — each story independently shippable but
      together forming the minimal viable loom runtime.
    story_count: 3  # @deprecated — evidence only (FR-3, ADR-004)

  - id: epic-002
    source: epic
    brief: "BMAD Planning Pipeline: Analyst → PM → Architect headless workflow"
    brief_source: "epics/epic-002.yaml"
    label:
      type: feature
      size: epic
    rationale: >
      Five-story planning pipeline wiring three distinct AI personas in sequence.
      Touches planner orchestration, LLM integration, and output serialization
      across multiple modules — clearly multi-story feature work.
    story_count: 5  # @deprecated — evidence only (FR-3, ADR-004)

  - id: epic-003
    source: epic
    brief: "Story Dispatch: supervisor, worktree isolation, subagent runner"
    brief_source: "epics/epic-003.yaml"
    label:
      type: feature
      size: epic
    rationale: >
      Three stories building the autonomous dispatch loop: worktree management,
      supervisor orchestration, and the subagent runner. Spans infrastructure
      and orchestration concerns that share no code path.
    story_count: 3  # @deprecated — evidence only (FR-3, ADR-004)

  - id: epic-004
    source: epic
    brief: "MCP Server: loom-mcp with 7 tools for Cursor + Claude Code"
    brief_source: "epics/epic-004.yaml"
    label:
      type: feature
      size: epic
    rationale: >
      Four stories implementing a full MCP server surface with seven distinct
      tools, IDE-specific wiring for two clients, and schema/validation work.
      Multi-story by tool count alone.
    story_count: 4  # @deprecated — evidence only (FR-3, ADR-004)

  - id: epic-005
    source: epic
    brief: "Skill System: discovery, loading, injection, and post-story generation"
    brief_source: "epics/epic-005.yaml"
    label:
      type: feature
      size: epic
    rationale: >
      Three stories covering the full skill lifecycle from on-disk discovery and
      validation through runtime injection and post-story generation. Each story
      independently shippable but together forming the skill subsystem.
    story_count: 3  # @deprecated — evidence only (FR-3, ADR-004)

  - id: epic-006
    source: epic
    brief: "IDE Integrations: Cursor MCP + Claude Code slash commands"
    brief_source: "epics/epic-006.yaml"
    label:
      type: feature
      size: epic
    rationale: >
      Three stories wiring loom into two distinct IDE surfaces with their own
      protocol requirements. Cross-surface work that cannot collapse into a
      single story without losing testability.
    story_count: 3  # @deprecated — evidence only (FR-3, ADR-004)

  - id: epic-007
    source: epic
    brief: "Eval & Safety: measuring quality and preventing self-degradation"
    brief_source: "epics/epic-007.yaml"
    label:
      type: feature
      size: epic
    rationale: >
      Four stories building the eval runner, skill provenance, lifecycle
      management, and quality judging — four distinct subsystems, each a
      non-trivial feature on its own. Clearly an epic.
    story_count: 4  # @deprecated — evidence only (FR-3, ADR-004)

  - id: epic-008
    source: epic
    brief: "Org MCP provisioning — connect loom to an approved MCP registry"
    brief_source: "epics/epic-008.yaml"
    label:
      type: feature
      size: epic
    rationale: >
      Two stories: registry ingestion and enforcement/audit. While compact, the
      two concerns (data pipeline + policy enforcement) are distinct enough that
      collapsing them would obscure the acceptance criteria. Human judgment:
      epic.
    story_count: 2  # @deprecated — evidence only (FR-3, ADR-004)

  - id: epic-009
    source: epic
    brief: "Shared skill corpus — an org-maintained loom-skills repo"
    brief_source: "epics/epic-009.yaml"
    label:
      type: feature
      size: epic
    rationale: >
      Three stories: org repo discovery, skill synchronisation, and conflict
      resolution. Introduces a new external dependency and a new discovery
      layer on top of the existing skill system — multi-story scope.
    story_count: 3  # @deprecated — evidence only (FR-3, ADR-004)

  - id: epic-010
    source: epic
    brief: "Onboarding & Control — frictionless setup and agent steering"
    brief_source: "epics/epic-010.yaml"
    label:
      type: feature
      size: epic
    rationale: >
      Four stories spanning diagnostic tooling, interactive approval gates,
      pause/resume controls, and a progress overlay. Distinct UX and runtime
      concerns that each require independent acceptance criteria.
    story_count: 4  # @deprecated — evidence only (FR-3, ADR-004)

  - id: epic-011
    source: epic
    brief: "Multi-product orchestration — work across many repos at once"
    brief_source: "epics/epic-011.yaml"
    label:
      type: feature
      size: epic
    rationale: >
      Two stories: machine-level project registry and a global concurrency
      limiter. Both require new persistent state and cross-process coordination
      — together they constitute a new subsystem, not a single-story tweak.
    story_count: 2  # @deprecated — evidence only (FR-3, ADR-004)

  - id: epic-012
    source: epic
    brief: "Research & Q&A mode — answer questions, not just build"
    brief_source: "epics/epic-012.yaml"
    label:
      type: feature
      size: epic
    rationale: >
      Two stories introducing a distinct agent persona (researcher) and a new
      CLI command with its own output format. Adding a second interaction mode
      to loom is a feature of epic scope even at two stories.
    story_count: 2  # @deprecated — evidence only (FR-3, ADR-004)

  - id: epic-013
    source: epic
    brief: "Cursor CLI backend — run loom on Cursor's session too"
    brief_source: "epics/epic-013.yaml"
    label:
      type: feature
      size: epic
    rationale: >
      Three stories implementing a new LLM backend, streaming/streaming-chunk
      normalisation, and a Cursor-specific worker. A second agent execution
      backend is multi-story regardless of line count.
    story_count: 3  # @deprecated — evidence only (FR-3, ADR-004)

  - id: epic-014
    source: epic
    brief: "pi.dev UI surface — a multi-agent management plugin"
    brief_source: "epics/epic-014.yaml"
    label:
      type: feature
      size: epic
    rationale: >
      Two stories: a new packages/loom-pi package and its slash-command
      registration. A standalone publishable package constitutes an epic scope
      even with only two stories.
    story_count: 2  # @deprecated — evidence only (FR-3, ADR-004)

  - id: epic-015
    source: epic
    brief: "Image input — mockups and screenshots feed planning"
    brief_source: "epics/epic-015.yaml"
    label:
      type: feature
      size: epic
    rationale: >
      Three stories adding image upload, vision-model planner integration, and
      screenshot annotation. Touches the planning pipeline, a new media type,
      and UI — multi-story by surface area.
    story_count: 3  # @deprecated — evidence only (FR-3, ADR-004)

  - id: epic-016
    source: epic
    brief: >
      Cost governance — context manifests, repo digest, diff-first, full
      dashboard
    brief_source: "epics/epic-016.yaml"
    label:
      type: feature
      size: epic
    rationale: >
      Six stories addressing token-budget tracking, context pruning, a
      diff-first worker mode, and a cost dashboard. The largest delivered epic
      by story count; clearly multi-story feature work.
    story_count: 6  # @deprecated — evidence only (FR-3, ADR-004)

  - id: epic-017
    source: epic
    brief: "PR strategy — one epic PR by default instead of N story PRs"
    brief_source: "epics/epic-017.yaml"
    label:
      type: feature
      size: epic
    rationale: >
      Three stories reworking the PR creation flow to produce one epic-scoped
      PR: branch consolidation, PR-creation changes, and a gate update. Changes
      the delivery contract enough to warrant epic scope.
    story_count: 3  # @deprecated — evidence only (FR-3, ADR-004)

  - id: epic-018
    source: epic
    brief: "Pre-PR automated code review — catch issues before the human"
    brief_source: "epics/epic-018.yaml"
    label:
      type: feature
      size: epic
    rationale: >
      Four stories adding an automated review step to the post-story pipeline:
      review agent, findings schema, dedup logic, and supervisor wiring. A new
      quality gate woven into the delivery loop — multi-story by necessity.
    story_count: 4  # @deprecated — evidence only (FR-3, ADR-004)

  - id: epic-019
    source: epic
    brief: "Repo-specific learning review skills — the reviewer that gets better"
    brief_source: "epics/epic-019.yaml"
    label:
      type: feature
      size: epic
    rationale: >
      Four stories building skill extraction from review feedback, a repo-local
      skill corpus, and a promotion/demotion loop. Extends the skill lifecycle
      system with new data pipelines and persistence — multi-story feature.
    story_count: 4  # @deprecated — evidence only (FR-3, ADR-004)
