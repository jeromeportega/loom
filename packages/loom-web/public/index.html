<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>loom — dashboard</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        padding: 24px 32px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0e1116;
        color: #e6edf3;
        max-width: 1100px;
        line-height: 1.5;
      }
      h1, h2 { margin: 0 0 8px; font-weight: 600; }
      h2 { font-size: 18px; margin-top: 0; }
      .tagline { color: #8b949e; margin-bottom: 28px; }
      .epic, .panel {
        border: 1px solid #30363d;
        border-radius: 8px;
        padding: 14px 18px;
        margin-bottom: 12px;
        background: #161b22;
      }
      .epic { cursor: pointer; }
      .epic:hover { border-color: #58a6ff; }
      .epic.archived { opacity: 0.55; }
      .epic.archived:hover { opacity: 0.85; }
      .archived-badge {
        font-size: 10px;
        padding: 1px 7px;
        border-radius: 3px;
        background: #2b2b33;
        color: #8b949e;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        white-space: nowrap;
      }
      .list-controls {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: #8b949e;
        margin-bottom: 10px;
        user-select: none;
      }
      .list-controls label { cursor: pointer; }
      .epic-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 16px;
        margin-bottom: 6px;
      }
      .epic-id { color: #58a6ff; font-weight: 600; }
      .epic-status {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 4px;
        background: #21262d;
        color: #8b949e;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .epic-status.done { background: #1f3a26; color: #56d364; }
      .epic-status.in_progress { background: #1f2c3a; color: #58a6ff; }
      .epic-status.rejected { background: #3a1f1f; color: #f85149; }
      .epic-status.planning { background: #2f2a14; color: #d29922; }
      .epic-status.approved { background: #2c1f3a; color: #bc8cff; }
      .epic-status.publish_pending { background: #1f3a2a; color: #3fb950; }
      .pulse { animation: pulse 1.4s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: 0.55 } }
      .counts { color: #8b949e; font-size: 13px; }
      .count-done { color: #56d364; }
      .count-failed { color: #f85149; }
      .empty {
        color: #8b949e;
        font-style: italic;
        padding: 32px 0;
        text-align: center;
      }
      .updated { color: #6e7681; font-size: 11px; margin-top: 6px; }
      .footer { color: #6e7681; font-size: 12px; margin-top: 32px; }
      a { color: #58a6ff; cursor: pointer; }
      .brief {
        background: #0d1117;
        padding: 12px 16px;
        border-radius: 6px;
        border-left: 3px solid #58a6ff;
        margin: 8px 0 16px;
        white-space: pre-wrap;
        font-size: 14px;
      }
      .back { font-size: 13px; color: #8b949e; margin-bottom: 14px; }
      .project-heading {
        margin: 20px 0 8px;
        padding-bottom: 4px;
        border-bottom: 1px solid #21262d;
        display: flex;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
      }
      .project-heading:first-of-type { margin-top: 0; }
      .project-name { font-size: 15px; font-weight: 600; color: #e6edf3; }
      .project-tag {
        font-size: 10px;
        padding: 1px 7px;
        border-radius: 3px;
        background: #1f3a26;
        color: #56d364;
        text-transform: uppercase;
        letter-spacing: 0.4px;
      }
      .project-root { font-size: 11px; color: #6e7681; font-family: ui-monospace, Menlo, Monaco, monospace; }
      .artifacts { margin: 14px 0 6px; }
      .artifacts details {
        background: #0d1117;
        border: 1px solid #21262d;
        border-radius: 6px;
        margin-bottom: 6px;
      }
      .artifacts summary {
        cursor: pointer;
        padding: 8px 12px;
        font-size: 13px;
        color: #e6edf3;
        user-select: none;
      }
      .artifacts summary:hover { color: #58a6ff; }
      .artifacts .doc-path {
        color: #6e7681;
        font-size: 11px;
        font-family: ui-monospace, Menlo, Monaco, monospace;
        margin-left: 6px;
      }
      .artifacts .doc-body {
        margin: 0;
        padding: 10px 14px 14px;
        font-family: ui-monospace, Menlo, Monaco, monospace;
        font-size: 12px;
        color: #c9d1d9;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 480px;
        overflow-y: auto;
        border-top: 1px solid #21262d;
      }
      .artifacts .doc-missing { color: #6e7681; font-style: italic; padding: 10px 14px; }
      .approval-banner {
        background: #2c1f3a;
        border: 1px solid #bc8cff44;
        border-radius: 6px;
        padding: 10px 14px;
        margin: 14px 0 6px;
        font-size: 13px;
        color: #d2a8ff;
      }
      button {
        background: #21262d;
        color: #e6edf3;
        border: 1px solid #30363d;
        border-radius: 6px;
        padding: 6px 12px;
        font-size: 13px;
        cursor: pointer;
        margin-right: 6px;
      }
      button:hover { border-color: #58a6ff; }
      button.danger { color: #f85149; border-color: #3a1f1f; }
      button.primary { background: #1f3a26; border-color: #2ea043; color: #56d364; }
      table.agents { width: 100%; border-collapse: collapse; font-size: 13px; }
      table.agents th { text-align: left; color: #8b949e; font-weight: 500; padding: 6px 8px; border-bottom: 1px solid #30363d; }
      table.agents td { padding: 6px 8px; border-bottom: 1px solid #21262d; }
      .agent-status { font-size: 11px; padding: 2px 6px; border-radius: 3px; background: #21262d; color: #8b949e; text-transform: uppercase; }
      .agent-status.done { background: #1f3a26; color: #56d364; }
      .agent-status.pr_open { background: #1f3a26; color: #56d364; }
      .agent-status.failed { background: #3a1f1f; color: #f85149; }
      .agent-status.running { background: #1f2c3a; color: #58a6ff; }
      .log-pane {
        margin-top: 6px;
        background: #010409;
        border: 1px solid #21262d;
        border-radius: 4px;
        padding: 8px 10px;
        font-family: ui-monospace, Menlo, Monaco, monospace;
        font-size: 11px;
        color: #c9d1d9;
        max-height: 180px;
        overflow-y: auto;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .log-pane:empty::before { content: '(no output yet)'; color: #6e7681; font-style: italic; }
      .row-actions { font-size: 11px; }
      .row-actions button { padding: 2px 8px; font-size: 11px; margin-right: 4px; }
      .stall-badge { font-size: 11px; padding: 2px 6px; border-radius: 3px; margin-left: 6px; background: #3a2f1f; color: #d29922; text-transform: uppercase; }
      .worktree { margin-top: 4px; font-size: 11px; color: #6e7681; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .worktree code { color: #8b949e; }
    </style>
  </head>
  <body>
    <h1>loom</h1>
    <div class="tagline">Multi-agent engineering dashboard · localhost</div>
    <nav id="nav" style="display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap"></nav>
    <div id="root">Loading…</div>
    <div class="footer">
      Polling every 2s ·
      <a href="https://jeromeportega.github.io/loom/">docs</a>
    </div>
    <script>
      const STORAGE_KEY = 'loom-web-token';
      const fragment = new URLSearchParams(window.location.hash.slice(1));
      let token = fragment.get('token') ?? '';
      if (token) {
        try { sessionStorage.setItem(STORAGE_KEY, token); } catch {}
        history.replaceState(null, '', window.location.pathname);
      } else {
        try { token = sessionStorage.getItem(STORAGE_KEY) ?? ''; } catch {}
      }
      // Expose token for registered views (e.g. fleet.js SSE EventSource).
      window.__loomToken = token;

      // ─── View registry ───────────────────────────────────────────────────
      // External view modules (autonomy.js, fleet.js, inbox.js) call
      // Loom.registerView({ id, label, render }) on load. render(container, api)
      // renders content and optionally returns a cleanup function.
      window.Loom = {
        views: [],
        registerView: function (v) {
          this.views.push(v);
          const btn = document.createElement('button');
          btn.id = 'nav-' + v.id;
          btn.className = 'nav-btn';
          btn.style.cssText = 'background:#21262d;color:#8b949e;border:1px solid #30363d;border-radius:6px;padding:4px 12px;font-size:13px;cursor:pointer';
          btn.textContent = v.label;
          btn.addEventListener('click', () => navTo(v.id));
          document.getElementById('nav').appendChild(btn);
        },
      };

      // ─── Nav ─────────────────────────────────────────────────────────────
      // Render the Dashboard tab eagerly (before registered views arrive).
      (function () {
        const nav = document.getElementById('nav');
        const btn = document.createElement('button');
        btn.id = 'nav-dashboard';
        btn.className = 'nav-btn';
        btn.style.cssText = 'background:#1f3a26;color:#56d364;border:1px solid #2ea043;border-radius:6px;padding:4px 12px;font-size:13px;cursor:pointer';
        btn.textContent = 'Dashboard';
        btn.addEventListener('click', () => navTo('dashboard'));
        nav.appendChild(btn);
      })();

      let activeViewId = 'dashboard';
      let activeViewCleanup = null;

      function navTo(viewId) {
        if (activeViewId === viewId) return;
        if (activeViewCleanup) { try { activeViewCleanup(); } catch {} activeViewCleanup = null; }
        activeViewId = viewId;
        document.querySelectorAll('.nav-btn').forEach((b) => {
          const isActive = b.id === 'nav-' + viewId;
          b.style.background = isActive ? '#1f3a26' : '#21262d';
          b.style.color      = isActive ? '#56d364' : '#8b949e';
          b.style.borderColor= isActive ? '#2ea043' : '#30363d';
        });
        if (viewId === 'dashboard') {
          closeEventStream();
          currentView = 'list';
          stopListPolling();
          refreshList();
          startListPolling();
          return;
        }
        const view = (window.Loom.views || []).find((v) => v.id === viewId);
        if (!view) return;
        stopListPolling();
        closeEventStream();
        currentView = 'view:' + viewId;
        const root = document.getElementById('root');
        root.innerHTML = '';
        const cleanup = view.render(root, api);
        if (typeof cleanup === 'function') activeViewCleanup = cleanup;
      }

      // ─── State ──────────────────────────────────────────────────────────
      // currentView is the routing surface: 'list' or `'epic:<id>'`.
      let currentView = 'list';
      let pollTimer = null;
      // When true, the list view also fetches + shows archived runs (dimmed).
      let showArchived = false;
      // SSE connection — opened on detail view, closed on navigation away.
      // Pre-render bytes accumulate per agent so a freshly rendered log pane
      // can pull the buffered stdout immediately.
      let eventSource = null;
      let logBuffersByAgent = new Map();

      function api(p, init = {}) {
        return fetch(p, {
          ...init,
          headers: { 'x-loom-token': token, ...(init.headers || {}) },
        });
      }
      const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

      // ─── Renderers ──────────────────────────────────────────────────────
      function fmtCounts(c) {
        const parts = [];
        if (c.done) parts.push(`<span class="count-done">${c.done} done</span>`);
        if (c.running) parts.push(`${c.running} running`);
        if (c.failed) parts.push(`<span class="count-failed">${c.failed} failed</span>`);
        if (c.blocked) parts.push(`${c.blocked} blocked`);
        if (c.pending) parts.push(`${c.pending} pending`);
        return `${c.total} stories${parts.length ? ' — ' + parts.join(', ') : ''}`;
      }

      const STATUS_LABELS = {
        publish_pending: 'work complete · publish pending',
      };
      function statusBadge(e) {
        const label = e.status === 'planning' && e.planning_phase
          ? `planning · ${e.planning_phase}`
          : (STATUS_LABELS[e.status] || e.status.replace('_', ' '));
        const pulse = e.status === 'planning' || e.status === 'in_progress' ? ' pulse' : '';
        return `<div class="epic-status ${e.status}${pulse}">${esc(label)}</div>`;
      }

      function archiveToggle() {
        return `
          <div class="list-controls">
            <label>
              <input type="checkbox" id="showArchivedToggle" ${showArchived ? 'checked' : ''} />
              Show archived
            </label>
          </div>`;
      }

      function renderList(epics) {
        const controls = archiveToggle();
        if (epics.length === 0) {
          return controls + '<div class="empty">No epics planned yet. Run <code>loom epic "..."</code> to start.</div>';
        }
        // Group epics by project so cross-repo activity is legible at a
        // glance. Current-project epics surface first; peers follow.
        const byProject = new Map();
        for (const e of epics) {
          const key = e.project_root;
          if (!byProject.has(key)) byProject.set(key, []);
          byProject.get(key).push(e);
        }
        const ordered = [...byProject.entries()].sort((a, b) => {
          const aCurrent = a[1][0].is_current_project ? 0 : 1;
          const bCurrent = b[1][0].is_current_project ? 0 : 1;
          if (aCurrent !== bCurrent) return aCurrent - bCurrent;
          return a[1][0].project_name.localeCompare(b[1][0].project_name);
        });
        return controls + ordered
          .map(([root, group]) => {
            const head = group[0];
            const heading = `
              <div class="project-heading">
                <span class="project-name">${esc(head.project_name)}</span>
                ${head.is_current_project ? '<span class="project-tag">current</span>' : ''}
                <span class="project-root">${esc(root)}</span>
              </div>`;
            const rows = group
              .map(
                (e) => `
              <div class="epic${e.archived ? ' archived' : ''}" data-id="${esc(e.id)}" data-project="${esc(e.project_root)}">
                <div class="epic-head">
                  <div><span class="epic-id">${esc(e.id)}</span> · ${esc(e.title)}</div>
                  <div style="display:flex;gap:8px;align-items:baseline;">
                    ${e.archived ? '<span class="archived-badge">archived</span>' : ''}
                    ${statusBadge(e)}
                  </div>
                </div>
                <div class="counts">${e.status === 'planning' ? 'Planning in progress…' : fmtCounts(e.stories)}</div>
                <div class="updated">updated ${new Date(e.updated_at).toLocaleString()}</div>
              </div>`
              )
              .join('');
            return heading + rows;
          })
          .join('');
      }

      // One spend signal per backend: claude-code reports USD, cursor-cli
      // reports request counts (cost_usd is a meaningless 0 there). Show
      // whichever is non-zero; both when both are.
      function fmtSpend(a) {
        const hasCost = a.cost_usd != null && a.cost_usd > 0;
        const hasReqs = a.request_count != null && a.request_count > 0;
        if (hasCost && hasReqs) return '$' + a.cost_usd.toFixed(3) + ' · ' + a.request_count + ' req';
        if (hasCost) return '$' + a.cost_usd.toFixed(3);
        if (hasReqs) return a.request_count + ' req';
        return '—';
      }

      function renderDetail(epic) {
        const isPlanning = epic.status === 'planning';
        const canApprove = epic.status === 'planned';
        const canStop = ['approved', 'in_progress', 'planning'].includes(epic.status);
        const briefSection = epic.user_brief
          ? `<h2>Original brief</h2><div class="brief">${esc(epic.user_brief)}</div>`
          : '';
        // Placeholder filled in by fetchPlanningArtifacts() after detail render.
        // Only the 'planned' phase shows the review panel — once approved, the
        // dispatch is in motion and the artifacts move out of the way.
        const artifactsSection = canApprove
          ? `<div class="approval-banner">
               Review the planning artifacts below before approving. Workers
               are dispatched as soon as you click <strong>Approve &amp; dispatch</strong>.
             </div>
             <div class="artifacts" id="planningArtifacts">
               <div class="doc-missing">Loading planning artifacts…</div>
             </div>`
          : '';
        const renderRow = (a) => `
          <tr data-agent-id="${esc(a.id)}" data-story-id="${esc(a.story_id)}">
            <td>
              <code>${esc(a.story_id)}</code>
              <br><span style="color:#8b949e;font-size:12px">${esc(a.story_title ?? '')}</span>
              <div class="log-pane" id="log-${esc(a.id)}" data-agent-id="${esc(a.id)}"></div>
            </td>
            <td>
              <span class="agent-status ${a.status}" data-status="${esc(a.id)}">${esc(a.status)}</span>
              ${a.stall_reason ? `<span class="stall-badge" title="Worker approaching/hitting its ${esc(a.stall_reason)} deadline">⚠ ${esc(a.stall_reason)}</span>` : ''}
              ${a.worktree_path ? `<div class="worktree" title="${esc(a.worktree_path)}"><code>${esc(a.branch_name ?? a.worktree_path)}</code></div>` : ''}
              ${a.status === 'running' ? `
                <div class="row-actions" style="margin-top:6px;">
                  <button class="danger" data-kill="${esc(a.id)}">⏻ kill</button>
                </div>` : ''}
              ${(a.status === 'failed' || a.status === 'blocked') ? `
                <div class="row-actions" style="margin-top:6px;">
                  <button class="primary" data-retry="${esc(a.story_id)}">↻ retry</button>
                  <button class="danger" data-retry-clean="${esc(a.story_id)}">↻ clean retry</button>
                </div>` : ''}
            </td>
            <td data-pr="${esc(a.id)}">${a.pr_url ? `<a href="${esc(a.pr_url)}" target="_blank">view</a>` : '—'}</td>
            <td data-tokens="${esc(a.id)}">${a.tokens_total ?? '—'}</td>
            <td data-cost="${esc(a.id)}">${fmtSpend(a)}</td>
          </tr>`;
        const agentsSection = (epic.agents && epic.agents.length > 0)
          ? `<h2>Stories</h2>
             <table class="agents">
               <thead><tr><th>Story / live output</th><th>Status</th><th>PR</th><th>Tokens</th><th>Cost / req</th></tr></thead>
               <tbody>${epic.agents.map(renderRow).join('')}</tbody>
             </table>`
          : (isPlanning
              ? `<h2>Stories</h2><div class="empty">Stories appear once planning completes.</div>`
              : '');
        const archiveLabel = epic.archived ? 'Unarchive' : 'Archive';
        const controls = `
          <div style="margin-top: 18px;">
            ${canApprove ? '<button class="primary" id="approveBtn">Approve & dispatch</button>' : ''}
            ${canApprove ? '<button class="danger" id="rejectBtn">Reject</button>' : ''}
            ${canStop ? '<button class="danger" id="stopBtn">Stop run (graceful)</button>' : ''}
            <button id="archiveBtn">${archiveLabel}</button>
          </div>`;
        return `
          <div class="back"><a id="backLink">← all epics</a></div>
          <div class="panel">
            <div class="epic-head">
              <div><span class="epic-id">${esc(epic.id)}</span> · ${esc(epic.title)}</div>
              <div style="display:flex;gap:8px;align-items:baseline;">
                ${epic.archived ? '<span class="archived-badge">archived</span>' : ''}
                ${statusBadge(epic)}
              </div>
            </div>
            <div class="updated">updated ${new Date(epic.updated_at).toLocaleString()}</div>
            ${briefSection}
            ${artifactsSection}
            ${agentsSection}
            ${controls}
          </div>`;
      }

      // ─── Routing ────────────────────────────────────────────────────────
      // Two views with two very different update strategies, on purpose:
      //   - List view: cheap 2s polling of /api/status. No SSE.
      //   - Detail view: ONE fetch on entry, then SSE drives updates in
      //     place. NO periodic re-fetch — full re-renders would tear down
      //     the EventSource and break the back button + log panes.
      // refreshList() and enterDetail() never touch each other's DOM.

      function authError() {
        try { sessionStorage.removeItem(STORAGE_KEY); } catch {}
        document.getElementById('root').innerHTML =
          '<div class="empty">' +
          'Session token rejected (401). The server was likely restarted. ' +
          'Close this tab and open the URL the latest <code>loom web</code> printed.' +
          '</div>';
      }

      async function refreshList() {
        if (currentView !== 'list') return; // nav-away race guard
        if (!token) {
          document.getElementById('root').innerHTML =
            '<div class="empty">No session token. Close this tab and re-launch <code>loom web</code>.</div>';
          return;
        }
        try {
          const res = await api(`/api/status${showArchived ? '?include_archived=true' : ''}`);
          if (res.status === 401) { authError(); return; }
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          if (currentView !== 'list') return; // raced; user navigated away
          const { epics } = await res.json();
          const root = document.getElementById('root');
          root.innerHTML = renderList(epics);
          root.querySelectorAll('.epic').forEach((el) => {
            el.addEventListener('click', () => enterDetail(el.dataset.id, el.dataset.project));
          });
          const toggle = document.getElementById('showArchivedToggle');
          if (toggle) {
            toggle.addEventListener('change', () => {
              showArchived = toggle.checked;
              refreshList();
            });
          }
        } catch (err) {
          // Soft-fail: leave the previous render up, surface a footer note.
          // Spamming the empty-state on every transient fetch error is worse
          // UX than just keeping the last-known state.
          console.warn('list refresh failed:', err.message);
        }
      }

      // currentDetailProject is captured at navigation time so subsequent
      // action POSTs (approve, reject, kill) and the artifacts fetch all
      // route to the same peer DB the user opened.
      let currentDetailProject = null;

      async function enterDetail(epicId, projectRoot) {
        stopListPolling();
        closeEventStream();
        currentView = `epic:${epicId}`;
        currentDetailProject = projectRoot ?? null;
        const root = document.getElementById('root');
        root.innerHTML = '<div class="empty">Loading epic…</div>';
        const url = projectRoot
          ? `/api/epics/${encodeURIComponent(epicId)}?project=${encodeURIComponent(projectRoot)}`
          : `/api/epics/${encodeURIComponent(epicId)}`;
        try {
          const res = await api(url);
          if (res.status === 401) { authError(); return; }
          if (res.status === 404) { backToList(); return; }
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          if (currentView !== `epic:${epicId}`) return;
          const body = await res.json();
          root.innerHTML = renderDetail(body);
          bindDetailHandlers(body);
          if (body.status === 'planned') {
            fetchPlanningArtifacts(body.id);
          }
          openEventStream(body);
        } catch (err) {
          root.innerHTML = `<div class="empty">Failed to load epic: ${esc(err.message)}</div>`;
        }
      }

      function backToList() {
        currentView = 'list';
        closeEventStream();
        startListPolling();
        refreshList();
      }

      // ─── Planning artifacts ─────────────────────────────────────────────
      // Fired once on entering detail view for a 'planned' epic. The four
      // documents render as collapsed <details> so the operator scans the
      // header (path + size hint) and expands only what they want to read
      // before approving. Content is rendered as escaped text — markdown
      // bodies are NOT parsed as HTML, defending against a poisoned brief
      // or PRD body that could have come from an LLM.
      async function fetchPlanningArtifacts(epicId) {
        const mount = document.getElementById('planningArtifacts');
        if (!mount) return;
        const url = currentDetailProject
          ? `/api/epics/${encodeURIComponent(epicId)}/planning-artifacts?project=${encodeURIComponent(currentDetailProject)}`
          : `/api/epics/${encodeURIComponent(epicId)}/planning-artifacts`;
        try {
          const res = await api(url);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const a = await res.json();
          mount.innerHTML = renderArtifacts(a);
        } catch (err) {
          mount.innerHTML = `<div class="doc-missing">Could not load planning artifacts: ${esc(err.message)}</div>`;
        }
      }

      function renderArtifacts(a) {
        const section = (label, path, body) => {
          const size = body == null ? null : `${body.length.toLocaleString()} chars`;
          const pathLabel = path
            ? `<span class="doc-path">${esc(path)}${size ? ` · ${size}` : ''}</span>`
            : `<span class="doc-path">(not generated)</span>`;
          const inner = body == null
            ? `<div class="doc-missing">No ${esc(label.toLowerCase())} on disk.</div>`
            : `<pre class="doc-body">${esc(body)}</pre>`;
          return `
            <details>
              <summary><strong>${esc(label)}</strong> ${pathLabel}</summary>
              ${inner}
            </details>`;
        };
        return [
          section('Brief', a.paths.brief, a.brief),
          section('PRD', a.paths.prd, a.prd),
          section('Architecture', a.paths.architecture, a.architecture),
          section('Epic YAML', a.paths.epic_yaml, a.epic_yaml),
        ].join('');
      }

      function bindDetailHandlers(body) {
        document.getElementById('backLink')?.addEventListener('click', backToList);
        document.getElementById('approveBtn')?.addEventListener('click', () =>
          act(`/api/epics/${encodeURIComponent(body.id)}/approve`, 'POST')
        );
        document.getElementById('rejectBtn')?.addEventListener('click', () => {
          const reason = prompt('Optional rejection reason:') ?? '';
          act(`/api/epics/${encodeURIComponent(body.id)}/reject`, 'POST', { reason });
        });
        document.getElementById('stopBtn')?.addEventListener('click', () => {
          if (!confirm('Send a graceful stop signal to the supervisor?')) return;
          act('/api/stop', 'POST');
        });
        document.getElementById('archiveBtn')?.addEventListener('click', async () => {
          const archived = !body.archived;
          const base = `/api/epics/${encodeURIComponent(body.id)}/archive`;
          const url = currentDetailProject
            ? `${base}?project=${encodeURIComponent(currentDetailProject)}`
            : base;
          await act(url, 'POST', { archived });
          // Re-enter detail so the button label + badge reflect the new state.
          enterDetail(body.id, currentDetailProject);
        });
        document.querySelectorAll('button[data-kill]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const agentId = btn.getAttribute('data-kill');
            if (!confirm(`SIGTERM the worker for ${agentId}? The story will be marked failed.`)) return;
            act(`/api/agents/${encodeURIComponent(agentId)}/kill`, 'POST');
          });
        });
        // Resume retry — keep the prior branch + checkpoint commit and let the
        // worker continue from its handoff doc.
        document.querySelectorAll('button[data-retry]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const storyId = btn.getAttribute('data-retry');
            if (!confirm(`Retry ${storyId}? It resumes from the prior attempt's commit.`)) return;
            act(`/api/stories/${encodeURIComponent(storyId)}/retry`, 'POST', {});
          });
        });
        // Clean retry — discard the prior worktree + branch (and any stories
        // stacked on it) and re-run from scratch.
        document.querySelectorAll('button[data-retry-clean]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const storyId = btn.getAttribute('data-retry-clean');
            if (!confirm(`Clean retry ${storyId}? This discards the prior branch and any stories stacked on it, then re-runs from scratch.`)) return;
            act(`/api/stories/${encodeURIComponent(storyId)}/retry`, 'POST', { clean: true });
          });
        });
      }

      function startListPolling() {
        stopListPolling();
        pollTimer = setInterval(refreshList, 2000);
      }
      function stopListPolling() {
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      }

      // ─── SSE ────────────────────────────────────────────────────────────
      // One EventSource per detail-view session. Handlers update DOM in
      // place; full re-fetch happens ONLY when a structural change makes
      // partial updates wrong (story count growing as planning completes).
      // Tracks the count at open time to detect that one case.
      let lastStoryCount = 0;

      function openEventStream(body) {
        closeEventStream();
        logBuffersByAgent = new Map();
        lastStoryCount = body?.agents?.length ?? 0;
        // EventSource doesn't support custom headers; pass the token via query.
        eventSource = new EventSource(`/api/events?token=${encodeURIComponent(token)}`);

        eventSource.addEventListener('output', (ev) => {
          try {
            const { agent_id, chunk } = JSON.parse(ev.data);
            const prev = logBuffersByAgent.get(agent_id) ?? '';
            const next = chunk.startsWith(prev) ? chunk : prev + chunk;
            logBuffersByAgent.set(agent_id, next);
            const pane = document.getElementById(`log-${agent_id}`);
            if (pane) {
              pane.textContent = next;
              const atBottom = pane.scrollHeight - pane.clientHeight - pane.scrollTop < 24;
              if (atBottom) pane.scrollTop = pane.scrollHeight;
            }
          } catch {}
        });

        eventSource.addEventListener('agent', (ev) => {
          try {
            const a = JSON.parse(ev.data);
            const statusEl = document.querySelector(`[data-status="${a.id}"]`);
            if (statusEl) {
              statusEl.textContent = a.status;
              statusEl.className = `agent-status ${a.status}`;
            }
            const tokensEl = document.querySelector(`[data-tokens="${a.id}"]`);
            if (tokensEl) tokensEl.textContent = a.tokens_total ?? '—';
            const costEl = document.querySelector(`[data-cost="${a.id}"]`);
            if (costEl) costEl.textContent = fmtSpend(a);
            const prEl = document.querySelector(`[data-pr="${a.id}"]`);
            if (prEl) {
              prEl.innerHTML = a.pr_url
                ? `<a href="${esc(a.pr_url)}" target="_blank">view</a>`
                : '—';
            }
          } catch {}
        });

        // Epic-level diffs: update header badge + counts in place to avoid
        // tearing the EventSource down. The exception is when the story
        // count grows (planning→planned added rows) — there we re-enter
        // the detail view via enterDetail() which rebuilds the table.
        eventSource.addEventListener('epic', (ev) => {
          try {
            const e = JSON.parse(ev.data);
            if (currentView !== `epic:${e.id}`) return;
            // Structural change → re-enter the view (rebuilds the table,
            // re-opens SSE). Costs a single fetch + render; back button
            // still works because the user is already on this epic.
            if (e.stories.total !== lastStoryCount) {
              enterDetail(e.id);
              return;
            }
            // Header badge + counts can be patched in place.
            const head = document.querySelector('.panel .epic-head');
            if (head) {
              const badge = head.querySelector('.epic-status');
              if (badge) {
                const label = e.status === 'planning' && e.planning_phase
                  ? `planning · ${e.planning_phase}`
                  : e.status.replace('_', ' ');
                badge.textContent = label;
                const pulse = e.status === 'planning' || e.status === 'in_progress' ? ' pulse' : '';
                badge.className = `epic-status ${e.status}${pulse}`;
              }
            }
          } catch {}
        });

        eventSource.onerror = () => {
          // EventSource auto-reconnects; nothing to do here. Persistent 401
          // surfaces on the next user-triggered fetch (back, action, etc.).
        };
      }

      function closeEventStream() {
        if (eventSource) {
          try { eventSource.close(); } catch {}
          eventSource = null;
        }
      }

      // Fire-and-forget action handler. Side effects land in the DB and
      // arrive via SSE in the next poll cycle — no manual re-fetch.
      async function act(path, method, body) {
        try {
          const res = await api(path, {
            method,
            headers: body ? { 'Content-Type': 'application/json' } : undefined,
            body: body ? JSON.stringify(body) : undefined,
          });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            alert(`Failed: ${err.error || res.status}`);
          }
        } catch (err) {
          alert(`Failed: ${err.message}`);
        }
      }

      // Bootstrap.
      refreshList();
      startListPolling();
    </script>
    <!-- View modules — self-register with Loom.registerView on load. -->
    <script src="autonomy.js"></script>
    <script src="fleet.js"></script>
    <script src="opportunities.js"></script>
    <script src="flywheel.js"></script>
  </body>
</html>
